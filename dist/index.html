<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026中级经济师备考助手</title>
<style>
:root{--bg:#f5f5f0;--surface:#fff;--s2:#f8f9fa;--border:#e0e0d8;--text:#2c2c2a;--t2:#666660;--t3:#999990;--accent:#2563eb;--al:#eff6ff;--green:#16a34a;--gl:#f0fdf4;--amber:#d97706;--aml:#fffbeb;--red:#dc2626;--rl:#fef2f2;--purple:#7c3aed;--pl:#f5f3ff;--r:10px;--rs:6px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}
.container{max-width:1000px;margin:0 auto;padding:0 16px}
.header{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.hi{max-width:1000px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.header h1{font-size:17px;font-weight:600;white-space:nowrap}
.header h1 span{color:var(--accent)}
.tabs{display:flex;gap:4px;background:var(--s2);border-radius:var(--r);padding:3px}
.tab{padding:7px 16px;border-radius:7px;font-size:13px;font-weight:500;border:none;background:transparent;color:var(--t2);cursor:pointer;transition:all .15s;white-space:nowrap;flex-shrink:0}
.tab:hover{color:var(--text)}
.tab.active{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.content{max-width:1000px;margin:0 auto;padding:20px 16px 40px}
.tc{display:none}
.tc.active{display:block}
.card{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);padding:20px;margin-bottom:16px}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.ct{font-size:15px;font-weight:600}
.cs{font-size:12px;color:var(--t3)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pw{margin-bottom:12px}
.pl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.pl .pct{color:var(--t2);font-weight:500}
.pb{height:8px;background:#e5e7eb;border-radius:4px;overflow:hidden}
.pf{height:100%;border-radius:4px;transition:width .3s}
.pf.g{background:var(--green)}.pf.b{background:var(--accent)}.pf.a{background:var(--amber)}.pf.p{background:var(--purple)}
.pc{background:var(--s2);border-radius:var(--rs);padding:12px 14px;margin-bottom:10px;border:1px solid var(--border)}
.pc.cur{border-color:var(--accent);background:var(--al)}
.pc .pn{font-size:13px;font-weight:500;margin-bottom:6px}
.pc .pm{font-size:12px;color:var(--t2);display:flex;gap:16px;flex-wrap:wrap}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;font-weight:500}
.badge.cur{background:var(--al);color:var(--accent)}
.badge.up{background:var(--s2);color:var(--t3)}
.badge.done{background:var(--gl);color:var(--green)}
.btn{display:inline-flex;align-items:center;gap:4px;padding:7px 14px;border-radius:var(--rs);font-size:13px;font-weight:500;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;transition:all .15s;text-decoration:none}
.btn:hover{border-color:#c0c0b8;background:var(--s2)}
.btn-p{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-p:hover{background:#1d4ed8;border-color:#1d4ed8}
.btn-d{color:var(--red);border-color:var(--red)}
.btn-d:hover{background:var(--rl)}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-xs{padding:2px 7px;font-size:11px}
.bg{display:flex;gap:8px;flex-wrap:wrap}
input[type="text"],input[type="number"],textarea,select{padding:8px 10px;border-radius:var(--rs);border:1px solid var(--border);font-size:13px;font-family:inherit;background:var(--surface);color:var(--text);width:100%}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(37,99,235,.15)}
textarea{resize:vertical;min-height:60px}
label{font-size:13px;font-weight:500;display:block;margin-bottom:4px}
.fg{margin-bottom:12px}
.fr{display:flex;gap:12px}
.fr>*{flex:1}
.stats-row{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.sc{flex:1;min-width:100px;background:var(--s2);padding:14px;border-radius:var(--rs);text-align:center}
.sc .sn{font-size:24px;font-weight:600}
.sc .sl{font-size:12px;color:var(--t2);margin-top:2px}
.note-area{width:100%;min-height:80px}
.empty-state{text-align:center;padding:40px 20px;color:var(--t3)}
.empty-state p{font-size:13px}
.st{font-size:14px;font-weight:600;margin:20px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#2c2c2a;color:#fff;padding:10px 24px;border-radius:20px;font-size:13px;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;z-index:150}
.modal{background:var(--surface);border-radius:var(--r);padding:24px;max-width:560px;width:90%;max-height:80vh;overflow-y:auto;box-shadow:0 4px 20px rgba(0,0,0,.1)}
.modal h3{font-size:16px;margin-bottom:16px}
.ma{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
/* Exercise cards */
.ex-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);padding:14px;margin-bottom:10px}
.ex-card .ex-num{font-size:11px;color:var(--t3);margin-bottom:4px}
.ex-card .ex-q{font-size:14px;margin-bottom:8px;line-height:1.7}
.ex-card .ex-opts{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}
.ex-opt{display:flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--border);border-radius:var(--rs);cursor:pointer;font-size:13px;transition:all .15s}
.ex-opt:hover{border-color:var(--accent);background:var(--al)}
.ex-opt.sel{border-color:var(--accent);background:var(--al)}
.ex-opt.corr{border-color:var(--green);background:var(--gl)}
.ex-opt.wrong{border-color:var(--red);background:var(--rl)}
.ex-card .ex-res{margin-top:8px;padding:10px;border-radius:var(--rs);display:none}
.ex-card .ex-res.show{display:block}
.ex-card .ex-res.correct{background:var(--gl);color:#166534}
.ex-card .ex-res.wrong{background:var(--rl);color:#991b1b}
.ex-card .ex-exp{font-size:13px;margin-top:4px;line-height:1.6}
/* Video links */
.video-link{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--s2);border-radius:var(--rs);margin-bottom:8px;text-decoration:none;color:var(--text);transition:all .15s;border:1px solid transparent}
.video-link:hover{border-color:var(--accent);background:var(--al)}
.video-link .v-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0}
.video-link .v-info{flex:1;min-width:0}
.video-link .v-title{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.video-link .v-meta{font-size:11px;color:var(--t3)}
/* Error cards */
.eq-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);padding:14px;margin-bottom:10px}
.eq-card.mastered{opacity:.6;background:var(--s2)}
.eq-card .eq-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.eq-card .eq-question{font-size:14px;font-weight:500}
.eq-card .eq-meta{font-size:12px;color:var(--t2);margin-top:4px}
.eq-card .eq-answer{font-size:13px;color:var(--green);margin-top:4px}
.eq-card .eq-reason{font-size:13px;color:var(--red);margin-top:4px}
.eq-card .eq-actions{margin-top:8px}
/* Past papers */
.pq-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);padding:16px;margin-bottom:12px}
.pq-card.ac{border-left:3px solid var(--green)}
.pq-card.aw{border-left:3px solid var(--red)}
.pq-card .pq-num{font-size:12px;color:var(--t3);margin-bottom:6px}
.pq-card .pq-q{font-size:14px;margin-bottom:12px;line-height:1.7}
.pq-card .pq-opts{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.pq-opt{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--border);border-radius:var(--rs);cursor:pointer;font-size:13px;transition:all .15s}
.pq-opt:hover{border-color:var(--accent);background:var(--al)}
.pq-opt.sel{border-color:var(--accent);background:var(--al)}
.pq-opt.cc{border-color:var(--green);background:var(--gl)}
.pq-opt.wc{border-color:var(--red);background:var(--rl)}
.pq-card .pq-res{margin-top:12px;padding:12px;border-radius:var(--rs)}
.pq-card .pq-res.correct{background:var(--gl);color:#166534}
.pq-card .pq-res.wrong{background:var(--rl);color:#991b1b}
.pq-card .pq-exp{font-size:13px;margin-top:4px;line-height:1.6}
.review-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);padding:14px;margin-bottom:10px}
.review-card .rh{display:flex;justify-content:space-between;margin-bottom:8px}
.review-card .rs{font-size:11px;font-weight:500;padding:2px 8px;border-radius:10px}
.review-card .rs.econ{background:var(--al);color:var(--accent)}
.review-card .rs.ip{background:var(--pl);color:var(--purple)}
.review-card .rq{font-size:13px;margin-bottom:8px}
.review-card .ra{font-size:12px;color:var(--green);display:none;margin-top:4px}
.review-card .ra.show{display:block}
.course-info{font-size:13px;color:var(--t2);background:var(--aml);padding:12px 16px;border-radius:var(--rs);margin-bottom:16px;border-left:3px solid var(--amber)}
.course-info strong{color:var(--amber)}
.exercise-summary{font-size:13px;color:var(--t2);background:var(--al);padding:12px 16px;border-radius:var(--rs);margin-bottom:16px}
.exercise-summary strong{color:var(--accent)}
/* Countdown */
.countdown-card{background:linear-gradient(135deg,#fef2f2 0%,#fff7ed 100%);border:1px solid #fecaca;border-radius:var(--r);padding:16px 20px;margin-bottom:16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.cd-icon{font-size:32px;flex-shrink:0}
.cd-info{flex:1;min-width:200px}
.cd-title{font-size:13px;color:var(--t2);margin-bottom:2px}
.cd-days{font-size:36px;font-weight:700;color:var(--red);line-height:1}
.cd-days small{font-size:16px;font-weight:400;color:var(--t2)}
.cd-date{font-size:12px;color:var(--t3);margin-top:4px}
.cd-bar-bg{background:#fee2e2;height:8px;border-radius:4px;overflow:hidden;margin-top:8px;width:100%}
.cd-bar-fg{height:100%;background:linear-gradient(90deg,var(--red),var(--amber));border-radius:4px;transition:width .3s}
/* Exercise one-by-one */
.ex-one{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;margin-bottom:12px}
.ex-one .ex-progress{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;font-size:12px;color:var(--t2)}
.ex-one .ex-progress .prog-dot{display:flex;gap:4px}
.ex-one .ex-progress .prog-dot span{width:8px;height:8px;border-radius:50%;background:#e5e7eb}
.ex-one .ex-progress .prog-dot span.done{background:var(--green)}
.ex-one .ex-progress .prog-dot span.wrong-dot{background:var(--red)}
.ex-one .ex-q-big{font-size:15px;line-height:1.8;margin-bottom:16px}
.ex-one .ex-opts-big{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.ex-one .ex-opt-big{display:flex;align-items:center;gap:10px;padding:10px 14px;border:2px solid var(--border);border-radius:8px;cursor:pointer;font-size:14px;transition:all .15s}
.ex-one .ex-opt-big:hover{border-color:var(--accent);background:var(--al)}
.ex-one .ex-opt-big.sel{border-color:var(--accent);background:var(--al)}
.ex-one .ex-opt-big.corr{border-color:var(--green);background:var(--gl)}
.ex-one .ex-opt-big.wrong{border-color:var(--red);background:var(--rl)}
.ex-one .ex-feedback{padding:14px;border-radius:8px;margin-bottom:16px;display:none}
.ex-one .ex-feedback.show{display:block}
.ex-one .ex-feedback.correct{background:var(--gl);border:1px solid #bbf7d0}
.ex-one .ex-feedback.wrong{background:var(--rl);border:1px solid #fecaca}
.ex-one .ex-feedback .fb-title{font-size:16px;font-weight:600;margin-bottom:6px}
.ex-one .ex-feedback .fb-exp{font-size:13px;color:var(--t2);line-height:1.7}
.ex-one .ex-actions{display:flex;gap:8px;flex-wrap:wrap}
.ex-done{text-align:center;padding:30px 20px}
.ex-done .ex-score{font-size:40px;font-weight:700;margin-bottom:8px}
.ex-done .ex-sm{font-size:13px;color:var(--t2)}
/* Notes history */
.note-entry{border:1px solid var(--border);border-radius:var(--rs);padding:12px 14px;margin-bottom:10px;background:var(--s2)}
.note-entry .note-date{font-size:13px;font-weight:600;color:var(--accent);margin-bottom:8px}
.note-entry .note-tag{font-size:11px;font-weight:400;color:var(--t3);margin-left:8px}
.note-block{margin-bottom:8px}
.note-subj{font-size:12px;font-weight:500;color:var(--t2);margin-bottom:4px}
.note-text{font-size:13px;line-height:1.7;color:var(--text)}
@media(max-width:700px){
.grid-2{grid-template-columns:1fr}
.hi{flex-direction:column;align-items:flex-start}
.hi>div{flex-wrap:wrap;width:100%;gap:6px}
.header h1{font-size:15px}
.tabs{width:100%;order:3;margin-top:4px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{font-size:11px;padding:5px 8px;flex-shrink:0;white-space:nowrap}
.fr{flex-direction:column}
.stats-row{gap:8px}
.sc{min-width:70px}
.sc .sn{font-size:20px}
}
.user-picker{display:flex;align-items:center;gap:6px;background:var(--bg);border-radius:20px;padding:4px 6px 4px 14px;border:1px solid var(--bl);cursor:pointer;font-size:13px;font-weight:600;color:var(--t1);position:relative;user-select:none}
.user-picker .u-arrow{font-size:10px;color:var(--t3);transition:transform .2s}
.user-picker.open .u-arrow{transform:rotate(180deg)}
.user-dropdown{display:none;position:absolute;top:100%;right:0;margin-top:4px;background:var(--card);border:1px solid var(--bl);border-radius:var(--rs);box-shadow:0 4px 16px rgba(0,0,0,.12);z-index:100;min-width:120px;overflow:hidden}
.user-picker.open .user-dropdown{display:block}
.user-dropdown .ud-item{padding:10px 16px;cursor:pointer;font-size:13px;color:var(--t1);transition:background .15s;display:flex;align-items:center;gap:8px}
.user-dropdown .ud-item:hover{background:var(--al)}
.user-dropdown .ud-item.active{font-weight:600;color:var(--accent);background:var(--al)}
.user-dropdown .ud-dot{width:8px;height:8px;border-radius:50%}
.ud-dot.wbb{background:var(--accent)}
.ud-dot.hgg{background:var(--green)}

/* ===== Celebration Overlay ===== */
.cheer-overlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:9999;pointer-events:none;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .3s}
.cheer-overlay.show{opacity:1}
.cheer-overlay .cheer-bg{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.3)}
.cheer-overlay .cheer-card{position:relative;background:var(--card);border-radius:20px;padding:24px 32px;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.25);animation:cheerPop .4s ease-out;max-width:280px;z-index:1}
@keyframes cheerPop{0%{transform:scale(.5) translateY(40px);opacity:0}60%{transform:scale(1.1) translateY(-5px)}100%{transform:scale(1) translateY(0);opacity:1}}
.cheer-char{font-size:80px;line-height:1;animation:cheerBounce .6s ease-in-out infinite alternate;display:block;margin-bottom:8px}
@keyframes cheerBounce{0%{transform:translateY(0)}100%{transform:translateY(-18px)}}
.cheer-char.hgg-chick{animation:cheerShake .3s ease-in-out infinite alternate}
@keyframes cheerShake{0%{transform:translateY(0) rotate(-3deg)}100%{transform:translateY(4px) rotate(3deg)}}
.cheer-hands{font-size:40px;animation:cheerClap .5s ease-in-out infinite alternate;display:inline-block}
@keyframes cheerClap{0%{transform:scaleX(1) rotate(0deg)}100%{transform:scaleX(1.3) rotate(-8deg)}}
.cheer-text{font-size:16px;font-weight:700;color:var(--accent);margin-top:8px}
.cheer-sub{font-size:12px;color:var(--t2);margin-top:4px}
.cheer-sparkles{position:absolute;top:-30px;left:50%;transform:translateX(-50%);font-size:24px;animation:cheerSparkle .8s ease-out infinite alternate}
@keyframes cheerSparkle{0%{opacity:.4;transform:translateX(-50%) scale(.8)}100%{opacity:1;transform:translateX(-50%) scale(1.2)}}
.cheer-rice{position:absolute;bottom:8px;font-size:14px;animation:riceBounce .5s ease-in-out infinite alternate}
@keyframes riceBounce{0%{transform:translateY(0)}100%{transform:translateY(-6px)}}
.rice1{left:40px;animation-delay:0s}
.rice2{left:50%;transform:translateX(-50%);animation-delay:.15s}
.rice3{right:40px;animation-delay:.3s}
/* ===== Knowledge Tips ===== */
.tip-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);padding:14px 16px;margin-bottom:10px;display:flex;align-items:flex-start;gap:10px;transition:all .15s}
.tip-card:hover{border-color:var(--purple);box-shadow:0 2px 8px rgba(124,58,237,.08)}
.tip-idx{flex-shrink:0;width:28px;height:28px;border-radius:50%;background:var(--pl);color:var(--purple);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.tip-body{flex:1}
.tip-text{font-size:14px;line-height:1.7;color:var(--text)}
.tip-text b{color:var(--accent)}
.tip-tag{display:inline-block;font-size:11px;color:var(--purple);background:var(--pl);padding:2px 8px;border-radius:10px;margin-left:6px;white-space:nowrap}
.tip-subj{font-size:11px;color:var(--t3);margin-top:4px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>

<header class="header"><div class="hi">
<h1><span>2026</span> 中级经济师备考助手</h1>
<div style="display:flex;align-items:center;gap:8px">
<span id="sync-status" style="font-size:16px">☁</span>
<div class="user-picker" id="userPicker" onclick="App.toggleUserMenu(event)">
<span id="curUserLabel">wbb</span><span class="u-arrow">▾</span>
<div class="user-dropdown">
<div class="ud-item active" data-user="wbb" onclick="App.switchUser('wbb',event)"><span class="ud-dot wbb"></span> wbb</div>
<div class="ud-item" data-user="hgg" onclick="App.switchUser('hgg',event)"><span class="ud-dot hgg"></span> hgg</div>
</div>
</div>
<div class="tabs" id="tabNav">
<button class="tab active" data-tab="plan">学习计划</button>
<button class="tab" data-tab="daily">每日学习</button>
<button class="tab" data-tab="notebook">错题本</button>
<button class="tab" data-tab="papers">真题模块</button>
<button class="tab" data-tab="tips">知识速记</button>
</div>
</div></header>

<div class="content">

<!-- ===== TAB 1: 学习计划 ===== -->
<div id="tab-plan" class="tc active">
<!-- 考试倒计时 -->
<div class="countdown-card" id="countdown-card">
<div class="cd-icon">⏳</div>
<div class="cd-info"><div class="cd-title">距离 2026 中级经济师考试还有</div>
<div class="cd-days" id="cd-days">--<small> 天</small></div>
<div class="cd-date">考试日期：2026年11月7日-8日（以准考证为准）</div>
<div class="cd-bar-bg"><div class="cd-bar-fg" id="cd-bar" style="width:0%"></div></div>
</div>
</div>
<div class="grid-2">
<div class="card"><div class="ch"><div class="ct">经济基础</div><span class="badge cur">B站网课</span></div>
<div id="plan-econ"></div>
<div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--border)"><label>更新进度</label>
<div class="fr" style="margin-top:6px">
<select id="econ-part" onchange="App.updateEconChapter()"><option value="">选部分</option></select>
<select id="econ-chapter" onchange="App.onEconProgressChange()"><option value="">选章节</option></select>
<select id="econ-section" onchange="App.saveProgress()"><option value="">选节</option></select>

  {ch:1,q:'关于混合所有制经济的说法，正确的是()。',o:["混合所有制经济是指国有资本、集体资本和非公有资本等交叉持股，相互融合的一种经济形式", "混合所有制经济属于股份制经济", "所有外资经济都属于混合所有制经济形式", "混合所有制经济是一种独立的所有制经济形式"],a:0,x:'以中外合资、合作方式形成的外资经济属于混合所有制经济形式，其中所包含的国有经济或集体经济部分属于公有制经济的范畴。所以不能简单地认为外资经济就完全是非公有制经济。混合所有制经济是指国有资本、集体资本和非公有资本等交叉持股、相互融合的一种经济形式。需要指出的是，混合所有制经济并不是一种独立的所有制。混合所有制经济有利于实现各种所有制资本取长补短、相互促进、共同发展，使我国基本经济制度发挥出更大优越性。'},

  {ch:3,q:'某工厂生产产品，生产10个单位时总成本为500，生产11个单位时平均成本为51，则该产品边际成本为()。',o:["51", "52", "61", "80"],a:2,x:'生产11个单位的总成本=51*11=561，该产品边际成本=(561-500)/(11-10)=61。'},

  {ch:4,q:'是完全竞争市场上，某厂商在目前的产量水平上满足边际成本等于边际收益，此时()。',o:["如果盈利，不可能得到最大利润", "应当继续调整产量规模", "一定是亏损状态", "如果亏损，应是最小亏损"],a:3,x:'企业在MR=MC点上获得了最大的利润，但这并不是说，在任何情况下，只要企业做到了MR=MC，就一定能获得利润。对MR=MC的最佳状态的全面理解应该是，在MR=MC点上，企业可能是盈利的，也可能是亏损的。但是，如果企业是亏损的，则这时的亏损一定是相对最小的。总之，无论是盈利还是亏损，当企业处于MR=MC时，是最优的产量。所以，边际成本等于边际收益既可称作利润最大化的均衡条件，也可称作亏损最小的均衡条件。'},

  {ch:6,q:'某一生产者经济活动存在外部不经济是指其()。',o:["边际私人成本低于边际社会收益", "边际私人成本低于边际社会成本", "边际私人收益低于边际社会收益", "平均私人成本低于边际外部成本"],a:1,x:'所谓外部不经济，就是某人或某企业的经济活动会给社会上其他成员带来损害，但该人或该企业却不必为这种损害进行补偿。'},

  {ch:7,q:'关于边际消费倾向、平均消费倾向及其相互关系的说法，正确的是()。',o:["平均消费倾向总是小于1", "边际消费倾向总是小于平均消费倾向", "边际消费倾向恒等于平均消费倾向", "边际消费倾向可能大于1"],a:1,x:'边际消费倾向和平均消费倾向的关系是：边际消费倾向总是小于平均消费倾向，用公式表示就是MPC'},
  {ch:7,q:'根据凯恩斯的消费理论，边际消费倾向和平均消费倾向的关系是()。',o:["边际消费倾向总是小于平均消费倾向", "边际消费倾向总是大于平均消费倾向", "边际消费倾向和平均消费倾向的关系不稳定", "边际消费倾向总是等于平均消费倾向"],a:0,x:'边际消费倾向和平均消费倾向的关系是：边际消费倾向总是小于平均消费倾向，用公式表示就是MPC'},
  {ch:7,q:'弗里德曼持久收入理论的公式表示为：()。',o:["S=Y-C", "Ct=c·YPt", "C=α·WR+cYL", "C=α+βY"],a:1,x:'第7章真题解析'},
  // Ch8
  {ch:8,q:'在一个经济体中，假设一定时期的经济增长速度为6%，资本存量增长率为5%，劳动力增长率为1%，并且资本和劳动在经济增长中份额或产出弹性分别为0.4和0.6，那么相应的全要素生产率增长()。',o:["1.4%", "2.4%", "4.2%", "3.4%"],a:3,x:'全要素生产率=经济增长率-(劳动份额×劳动增长率+资本份额×资本增长率)。全要素生产率增长率=6%-5%*0.4-1%*0.6=3.4%'},
  {ch:8,q:'制造业订单属于下列什么指标()。',o:["先行指标", "一致指标", "落后指标", "同步指标"],a:0,x:'所谓先行指标，也叫领先指标，通过这些指标可以预测总体经济运行的轨迹，如制造业订货单、股票价格指数和广义货币M2等就属于先行指标。—致指标，也叫同步指标，这些指标的峰顶与谷底出现的时间和总体经济运行的峰谷出现的时间一致，可以综合地描述总体经济所处状态。在我国，一般把工业总产值、固定资产投资额和社会消费品零售总额等视为一致指标;滞后指标，是对总体经济运行中已经出现的峰顶和谷底的确认，如库存，居民消费价格指数等。课程咨询免费微信学习群温馨提示：因考试政策、内容不断变化与调整，华课网校提供的以上信息仅供参考，如有异议，请考生以官方部门公布的内容为准！责编：duoduo上一篇：中级经济师《经济基础知识》'},
  // Ch9
  {ch:9,q:'描述通货膨胀与失业或经济增长之间相互关系的曲线是()。',o:["奥肯定律曲线", "弗里德曼曲线", "拉弗曲线", "菲利普斯曲线"],a:3,x:'菲利普斯曲线是以英国经济学家菲利普斯名字命名的一条描述通货膨胀与失业或经济增长之间相互关系的曲线，也是分析宏观经济问题的重要工具。'},
  {ch:9,q:'宏观经济学中，“菲利普斯曲线”描述的是()。',o:["通货膨胀率与经济增长率之间的关系", "就业率与经济增长率之间的关系", "", "通货膨胀率和失业率之间的关系", "经济增长与国际收支之间的关系"],a:2,x:'第9章真题解析'},
  {ch:9,q:'目前大部分国家或地区所采用的反映价格总水平变动的主要价格指数是()。',o:["生产资料价格指数", "居民消费价格指数", "国内生产总值缩减指数", "批发价格指数"],a:1,x:'反映价格总水平变动的指标叫作价格总指数，一般称为价格指数。价格指数有很多种类，大部分国家或地区用居民消费价格指数作为度量价格总水平的主要指标，我国也是采用CPI作为衡量价格总水平变动的基本指标。课程咨询免费微信学习群温馨提示：因考试政策、内容不断变化与调整，华课网校提供的以上信息仅供参考，如有异议，请考生以官方部门公布的内容为准！责编：duoduo上一篇：中级经济师《经济基础知识》章节真题考点：第八章经济增长和经济下一篇：中级经济师《经济基础知识》章节真题考点：第十章国际贸易理论和相关新闻中级经济师《经济基础知识》章节真题考点汇总06-29中级经济师《经济基础知识》章节真题考点：第三十七06-'},
  // Ch10
  {ch:10,q:'政府干预出口贸易以刺激出口增加的主要措施是()。',o:["出口补贴", "技术标准和卫生检疫标准", "歧视性公共采购", "倾销"],a:0,x:'政府干预出口贸易以刺激出口增加的主要措施是出口补贴。政府对进口贸易的干预主要采取关税限制和非关税限制两种方式，即关税壁垒和非关税壁垒。关税壁垒是指国家通过征收高额进口关税来限制外国商品进口的一种外贸政策。这种政策可以提高进口货物的成本，从而削弱其竞争力，起到保护国内生产和国内市场的作用。非关税壁垒则是指采用关税以外的手段对外国商品进口设置障碍的各种措施，如进口配额制、自愿出口限制、歧视性公共采购、技术标准和卫生检疫标准等。'},
  {ch:10,q:'判断是否存在倾销的关键在于()。',o:["产品正常价值的认定", "损害与低价倾销之间存在因果关系", "倾销对某一成员工相关产业造成重大损失", "引发出口国国内生产厂商价格过度竞争"],a:0,x:'确认出口国企业低价销售行为是否为倾销行为的关键在于对产品正常价值的认定。'},
  {ch:10,q:'主张各国应当生产、出口密集使用本国相对丰裕要素的产品，进口需要密集使用本国相对稀缺要素的产品，这种国际贸易理论是()。',o:["绝对优势理论", "比较优势理论", "规模经济贸易理论", "要素禀赋理论"],a:3,x:'赫克歇尔一俄林理论，又称要素禀赋理论，各国应该集中生产并出口那些能够充分利用本国相对丰裕要素的产品，进口那些需要密集使用本国相对稀缺要素。'},
  {ch:10,q:'关于反倾销税的说法，错误的是()。',o:["出口商可以直接或间接替进口商承担反倾销税", "反倾销措施属于贸易救济措施", "反倾销税纳税义务人是倾销产品的进口商", "对出口国某一产品征收反倾销税必须符合该产品以低于正常价值水平进入另一国或地区"],a:0,x:'反倾销措施属于贸易救济措施，是指进口国针对价格倾销这种不公平的贸易行为而采取征收反倾销税等措施来抵消不利影响的行为。反倾销税是在正常海关税费之外，进口国主管机关对确认的倾销产品征收的一种附加税。反倾销税的税额不得超过所裁定的倾销幅度，反倾销税的纳税义务人是倾销产品的进口商，出口商不得直接或间接替进口商承担反倾销税。'},
  {ch:10,q:'能够用于解释具有相似资源储备国家或地区之间和同类工业品之间的双向贸易现象的经济理论是()。',o:["比较优势理论", "平行贸易理论", "规模经济贸易理论", "要素禀赋理论"],a:2,x:'美国经济学家克鲁格曼等提出了规模经济的贸易学说，来解释相似资源储备国家之间和同类工业品之间的双向贸易现象，并形成了当代贸易理论。课程咨询免费微信学习群温馨提示：因考试政策、内容不断变化与调整，华课网校提供的以上信息仅供参考，如有异议，请考生以官方部门公布的内容为准！责编：duoduo上一篇：中级经济师《经济基础知识》章节真题考点：第九章价格总水平和就下一篇：中级经济师《经济基础知识》章节真题考点：第十一章公共物品与财相关新闻中级经济师《经济基础知识》章节真题考点汇总06-29中级经济师《经济基础知识》章节真题考点：第三十七06-27中级经济师《经济基础知识》章节真题考点：第三十六06-27中级'},
  // Ch11
  {ch:11,q:'关于财政行使经济稳定和发展职能的说法，正确的是()。',o:["财政行使经济稳定与发展职能，等于财政要直接操纵经济运行", "行政行使经济稳定和发展职能的目标中包括汇率稳定", "行政行使经济稳定和发展职能，重点是对社会资源在私人部门和政府部门之间进行配置", "财政行使经济稳定与发展职能，不仅要促进经济增长还要带来经济结构的改善"],a:3,x:'财政行使经济发展职能的意义，不仅仅是要促进经济增长，还要在促进经济增长的同时带来经济结构的改善(D正确)、经济增长质量的提高和社会事业的进步。经济稳定和经济增长是相互统一的概念，经济发展要建立在经济稳定的基础上，经济稳定要以经济发展为前提。财政行使经济稳定职能，其重点不是对社会资源在私人部门和政府部门之间进行配置，而是维持社会资源在高水平利用状况下的稳定。C错误。财政经济稳定和发展职能是指通过财政活动对生产、消费投资和储蓄等产生影响，达到稳定和发展经济的目的。财政行使经济稳定和发展职能的四大目标是充分就业、物价稳定、经济增长和国际收支平衡。B错误。需要指出的是，在社会主义市场经济条件下，财政行'},
  {ch:11,q:'公共物品的融资包括政府融资、私人融资和联合融资，政府融资的缺点是难以满足社会成员对公共物品()。',o:["排他性需求", "规模化需求", "竞争性需求", "多样化需求"],a:3,x:'政府融资(或强制融资)。由于公共物品存在消费上的非排他性，理性的个人倾向于由他人付费，而自己坐享其成，这就是“免费搭车”。“免费搭车”问题使公共物品市场融资机制失灵，因此由传统的公共物品理论引申出来的结论是，政府应作为公共物品供给的资金提供者，以强制税收的形式为公共物品融资。政府融资的缺点是难以满足社会成员对公共物品的多样化需求。故选D。'},
  {ch:11,q:'关于公共物品生产的说法，正确的是()。',o:["政府生产和合同外包是两种典型的公共物品生产方式", "合同外包中，私人签约者是一定是营业性机构", "特许经营不属于公共物品的生产方式", "公共物品的供给主体中不包括事业单位"],a:0,x:'当公共物品供给所需的资金问题已经解决，社会成员还需决定通过何种方式完成公共物品的生产或公共服务的递送。其中，政府生产和合同外包是两种典型的生产方式(A正确)。政府生产是指代表公众利益的政治家雇用公共雇员，与他们签订就业合同，合同中对所需提供的物品或服务作出具体规定。合同外包是指政治家首先与私人厂商签约，再由这个私人厂商与其雇员签订劳务合同，按政府的要求完成公共物品或服务的生产任务。在合同外包中，私人签约者可能是营利性机构，也可能是非营利性机构，不论其性质如何，合同外包都是公共服务提供私有化的表现(B错误)。其他介于政府生产和合同外包之间的公共物品供给方式还包括特许经营、合同委托等(C错误)。同'},

  {ch:12,q:'购买性支出是政府为了履行其职能从()部门购买物品与劳务而发生的费用。',o:["私人", "事业单位", "政府", "非盈利"],a:0,x:'购买性支出是指政府为了履行其职能，从私人部门购买物品与劳务而发生的费用。这些物品与劳务或者被用于政府自身的消费(称为政府消费性支出)，或者形成投资(称为政府投资性支出)。'},
  {ch:12,q:'2019年1~6月我国财政支出为123538亿元，2020年1~6月我国财政支出为116411亿元。则2020年1~6月我国财政支出增长率为()。',o:["-5.77%", "-6.12%", "6.12%", "5.77%"],a:0,x:'第12章真题解析'},
  {ch:12,q:'按照“梯度渐进增长理论”，属于公共支出内在原因的是()。',o:["公众可容忍税收水平的提高", "社会经历战争", "社会发生某种危机", "社会发生某种自然灾害"],a:0,x:'公众可容忍税收水平的提高，是公共支出增长的内在原因。'},
  {ch:12,q:'2020年，我国一般公共预算收入182895亿元，同比下降3.9%;一般公共预算支出245588亿元，同比增加2.8%;全国国内生产总值达1015986亿元，2020年国内生产总值同比增长2.3%。2020年我国财政支出增长的弹性系数是()。',o:["-1.393", "1.217", "0.821", "-0.718"],a:1,x:'根据题干ΔG=2.8%，ΔGDP=2.3%，故Eg=2.8%/2.3%=1.217，故选B。'},
  {ch:12,q:'财政支出规模是指财政支出总额占()的比重。',o:["国内生产总值", "税收收入总额", "国民生产总值", "财政收入总额"],a:0,x:'财政支出规模是指财政支出总额占国内生产总值(GDP)的比重。它反映了政府实际参与社会经济生活的程度，有助于人们了解政府支配了多少社会资源，简单地说就是掌控和运用了多少钱。课程咨询免费微信学习群温馨提示：因考试政策、内容不断变化与调整，华课网校提供的以上信息仅供参考，如有异议，请考生以官方部门公布的内容为准！责编：duoduo上一篇：中级经济师《经济基础知识》章节真题考点：第十一章公共物品与财下一篇：中级经济师《经济基础知识》章节真题考点：第十三章财政收入相关新闻中级经济师《经济基础知识》章节真题考点汇总06-29中级经济师《经济基础知识》章节真题考点：第三十七06-27中级经济师《经济基础知识'},
  // Ch13
  {ch:13,q:'增值税纳税人会将税负转嫁给最终消费者，这种税负转嫁形式称为()。',o:["前转", "后转", "旁转", "消转"],a:0,x:'前转也称“顺转”或“向前转嫁”是指纳税人将其所纳税款通过提高其所提供商品价格的方法，向前转移给商品的购买者或者最终消费者负担的一种形式。前转是税收转嫁最典型和最普遍的形式，多发生在流转税上。例如，对原材料生产者征收税款，原材料生产者可以通过提高原材料售价把税负转嫁给制造商，制造商再把税负转嫁给批发商，批发商又可以把税负转嫁给零售商，最后零售商向消费者出售商品时，又把税负转嫁给消费者。增值税属于该种情况。'},
  {ch:13,q:'根据我国《2022年政府收支分类科目》，下列收入项目中，不属于一般公共预算收入科目的是()。',o:["政府住房基金收入", "国有资源(资产)有偿使用收入", "专项收入", "土地出让收入"],a:3,x:'我国《2022年政府收支分类科目》将政府─般公共预算收入科目分为税收收入，非税收入，债务收入和转移性收入四类。其中非税收入包括专项收入(选项C属于)、行政事业性收费收入、罚没收入、国有资本经营收入、国有资源(资产)有偿使用收入(选项B属于)、捐赠收入、政府住房基金收入(选项A属于)和其他收入八款。'},
  // Ch14

  {ch:28,q:'在企业资金循环中，企业的资金从储备资金形态转化为生产资金形态，又从生产资金形态转化为成品资金形态的过程是企业的()。',o:["流通过程", "供应过程", "生产过程", "销售过程"],a:2,x:'企业将资金运用于生产经营过程，就形成了资金的循环与周转。它又分为供应过程、生产过程、销售过程三个阶段。1.供应过程：它是生产的准备过程。在这个阶段，为了保证生产的正常进行，企业需要用货币资金购买并储备原材料等劳动对象，要发生材料买价、运输费、装卸费等材料采购成本，与供应单位发生货款的结算关系。随着采购活动的进行，企业的资金从货币资金形态转化为储备资金形态。2.生产过程：既是产品的制造过程，又是资产的耗费过程。在这个阶段，劳动者借助于劳动手段将劳动对象加工成特定的产品，企业要发生原材料等劳动对象的消耗、劳动力的消耗和固定资产等劳动手段的消耗等，构成了产品的使用价值与价值的统一体。同时，随着劳动对'},
  {ch:28,q:'企业发生的支出不产生经济利益的，或者即使能够产生经济利益但不符合资产确认条件的，应当在发生时确认为()。',o:["收入", "负债", "费用", "资产"],a:2,x:'企业发生的支出不产生经济利益的，或者即使能够产生经济利益但不符合或者不再符合资产确认条件的。应当在发生时确认为费用，计入当期损益.'},

  {ch:31,q:'销售收入2000万元，营业成本1200万元，税金100万，管理费用200万，投资收益200万，营业外收入500万，营业利润率是()。',o:["45%", "50%", "60%", "35%"],a:3,x:'营业净利润率是企业营业利润与营业收入净额的比率，营业利润=2000-1200-100-200+200=700，营业利润率=700/2000*100%=35%'},

  {ch:32,q:'预算安排项目的支出年终尚未执行完毕或者因故未执行，且下年需要按原用途继续适用的资金属于()。',o:["结余资金", "结转资金", "其他收入", "预算支出"],a:1,x:'预算结余包括结余资金和结转资金。结余资金是指年度预算执行终了，预算收入实际完成数扣除预算支出和结转资金后剩余的资金。结转资金是指预算安排项目的支出年终尚未执行完毕或者因故未执行，且下年需要按原用途继续使用的资金。'},

  {ch:33,q:'关于“经济法”及“调整经济的法”的说法，错误的是()。',o:["经济法是“调整经济的法”的简称", "国际经济法属于“调整经济的法”", "经济法是现代法律体系的一个重要组成部分", "民法、商法属于“调整经济的法”"],a:0,x:'“经济法”和“调整经济的法”是两个不同的概念。“经济法”是与民法、商法、行政法，刑法等部门法并列的一个法律部门，是现代法律体系的一个重要组成部分。所谓“调整经济的法”，是指调整围绕社会物质财富的生产，交换、分配和消费过程所进行的各种经济关系的法律规范的总体——它既包括传统法律体系中的民法、商法，也包括近代产生的经济法;它既包括调整国内经济关系的法，也包括调整国际经济关系的国际私法和国际经济，它是一国所有调整经济关系的法律规范的总和。'},
  {ch:33,q:'法律对经济关系的调整的说法，错误的是()。',o:["经济法和民商法是市场经济中调整经济关系的两大法律部门", "法律对经济关系的调整需要各部门分工协作", "民商法在调整市场经济的法律中处于基本法的地位", "调整经济关系的法律就是经济法"],a:3,x:'“经济法”和“调整经济的法”是两个不同的概念。“经济法”是与民法、商法、行政法，刑法等部门法并列的一个法律部门，是现代法律体系的一个重要组成部分。所谓“调整经济的法”，是指调整围绕社会物质财富的生产，交换、分配和消费过程所进行的各种经济关系的法律规范的总体——它既包括传统法律体系中的民法、商法，也包括近代产生的经济法;它既包括调整国内经济关系的法，也包括调整国际经济关系的国际私法和国际经济法，它是一国所有调整经济关系的法律规范的总和。'},
  {ch:33,q:'反映政府会计主体在某一特定日期的财务状况和某一会计期间的运行情况的文件是()。',o:["政府预算", "政府资产负债表", "政府决算报告", "政府财务报告"],a:3,x:'政府财务报告是反映政府会计主体某一特定日期的财务状况和某一会计期间的运行情况等信息的文件。政府决算报告是综合反映政府会计主体年度预算收支执行结果的文件。'},
  {ch:33,q:'地方政府举借债务规模的批准单位是()。',o:["省、自治区、直辖市人民代表大会或其常务委员会", "财政部", "中国人民银行", "全国人民代表大会或其常务委员会"],a:3,x:'地方政府举借债务的规模，由国务院报全国人民代表大会或其常务委员会批准。'},
  {ch:33,q:'关于经济法调整的经济管理关系的说法，错误的是()。',o:["经济管理关系是在对宏观经济进行调控中形成的社会关系", "经济管理关系是对国民经济进行全局性，整体性调控形成的社会关系", "经济管理关系包括财政政策、货币政策、产业政策等不同类别的经济管理关系", "经济管理关系本质上属于行政指导关系"],a:3,x:'经济管理关系是指国家作为社会管理者运用一系列手段在对宏观经济进行调控过程中所形成的社会关系。这种宏观经济管理关系有如下特点：①它是一种经济关系，以此区别于行政指导关系(选项D错误);②它以市场经济体制为基础;③它是宏观领域的经济关系，它关系国计民生，是对国民经济进行全局性，整体性调控而形成的;④它综合运用各种手段，如发展计划、财政政策、货币政策、产业政策等，因而可以分化出各种具体的宏观经济管理关系，如计划关系、财政政策关系、货币政策关系、产业政策关系等。'},
  {ch:33,q:'下列属于辅助调整经济关系的新兴法律是()。',o:["商法", "环境保护法", "经济法", "民法"],a:1,x:'社会保障法、环境保护法等新兴法律部门也成为调整经济关系的辅助性法律部门。其他选项A商法是主要调整市场力量发挥作用的经济领域。C经济法是也是市场经济制度的基本法，其调整对象主要是国家对市场经济进行宏观调控所形成的法律关系。D民法是市场经济的基本法。课程咨询免费微信学习群温馨提示：因考试政策、内容不断变化与调整，华课网校提供的以上信息仅供参考，如有异议，请考生以官方部门公布的内容为准！责编：duoduo上一篇：中级经济师《经济基础知识》章节真题考点：第三十二章政府会计下一篇：中级经济师《经济基础知识》章节真题考点：第三十四章物权法律制相关新闻中级经济师《经济基础知识》章节真题考点汇总06-29中级'},
  // Ch34
  {ch:34,q:'根据《中华人民共和国民法典》，权利人认为不动产登记簿记载的事项是错误的，可以申请()。',o:["更正登记", "异议登记", "注销登记", "变更登记"],a:0,x:'权利人、利害关系人认为不动产登记簿记载的事项是错误的，可以申请更正登记。不动产登记簿记载的权利人不同意更正的，利害关系人可以申请异议登记。变更登记是指不动产物权的具体内容发生变化时进行的登记。注销登记是指不动产物权消灭时所进行的登记。'},
  {ch:34,q:'下列情形中，属于所有权的绝对消灭的是()。',o:["乙的房屋被焚毁", "甲去世后其房产被继承", "丙将其房屋卖掉", "丁将其房屋出租"],a:0,x:'所有权的绝对消灭指因所有权客体的原因而消灭，如标的物毁损或灭失导致原物权的终止。由于物本身的灭失，使原来建立在这一权利客体上的物权失去了存在的基础而彻底消灭。所有权的相对消灭是指因物权主体的原因而消灭，如权利人转让或抛弃物权或作为权利人的公民死亡等。在这种情形下，所有权的客体并未消失，只是其权利主体发生了变更，物由一个新的所有人对其行使权利，原所有人的权利消灭。'},
  {ch:34,q:'下列权利中，属于民法上的“对人权”的是()。',o:["债权", "抵押权", "所有权", "居住权"],a:0,x:'债权只是发生在债权人和债务人之间的关系，债权的权利主体和义务主体都是特定的。债权人的请求权只对特定的债务人发生效力，因此债权是相对权，又称“对人权”。'},
  {ch:34,q:'作为被执行人的不动产权利人，因判决或者强制执行等原因，当事人尚未向权属登记机关办理登记手续，而由执行法院向登记机关提供被执行人取得财产所依据的生效判决书或者执行裁定书及协助执行通知书，由登记机关对该房屋的权属直接进行登记是()。',o:["变更登记", "查封登记", "预告登记", "注销登记"],a:1,x:'查封登记指作为被执行人的不动产权利人因判决或者强制执行等原因，当事人尚未向权属登记机关办理登记手续，而由执行法院向登记机关提供被执行人取得财产所依据的生效判决书或者执行裁定书及协助执行通知书，由登记机关对该房屋的权属直接进行登记，然后再予以查封。'},
  {ch:34,q:'下列权利中，不可以出质的是()。',o:["提单", "保险单", "可转让的基金份额", "将有的应收账款"],a:1,x:'根据《民法典》第440条的规定，下列权利可以出质：①汇票、本票、支票;②债券、存款单;③仓单，提单;④可以转让的基金份额、股权;⑤可以转让的注册商标专用权、专利权，著作权等知识产权中的财产权;⑥现有的以及将有的应收账款;⑦法律、行政法规规定可以出质的其他财产权利。课程咨询免费微信学习群温馨提示：因考试政策、内容不断变化与调整，华课网校提供的以上信息仅供参考，如有异议，请考生以官方部门公布的内容为准！责编：duoduo上一篇：中级经济师《经济基础知识》章节真题考点：第三十三章法律对经济下一篇：中级经济师《经济基础知识》章节真题考点：第三十五章合同法律制相关新闻中级经济师《经济基础知识》章节真题考'},

  {ch:35,q:'合同终止的最正常和最主要的形式是()。',o:["混同", "提存", "抵销", "合同履行"],a:3,x:'合同的履行是合同终止的最正常和最主要的形式。'},
  {ch:35,q:'下列合同中，既是单务合同又是实践合同的是()。',o:["买卖合同", "借用合同", "赠与合同", "租赁合同"],a:1,x:'单务合同是指合同当事人一方只负有义务而不享有权利，另一方只享有权利而不负担义务的合同。实践合同是指除了当事人双方意思表示一致以外，还需要有一方当事人实际交付标的物的行为才能成立的合同，所以实践合同也称要物合同。借用合同既是单务合同又是实践合同。'},
  {ch:35,q:'甲公司与乙公司签订了一份食品买卖合同，双方约定甲公司先付款前，爆出乙公司食品违法使用添加剂的新闻，导致乙公司商誉尽失。此种情形下，甲公司可以行使()。',o:["先履行抗辩权", "不安抗辩权", "先诉抗辩权", "同时履行抗辩权"],a:1,x:'不安抗辩权是指在双务合同中有先给付义务的当事人，在有证据证明后给付人具有丧失或者可能丧失履行债务能力的情况时，可以中止自己先给付义务的履行。'},
  {ch:35,q:'合同一方利用对方处于危困状态、缺乏判断能力等情形，而订立的显示公平的合同属于()。',o:["可撤销合同", "未成立的合同", "效力待定的合同", "无效合同"],a:0,x:'一方利用对方处于危困状态、缺乏判断能力等情形，致使订立的合同显失公平的，受损害方有权请求人民法院或者仲裁机构予以撤销。课程咨询免费微信学习群温馨提示：因考试政策、内容不断变化与调整，华课网校提供的以上信息仅供参考，如有异议，请考生以官方部门公布的内容为准！责编：duoduo上一篇：中级经济师《经济基础知识》章节真题考点：第三十四章物权法律制下一篇：中级经济师《经济基础知识》章节真题考点：第三十六章公司法律制相关新闻中级经济师《经济基础知识》章节真题考点汇总06-29中级经济师《经济基础知识》章节真题考点：第三十七06-27中级经济师《经济基础知识》章节真题考点：第三十六06-27中级经济师《经'},
  // Ch36
  {ch:36,q:'国有独资公司不设股东会，行使股东会职权的是()。',o:["国有资产监督管理机构", "监事会", "职工代表大会", "董事会"],a:0,x:'固有独资公司不设股东会，由国有资产监督管理机构行使股东会职权。国有资产监督管理机构可以授权公司董事会行使股东会的部分职权，决定公司的重大事项，但公司的合并、分立、解散、增加或者减少注册资本和发行公司债券，必须由国有资产监督管理机构决定。'},
  {ch:36,q:'2022年5月，外资甲方和中资乙方在我国某直辖市新设立一家法人企业。关于该企业的组织形式、组织机构等事项，适用的法律是()。',o:["《中华人民共和国中外合作经营企业法》", "《中华人民共和国中外合资经营企业法》", "《中华人民共和国公司法》", "《中华人民共和国外资企业法》"],a:2,x:'2019年第十三届全国人民代表大会第二次会议通过的《中华人民共和国外商投资法》以下简称《外商投资法》规定，外商投资企业的组织形式、组织机构及其活动准则，适用《公司法》《中华人民共和国合伙企业法》等法律的规定。同时，该法宣告《中华人民共和国中外合资经营企业法》《中华人民共和国中外合作经营企业法》和《中华人民共和国外资企业法》自2020年1月1日起废止。'},
  {ch:36,q:'根据《中华人民共和国公司法》，公司经营管理发生严重困难，继续存续会使股东利益受到重大损失，通过其他途径不能解决的，持有公司全部股东表决权()以上的股东，可以请求人民法院解散公司。',o:["60%", "10%", "25%", "51%"],a:1,x:'《最高人民法院关于适用〈中华人民共和国公司法〉若干问题的规定(二)》(以下简称《公司法司法解释(二)》)列举了下列情形，可由单独或者合计持有公司全部股东表决权10%以上的股东提起解散公司诉讼：①公司持续两年以上无法召开股东会或者股东大会，公司经营管理发生严重困难的;②股东表决时无法达到法定或者公司章程规定的比例，持续两年以上不能做出有效的股东会或者股东大会决议，公司经营管理发生严重困难的;③公司董事长期冲突，且无法通过股东会或者股东大会解决，公司经营管理发生严重困难的;④经营管理发生其他严重困难，公司继续存续会使股东利益受到重大损失的情形。'},
  {ch:36,q:'股东可以提起解散公司诉讼。下列情形中，人民法院不予受理的是()。',o:["股东以利润分配请求权受到损害为由起诉要求解散公司的", "股东表决时无法达到法定或者公司章程规定的比例，持续2年以上不能做出有效的股东会或股东大会决议", "公司持续2年以上无法召开股东会或者股东大会，公司经营管理发生严重困难的", "经营管理发生其他严重困难，公司继续存续会使股东利益受到重大损失的"],a:0,x:'公司经营管理发生严重困难，继续存续会使股东利益受到重大损失，通过其他途径不能解决的，持有公司全部股东表决权10%以上的股东，可以请求人民法院解散公司。下列情形，可提起解散公司诉讼：①公司持续两年以上无法召开股东会或者股东大会，公司经营管理发生严重困难的;②股东表决时无法达到法定或者公司章程规定的比例，持续两年以上不能做出有效的股东会或者股东大会决议，公司经营管理发生严重困难的;③公司董事长期冲突，且无法通过股东会或者股东大会解决，公司经营管理发生严重困难的;④经营管理发生其他严重困难，公司继续存续会使股东利益受到重大损失的情形。股东以知情权、利润分配请求权等权益受到损害，或者公司亏损、财产不足'},
  // Ch37
  {ch:37,q:'劳动合同1年以上不满3年的，约定试用期不得超过()。',o:["6个月", "1个月", "2个月", "3个月"],a:2,x:'劳动合同期限3个月以上不满1年的，试用期不得超过1个月;劳动合同期限1年以上不满3年的，试用期不得超过2个月;3年以上固定期限和无固定期限的劳动合同，试用期不得超过6个月。'},

  {ch:29,type:'multi',q:'共同共有和按份共有的区别在于（）。',o:["对共有物的管理不同", "享有的权利不同", "权利的主体不同", "对第三人行使权利不同"],a:[0, 1, 3, 4],x:'本题考查共同共有和按份共有的区别。主要体现在以下方面：（1）成立的原因不同；（2）对共有物的管理不同；（3）享有的权利不同；（4）对第三人行使权利不同；（5）分割共有物的限制不同。'},

  {ch:29,q:'担保期间，担保财产毁损、灭失的，担保物权人可以就获得的赔偿金优先受偿。这体现了担保物权的（）特征。',o:["价值权性", "从属性", "不可分性"],a:3,x:'本题考查担保物权的特征。担保物权具有物上代位性。担保物权的实质在于对标的物交换价值的直接支配。因此，担保标的物变化为其他的价值形态时，担保物权所具有的支配效力及于变形物或者代替物。担保物因毁损灭失所获得的赔偿金成为担保物的代替物，担保物权人可就该代替物行使担保物权。'},

  {ch:29,type:'multi',q:'所有权的原始取得方式包括（）。',o:["添附", "先占", "生产", "国有化和没收"],a:[0, 1, 2, 3],x:'本题考查所有权的原始取得方式。原始取得的方式主要有生产、孳息、国有化、没收、先占、添附、发现埋藏物和隐藏物、拾得遗失物、善意取得。选项E属于继受取得的方式。'},
  {ch:28,q:'不同所有人的物因一定的行为而结合在一起形成不可分割的物或具有新质的物，这在民法理论上称为（）。',o:["合并", "继受所得", "添附"],a:2,x:'本题考查添附的概念。所谓添附，是指不同所有人的物因一定的行为而结合在一起形成不可分割的物或具有新质的物。'},
  {ch:29,q:'所有权并非占有、使用、收益和处分四项权利的简单相加，而是一个整体的权利，可以统一行使，也可以将其部分权能转移他人，这体现了所有权（）的法律特征。',o:["独占性", "全面性", "单一性"],a:2,x:'本题考查所有权的概念和法律特征。所有权单一性指所有权并非占有、使用、收益和处分四项权利的简单相加，而是一个整体的权利，可以统一行使，也可以将其部分权能转移他人。'},
  {ch:0,q:'登记机构予以异议登记的，申请人在异议登记之日起（）日内不起诉，异议登记失效。',o:["5", "10", "15"],a:2,x:'本题考查不动产登记。登记机构予以异议登记的，申请人在异议登记之日起15日内不起诉，异议登记失效。'},
  {ch:29,q:'下列选项中属于所有权内容的核心且是拥有所有权的根本标志的是（）。',o:["使用权", "处分权", "收益权"],a:1,x:'本题考查所有权的概念。处分权是所有权内容的核心，是拥有所有权的根本标志。'},
  {ch:29,q:'所有人对自己的不动产或者动产依法享有的占有、使用、收益和处分的权利称为（）。',o:["占有权", "所有权", "用益物权"],a:1,x:'本题考查所有权的概念。所有权是指所有人对自己的不动产或者动产依法享有的占有、使用、收益和处分的权利。'},
  {ch:29,type:'multi',q:'根据物权的权利人行使权利的范围不同，物权可分为（）。',o:["自物权", "主物权", "他物权", "从物权"],a:[0, 2],x:'本题考查物权的种类。根据物权的权利人行使权利的范围不同，物权可分为自物权和他物权。'},
  {ch:29,q:'下列选项中不属于物权特征的是（）。',o:["是一种支配权", "客体一般为物", "是一种相对权"],a:2,x:'本题考查物权的特征。物权是绝对权，选项C说法错误。'},
  {ch:30,q:'若同一不动产上先后设立了两个登记的抵押权，则二者的受偿顺序为（）。',o:["登记在先的优先受清偿", "登记在后的优先受清偿", "二者按照比例受偿"],a:0,x:'本题考查物权的优先效力。同一标的物上存在着两个或者两个以上内容相同或者性质相同的物权时，成立在先的优先于成立在后的物权。'},
  {ch:29,q:'关于物权特征的说法，错误的是（）。',o:["物权是绝对权", "物权具有优先效力", "物权具有追及效力"],a:3,x:'本题考查物权的特征。物权是绝对权、支配权、具有优先效力和追及效力。债权具有请求权。'},
  {ch:0,q:'债权必须有相对的义务人给予协助方可顺利实现对应的（）。',o:["请求权", "相对权", "绝对权"],a:0,x:'本题考查物权的特征。债权必须有相对的义务人给予协助方可顺利实现请求权。而物权的权利人可以自由地根据自己的意志行使自己的权利，无须他人给予协助，更不须征得他人的同意。'},
  {ch:28,q:'通过一定的法律行为或基于法定的事实从原所有人处取得所有权的方式称为（）。',o:["善意取得", "继受取得", "原始取得"],a:1,x:'本题考查继受取得的概念。继受取得是指通过一定的法律行为或基于法定的事实从原所有人处取得所有权的方式。'},
  {ch:28,type:'multi',q:'物权法律制度的基本原则包括（）。',o:["诚实信用原则", "物权法定原则", "一物一权原则", "物权公示原则"],a:[1, 2, 3],x:'本题考查物权法律制度的基本原则。物权法律制度的基本原则包括物权法定原则、一物一权原则和物权公示原则。AE两项是民法的基本原则。'},
  {ch:28,q:'物权法律制度的“一物一权原则”指的是一个特定的标的物上只有一个（）。',o:["所有权", "抵押权", "用益物权"],a:0,x:'本题考查物权法律制度的基本原则。一物一权原则指的是一个特定的标的物上只有一个所有权，不得设有两个以上相互冲突和矛盾的物权。'},
  {ch:29,type:'multi',q:'物权法定原则的具体内容包括（）。',o:["物权种类法定化", "物权效力法定化", "物权内容法定化", "物权的得丧变更法定化"],a:[0, 1, 2, 3],x:'本题考查物权法律制度的基本原则。物权法定原则的具体内容包括：（1）物权种类法定化。非经法律准许，当事人不得创设新类型的物权。（2）物权内容法定化。物权制度的所有内容均是由法律直接加以规定的（3）物权效力法定化。物权的法律后果源自法律的直接规定。（4）物权的得丧变更法定化。非经法定程序，不得取得、变更和消灭物权。（5）物权保护方法法定化。物权保护方法和债权保护方法均为法定的物权的保护方法。'},
  {ch:29,q:'根据物权的发生是否基于当事人的意思为标准可将物权分为（）。',o:["自物权和他物权", "用益物权和担保物权", "主物权和从物权"],a:3,x:'本题考查物权的种类。根据物权的发生是否基于当事人的意思为标准可将物权分为法定物权和意定物权。'},
  {ch:29,q:'下列属于无期限物权的是（）。',o:["质权", "留置权", "抵押权"],a:3,x:'本题考查物权的种类。抵押权、质权、留置权属于有期限物权，所有权属于无期限物权。'},
  {ch:30,q:'合同担保的目的是（）。',o:["督促债权人履行合同义务", "督促债务人履行合同义务", "保全债权人的债权"],a:1,x:'本题考查合同担保的法律特征。合同担保的目的是督促债务人履行合同义务。'},
  {ch:30,q:'定金的数额由当事人约定，但不得超过主合同标的额的（）。',o:["15%", "20%", "25%"],a:1,x:'本题考查定金的数额。定金的数额由当事人约定，但不得超过主合同标的额的百分之二十，超过部分不产生定金的效力。'},
  {ch:30,type:'multi',q:'定金与违约金的区别在于（）。',o:["定金的给付一般是在订立合同之时，也可以在合同履行之前给付，而不是在违约时支付", "违约金有证明合同成立和预先给付的效力，而定金没有", "定金主要是担保作用，违约金则是违约责任的一种形式", "定金的数额不超过主合同的总金额的20%，而违约金没此限制"],a:[0, 2, 3],x:'本题考查违约金与定金的区别。定金与违约金的区别：（1）交付时间不同。定金的给付一般是在订立合同之时，也可以在合同履行之前，而不是在违约时支付；（2）效力不同。定金有证明合同成立和预先给付的效力，而违约金没有；（3）性质不同。定金主要起合同担保的作用，而违约金则是违约责任的一种形式。定金的数额不得超过主合同标的额的20%，具体数额由双方当事人协商决定。本题选项ACD正确。'},
  {ch:30,q:'保证人和债权人约定，当债务人不履行债务时，保证人按照约定履行债务或者承担责任的行为称为（）。',o:["抵押", "定金", "保证"],a:2,x:'本题考查保证的概念。保证是指保证人和债权人约定，当债务人不履行债务时，保证人按照约定履行债务或者承担责任的行为。'},
  {ch:30,q:'下列权利中，属于合同保全制度内容的是（）。',o:["不动产抵押权", "留置权", "债权人的代位权"],a:2,x:'本题考查合同的保全。合同的保全，是指法律为防止因债务人财产的不当减少致使债权人债权的实现受到危害，而设置的保全债务人责任财产的法律制度，具体包括债权人代位权制度和债权人撤销权制度。'},
  {ch:0,q:'当债务人所为的减少其财产的行为危害债权实现时，债权人为保全其债权可以（）。',o:["向债务人表示撤销其行为", "向工商行政管理机关请求撤销债务人的行为", "请求人民法院撤销债务人的行为"],a:2,x:'本题考查债权人的撤销权。债权人撤销权是指当债务人所为的减少其财产的行为危害债权实现时，债权人为保全其债权得请求法院撤销债务人该行为的权利。'},

  {ch:31,type:'multi',q:'下列人员中，不得担任公司的董事、监事、高级管理人员的有（）。',o:["限制民事行为能力人", "个人所负数额较大的债务到期未清偿的人", "因犯罪被剥夺政治权利，执行期满未逾5年的人", "无民事行为能力人"],a:[0, 1, 2, 3],x:'本题考查董事、监事及高级管理人员的资格和义务。有下列情形之一的，不得担任公司的董事、监事、高级管理人员：（1）无民事行为能力或者限制民事行为能力；（2）因贪污、贿赂、侵犯财产、挪用财产或者破坏社会主义市场经济秩序，被判处刑罚，执行期满未逾5年，或者因犯罪被剥夺政治权利，执行期满未逾5年；（3）担任破产清算的公司、企业的董事或者厂长、经理，对该公司、企业的破产负有个人责任的，自该公司、企业破产清算完结之日起未逾3年；（4）担任因违法被吊销营业执照、责令关闭的公司、企业的法定代表人，并负有个人责任的，自该公司、企业被吊销营业执照之日起未逾3年；（5）个人所负数额较大的债务到期未清偿。'},
  {ch:31,q:'代表（）以上表决权的股东、（）以上董事或者监事会，可以提议召开股份有限公司董事会临时会议。',o:["1/10，1/3", "1/10，2/3", "1/3，半数"],a:0,x:'本题考查董事会。代表1/10以上表决权的股东、1/3以上董事或者监事会，可以提议召开股份有限公司董事会临时会议。'},
  {ch:31,q:'股份有限公司的董事会每年度至少召开（）会议，每次会议应当于会议召开（）前通知全体董事和监事。',o:["一次，10日", "两次，15日", "一次，15日"],a:3,x:'本题考查董事会。股份有限公司的董事会每年度至少召开两次会议，每次会议应当于会议召开10日前通知全体董事和监事。'},
  {ch:0,q:'甲向乙借了30元钱，同时甲又为乙修好了收音机，修理费恰好是30元。则他们之间的债权债务可以（）。',o:["提存", "混同", "免除"],a:3,x:'本题考查抵销的概念。抵销是指当事人双方相互负有同种类的给付义务时，将两项义务相互冲抵，使其相互在对等额内消灭。'},

  {ch:0,q:'恩格尔定律是指（）。',o:["在一个家庭或一个经济体中，食物支出在收入中所占的比例随着收入的增加而减少", "在一个家庭或一个经济体中，食物支出在收入中所占的比例随着支出的增加而减少", "在一个家庭或一个经济体中，食物支出在收入中所占的比例随着收入的减少而减少"],a:0,x:'本题考查恩格尔定律。恩格尔定律：在一个家庭或一个经济体中，食物支出在收入中所占的比例随着收入的增加而减少。'},
  {ch:11,type:'multi',q:'下列关于弹性系数的说法，正确的有（）。',o:["需求交叉弹性系数小于0的商品称为低档品", "需求收入弹性系数大于1的商品称为高档品", "需求交叉弹性系数大于0的商品称为正常品", "需求收入弹性系数大于0小于1的商品称为必需品"],a:[1, 3, 4],x:'本题考查需求收入弹性。需求收入弹性系数大于1的商品称为高档品，需求收入弹性系数大于0小于1的商品称为必需品，需求收入弹性系数小于0的商品称为低档品。需求交叉弹性系数为正数，表示两种商品是替代品。需求交叉弹性系数为负数，表示两种商品是互补品。'},

  {ch:2,type:'multi',q:'关于需求曲线的说法正确的有（）。',o:["需求曲线是一条向右上方倾斜的曲线", "需求曲线是一条向右下方倾斜的曲线", "一般情况下需求与价格的变动呈反方向变化", "一般情况下需求与价格的变动呈同方向变化"],a:[1, 2, 4],x:'本题考查需求曲线。一般情况下需求与价格的变动呈反方向变化。需求曲线是一条向右下方倾斜的曲线，供给曲线是一条向右上方倾斜的曲线。所以选项AD错误。'},
  {ch:0,q:'支配着消费者在使用价值相同或接近的替代品之间消费选择的因素是（）。',o:["消费者偏好", "生产成本", "消费者预期"],a:0,x:'本题考查影响需求的主要因素。消费者偏好支配着消费者在使用价值相同或接近的替代品之间的消费选择。'},

  {ch:0,q:'在一定时间内和一定价格条件下，消费者对某种商品或服务愿意而且能够购买的数量称为（）。',o:["供给", "需求", "弹性"],a:1,x:'本题考查需求的含义。需求就是指在一定时间内和一定价格条件下，消费者对某种商品或服务愿意而且能够购买的数量。'},
  {ch:0,type:'multi',q:'下列经济因素中，属于影响市场供给主要因素的有（）。',o:["商品价格", "生产成本", "消费者偏好", "生产技术水平"],a:[0, 1, 3],x:'本题考查影响供给的因素。影响供给的因素主要有：产品价格、生产成本、生产技术、预期、相关产品价格、生产要素的价格以及国家政策等。'},
  {ch:11,q:'两种商品为互补品，则交叉弹性系数为（）。',o:["负数", "正数", "零"],a:0,x:'本题考查需求交叉价格弹性的类型。两种商品为互补品，则需求交叉弹性系数为负数，即Eij＜0。'},

  {ch:3,q:'按照美国经济学家科斯的观点，企业的本质或者显著特征是（）。',o:["企业是推动技术进步的平台", "企业是社会化大生产的产物", "企业是承担社会责任的机制"],a:3,x:'本题考查企业形成的理论。科斯认为企业是为了节约市场交易费用或交易成本而产生的，企业的本质或者显著特征是作为市场机制或价格机制的替代物。'},
  {ch:3,q:'边际产量递减规律发生作用的前提条件是（）。',o:["投入的生产要素价格不变", "各种生产要素投入比例不变", "全要素生产率有所下降"],a:3,x:'本题考查边际产量递减规律。边际产量递减规律也称为边际报酬递减规律，其基本含义是：在技术水平和其他投入保持不变的条件下，连续追加一种生产要素的投入量，总是存在着一个临界点，在临界点之前，边际产量递增，超过临界点之后，边际产量将出现递减的趋势，直到出现负值。'},
  {ch:3,q:'按照美国经济学家科斯的观点，企业存在的根本原因是（）。',o:["节约交易成本或交易费用", "社会生产力发展的要求", "有利于成本和劳动的有机结合"],a:0,x:'本题考查企业形成的理论。美国经济学家科斯认为企业是为了节约市场交易费用或交易成本而产生的，企业的本质或者显著特征是作为市场机制或价格机制的替代物。'},
  {ch:3,q:'在一种可变要素的生产函数及其曲线中，总产量曲线、平均产量曲线、边际产量曲线等曲线之间存在着一定的规律或关系，当总产量曲线下降时，（）。',o:["平均产量为0", "平均产量曲线与边际产量曲线相交", "边际产量为负数"],a:2,x:'本题考查产量曲线。当边际产量为0时，总产量达到最大。当边际产量小于0时，总产量开始下降。所以，总产量下降时，边际产量为负数。'},
  {ch:3,type:'multi',q:'关于规模报酬的说法，正确的有（）。',o:["规模报酬是企业的生产规模与所引起的产量之间的关系", "规模报酬可以分为两类", "规模报酬研究的是长期生产决策问题", "技术进步决定生产规模"],a:[0, 2],x:'本题考查规模报酬。规模报酬也称规模收益，是在其他条件不变的情况下，企业内部各种生产要素按照相同比例变化时所带来的产量的变化，也就是企业的生产规模变化与所引起的产量变化之间的关系，选项A正确，选项E错误。企业只有在长时期中才能改变全部生产要素的投入，进而影响生产规模，所以规模收益研究的是企业的长期生产决策问题，选项C正确，选项D错误。规模报酬可以分为三类，选项B错误。'},
  {ch:3,q:'在给定的预算线坐标图上，决定预算线变动的因素包括（）。',o:["价格弹性和商品的相对价格", "消费者收入和商品的相对价格", "消费者偏好和商品的相对价格"],a:1,x:'本题考查预算约束线。预算线表示在消费者的收入和商品的价格给定的条件下，消费者的全部收入所能购买到的两种商品的各种组合。所以决定预算线变动的因素就是商品的价格和消费者的收入。'},
  {ch:2,q:'需求曲线是通过（）推导出来的。',o:["价格一成本曲线", "价格一消费曲线", "价格弹性曲线"],a:1,x:'本题考查需求曲线。需求曲线是通过价格—消费曲线推导出来的。由于一种商品价格的变动，预算线的位置发生了变动，从而引起预算线与无差异曲线的切点即消费者均衡点的移动，把这些均衡点连接起来便可以得到一条价格—消费曲线。由价格一消费曲线可以看出，当商品的价格下降时，无差异曲线向外转，因而商品的需求量上升，所以消费者的需求曲线是向下倾斜的。（2018年试题）正保会计网校中级经济师好课已就位，随报随学！其中，高效实验班入学测试、阶段测评、还赠送机考模拟系统，两科联报更划算！点击了解中级经济师课程>>告别低效备考，限时抽好课，随机立减-试试手气试试手气点击试试手气即可抽奖人已抽奖告别低效备考，限时抽好课，立减-元优惠券已放入账户人已抽奖折优惠券使用范围：考培课程购买（不包括VIP，无忧以及面授班次）点击\'去买课\'即可使用48小时内失效热门班次不感兴趣？去选课中心>活动说明：此抽奖活动会随机抽选幸运用户，并非所有人可见。参与后优惠券仅限48小时内使用。您有一次专属抽奖机会最多可得元优惠试试手气人已抽奖关闭去选课去选课去选课关闭000分享到：-->发送学员讨论（0）查看被折叠的评论被折叠评论包含相似、疑似不友好或无意义内容上一篇：2022年中级经济师《经济基础》习题精选（三...下一篇：2022年中级经济师《经济基础》习题精选（二...推荐阅读报考指南：初中级经济师报考全攻略中级经济师全套备考资料一键领取初级经济师全套备考资料一键领取中级经济师题库会员→尊享20+权益初级经济师题库会员→尊享18+权益中级经济师教材+辅导书一站式配齐相关资讯·2023初中级经济师考前丢分行为看看你有没有中招？·2023初中级经济师各科高频考点带你冲刺逆袭！·备考初中级经济师做题效果差做点啥有用？·2023年中级经济师各科目易错题汇总·2022年中级经济师《建筑与房地产》练习题精选（三十）·2022中级经济师《知识产权》练习题精选（三十）·2022年中级经济师《财政税收》练习题精选（三十）·2022年中级经济师《金融》练习题精选（三十）·2022年中级经济师《工商管理》练习题精选（三十）·2022年中级经济师《人力资源管理》练习题精选（三十）报考指南报考指南-->考试大纲已公布报名时间7月22日-8月12日准考证打印考前一周考试时间11月7日、8日考试成绩考后一个月左右-->合格证领取以各地公告为准辅导用书高效课程热搜关键词查看更多>精品好课免费专区免费咨询财税问答免费试听免费题库免费直播免费资料免费试听查看更多>免费资料下载报考政策历年试题科目特点各章重要性模拟试题高频考点新手指导一键领取全部资料一键领取全部资料-->免费直播查看更多>免费题库免费题库海量好题免费做带你花式刷题每日一练机考系统关注更多扫码下载APP及时接收最新考试资讯及备考信息扫码加入备考交流群与更多考生一起交流学习，备战考试，赢在起跑线领取资料-->在线客服APP新用户扫码下载立享专属优惠安卓版本:8.9.21苹果版本:8.9.21开发者：北京正保会计科技有限公司应用涉及权限：查看权限>APP隐私政策：查看政策>HD版本上线：点击下载>官方号官方公众号微信扫一扫官方视频号微信扫一扫官方抖音号抖音扫一扫公众号扫一扫关注-->建议/投诉回到顶部折叠网站地图初级会计职称指南-->报名考试查分备考题库复习-->中级会计职称报名考试查分备考题库高级会计师报名考试查分题库评审注册会计师报名考试查分备考题库税务师报名考试查分备考题库资产评估师报名考试查分备考题库ACCA白金级前景免考政策资料复习-->CMA报名考试政策准考证查分CFA前景报名考试资料备考FRM官方前景报名考试备考美国CPA证书互认报名考试资料查分-->澳洲CPA授权机构免考考试资料试题-->经济师指南-->报名考试查分备考题库就业晋升招聘简历求职故事会计实务各行业问答记账报表实操银行从业报名准考证考试证书查分证券从业报名大纲考试查分证书精华问答初级中级注会税务师经济师-->期货从业报名大纲考试准考证查分-->Copyright©2000-www.chinaacc.comAllRightsReserved.北京正保会计科技有限公司版权所有京B2-20200959京ICP备20012371号-7出版物经营许可证京公网安备11010802044457号营业执照-->-->-->-->恭喜你！获得专属大额券！-->￥1100-->税务师专属券-->去使用-->-->套餐D大额券￥去使用'},
  {ch:2,q:'在完全竞争市场上，单个企业所面对的需求曲线也是其（）。',o:["平均收益曲线和边际成本曲线", "平均收益曲线和边际收益曲线", "平均收益曲线和总收益曲线"],a:1,x:'本题考查完全竞争市场中生产者的行为。完全竞争市场上，正因为价格、平均收益和边际收益都是相等的，所以，企业的平均收益、边际收益和需求曲线都是同一条线。（2021年试题）'},
  {ch:4,q:'垄断竞争企业为了实现利润最大化，遵循的决策原则是（）。',o:["边际收益等于平均收益", "按照价格弹性进行的价格歧视", "边际收益等于边际成本"],a:2,x:'本题考查垄断竞争市场上生产者的行为。因为垄断竞争企业面临向右下方倾斜的需求曲线，所以与完全垄断企业类似，垄断竞争企业也遵循着相同的利润最大化原则，它选择边际收益等于边际成本即MR＝MC的产量，然后用其需求曲线找出与这种产量相对应的价格。（2021年试题）'},
  {ch:4,type:'multi',q:'在完全竞争市场上，关于产品的价格的说法，正确的有（）。',o:["每个消费者可以自主定价", "生产者可以进行差别定价", "政府的价格控制是非常必要的", "每个生产者都是价格的接受者"],a:[3, 4],x:'本题考查市场结构。在完全竞争市场上，市场上有很多生产者和消费者，或买者和卖者，而且这些生产者规模都很小，没有任何一个买者或卖者能够影响市场价格，每个生产者或消费者都只能是市场价格的接受者，而不是价格的决定者。也就是说，每一个生产者或消费者都只是被动地接受市场价格，对市场价格没有任何控制的力量。（2021年试题）'},

  {ch:0,q:'在要素市场上，生产者使用要素的原则是（）。',o:["边际要素成本等于边际物质产品", "边际要素成本等于边际收益产品", "边际要素成本等于平均要素成本"],a:1,x:'本题考查生产者使用生产要素的原则。生产者使用要素的原则就是在一定时间内，在一定条件下，根据企业内部的生产状况和市场情况，确定要素的使用量，以实现利润最大化，即边际要素成本等于边际收益产品。'},
  {ch:2,type:'multi',q:'关于各种不同的生产要素的供给曲线的说法，正确的有（）。',o:["土地的供给曲线是一条垂直线", "劳动的供给曲线是一条后弯曲线", "资本的供给曲线在短期内是一条后弯曲线", "各种要素的供给曲线具有同样的形状"],a:[0, 1],x:'本题考查劳动供给曲线和均衡工资的决定。劳动的供给曲线是后弯曲线。由于土地的数量一般不会变化，所以土地的供给曲线是一条垂直线。而资本的供给在短期内是垂直线，从长期来看也是一条后弯曲线。'},

  {ch:1,q:'资源配置实现最优的标准是（）。',o:["经济总量和财政收入持续增长", "不存在帕累托改进的资源配置状态", "劳动生产率持续提高"],a:1,x:'本题考查帕累托最优状态。资源实现最优配置的标准是：当一种资源的任何重新分配已经不可能实现在不使一个人福利减少的情况下使任何一个人的福利增加。换言之，社会已经达到这样一种状态，如果资源在某种配置下，不可能由重新组合生产和分配来使一个人或多个人的福利增加，而不使其他任何人的福利减少，那么社会就实现了资源的最优配置，这种状态称为“帕累托最优”状态；反之，如果既定的资源配置状态能够在其他人福利水平不降的情况下，通过重新配置资源，使得至少有一个人的福利水平有所提高，则这种资源重新配置称为“帕累托改进”。所以，帕累托最优状态是不存在帕累托改进的资源配置状态。'},
  {ch:6,type:'multi',q:'按照市场失灵的理论，导致市场失灵的原因包括（）。',o:["信息不对称", "市场监管不力", "市场竞争过度", "收入分配差距过大"],a:[0, 4],x:'本题考查市场失灵的原因。导致市场失灵的原因主要有垄断、外部性、公共物品和信息不对称等。（2021年试题）'},
  {ch:6,q:'关于外部性的说法，正确的是（）。',o:["外部性问题只有在垄断竞争市场条件下存在", "外部性的存在使得资源配置难以达到帕累托最优状态", "外部性问题只有在生产过程中存在"],a:1,x:'本题考查外部性。外部性可以分为外部经济与外部不经济两种（选项D错误）。根据经济活动的主体是生产者还是消费者，外部性可以分为生产的外部性和消费的外部性（选项C错误）。由于外部性或外部影响的存在，市场机制就不能有效地进行资源配置。即使是在完全竞争条件下，由于存在外部性的影响，整个经济的资源配置也不可能达到帕累托最优状态（选项A错误，选项B正确）。'},
  {ch:3,type:'multi',q:'美国经济学家科斯关于产权和外部性理论的主要观点和结论包括（）。',o:["很多外部性的产生都是由于产权不清晰导致的", "只要产权是明确的，并且交易成本为零或者很小，市场均衡的最终结果都是有效率的", "即使产权不明确，只要交易成本为零或者很小，市场均衡的最终结果都是有效率的", "不同的产权制度会导致相同的资源配置效率"],a:[0, 1, 4],x:'本题考查科斯理论。只要财产权是明确的，并且交易成本是零或者很小，那么无论在开始时将财产权赋予谁，市场均衡的最终结果都是有效率的，实现资源配置的帕累托最优。一旦考虑到交易成本，不同产权制度，会导致不同的资源配置效率。选项CD说法错误。'},
  {ch:5,q:'反映生产要素市场和产品市场之间联系的是（）。',o:["引致需求", "联合需求", "复合需求"],a:0,x:'本题考查引致需求。生产者对生产要素的需求称为引致需求或派生需求，引致需求的概念反映了生产要素市场和产品市场之间的联系。生产者对生产要素的需求量在很大程度上取决于消费者对产品的需求量。（2018年试题）'},
  {ch:5,q:'从短期看，在要素市场上，供给曲线具有后弯特征的生产要素是（）。',o:["数据", "土地", "资本"],a:3,x:'本题考查劳动的供给曲线。劳动的供给曲线向后弯曲。土地的供给曲线是一条垂直线。而资本的供给在短期内是垂直线，从长期来看才是一条后弯曲线。'},
  {ch:5,q:'在要素市场上，工资增加的替代效应是指（）。',o:["工作较短的时间可以获得同样的收入，劳动供给减少", "劳动者收入增加而追求闲暇，减少劳动供给", "宁愿工作更长的时间用劳动替代闲暇，增加劳动供给"],a:2,x:'本题考查劳动的供给曲线。工资增加的替代效应是指，由于工资上升，收入增加，消费者用劳动替代闲暇，劳动供给增加。工资增加的收入效应是指，由于工资上升，收入增加，消费者相对更加富有而追求闲暇，从而会减少劳动的供给。正保会计网校中级经济师好课已就位，随报随学！其中，高效实验班入学测试、阶段测评、还赠送机考模拟系统，两科联报更划算！点击了解中级经济师课程>>告别低效备考，限时抽好课，随机立减-试试手气试试手气点击试试手气即可抽奖人已抽奖告别低效备考，限时抽好课，立减-元优惠券已放入账户人已抽奖折优惠券使用范围：考培课程购买（不包括VIP，无忧以及面授班次）点击\'去买课\'即可使用48小时内失效热门班次不感兴趣？去选课中心>活动说明：此抽奖活动会随机抽选幸运用户，并非所有人可见。参与后优惠券仅限48小时内使用。您有一次专属抽奖机会最多可得元优惠试试手气人已抽奖关闭去选课去选课去选课关闭000分享到：-->发送学员讨论（0）查看被折叠的评论被折叠评论包含相似、疑似不友好或无意义内容上一篇：2022年中级经济师《经济基础》习题精选（三...下一篇：2022年中级经济师《经济基础》习题精选（三...推荐阅读报考指南：初中级经济师报考全攻略中级经济师全套备考资料一键领取初级经济师全套备考资料一键领取中级经济师题库会员→尊享20+权益初级经济师题库会员→尊享18+权益中级经济师教材+辅导书一站式配齐相关资讯·2023初中级经济师考前丢分行为看看你有没有中招？·2023初中级经济师各科高频考点带你冲刺逆袭！·备考初中级经济师做题效果差做点啥有用？·2023年中级经济师各科目易错题汇总·2022年初中级经济师报名账号如何注册？·2022年中级经济师《建筑与房地产》练习题精选（三十三）·2022中级经济师《知识产权》练习题精选（三十三）·2022年中级经济师《财政税收》练习题精选（三十三）·2022年中级经济师《金融》练习题精选（三十三）·2022年中级经济师《工商管理》练习题精选（三十三）报考指南报考指南-->考试大纲已公布报名时间7月22日-8月12日准考证打印考前一周考试时间11月7日、8日考试成绩考后一个月左右-->合格证领取以各地公告为准辅导用书高效课程热搜关键词查看更多>精品好课免费专区免费咨询财税问答免费试听免费题库免费直播免费资料免费试听查看更多>免费资料下载报考政策历年试题科目特点各章重要性模拟试题高频考点新手指导一键领取全部资料一键领取全部资料-->免费直播查看更多>免费题库免费题库海量好题免费做带你花式刷题每日一练机考系统关注更多扫码下载APP及时接收最新考试资讯及备考信息扫码加入备考交流群与更多考生一起交流学习，备战考试，赢在起跑线领取资料-->在线客服APP新用户扫码下载立享专属优惠安卓版本:8.9.21苹果版本:8.9.21开发者：北京正保会计科技有限公司应用涉及权限：查看权限>APP隐私政策：查看政策>HD版本上线：点击下载>官方号官方公众号微信扫一扫官方视频号微信扫一扫官方抖音号抖音扫一扫公众号扫一扫关注-->建议/投诉回到顶部折叠网站地图初级会计职称指南-->报名考试查分备考题库复习-->中级会计职称报名考试查分备考题库高级会计师报名考试查分题库评审注册会计师报名考试查分备考题库税务师报名考试查分备考题库资产评估师报名考试查分备考题库ACCA白金级前景免考政策资料复习-->CMA报名考试政策准考证查分CFA前景报名考试资料备考FRM官方前景报名考试备考美国CPA证书互认报名考试资料查分-->澳洲CPA授权机构免考考试资料试题-->经济师指南-->报名考试查分备考题库就业晋升招聘简历求职故事会计实务各行业问答记账报表实操银行从业报名准考证考试证书查分证券从业报名大纲考试查分证书精华问答初级中级注会税务师经济师-->期货从业报名大纲考试准考证查分-->Copyright©2000-www.chinaacc.comAllRightsReserved.北京正保会计科技有限公司版权所有京B2-20200959京ICP备20012371号-7出版物经营许可证京公网安备11010802044457号营业执照-->-->-->-->恭喜你！获得专属大额券！-->￥1100-->税务师专属券-->去使用-->-->套餐D大额券￥去使用'},

  {ch:7,q:'按照国民收入核算理论，下列项目中，不属于按支出法计算国内生产总值（GDP）范围的是（）。',o:["劳动者报酬", "政府消费", "存货变动"],a:0,x:'本题考查国内生产总值的计算方法。国内生产总值支出法国内生产总值＝最终消费＋资本形成总额＋净出口。最终消费包括居民消费和政府消费，资本形成总额包括固定资本形成总额和存货变动。选项A属于收入法国内生产总值包括的内容。'},

  {ch:1,q:'下列关于外部性或外部影响与资源配置效率的说法，正确的是（）。',o:["产生外部经济的生产者的产出水平低于社会最优产出水平", "产生外部经济的生产者的产出水平高于社会最优产出水平", "产生外部不经济的生产者的产出水平等于社会最优产出水平"],a:0,x:'本题考查外部性和市场失灵。对于产生外部经济的生产者来说，由于其私人收益小于社会收益（因为社会收益等于私人收益与外部收益之和，而外部收益却不能为生产者通过市场价格获得），因而缺乏生产积极性，其产出水平就会低于社会最优产出水平。'},

  {ch:9,type:'multi',q:'下列关于我国的经济结构及就业失业问题的说法，正确的有（）。',o:["我国还处于从二元经济结构向现代化经济转型的进程中", "我国保持经济的长期稳定增长，不存在就业矛盾", "我国在经济和社会发展过程中，还将有一定数量的农村劳动力向城镇转移", "我国将继续实施就业优先政策，缓解结构性就业矛盾"],a:[0, 2, 3, 4],x:'本题考查我国的就业与失业问题。我国还处于从二元经济结构向现代化经济转型的进程中，城镇化程度还有待进一步提高，农村富余劳动力还有一定规模。在经济和社会发展过程中，还将有一定数量的农村劳动力向城镇转移。努力扩大就业，降低失业率，使劳动力资源得到更加充分的利用，是提高人民生活水平的重要途径。国家将继续实施就业优先政策，健全有利于更充分更高质量就业的促进机制，扩大就业容量，提升就业质量，缓解结构性就业矛盾。只有选项B说法错误。'},

  {ch:9,type:'multi',q:'关于菲利普斯曲线的含义和作用，下列说法中正确的有（）。',o:["菲利普斯曲线是一条描述通货膨胀与失业或经济增长之间相互关系的曲线", "菲利普斯曲线是一条描述经济增长与就业或失业之间相互关系的曲线", "根据菲利普斯曲线，可以通过促进经济增长来增加就业或减少失业", "菲利普斯曲线是一条描述税收收入与税率之间相互关系的曲线"],a:[0, 4],x:'本题考查菲利普斯曲线。菲利普斯曲线是以英国经济学家菲利普斯名字命名的一条描述通货膨胀与失业或经济增长之间相互关系的曲线，也是分析宏观经济问题的重要工具（选项A正确，BD错误）。根据奥肯定律，政府可以通过促进经济增长来增加就业或减少失业（选项C错误）。美国经济学家弗里德曼认为，工人和企业感兴趣的是实际工资而不是名义工资（货币工资），在劳资双方进行工资谈判时，工人会把通货膨胀预期考虑进去。这就意味着，对某一个水平的失业率，可以对应多个水平的通货膨胀率。按照这种观点，通货膨胀和失业之间的所谓替代关系只在短期内才是可能的，而在长期内则是不存在的（选项E正确）。（2021年试题）'},
  {ch:9,type:'multi',q:'关于菲利普斯曲线的说法，正确的有（）。',o:["从长期看，菲利普斯曲线是一条和横轴平行的直线", "菲利普斯曲线适用于任何国家，都具有相同数量关系", "简单的菲利普斯曲线是一条描述通货膨胀率与失业率之间关系的曲线", "弗里德曼认为长期来看，菲利普斯曲线是不存在的"],a:[2, 3],x:'本题考查菲利普斯曲线。从长期看，菲利普斯曲线是一条和横轴垂直的直线，选项A错误。菲利普斯曲线没有涉及数量关系，选项B错误。简单的菲利普斯曲线是一条表示通货膨胀率与失业率之间相互关系的曲线，选项C正确。按照经济学家弗里德曼的观点，通货膨胀和失业之间的所谓替代关系只在短期内才是可能的，而在长期内则是不存在的，选项D正确。菲利普斯曲线是以英国经济学家菲利普斯名字命名的一条描述通货膨胀与失业或经济增长之间相互关系的曲线，选项E错误。'},

  {ch:9,q:'关于失业的说法，错误的是（）。',o:["失业率是反映一个国家或地区劳动力资源利用状况的最重要的指标", "如何减少失业是宏观经济调控的重要任务之一", "失业是指有劳动能力的人目前没有从事有报酬或收入的工作的现象"],a:2,x:'本题考查就业与失业。失业是指有劳动能力并愿意就业但目前没有从事有报酬或收入的工作的现象。选项C忽略了“愿意就业”。'},
  {ch:9,q:'关于价格总水平影响因素的说法，错误的是（）。',o:["价格总水平与货币流通速度的变化呈正方向变动", "价格总水平取决于总需求和总供给的比例关系", "从长期来看，总供给变动与价格总水平无关"],a:3,x:'本题考查价格总水平。价格总水平与货币供给量、货币流通速度的变化呈正方向变动，而与总产出的变化呈反方向变动。'},
  {ch:9,q:'我国关于城镇登记失业人员劳动年龄的规定是（）。',o:["18周岁至退休年龄", "20周岁至退休年龄", "16周岁至退休年龄"],a:2,x:'本题考查我国的就业与失业的含义和统计口径。调查失业人员统计范围是16周岁及以上常住人口，不考虑其户籍所在地和类型；而登记失业人员统计范围是劳动年龄内（16周岁至退休年龄）的城镇常住人口。'},
  {ch:9,type:'multi',q:'关于奥肯定律的内容和政策含义的说法，正确的有（）。',o:["经济增长与通货膨胀之间的具体数量相关关系会随着时代的变化而有所不同", "经济增长与失业之间的具体数量相关关系在不同的国家或地区可能差别更大", "政府应当把促进经济增长作为增加就业和降低失业的主要途径", "奥肯定律反映了货币工资率与失业率之间的变化关系"],a:[1, 2, 4],x:'本题考查奥肯定律。奥肯定律所提出的经济增长和失业之间的具体数量相关关系可能会随着时代的变化而有所不同，在不同的国家或地区可能差别更大。但是，这一定律具有重要的政策含义，表明了在经济增长和就业之间存在一定的正相关关系。其政策含义就是，政府应当把促进经济增长作为增加就业或降低失业的主要途径。'},
  {ch:9,type:'multi',q:'关于失业与经济增长及价格总水平的相互关系的说法，正确的有（）。',o:["菲利普斯曲线是一条描述通货膨胀与失业或者经济增长之间相互关系的曲线", "奥肯定律所提出的经济增长和失业之间的具体数量相关关系可能会随着时代的变化而有所不同", "按照美国经济学家萨缪尔森的观点，从短期看，菲利普斯曲线是一条和横轴垂直的线", "菲利普斯曲线反映的是失业率与税率及财政收入之间的关系"],a:[0, 1, 4],x:'本题考查失业与经济增长及价格总水平的相互关系。弗里德曼认为，从长期看，菲利普斯曲线是一条和横轴垂直的直线。菲利普斯曲线反映的是通货膨胀与失业或经济增长之间的相互关系。选项CD说法错误。'},
  {ch:7,q:'根据失业的分类，因总需求不足而减少劳动力派生需求所导致的失业是（）。',o:["周期性失业", "自愿失业", "摩擦性失业"],a:0,x:'本题考查失业的类型。需求不足型失业也叫非自愿失业，或者叫周期性失业，是指劳动者在现行工资水平下找不到工作的状况，或是指总需求相对不足减少劳动力派生需求所导致的失业。点击了解中级经济师课程>>告别低效备考，限时抽好课，随机立减-试试手气试试手气点击试试手气即可抽奖人已抽奖告别低效备考，限时抽好课，立减-元优惠券已放入账户人已抽奖折优惠券使用范围：考培课程购买（不包括VIP，无忧以及面授班次）点击\'去买课\'即可使用48小时内失效热门班次不感兴趣？去选课中心>活动说明：此抽奖活动会随机抽选幸运用户，并非所有人可见。参与后优惠券仅限48小时内使用。您有一次专属抽奖机会最多可得元优惠试试手气人已抽奖关闭去选课去选课去选课关闭000分享到：-->发送学员讨论（0）查看被折叠的评论被折叠评论包含相似、疑似不友好或无意义内容上一篇：2022年中级经济师《经济基础》习题精选（四...下一篇：2022年中级经济师《经济基础》习题精选（三...推荐阅读报考指南：初中级经济师报考全攻略中级经济师全套备考资料一键领取初级经济师全套备考资料一键领取中级经济师题库会员→尊享20+权益初级经济师题库会员→尊享18+权益中级经济师教材+辅导书一站式配齐相关资讯·2023初中级经济师考前丢分行为看看你有没有中招？·2023初中级经济师各科高频考点带你冲刺逆袭！·备考初中级经济师做题效果差做点啥有用？·2023年中级经济师各科目易错题汇总·河北2022年中级经济师网上缴费截止时间为8月22日·河北2022年中级经济师网上缴费截止时间为8月22日·江西2022年初中级经济师报名网上缴费截止8月21日！·江西2022年初中级经济师报名网上缴费截止8月21日！·提醒：2022福建中级经济师网上缴费8月21日截止！·提醒：2022福建中级经济师网上缴费8月21日截止！报考指南报考指南-->考试大纲已公布报名时间7月22日-8月12日准考证打印考前一周考试时间11月7日、8日考试成绩考后一个月左右-->合格证领取以各地公告为准辅导用书高效课程热搜关键词查看更多>精品好课免费专区免费咨询财税问答免费试听免费题库免费直播免费资料免费试听查看更多>免费资料下载报考政策历年试题科目特点各章重要性模拟试题高频考点新手指导一键领取全部资料一键领取全部资料-->免费直播查看更多>免费题库免费题库海量好题免费做带你花式刷题每日一练机考系统关注更多扫码下载APP及时接收最新考试资讯及备考信息扫码加入备考交流群与更多考生一起交流学习，备战考试，赢在起跑线领取资料-->在线客服APP新用户扫码下载立享专属优惠安卓版本:8.9.21苹果版本:8.9.21开发者：北京正保会计科技有限公司应用涉及权限：查看权限>APP隐私政策：查看政策>HD版本上线：点击下载>官方号官方公众号微信扫一扫官方视频号微信扫一扫官方抖音号抖音扫一扫公众号扫一扫关注-->建议/投诉回到顶部折叠网站地图初级会计职称指南-->报名考试查分备考题库复习-->中级会计职称报名考试查分备考题库高级会计师报名考试查分题库评审注册会计师报名考试查分备考题库税务师报名考试查分备考题库资产评估师报名考试查分备考题库ACCA白金级前景免考政策资料复习-->CMA报名考试政策准考证查分CFA前景报名考试资料备考FRM官方前景报名考试备考美国CPA证书互认报名考试资料查分-->澳洲CPA授权机构免考考试资料试题-->经济师指南-->报名考试查分备考题库就业晋升招聘简历求职故事会计实务各行业问答记账报表实操银行从业报名准考证考试证书查分证券从业报名大纲考试查分证书精华问答初级中级注会税务师经济师-->期货从业报名大纲考试准考证查分-->Copyright©2000-www.chinaacc.comAllRightsReserved.北京正保会计科技有限公司版权所有京B2-20200959京ICP备20012371号-7出版物经营许可证京公网安备11010802044457号营业执照-->-->-->-->恭喜你！获得专属大额券！-->￥1100-->税务师专属券-->去使用-->-->套餐D大额券￥去使用'},
  {ch:0,type:'multi',q:'关于要素禀赋理论，下列说法正确的有（）。',o:["该理论也称为H-O模型", "该理论属于当代贸易理论", "该理论由瑞典经济学家赫克歇尔和俄林提出", "该理论假设规模报酬不变"],a:[0, 2, 3, 4],x:'本题考查要素禀赋理论。要素禀赋理论，也叫H-O模型，由瑞典经济学家赫克歇尔和俄林提出。要素禀赋理论属于传统的贸易理论。传统的贸易理论，一般不考虑生产规模的变化，或假设规模报酬不变。假设各国生产的产品都是同质的，国际市场是完全竞争的。只有选项B说法错误。'},
  {ch:10,type:'multi',q:'关于赫克歇尔—俄林理论，下列说法正确的有（）。',o:["该理论也称为要素禀赋理论", "该理论属于传统贸易理论", "该理论认为决定国际贸易的因素是两个国家产品的生产成本差异", "该理论解释了相似资源储备国家之间和同类工业品之间的双向贸易现象"],a:[0, 1, 4],x:'本题考查要素禀赋理论。赫克歇尔—俄林理论，也就是要素禀赋理论，它属于传统贸易理论。根据赫克歇尔-俄林理论，各国应该集中生产并出口那些能够充分利用本国充裕要素的产品，进口那些需要密集使用本国稀缺要素的产品。国际贸易的基础是生产资源配置或要素储备比例上的差别。选项CD说法错误。'},
  {ch:10,q:'依据赫克歇尔一俄林的理论可以得出的结论是（）。',o:["各个经济体利用自然资源优势生产有限类别的产品", "所有的经济体都应集中生产并出口其具有绝对优势的产品", "具有相似资源储备的国家之间的贸易和双向贸易是当代国际贸易的基础"],a:3,x:'本题考查国际贸易理论的演变。根据赫克歇尔一俄林理论，各国应该集中生产并出口那些能够充分利用本国相对丰裕要素的产品，进口那些需要密集使用本国相对稀缺要素的产品。国际贸易的基础是生产资源配置或要素储备比例上的差别。通过国际贸易，往往会使各个国家之间的要素报酬（如工资、利息、地租等）差异趋于缩小，出现要素价格均等化趋势。'},
  {ch:10,type:'multi',q:'政府对国际贸易进行干预的手段主要有（）。',o:["实行利率管制", "实行出口信贷", "出口退税", "调整汇率"],a:[1, 2],x:'本题考查政府对国际贸易干预的目的。政府对国际贸易的干预包括对进口贸易的干预和对出口贸易的干预两个方面。政府对进口贸易的干预主要采取关税限制和非关税限制两种方式，即关税壁垒和非关税壁垒。政府除利用关税和非关税措施限制和调节进口贸易外，还常常采取各种鼓励出口的措施对出口贸易进行干预。政府干预出口贸易以刺激出口增加的主要措施是出口补贴。出口补贴分为直接补贴和间接补贴两种。直接补贴是政府直接以现金形式弥补出口企业国际市场价格与本国国内市场价格的差价；间接补贴是对出口企业在出口商品时给予财政上的优惠待遇，如出口退税、出口信贷等。'},
  {ch:0,q:'影响一个国家或地区进口贸易的主要因素是（）。',o:["该国家或地区的技术水平高低", "该国家或地区的自然资源优势", "该国家或地区的总产出水平"],a:2,x:'本题考查影响国际贸易的因素。影响一国进口贸易的因素主要有：一国的经济总量或总产出水平；汇率水平；国际市场商品的供给情况和价格水平的高低。（2021年试题）'},
  {ch:10,q:'关于反倾销税的说法，正确的是（）。',o:["反倾销税水平和裁定的倾销幅度无关", "征收反倾销税有利于扩大出口", "反倾销税属于贸易救济措施"],a:2,x:'本题考查反倾销措施分析。反倾销措施属于贸易救济措施，是指进口国针对价格倾销这种不公平的贸易行为而采取征收反倾销税等措施来抵消不利影响的行为。反倾销税是在正常海关税费之外，进口国主管机关对确认的倾销产品征收的一种附加税。反倾销税的税额不得超过所裁定的倾销幅度，反倾销税的纳税义务人是倾销产品的进口商，出口商不得直接或间接替进口商承担反倾销税。'},

  {ch:12,type:'multi',q:'关于财政收入分配职能的说法，正确的有（）。',o:["财政收入分配职能是政府调整国民收入再分配结果的职能", "财政收入分配职能是政府运用财政手段进行的", "财政收入分配职能可以通过转移支付对收入进行初次分配改变社会分配不公", "财政收入分配职能旨在实现公平收入分配的目标"],a:[1, 3, 4],x:'本题考查财政的基本职能。财政收入分配职能是指政府运用财政手段调整国民收入初次分配结果的职能，旨在实现公平收入分配的目标，故选项A错误。通过财政转移支付对收入进行的是再分配，故选项C错误。'},
  {ch:1,type:'multi',q:'社会主义市场经济条件下，属于财政资源配置范围的有（）。',o:["提供准公共物品和服务", "调节收入分配", "维护市场竞争", "矫正外部效应"],a:[0, 2, 3, 4],x:'本题考查财政的基本职能。根据政府职能的范围，财政资源配置范围应当是市场失灵而又为社会公共需要的公共物品和服务。包括：（1）满足政府行使职能的需要，包括政府机关的正常运转和行使社会公共服务的领域，如国家安全支出、一般公共服务支出；（2）市场不能有效提供而社会又需要的准公共物品和服务的开支，如公共卫生、科技、公共工程；（3）对社会资源配置的引导支出，如矫正外部效应，维护市场竞争。'},
  {ch:6,q:'关于公共物品生产的说法，正确的是（）。',o:["政府生产和合同外包是两种典型的公共物品生产方式", "合同外包中，私人签约者一定是营利性机构", "特许经营不属于公共物品的生产方式"],a:0,x:'本题考查公共物品的融资和生产。在合同外包中，私人签约者可能是营利性机构，也可能是非营利性机构，不论其性质如何，合同外包都是公共服务提供私有化的表现（选项B错误）。其他介于政府生产和合同外包之间的公共物品供给方式还包括特许经营、合同委托等（选项C错误）。服务供给主体也不仅限于政府和私人企业，还包括社会组织、慈善机构、事业单位等（选项D错误）。'},

  {ch:6,q:'公共物品的融资包括政府融资、私人融资和联合融资，政府融资的缺点是难以满足社会成员对公共物品的（）。',o:["排他性需求", "规模化需求", "竞争性需求"],a:3,x:'本题考查公共物品的融资和生产。由于公共物品存在消费上的非排他性，理性的个人倾向于由他人付费，而自己坐享其成，这就是“免费搭车”。“免费搭车”问题使公共物品市场融资机制失灵，因此由传统的公共物品理论引申出来的结论是，政府应作为公共物品供给的资金提供者，以强制税收的形式为公共物品融资。政府融资的缺点是难以满足社会成员对公共物品的多样化需求。故选D选项。（2021年试题）'},

  {ch:12,type:'multi',q:'关于地方政府债务的说法，正确的有（）。',o:["地方政府举债采取政府债券方式", "地方政府举借债务的规模由省级人民代表大会批准", "地方政府债务可以通过企事业单位举借", "各省政府可以自行决定举借债务，无须国务院批准"],a:[0, 4],x:'本题考查加强政府性债务管理。经国务院批准，省、自治区、直辖市政府可以适度举借债务，选项D错误；市县级政府确需举借债务的，由省、自治区、直辖市政府代为举借，选项E正确。政府债务只能通过政府及其部门举借，不得通过企事业单位等举借，选项C错误。地方政府举债采取政府债券方式，选项A正确。地方政府举借债务的规模，由国务院报全国人民代表大会或其常务委员会批准，选项B错误。'},
  {ch:12,q:'关于税收基本特征的说法，正确的是（）。',o:["强制性、无偿性和固定性是税收的绝对特征", "税收的固定性表明只有征收机关可以随意变更征纳标准", "税收的无偿性反映的是一种社会产品的所有权与支配权之间的等价交换关系"],a:3,x:'本题考查税收的基本特征。强制性、无偿性和固定性是税收的基本特征，选项A错误；税收征纳双方必须按税法规定征税和纳税，双方都无权随意变更征纳标准，选项B错误；税收的无偿性是税收本质的体现，它反映的是一种社会产品所有权、支配权的单方面转移关系，而不是等价交换关系，选项C错误。'},
  {ch:12,q:'关于地方债务的说法，正确的是（）。',o:["地方政府举债可以用于经常性支出", "地方政府债务规模实行限额管理", "地方专项债务纳入一般公共预算管理"],a:1,x:'本题考查加强政府性债务管理。地方政府举债，只能用于公益性资本支出和适度归还存量债务，不得用于经常性支出，选项A错误。一般债务通过发行一般债券融资，纳入一般公共预算管理。专项债务通过发行专项债券融资，纳入政府性基金预算管理，选项CD错误。'},

{ch:8,q:'下列不属于商标注册绝对拒绝理由的是（ ）。',o:['仅有本商品的通用名称','与他人在先使用的未注册商标相同','缺乏显著特征','有欺骗性，容易使公众误认'],a:1,x:'与他人在先使用商标相同属于相对拒绝理由（涉及在先权利）。A、C、D均为绝对拒绝理由。'},
{ch:8,q:'商标注册申请人自其商标在外国第一次提出商标注册申请之日起（ ）内，在中国就相同商品以同一商标提出申请的，享有优先权。',o:['3个月','6个月','9个月','12个月'],a:1,x:'根据《商标法》，商标注册申请人自在外国第一次提出申请之日起6个月内，在中国申请享有优先权。'},
{ch:10,q:'商标使用许可中，许可人应当将许可合同报送（ ）备案。',o:['不需要备案','商标局','版权局','工商行政管理部门'],a:1,x:'根据《商标法》，许可他人使用注册商标的，许可人应将其商标使用许可报商标局备案，由商标局公告。'},
{ch:10,q:'注册商标的有效期为（ ）年，自核准注册之日起计算。',o:['5','10','15','20'],a:1,x:'注册商标的有效期为10年，自核准注册之日起计算。期满可以续展，每次续展有效期为10年。'},
{ch:8,q:'销售不知道是侵犯注册商标专用权的商品，能证明该商品是自己合法取得并说明提供者的，（ ）。',o:['不承担赔偿责任','承担全部赔偿责任','由市场监督管理部门责令停止销售','需承担惩罚性赔偿'],a:2,x:'这种情况下由市场监督管理部门责令停止销售，但不承担赔偿责任。这体现了对善意销售者的保护。'},
{ch:8,q:'对5年内实施（ ）次以上商标侵权行为的，应当从重处罚。',o:['1','2','3','4'],a:1,x:'根据规定，对5年内实施2次以上商标侵权行为或有其他严重情节的，应当从重处罚。'},
{ch:11,q:'著作权中的人身权不包括（ ）。',o:['发表权','署名权','改编权','保护作品完整权'],a:2,x:'改编权属于著作财产权。著作人身权包括发表权、署名权、修改权和保护作品完整权。'},
{ch:11,q:'下列属于著作权合理使用的是（ ）。',o:['为个人学习研究使用他人已发表作品','将他人作品用于商业广告','未经许可翻译他人作品并出版','大量复制他人作品用于销售'],a:0,x:'为个人学习、研究或者欣赏使用他人已发表作品，属于合理使用，可以不经许可、不支付报酬。'},
{ch:11,q:'作者的署名权、修改权、保护作品完整权的保护期是（ ）。',o:['作者终生','作者终生及其死亡后50年','50年','不受限制'],a:3,x:'署名权、修改权和保护作品完整权是人身权，保护期不受限制，永远受法律保护。'},
{ch:8,q:'关于地理标志，以下描述正确的是（ ）。',o:['地理标志保护的是个人权利','地理标志可以任意转让','地理标志标识商品来源于特定地区并与该地区因素相关','地理标志保护期限为10年'],a:2,x:'地理标志标识商品来源于特定地域，其特定质量、声誉与该地理来源相关联，是集体性权利，一般不可转让。'},
{ch:8,q:'侵犯以地理标志作为集体商标、证明商标注册的商标专用权，违法经营额5万元以上的，可以处违法经营额（ ）以下的罚款。',o:['3倍','5倍','10倍','2倍'],a:1,x:'相关行政部门处理时，认定侵权行为成立的，违法经营额5万元以上的，可以处违法经营额5倍以下的罚款。'},
{ch:12,q:'商业秘密的构成要件不包括（ ）。',o:['秘密性','价值性','新颖性','保密性'],a:2,x:'商业秘密三个构成要件：秘密性（不为公众所知悉）、价值性（具有商业价值）、保密性（采取相应保密措施）。新颖性是专利授权条件。'},
{ch:12,q:'我国对商业秘密给予保护的主要法律是（ ）。',o:['《专利法》','《商标法》','《反不正当竞争法》','《反垄断法》'],a:2,x:'商业秘密主要通过《反不正当竞争法》进行保护，该法对侵犯商业秘密的行为及法律责任作出了规定。'},
{ch:12,q:'下列不属于集成电路布图设计专有权合理使用的是（ ）。',o:['为个人目的复制','单纯为评价目的复制','为营利目的复制','对自己独立创作的相同设计进行复制'],a:2,x:'为营利目的复制不属于合理使用。个人目的、评价分析、独立创作均属于合理使用或合法行为。'},
{ch:12,q:'集成电路布图设计专有权的保护期为（ ）年。',o:['5','10','15','20'],a:1,x:'集成电路布图设计专有权的保护期为10年，自登记申请之日或在世界任何地方首次投入商业利用之日起计算。'},
{ch:12,q:'知识产权国际保护中，涉及专利合作的重要国际条约是（ ）。',o:['《保护文学和艺术作品伯尔尼公约》','《专利合作条约》（PCT）','《保护工业产权巴黎公约》','《与贸易有关的知识产权协定》（TRIPS）'],a:1,x:'PCT是专门关于专利国际申请合作的条约，简化了在多个国家申请专利的程序。《巴黎公约》和TRIPS涵盖更广。'},
{ch:12,q:'马德里国际商标注册体系主要涉及的国际条约是（ ）。',o:['《马德里协定》及其议定书','《巴黎公约》','《伯尔尼公约》','TRIPS协定'],a:0,x:'马德里体系由《马德里协定》（1891年）和《马德里议定书》（1989年）构成，为商标国际注册提供了便捷途径。'},

  // ===== 2024新考纲补充题目 =====
  
  {ch:1,q:'知识产权的基本特征不包括（ ）。',o:["专有性", "地域性", "时间性", "无限性"],a:3,x:'知识产权具有专有性（排他性）、地域性、时间性三个基本特征。知识产权保护有期限限制，不是无限的。'},
  {ch:1,q:'《与贸易有关的知识产权协定》（TRIPS）是（ ）框架下的协定。',o:["世界知识产权组织（WIPO）", "联合国教科文组织", "世界贸易组织（WTO）", "国际知识产权联盟"],a:2,x:'TRIPS协定是WTO框架下的重要协定，是当今世界知识产权保护水平最高的国际公约。'},
  {ch:1,q:'知识产权管理体系认证实行（ ）管理。',o:["许可制", "备案制", "目录式", "审批制"],a:2,x:'知识产权管理体系认证实行目录式管理，列入《知识产权认证目录》的认证项目方可实施第三方认证。'},
  {ch:1,q:'知识产权管理体系认证的依据不包括（ ）。',o:["《企业知识产权管理规范》", "《高等学校知识产权管理规范》", "《科研组织知识产权管理规范》", "《知识产权强国建设纲要》"],a:3,x:'当前列入《知识产权认证目录》的三类认证项目分别依据GB/T29490（企业）、GB/T33251（高校）、GB/T33250（科研组织）。《知识产权强国建设纲要》是政策文件而非认证依据标准。'},
  {ch:2,q:'专利代理机构设立的条件不包括（ ）。',o:["有符合规定的名称", "有合伙协议书或公司章程", "有5名以上专利代理师", "有固定的办公场所"],a:2,x:'合伙制专利代理机构需有2名以上专利代理师，有限责任制需有4名以上专利代理师。'},
  {ch:2,q:'商标代理机构明知委托人委托事项属于恶意申请，仍接受委托的，由市场监督管理部门处以（ ）罚款。',o:["1万元以下", "1万元以上10万元以下", "5万元以上20万元以下", "10万元以上50万元以下"],a:1,x:'根据《商标法》第68条，商标代理机构违反诚信原则的，由市场监督管理部门处1万元以上10万元以下罚款。'},
  {ch:2,q:'国家知识产权局负责全国专利代理管理工作的部门是（ ）。',o:["条法司", "运用促进司", "知识产权保护司", "公共服务司"],a:1,x:'国家知识产权局运用促进司负责全国专利代理行业的管理工作。'},
  {ch:2,q:'下列不属于专利代理师执业禁止行为的是（ ）。',o:["代理未经申请人同意的专利申请", "泄露委托人的商业秘密", "以自己的名义申请专利", "在一个专利代理机构执业"],a:3,x:'专利代理师不得同时在两个以上专利代理机构执业。在一个专利代理机构执业是允许的。ABC均为执业禁止行为。'},
  {ch:2,q:'知识产权管理体系的认证依据《企业知识产权管理规范》的国家标准编号是（ ）。',o:["GB/T19001", "GB/T29490", "GB/T33250", "GB/T33251"],a:1,x:'《企业知识产权管理规范》编号GB/T29490-2013；GB/T33250是科研组织标准；GB/T33251是高等学校标准。'},
  {ch:3,q:'根据《专利法》，外观设计专利权的保护范围以（ ）为准。',o:["说明书", "权利要求书", "表示在图片或者照片中的该产品的外观设计", "简要说明"],a:2,x:'外观设计专利权的保护范围以表示在图片或者照片中的该产品的外观设计为准，简要说明可用于解释该外观设计。'},
  {ch:3,q:'发明专利申请公布后至授权前，申请人可要求实施其发明的单位或个人支付适当使用费，此期间称为（ ）。',o:["优先权期", "临时保护期", "宽限期", "审查期"],a:1,x:'发明专利申请公布后、授权前为临时保护期，申请人可要求实施者支付适当费用。但临时保护期内不能提起侵权诉讼。'},
  {ch:3,q:'复审请求人对专利复审委员会的复审决定不服的，可以自收到通知之日起（ ）内向人民法院起诉。',o:["15日", "1个月", "2个月", "3个月"],a:3,x:'对专利复审决定不服的，可自收到通知之日起3个月内向人民法院起诉。'},
  {ch:4,q:'专利侵权纠纷涉及新产品制造方法的发明专利的，（ ）应当提供其产品制造方法不同于专利方法的证明。',o:["专利权人", "制造同样产品的单位或个人", "专利代理机构", "技术鉴定机构"],a:1,x:'涉及新产品制造方法的发明专利侵权纠纷，举证责任倒置，由制造同样产品的单位或个人证明其方法不同于专利方法。'},
  {ch:4,q:'确定专利侵权赔偿数额时，计算方式的适用顺序正确的是（ ）。',o:["权利人实际损失→侵权人获利→许可费倍数→法定赔偿", "侵权人获利→权利人实际损失→许可费倍数→法定赔偿", "法定赔偿→许可费倍数→侵权人获利→权利人实际损失", "许可费倍数→法定赔偿→权利人实际损失→侵权人获利"],a:0,x:'专利侵权赔偿按：权利人实际损失→侵权人获利→参照许可费合理倍数→法定赔偿（3万-500万）的顺序确定。'},
  {ch:4,q:'下列关于专利无效宣告的说法，正确的是（ ）。',o:["只有专利权人可提出无效", "无效宣告只能由专利局主动启动", "被宣告无效的专利权视为自始即不存在", "专利权被宣告无效后对所有判决具有追溯力"],a:2,x:'被宣告无效的专利权视为自始即不存在。任何单位或个人都可请求宣告专利权无效。'},
  {ch:4,q:'专利权人或者利害关系人申请诉前责令停止侵犯专利权行为，人民法院应当自接受申请之日起（ ）内作出裁定。',o:["12小时", "24小时", "48小时", "72小时"],a:2,x:'人民法院应当自接受诉前禁令申请之时起48小时内作出裁定；有特殊情况需要延长的，可以延长48小时。'},
  {ch:5,q:'专利权质押融资中，出质人与质权人应当订立书面合同，并向（ ）办理出质登记。',o:["工商行政管理部门", "国家知识产权局", "中国版权保护中心", "中国人民银行"],a:1,x:'以专利权出质的，质权自国家知识产权局办理出质登记之日起设立。'},
  {ch:5,q:'专利开放许可声明经国家知识产权局公告后，（ ）。',o:["专利权人不能再自行实施该专利", "任何单位或个人均可按公告条件获得普通许可", "专利权人应撤销该专利", "该专利进入公有领域"],a:1,x:'开放许可期间，任何单位或个人书面通知并付费后即可获得普通许可。专利权人不得就该专利给予独占或排他许可，但可自行实施。'},
  {ch:5,q:'专利实施许可合同应当自合同生效之日起（ ）内向国务院专利行政部门备案。',o:["1个月", "2个月", "3个月", "6个月"],a:2,x:'专利实施许可合同应自生效之日起3个月内向国家知识产权局备案。'},
  {ch:6,q:'以三维标志申请注册商标的，仅由商品自身的性质产生的形状，（ ）。',o:["可以注册", "不得注册", "经使用取得显著特征后可以注册", "需要经过实审确定"],a:1,x:'仅由商品自身性质产生的形状、为获得技术效果而需有的商品形状或使商品具有实质性价值的形状，不得注册为商标。'},
  {ch:6,q:'下列关于集体商标和证明商标的说法，错误的是（ ）。',o:["集体商标表明商品或服务来自某一组织", "证明商标表明商品或服务具有某种特定品质", "集体商标只能由该组织成员使用", "证明商标的注册人可以在自己提供的商品上使用该证明商标"],a:3,x:'证明商标的注册人不得在自己提供的商品上使用该证明商标。这是证明商标区别于普通商标和集体商标的重要特征。'},
  {ch:6,q:'声音商标在我国（ ）申请注册。',o:["不可以", "经使用取得显著特征后方可", "可以作为商标", "仅限知名企业"],a:2,x:'2014年《商标法》修改后明确声音可作为商标申请注册，属于非传统商标。注意：声音商标也需要具有显著特征。'},
  {ch:7,q:'商标使用许可未经备案的，（ ）。',o:["许可合同无效", "不得对抗善意第三人", "许可人需承担行政责任", "被许可人不得使用该商标"],a:1,x:'商标使用许可未经备案不影响许可合同效力，但不得对抗善意第三人。'},
  {ch:7,q:'注册商标有效期满需要继续使用的，应当在期满前（ ）内申请续展注册。',o:["3个月", "6个月", "12个月", "18个月"],a:2,x:'注册商标有效期10年，期满前12个月内应办理续展；此期间未办理的，给予6个月宽展期。'},
  {ch:7,q:'商标注册人许可他人使用其注册商标的，许可人应当监督被许可人使用其注册商标的（ ）。',o:["数量", "范围", "商品质量", "销售价格"],a:2,x:'许可人有监督商品质量的义务，被许可人应保证使用该注册商标的商品质量。'},
  {ch:8,q:'对恶意侵犯商标专用权，情节严重的，可以在确定数额的（ ）以下确定赔偿数额。',o:["1倍", "3倍", "5倍", "10倍"],a:2,x:'《商标法》第63条规定，恶意侵权且情节严重的，可在权利人损失或侵权人获利的1倍以上5倍以下确定赔偿。法定赔偿上限500万元。'},
  {ch:8,q:'驰名商标的保护遵循（ ）原则。',o:["自动保护", "主动认定", "个案认定、被动保护", "行政认定优先"],a:2,x:'我国驰名商标保护遵循个案认定、被动保护原则，即在具体案件中根据当事人请求进行认定，认定结果仅对该案有效。'},
  {ch:8,q:'将他人注册商标、未注册的驰名商标作为企业名称中的字号使用，误导公众的，依照（ ）处理。',o:["《商标法》", "《反不正当竞争法》", "《公司法》", "《企业名称登记管理规定》"],a:1,x:'将他人商标作为企业字号使用误导公众的，属于不正当竞争行为，依照《反不正当竞争法》处理。'},
  {ch:9,q:'我国《著作权法》规定的著作财产权中，（ ）是指以出售或者赠与方式向公众提供作品原件或复制件的权利。',o:["复制权", "发行权", "出租权", "展览权"],a:1,x:'发行权是以出售或赠与方式向公众提供作品原件或复制件的权利，涉及作品载体所有权的转移。'},
  {ch:9,q:'下列权利的保护期不受限制的是（ ）。',o:["复制权", "发行权", "修改权", "改编权"],a:2,x:'署名权、修改权和保护作品完整权的保护期不受限制。复制权、发行权、改编权等财产权保护期为作者终生加50年。'},

let st=this.data.dailyExState||{date:'',econChapter:1,ipChapter:1,usedEcon:[],usedIP:[]};
if(!this.data.dailyExState)this.data.dailyExState=st;

// New day: reset chapters and used list
if(st.date!==today){
st.date=today;st.econChapter=(daysSince%ECON_TOTAL)+1;st.ipChapter=(daysSince%IP_TOTAL)+1;
st.usedEcon=[];st.usedIP=[];sd(this.data);
}

const chE=st.econChapter,chI=st.ipChapter;
const chEName=(ECON_ALL_CH.find(c=>c.id===chE)||{name:'未知'}).name;
const chIName=(IP_CHS.find(c=>c.id===chI)||{name:'未知'}).name;

function pickQ(qbank,focusCh,usedArr,count){
  // Strictly pick questions from today's focus chapter
  let usedSet=new Set(usedArr||[]);
  let pool=qbank.filter(q=>q.ch===focusCh&&!usedSet.has(q.q));
  // If all questions in this chapter have been used today, reset and reuse
  if(pool.length===0){
    usedArr.length=0;
    usedSet=new Set();
    pool=qbank.filter(q=>q.ch===focusCh);
  }
  const sh=[...pool].sort(()=>Math.random()-.5);
  const sel=sh.slice(0,Math.min(count,sh.length));
  // Track newly used questions
  sel.forEach(q=>{if(!usedSet.has(q.q))usedArr.push(q.q);});
  return sel;
}

const qI=pickQ(IP_QBANK,chI,st.usedIP,15);
sd(this.data);
this._exQuestions={econ:qE.map(q=>({...q,subject:'econ',answered:false,userAns:null,correct:false})),

renderTips(){
const subj=document.getElementById('tips-subject')?.value||'all';
let all=[];
if(subj==='econ'||subj==='all')all=all.concat(this.tipsData().econ.map(t=>({...t,subj:'经济基础'})));
if(subj==='ip'||subj==='all')all=all.concat(this.tipsData().ip.map(t=>({...t,subj:'知识产权'})));
const sh=[...all].sort(()=>Math.random()-.5).slice(0,20);
const label=document.getElementById('tips-subj-label');
if(label)label.textContent=subj==='all'?'全部':(subj==='econ'?'经济基础':'知识产权');
const intro=document.getElementById('tips-intro');
if(intro)intro.textContent=
subj==='all'?'以下知识点精选自最新官方教材高频考点，每天滚动 20 条，利用排队、通勤时间反复记忆。'
:(subj==='econ'?'经济基础高频数字、口诀、易混点，一句一个，零碎时间轻松记。'
:'知识产权核心考点速记，专利/商标/著作权数字与要件一网打尽。');
let html='';
sh.forEach((t,i)=>{
html+=`<div class="tip-card">
<div class="tip-idx">${i+1}</div>
<div class="tip-body"><div class="tip-text">${t.t}<span class="tip-tag">${t.tag}</span></div>
<div class="tip-subj">${t.subj}</div></div></div>`;
});
const list=document.getElementById('tips-list');
if(list)list.innerHTML=html;
},
rerollTips(){this.renderTips();},
};
