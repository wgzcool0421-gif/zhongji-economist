  {ch:14,q:'下列财政政策中，属于扩张性财政政策的是（）。',o:["增加财政支出", "减少转移支付", "减少税收优惠"],a:0,x:'本题考查财政政策的类型。扩张性财政政策是指通过财政收支活动增加和刺激社会总需求的政策。在社会总需求不足情况下，政府通常采取扩张性财政政策，通过减税、增加支出等手段扩大社会需求，提高社会总需求水平，缩小社会总需求与社会总供给之间的差距，最终实现社会总供需的平衡。'},
  {ch:7,q:'假设边际消费倾向等于0.2，则政府购买支出乘数为（）。',o:["1.25", "－1.25", "－0.25"],a:0,x:'本题考查财政政策乘数。政府购买支出乘数＝国民收入变动率△Y/政府购买支出变动率△G＝1/（1－b），b为边际消费倾向，故政府购买支出乘数＝1/（1－0.2）＝1.25。'},
  {ch:14,type:'multi',q:'财政政策工具包括（）。',o:["存款准备金政策", "财政补贴政策", "汇率政策", "税收政策"],a:[1, 3],x:'本题考查财政政策工具。财政政策工具是指用以达到财政政策目标的各种财政手段，主要有预算、税收、公债、公共支出、政府投资和财政补贴等。'},
  {ch:14,type:'multi',q:'关于相机抉择财政政策的说法，正确的有（）。',o:["汲水政策以扩大公共投资规模为手段", "汲水政策以市场经济所具有的自发机制为前提", "补偿政策是政府有意识地从当时经济状态的反方向调节经济变动的财政政策", "汲水政策是一种长期财政政策"],a:[0, 1, 2],x:'相机抉择财政政策具体包括汲水政策和补偿政策。汲水政策是指在经济萧条时期进行公共投资，以增加社会有效需求，使经济恢复活力的政策。汲水政策具有四个特点：①它以市场经济所具有的自发机制为前提，是一种诱导经济复苏的政策；②它以扩大公共投资规模为手段，启动和活跃社会投资；③财政投资规模具有有限性，即只要社会投资恢复活力、经济实现自主增长，政府就不再投资或缩小投资规模；④如果经济萧条的状况不再存在，这种政策就不再实行，因而它是一种短期财政政策。补偿政策是指政府有意识地从当时经济状态的反方向上调节经济变动的财政政策，以达到稳定经济波动的目的。在经济萧条时期，为缓解通货紧缩影响，政府通过增加财政支出、减少财政收入等政策来提升投资和消费需求，增加社会有效需求，刺激经济增长。相反，在经济繁荣时期，为抑制通货膨胀，政府通过增加财政收入、减少财政支出等政策来抑制和减少社会过剩需求，稳定经济波动。'},
  {ch:0,type:'multi',q:'关于合理划分中央与地方财政事权和支出责任原则，下列描述正确的有（）。',o:["激励地方政府主动作为", "跨省（区、市）的基本公共服务由中央与地方共同负责", "信息量大、复杂且获取困难的基本公共服务优先作为地方事权", "信息量大、复杂且获取困难的基本公共服务优先作为中央事权"],a:[0,1,2],x:'本题考查合理划分中央与地方财政事权和支出责任的原则。信息比较容易获取和甄别的全国性基本公共服务宜作为中央的财政事权，选项D错误。',flag:'源站答案疑似错误：信息困难的基本公共服务优先作为地方事权，D项说反了；正确为ABC'},
  {ch:0,type:'multi',q:'合理划分中央与地方财政事权和支出责任的总体要求包括（）。',o:["坚持财政事权由中央决定", "坚持有利于健全社会主义市场经济体制", "坚持法治化规范化道路", "坚持加强中央对微观事务的直接管理"],a:[0,1,2],x:'本题考查合理划分中央与地方财政事权和支出责任。合理划分中央与地方财政事权和支出责任的总体要求包括：（1）坚持中国特色社会主义道路和党的领导。（2）坚持财政事权由中央决定。（3）坚持有利于健全社会主义市场经济体制。（4）坚持法治化规范化道路。（5）坚持积极稳妥统筹推进。（2017年试题）',flag:'源站答案疑似错误：总体要求不含“加强中央对微观事务的直接管理”，D项错；正确为ABC'},
  {ch:0,type:'multi',q:'合理划分中央与地方财政事权和支出责任的原则，包括（）。',o:["体现基本公共服务受益范围", "兼顾政府职能和行政效率", "实现权、责、利相统一", "做到中央统筹、地方协助"],a:[0,1,2,3],x:'本题考查合理划分中央与地方财政事权和支出责任。中央与地方财政事权和支出责任的划分原则：体现基本公共服务受益范围；兼顾政府职能和行政效率；实现权、责、利相统一；激励地方政府主动作为；做到支出责任与财政事权相适应。（2018年试题）',flag:'答案存疑：划分原则应为“支出责任与财政事权相适应”，而非“中央统筹、地方协助”，疑为ABC，建议核实'},
  {ch:7,type:'multi',q:'以下属于凯恩斯货币需求理论三类动机决定的是（）。',o:["交易动机", "储蓄动机", "预防动机", "投机动机"],a:[0, 2, 3],x:'本题考查流动性偏好理论。流动性偏好理论指出货币需求是由三类动机决定的：①交易动机；②预防动机；③投机动机。'},
  {ch:14,type:'multi',q:'关于财政政策时滞的说法，正确的有（）。',o:["认识时滞和行政时滞被称为内在时滞", "内在时滞与决策单位发生直接关系，而且直接影响社会的经济活动", "决策时滞、执行时滞和效果时滞被称为外在时滞", "外在时滞只属于研究过程，与决策机关没有直接关系"],a:[0,2,3],x:'本题考查财政政策时滞。内在时滞只属于研究过程，与决策机关没有直接关系。外在时滞与决策单位发生直接关系，而且直接影响社会的经济活动。选项BD错误。'},
  {ch:7,q:'已知边际消费倾向为0.6，则税收乘数为（）。',o:["1.5", "﹣1.5", "1.67"],a:1,x:'本题考查财政政策乘数。税收乘数是指国民收入变动与引起这种变动的税收变动的比率，即：税收乘数KT＝国民收入变动率△Y/税收变动率△T＝﹣b/（1﹣b）＝﹣0.6/（1﹣0.6）＝﹣1.5。'},
  {ch:14,type:'multi',q:'财政“汲水政策”的特点有（）。',o:["该政策是一种诱导经济复苏的政策", "该政策以扩大公共投资规模为手段", "实行该政策时，财政投资规模具有有限性", "该政策是一种短期的财政政策"],a:[0, 1, 2, 3],x:'本题考查财政政策的类型。汲水政策具有四个特点：①它以市场经济所具有的自发机制为前提，是一种诱导经济复苏的政策；②它以扩大公共投资规模为手段，启动和活跃社会投资；③财政投资规模具有有限性，即只要社会投资恢复活力、经济实现自主增长，政府就不再投资或缩小投资规模；④如果经济萧条的状况不再存在，这种政策就不再实行，因而它是一种短期财政政策。'},
  {ch:7,q:'假设边际消费倾向为0.8，则平衡预算乘数为（）。',o:["0.25", "4", "1"],a:2,x:'本题考查财政政策乘数。平衡预算乘数＝国民收入变动率/政府购买支出变动率（或者税收变动率）＝（1－b）/（1－b）＝1。'},
  {ch:14,type:'multi',q:'财政“自动稳定器”工具主要表现有（）。',o:["政府的福利支出", "累进所得税", "政府国债", "财政赤字"],a:[0, 1],x:'本题考查财政政策的类型。财政“自动稳定器”，主要表现在两方面：①累进所得税（包括个人所得税和企业所得税）的自动稳定作用；②政府福利支出的自动稳定作用'},
  {ch:9,q:'按照供给学派的理论，在治理通货膨胀时，积极的供给政策是（）。',o:["增加社会福利开支", "主动实施货币贬值", "增加税收"],a:2,x:'一些西方学者认为过去的反通货膨胀政策过分注意需求方面而忽略了供给方面，在治理通货膨胀时应从供求两个方面入手，在抑制总需求的同时，积极运用刺激生产的方法增加供给来治理通货膨胀。倡导这种政策的学派被称为供给学派，其主要措施有减税、削减社会福利开支、适当增加货币供给发展生产和精简规章制度等。'},
  {ch:0,type:'multi',q:'一般说来，银行体系扩张信用并创造派生存款的能力要受到（）等因素的制约。',o:["企事业单位缴付税款", "转贴现银行承兑汇票", "缴存中央银行存款准备金", "公众提取现金数量"],a:[0, 2, 3],x:'一般来说，银行体系扩张信用并创造派生存款的能力要受到三类因素的制约：（1）受到缴存中央银行存款准备金的限制。（2）受到提取现金数量的限制。（3）受到企事业单位及社会公众缴付税款等的限制。'},
  {ch:15,q:'以下计入社会融资规模的是（）。',o:["证券投资基金", "银行理财", "未赔款人寿保险"],a:2,x:'本题考查货币供给。金融机构通过表外业务向实体经济提供的资金支持，包括委托贷款、信托贷款和未贴现的银行承兑汇票。'},
  {ch:7,q:'边际消费倾向0.75.财政支出增加100万，下列选项正确的是（）。',o:["国民收入增加75", "国民收入增加400", "政府支出乘数3"],a:1,x:'本题考查投资乘数。增加一笔投资ΔI，在国民经济重新达到均衡状态的时候，由此引起的国民收入△Y增加量并不仅限于这笔初始投资量，而是初始投资量的若干倍。这个倍数就是投资乘数。边际消费倾向用β表示，△Y表示国民收入，ΔI表示财政支出，根据投资乘数公式K=△Y/ΔI=1/(1-β)，即ΔY/100=1/(1-0.75)，所以ΔY=400。'},
  {ch:0,q:'美国经济学家费雪提出了交易方程式MV=PT其主要结论是（）。',o:["物价水平决定货币流通速度", "货币量决定物价水平"],a:1,x:'本题考查传统货币数量说。费雪认为，在方程式中，V和T在长期中都不受M变动的影响，V由制度因素决定而在短期内难以改变，可视为常数；T则取决于资本、劳动和自然资源的供给状况以及生产技术水平等非货币因素，大体上也是稳定的。因此，只有物价水平P和货币量M有直接关系。他认为，货币量是最活跃的因素，会经常主动地变动，而物价则是主要的被动因素。只要货币量发生变化，马上就会反映到物价上来，引起物价变动。因此，交易方程式所反映是货币量决定物价水平的理论。'},
  {ch:6,q:'以下属于纯公共物品的是（）。',o:["私人汽车", "无线广播", "住宅"],a:2,x:'本题考查公共物品的分类。纯公共物品是指具有完全的非竞争性和非排他性的物品，一般认为，国防、治安等都是最典型的纯公共物品。'},
  {ch:0,q:'制约银行体系并且创造派生存款能力的是（）。',o:["同业拆借数量", "进出口贸易总额", "居民消费倾向"],a:2,x:'本题考查货币供给机制。一般来说，银行体系扩张信用并创造派生存款的能力要受到三类因素的制约：（1）受到缴存中央银行存款准备金的限制；（2）受到提取现金数量的限制。（3）受到企事业单位及社会公众缴付税款等的限制'},
  {ch:0,q:'下列关于数字货币的说法，错误的是（）。',o:["根据发行人的不同，数字货币可分为法定数字货币和私人数字货币", "法定数字货币是商业银行发行的数字货币", "私人数字货币是指私人部门发行的以数字加密技术和分布式账本技术为基础的加密数字货币"],a:1,x:'本题考查数字货币。法定数字货币是指中央银行发行的数字货币，选项B说法错误。'},
  {ch:0,q:'法定数字货币和私人数字货币，都具有的特点不包括（）。',o:["公开性", "安全性", "可编程性"],a:0,x:'本题考查数字货币。不论是法定数字货币还是私人数字货币，都具有匿名性、安全性、可编程性和高效率性。'},
  {ch:0,q:'数字人民币采用的运营体系是（）。',o:["“商业银行-证券机构”双层运营体系", "“中央银行-保险机构”双层运营体系", "“中央银行-商业机构”双层运营体系"],a:2,x:'本题考查数字货币。数字人民币采用“中央银行-商业机构”的双层运营体系。'},
  {ch:0,q:'关于数字人民币与第三方支付账户余额的差异，说法正确的是（）。',o:["前者是中央银行负债，后者是支付机构负债", "前者是商业信用，后者是国家信用", "前者不具有无限法偿性，后者具有无限法偿性"],a:0,x:'本题考查数字人民币与支付账户余额的区别。①债权关系不同，前者是中央银行负债，后者是支付机构负债。②信用背书关系不同，前者是国家信用，后者是商业信用。③法偿性不同，前者具有无限法偿性，后者不具有无限法偿性。④货币供应层次不同，前者属于M0，而后者属于M2。'},
  {ch:0,q:'关于数字人民币的说法，正确的是（）。',o:["数字人民币无法实现支付即结算", "数字人民币定位于M2，不计付利息", "数字人民币采用“中央银行—商业机构”的双层运营体系"],a:2,x:'本题考查数字人民币。数字人民币可实现支付即结算，选项A错误。数字人民币定位于M0，不计付利息，选项B错误。数字人民币遵循“小额匿名、大额依法可溯”的原则，选项D错误。'},
  {ch:14,q:'货币乘数等于（）与货币结构比率之和的倒数。',o:["货币流通速度", "利率", "存款准备金率"],a:2,x:'基础货币的扩张倍数取决于商业银行在其所吸收的全部存款中需存入中央银行部分所占比重即存款准备金率，以及需转化为现金及财政存款等所占比重的货币结构比率，这个倍数被称为货币乘数，等于存款准备金率与货币结构比率之和的倒数，一般用K表示。'},
  {ch:16,q:'为了统计不同口径的货币供应量，一般依据资产的（）来划分货币层次。',o:["流动性", "安全性", "风险性"],a:0,x:'目前一般依据资产的流动性，即各种货币资产转化为通货或现实购买力的能力来划分不同的货币层次，进而就有了不同口径的货币供应量。2023中级经济师《经济基础知识》练习题精选汇总'},
  {ch:14,q:'1986年以前美国的“Q条例”，属于货币政策工具的（）。',o:["直接信用控制", "选择性货币政策工具", "一般性政策工具"],a:0,x:'本题考查货币政策工具。直接信用控制是指中央银行以行政命令或其他方式，从质和量两个方面直接对金融机构尤其是商业银行的信用活动进行控制。其手段包括利率最高限、信用配额、流动比率和直接干预等。其中，规定存贷款最高利率限制，是最常使用的直接信用管制工具，如1986年以前美国的“Q条例”。'},
  {ch:14,q:'下列宏观经济政策中属于紧缩性财政政策的是（）。',o:["提高利率", "增加政府投资", "提高存款准备金率"],a:2,x:'本题考查通货膨胀的治理。紧缩性财政政策直接从限制支出、减少需求等方面来减轻通货膨胀压力，概括地说就是增收节支，减少赤字。一般包括以下措施：①减少政府支出。②增加税收。③发行公债。'},
  {ch:0,type:'multi',q:'按照我国货币供应量指标，广义的货币供应量包括（）。',o:["个人存款", "流通中货币", "单位定期存款", "单位活期存款"],a:[0, 1, 2, 3],x:'本题考查货币供给层次的划分。广义货币供应量M2＝M1＋单位定期存款＋个人存款＋其他存款（财政存款除外）。'},
  {ch:7,q:'英国经济学家凯恩斯认为，当利率降到某一点时，货币需求会无限增大，此时无人愿意持有（）。',o:["房产", "债券", "股票"],a:1,x:'本题考查凯恩斯的货币需求理论。凯恩斯认为，当利率降到某一低点时，货币需求会无限增大，此时无人愿意持有债券，都愿意持有货币，流动性偏好具有绝对性。这就是著名的流动性陷阱。'},
  {ch:14,q:'我国货币供应量指标中，狭义货币供应量由流通中货币和（）构成。',o:["单位活期存款", "其他存款", "个人存款"],a:0,x:'本题考查货币供给层次的划分。流通中货币和单位活期存款构成M1，即通常所说的狭义货币供应量，因其流动性较强是中央银行重点调控对象。'},
  {ch:15,type:'multi',q:'社会融资规模统计指标包括（）。',o:["保险公司发放的保单贷款", "信托贷款", "委托贷款", "商业银行发行的资本补充债券"],a:[0,1,3],x:'本题考查社会融资规模。具体来看，社会融资规模统计指标主要由五个部分构成：（1）金融机构通过表内业务向实体经济提供的资金支持，包括人民币贷款和外币贷款。（2）金融机构通过表外业务向实体经济提供的资金支持，包括委托贷款、信托贷款和未贴现的银行承兑汇票。（3）实体经济利用规范的金融工具、在正规金融市场所获得的直接融资。主要包括非金融企业境内股票筹资和企业债券筹资。（4）以其他方式向实体经济提供的资金支持，主要包括保险公司赔偿、投资性房地产、小额贷款公司和贷款公司贷款。（5）政府部门在债券市场的融资，包括国债、地方政府专项债券和地方政府一般债券。'},
  {ch:7,q:'下列关于凯恩斯的货币需求函数，说法错误的是（）。',o:["比传统的货币数量论的研究层次更高", "采用了大量的心理分析法", "突破了西方经济学传统的货币理论研究范围"],a:2,x:'本题考查凯恩斯的货币需求函数。凯恩斯的货币需求函数建立在“未来的不确定性”和“收入是短期资产”这两个假定之上，采用了大量的心理分析法，并突破了西方经济学传统的货币理论研究范围，将货币作为宏观经济中一个重要的经济变量和政策变量来研究，比传统的货币数量论的研究层次更高。选项D说法错误。2023中级经济师《经济基础知识》练习题精选汇总'},
  {ch:30,q:'2008年下半年，为应对国际金融危机，保证流动性供应，中国人民银行采取的措施包括（）。',o:["提高再贴现率", "下调存款准备金率", "扩大发行中央银行债券"],a:1,x:'本题考查近年来我国货币政策的实践。2008年下半年，美国次贷危机急剧恶化为国际金融危机，我国经济发展势头急转直下，出口大幅下滑，部分企业陷入困境，就业压力明显加大。在此背景下，中国人民银行及时将货币政策从“从紧”转向“适度宽松”，先后4次下调存款准备金率，5次下调存贷款基准利率，保证流动性供应，明确释放保经济增长和稳定市场预期的信号。'},
  {ch:14,q:'《中华人民共和国中国人民银行法》规定，货币政策目标是保持货币币值稳定，并以此促进（）。',o:["充分就业", "国际收支平衡", "经济增长"],a:2,x:'本题考查货币政策目标。《中国人民银行法》第3条规定：“货币政策目标是保持货币币值稳定，并以此促进经济增长。”'},
  {ch:14,q:'下列金融指标中，不能作为货币政策中间目标的是（）。',o:["资产价格", "短期市场利率", "货币供应量"],a:0,x:'本题考查货币政策的中介目标。货币政策的中间目标又称中介目标，它的变量指标包括：利率、货币供应量、超额准备金或基础货币、通货膨胀率。'},
  {ch:0,type:'multi',q:'2020年12月中央经济工作会议提出的政策措施有（）。',o:["多渠道补充银行资本金", "完善债券市场法制", "实施适度宽松的货币政策", "深化利率汇率市场化改革"],a:[0,1,3],x:'本题考查近年来我国货币政策的实践。2020年12月，中央经济工作会议提出：稳健的货币政策要灵活精准、合理适度，保持货币供应量和社会融资规模增速同名义经济增速基本匹配，保持宏观杠杆率基本稳定，处理好恢复经济和防范风险关系，多渠道补充银行资本金，完善债券市场法制，加大对科技创新、小微企业、绿色发展的金融支持，深化利率汇率市场化改革，保持人民币汇率在合理均衡水平上的基本稳定。'},
  {ch:14,q:'在选择货币政策中介目标时，中央银行考虑的主要原则有（）。',o:["稳健性", "灵活性", "前瞻性"],a:2,x:'本题考查货币政策的中介目标。选择货币政策中介目标依据的原则是可控性、可测性和相关性。'},
  {ch:15,q:'下列业务中，属于中央银行信贷业务的是（）。',o:["代理发行国家债券", "集中存款准备金", "保管外汇和黄金储备"],a:2,x:'本题考查中央银行的业务。中央银行的信贷业务主要有接受商业银行提交的有价证券作为抵押物而向商业银行提供的再抵押放款、为商业银行贴现商业票据的再贴现和再贷款三种方式。'},
  {ch:14,q:'中央银行在实行再贴现货币政策工具时，政策效果的主动权取决于（）。',o:["财政部", "非银行金融机构", "商业银行"],a:2,x:'本题考查货币政策工具。中央银行的再贴现政策是否能够获得预期效果，还取决于商业银行是否采取主动配合的态度。2023中级经济师《经济基础知识》练习题精选汇总'},
  {ch:15,q:'下列金融市场交易主体中，属于中央银行业务服务对象的是（）。',o:["居民个人", "工业企业", "商业银行"],a:2,x:'本题考查中央银行制度。中央银行是发行的银行、银行的银行和政府的银行，具有国家行政管理机关和银行的双重性质。'},
  {ch:0,q:'在金融中介体系中处于中心环节的金融机构是（）。',o:["商业银行", "中央银行", "政策性银行"],a:1,x:'本题考查中央银行制度。中央银行在金融中介体系中处于中心环节，具有特殊的地位。'},
  {ch:15,type:'multi',q:'我国中央银行的主要职能有（）。',o:["制定和执行货币政策", "维护金融稳定", "实现充分就业", "提供金融服务"],a:[0, 1, 3],x:'本题考查中央银行制度。中国人民银行是我国的中央银行，它的主要职能包括：制定和执行货币政策；维护金融稳定；提供金融服务。'},
  {ch:8,q:'《中华人民共和国中国人民银行法》规定，“货币政策目标是保持（），并以此促进经济增长”。',o:["金融稳定", "币值稳定", "国际收支平衡"],a:1,x:'本题考查货币政策的目标。《中国人民银行法》第三条规定，货币政策目标是保持货币币值稳定，并以此促进经济增长。'},
  {ch:25,q:'下列项目中，属于中央银行资产负债表中储备货币的是（）。',o:["国外负债", "政府存款", "其他存款性公司存款"],a:2,x:'本题考查中央银行资产负债表。储备货币是中央银行资产负债表负债方的主要项目，包含货币发行、其他存款性公司存款、非金融机构存款。'},
  {ch:14,q:'一般性货币政策工具中，更具有弹性和优越性的是（）。',o:["再贷款", "法定存款准备金", "公开市场业务"],a:2,x:'本题考查一般性货币政策工具。公开市场业务是比较灵活的金融调控工具。与存款准备金率政策相比较，公开市场业务更具有弹性和优越性。'},
  {ch:15,type:'multi',q:'中央银行对商业银行的业务主要表现为（）。',o:["保管外汇和黄金储备", "集中存款准备金", "组织全国银行间的清算业务", "充当最后贷款人"],a:[1, 2, 3],x:'本题考查中央银行的主要业务。中央银行对商业银行的主要业务：（1）集中存款准备金；（2）充当最后贷款人；（3）组织全国银行间的清算业务。（2012年试题）（2015年试题）（2018年试题）（2020年试题）2023中级经济师《经济基础知识》练习题精选汇总'},
  {ch:15,type:'multi',q:'关于金融市场效率的说法，正确的有（）。',o:["金融市场效率的发挥是以资本的合理运动为前提的", "金融市场的高效率是因为资本追逐利润", "依据资金需求者获得金融资源的等待时间衡量市场效率", "依据资金需求者使用金融资源向社会提供有效产出的规模衡量市场效率"],a:[0, 1, 3],x:'本题考查金融市场效率。金融市场效率是指金融市场实现金融资源优化配置功能的程度，它包含两方面内容：一是金融市场以最低交易成本为资金需求者提供金融资源的能力，二是金融市场的资金需求者使用金融资源向社会提供有效产出的能力（D正确）。高效率的金融市场能将社会有限的金融资源配置到效益最好的企业及行业，进而创造最大产出，实现社会效益的最大化，这是因为资本的本质特征是追逐利润（B正确）。金融市场效率的发挥是以资本的合理运动为前提的（A正确），正是资本的不间断的运动才使社会资源的优化配置得以实现。'},
  {ch:0,q:'关于商业票据的说法，正确的是（）。',o:["商业票据是以企业间的间接信用作为保证的", "商业票据是在资本市场上向投资者发行并承诺在将来一定时期偿付票据本息的凭证", "商业票据是一种长期有担保证券"],a:2,x:'本题考查票据市场。商业票据是一种短期无担保证券，是由发行人（一般为信誉度高实力雄厚的大公司）为了筹措短期资金或弥补短期资金缺口，在货币市场上向投资者发行并承诺在将来一定时期偿付票据本息的凭证。它是以企业间的直接信用作为保证的。'},
  {ch:15,type:'multi',q:'关于存款保险制度的说法，错误的有（）。',o:["存款人在同一家投保机构所有存款账户的本息在50万元以内，其本息应获全额赔付", "中资银行海外分支机构的存款原则上纳入存款保险范围", "金融机构同业存款不纳入存款保险范围", "存款保险制度就是存款保障制度"],a:[0,3],x:'本题考查存款保险制度。存款保险实行限额偿付，最高偿付限额为人民币50万元。也就是说，同一存款人在同一家投保机构所有存款账户的本金和利息加起来在50万元以内的，全额赔付；超过50万元的部分，从该投保机构清算财产中受偿。故选项A正确，选项E错误。参照国际惯例，外国银行在中国的分支机构以及中资银行海外分支机构的存款原则上不纳入存款保险范围，故选项B错误。被保险的存款既包括人民币存款，也包括外币存款。但是，金融机构同业存款、投保机构的高级管理人员在本投保机构的存款以及存款保险基金管理机构规定不予保险的其他存款除外。选项C正确。存款保险制度又称存款保障制度，故选项D正确。'},
  {ch:15,q:'金融市场是以（）为交易对象而形成的供求关系及其机制的总和。',o:["金融市场", "金融净资产", "金融资产"],a:2,x:'本题考查金融市场运行机理。金融市场是指以金融资产为交易对象而形成的供求关系及其机制的总和。'},
  {ch:15,q:'关于商业银行经营管理的说法，错误的是（）。',o:["资产盈利性与安全性是负相关关系", "资产流动性与盈利性是负相关关系", "安全性原则是指贷款和投资等业务要能够按期收回本息"],a:2,x:'本题考查商业银行的经营管理。流动性原则包含两层含义：一是指商业银行必须保有一定比例的现金或其他容易变现的资产；二是指商业银行取得现款的能力。'},
  {ch:15,type:'multi',q:'关于商业银行主要业务的说法，正确的有（）。',o:["贴现业务形式上是票据的买卖，实际上是间接贷款给票据持有人", "银行结算业务的手续费向委托人收取", "商业银行的借款业务包括再贴现、结算过程中的短期资金占用", "租赁业务是商业银行作为支付中介提供服务"],a:[0, 1, 2, 3],x:'本题考查商业银行的主要业务。综合化银行制又称为全能银行制，在实行全能制银行制度的国家中，虽然对银行介入股市没有严格规定，但不少国家在投资数量上也有限制性规定，E错误。'},
  {ch:0,type:'multi',q:'关于债券和债券市场的说法，错误的有（）。',o:["按期限，债券分为短期债券和长期债券", "期限在1~10年的政府债券，其流动性是债券市场最高的", "债券市场具有资本市场属性，不具有货币市场属性", "债券市场具有货币市场属性，不具有资本市场属性"],a:[0, 1, 2, 3],x:'本题考查金融市场的结构。债券市场是发行和买卖债券的场所，它是一种直接融资的市场，即不通过银行等信用中介，资金的需求者和供给者直接进行融资的市场。债券市场既具有货币市场属性，又具有资本市场属性。按期限，债券可以分为短期债券（1年期以内）、中期债券（1年期至10年期）和长期债券（10年期以上）。债券市场作为直接融资的市场，既是政府、企业、金融机构融资的场所，也是中央银行货币政策的操作平台，是最重要的金融子市场之一。其中，政府以债务人身份承担到期偿付本息责任的、期限在1年以内的短期政府债券，因其具有违约风险小、流动性强、面额小、收入免税等特点，其流动性在货币市场中是最高的，几乎所有的金融机构都参与短期政府债券市场的交易。2023中级经济师《经济基础知识》练习题精选汇总'},
  {ch:15,q:'下列商业银行业务中，属于资产业务的是（）。',o:["定期存款业务", "抵押贷款业务", "租赁业务"],a:1,x:'本题考查商业银行的主要业务。资产业务主要包括：票据贴现、贷款业务和投资业务。选项A属于负债业务。选项CD属于中间业务。'},
  {ch:0,q:'下列贷款中，不属于担保贷款的是（）。',o:["保证贷款", "信用贷款", "抵押贷款"],a:1,x:'本题考查商业银行的主要业务。贷款业务是商业银行的资产业务。按照贷款条件，分为信用贷款和担保贷款。担保贷款是指以特定的抵押品作为担保的贷款，包括保证贷款、抵押贷款和质押贷款。'},
  {ch:15,type:'multi',q:'关于商业银行中间业务的说法，正确的有（）。',o:["商业银行不能办理财产信托业务", "商业银行可以自主发行和兑付国债，无需财政部门委托", "票据贴现不属于商业银行的中间业务", "商业银行办理中间业务时无需投入自有资金"],a:[2, 3],x:'本题考查商业银行的主要业务。选项A错误，信托业务属于商业银行的中间业务。选项B错误，商业银行受财政部门的委托，代理发行和兑付国债等，这是商业银行的代理业务，也属于中间业务。选项E错误，购买有价证券属于商业银行的资产业务，不属于中间业务。'},
  {ch:15,q:'存款保险实行限额偿付，最高偿付限额为人民币（）。',o:["30万元", "10万元", "50万元"],a:2,x:'本题考查存款保险制度。存款保险实行限额偿付，最高偿付限额为人民币50万元。'},
  {ch:15,type:'multi',q:'按照贷款用途划分，商业银行贷款包括（）。',o:["保证贷款", "信用贷款", "消费贷款", "资本贷款"],a:[1,2,3],x:'本题考查商业银行的主要业务。按用途划分，商业银行的贷款可分为资本贷款、商业贷款和消费贷款。'},
  {ch:0,type:'multi',q:'根据有效市场理论，证券市场的有效性可以分为不同类别，这些类别主要包括（）。',o:["半弱型效率", "强型效率", "半强型效率", "弱型效率"],a:[1, 2, 3],x:'本题考查有效市场理论。根据信息对证券价格影响的不同程度，法玛将市场有效性分为三类：弱型效率、半强型效率、强型效率。'},
  {ch:0,q:'关于投资基金的说法，错误的是（）。',o:["单位信托基金、共同基金是投资基金的别称", "投资基金属于金融衍生产品", "投资基金是一种集合投资方式"],a:1,x:'本题考查投资基金。投资基金不是金融衍生品，金融衍生品包括期货、期权、互换等。2023中级经济师《经济基础知识》练习题精选汇总'},
  {ch:15,q:'关于金融风险基本特征的说法正确的是（）。',o:["传染性是由于金融机构承担着中介机构的职能，割裂了原始借贷的对应关系", "金融机构受到严格监管，金融风险事前能够完全把握", "金融机构之间存在大量的同业业务，因而金融风险具有相关性"],a:0,x:'本题考查金融风险。影响金融风险的因素非常复杂，各种因素相互交织，事前难以完全把握，选项B错误。金融机构所经营的商品——货币的特殊性决定了金融机构同经济和社会是紧密相关的，选项C错误。与工商企业相比，金融企业负债率明显偏高，财务杠杆大，导致负外部性大，选项D错误。金融机构承担着中介机构的职能，割裂了原始借贷的对应关系。处于这一中介网络的任何一方出现风险，都有可能对其他方面产生影响，甚至发生行业的、区域的金融风险，导致金融危机，这是金融风险传染性的特征，选项A正确。'},
  {ch:15,type:'multi',q:'关于美国金融监管体制的说法，正确的有（）。',o:["各州的金融监管当局负责监管在本州注册的银行", "外国银行分支机构由货币监理署负责监管", "对银行采取双线多头监管体制", "美联储负责监管在联邦注册的银行"],a:[0,1,2],x:'本题考查金融监管体制。以中央银行为重心的监管体制：这是以中央银行为重心，其他机构参与分工的监管体制。美国是其中的典型代表。美国对银行类金融机构采取双线多头的监管体制，双线是指存在联邦和州两级监管机构，多头是指在联邦这一级又存在多个分工协作的监管机构。在联邦这一级，美联储负责监管在各个州注册的联储会员银行，联邦存款保险公司负责监管所有在州注册的非联储会员银行，货币监理署负责监管所有在联邦注册的国民银行和外国银行分支机构（选项D错误），储贷监理署负责监督参加联邦保险的储贷协会和互助储蓄银行，国家信用社管理局负责监管所有参加联邦保险的信用社。',flag:'源站答案疑似错误：监管联邦注册银行的是货币监理署而非美联储，D项错；正确为ABC'},
  {ch:15,q:'下列属性特征中，不属于金融风险一般性特征的是（）。',o:["不确定性", "高杠杆性", "频繁性"],a:2,x:'本题考查金融风险。金融风险具有以下几个基本特征：不确定性、相关性、高杠杆性、传染性。'},
  {ch:0,q:'2008年美国次贷危机可以分为三个阶段，各阶段的危机类型不包括（）。',o:["流动性危机", "货币危机", "债务危机"],a:1,x:'本题考查金融危机。次贷危机可以分为三个阶段：第一阶段是债务危机阶段，即由于房地产价格下跌，利率上升，导致次级房贷的贷款人不能按时还本付息而引发的危机；第二阶段是流动性危机，由于债务危机导致相关金融机构流动性不足，不能及时应付债权人变现的要求；第三阶段即信用危机，投资者对建立在信用基础上的金融活动产生怀疑，引发全球范围内的金融恐慌。'},
  {ch:15,type:'multi',q:'关于德国金融监管体制的说法，正确的有（）。',o:["该体制是独立于中央银行的分业监管体制", "银行监督局负责制定颁布监管规章", "银行监督局设分支机构，统计金融数据、进行日常的监管活动", "德意志联邦银行失去了独立制定货币政策的职能"],a:[0,2,3],x:'本题考查金融监管体制。独立于中央银行的综合监管体制，这是在中央银行之外，同时设立几个部门对银行、证券和保险金融机构进行监管的体制，但是中央银行在其中发挥独特的作用。德国是其中的典型代表（A错误）。早在1961年，联邦德国《银行法》就授权成立联邦银行监督局。它隶属财政部，在银行监管中发挥中心作用，同时联邦德国《银行法》要求它在监管中与德意志联邦银行和联邦证券交易监督局保持一致。由于德国的银行可以同时经营证券和保险业务（E正确），所以银行监督局就是一个综合性融监管机构。《银行法》承认银行监督局的功能和德意志联邦银行的功能密不可分，而且银行监督局自身缺乏分支机构（C错误），没有统计职能，必须借助德意志联邦银行的分支机构网点，因此德意志联邦银行也被要求参与银行监管。在监管工作中，两者各有侧重点，又能彼此制约。例如，银行监督局负责制定和颁布有关监管的规章制度（B正确），德意志联邦银行负责对金融机构的各种报告进行分析，进行日常的监管活动。1999年欧洲中央银行成立，德意志联邦银行失去了独立制定货币政策的职能（D正确），原有监管体制受到了挑战。'},
  {ch:15,type:'multi',q:'下列金融业务中，属于商业银行中间业务的有（）。',o:["办理信托", "办理结算", "发放贷款", "吸收存款"],a:[0, 1],x:'本题考查商业银行的主要业务。商业银行中间业务包括：（1）结算业务。（2）信托业务。（3）租赁业务。（4）代理业务。（5）咨询业务。'},
  {ch:15,q:'下列金融业务中，属于商业银行资产业务的是（）。',o:["借款", "结算", "投资"],a:2,x:'本题考查商业银行的主要业务。商业银行的资产业务包括：票据贴现、贷款业务、投资业务。2023中级经济师《经济基础知识》练习题精选汇总'},
  {ch:15,type:'multi',q:'金融风险的基本特征包括（）。',o:["高杠杆性", "传染性", "不确定性", "相关性"],a:[0, 1, 2, 3],x:'本题考查金融风险。金融风险具有以下基本特征：（1）不确定性；（2）相关性；（3）高杠杆性；（4）传染性。'},
  {ch:0,q:'关于1992年英镑危机产生的原因的说法，正确的是（）。',o:["英国信用扩张速度快", "英国财政赤字规模大", "英国债务结构不合理"],a:2,x:'本题考查金融危机的类型。1992年英镑危机，英国没有财政赤字货币化的历史，筹集外汇也不是问题，但此时政府的偏好具有决定意义。从政府的角度看，当市场出现强烈的贬值预期时，由于国内存在高失业率，使得维持钉住汇率的成本远大于收益，因此政府放弃钉住汇率制，导致危机发生。'},
  {ch:15,type:'multi',q:'关于1988年巴塞尔报告的说法，错误的有（）。',o:["普通股至少占全部资本的50％", "确认了监督银行资本的可行的统一标准", "表外业务计算风险加权资产要按照信用换算系数进行", "银行资本分为核心资本、附属资本和超额资本"],a:[0,3],x:'本题考查1988年巴塞尔报告。巴塞尔委员会将银行资本分为核心资本和附属资本。核心资本又称一级资本，包括实收股本（普通股）和公开储备，这部分资本至少占全部资本的50％。附属资本又称二级资本，包括未公开储备、资产重估储备、普通准备金和呆账准备金、混合资本工具和长期次级债券。'},
  {ch:15,q:'关于金融风险的说法，错误的是（）。',o:["金融风险发生损失的可能性，未必真实发生", "金融风险产生于资金借贷和经营过程中的不确定性", "金融风险表现为名义收益率与实际收益率的偏离"],a:2,x:'本题考查金融风险。所谓金融风险，是指投资者和金融机构在资金的借贷和经营过程中，由于各种不确定性因素的影响，使得预期收益和实际收益发生偏差，从而发生损失的可能性。在市场经济体系中，金融风险是客观存在，难以完全避免的。'},
  {ch:0,q:'关于1997年亚洲金融危机诱因的说法，错误的是（）。',o:["制度上的道德风险累积金融风险", "财政赤字货币化和高失业率", "银行体系流动性不足"],a:1,x:'本题考查金融危机。1997年亚洲金融危机的诱因：在危机发生之前，财政赤字和国内宏观经济状况表现良好，两者都不能解释危机的形成，是市场信心的变化导致了危机的自我实现。一方面，由制度上的道德风险所积累的金融风险如果超过了市场所能承受的程度，由此产生的不良资产只能靠财政注资解决，从而对财政造成巨大压力，形成隐性的财政赤字；另一方面，银行体系流动性不足，容易导致恐慌性的资金冲击。一旦境外投资者和境内外币存款者认为银行的流动性不足，出于安全起见，他们将会向外转移资金，在“羊群效应”作用下，这种流动性危机就会演变为货币危机。（2021年试题）'},
  {ch:15,type:'multi',q:'金融监管首先从对银行进行监管开始的原因有（）。',o:["银行提供的期限转换功能", "有利于稳定市场利率", "银行是整个支付体系中的重要组成部分", "银行的信用创造功能"],a:[0,2,3],x:'本题考查金融监管理论。金融监管首先是从对银行进行监管开始的。这和银行的一些特性有关：（1）银行提供的期限转换功能，即银行在储蓄—投资转化过程中，为储蓄者提供短期资产和流动性，把储蓄集合起来，再根据投资者的需要提供期限相对较长的负债和资金，从而实现期限转换；（2）银行是整个支付体系的重要组成部分，作为票据的清算者，降低了交易的费用；（3）银行的信用创造和流动性创造功能。（2021年试题）'},
  {ch:15,type:'multi',q:'关于2003年新巴塞尔协议的说法，正确的有（）。',o:["对商业银行组织形式的变动提出了相应的资本约束对策", "风险范围由信用风险拓展到市场风险、流动性风险", "对交易工具的变动提出了相应的资本约束对策", "市场约束成为2003年新巴塞尔协议的“三大支柱”之一"],a:[0, 2, 3],x:'本题考查2003年新巴塞尔协议。新协议的资本要求已经发生了重大变化：①对风险范畴的进一步拓展。当前，信用风险仍然是银行经营中面临的主要风险，但是委员会也注意到市场风险和操作风险的影响和破坏力。B错误。②计量方法的改进。新协议根据银行业务错综复杂的现状，改进了一些计量风险和资本的方法，使其更具指导意义和可操作性。③鼓励使用内部模型。新协议主张有条件的大银行提供自己的风险评估水平，建立更精细的风险评估系统，并提出了一整套精致的基于内部信用评级的资本计算方法。E错误。④资本约束范围的扩大。新协议对诸如组织形式、交易工具等的变动提出了相应的资本约束对策。2023中级经济师《经济基础知识》练习题精选汇总'},
  {ch:22,type:'multi',q:'跨境贸易人民币融资的各项业务品种中，属于进口贸易融资的有（）。',o:["打包贷款", "海外代付", "进口信用证", "福费廷"],a:[0,1,3],x:'本题考查跨境人民币业务的类型。进口贸易融资包括进口信用证、海外代付、进口押汇等。'},
  {ch:15,q:'商业银行在办理境外直接投资人民币结算业务时不需要履行的义务是（）。',o:["严格进行交易真实性和合规性审查", "对公众披露投资企业信息", "履行反洗钱和反恐融资义务"],a:1,x:'本题考查跨境人民币业务的类型。商业银行在办理境外直接投资人民币结算业务时应履行下列义务：①严格进行交易真实性和合规性审查。②按照规定报送信息。③履行反洗钱和反恐融资义务。'},
  {ch:22,type:'multi',q:'2005年7月21日，在主动性、可控性、渐进性原则的指导下，我国改革人民币汇率形成机制，这一机制的主要内容包括（）。',o:["人民币汇率盯住一篮子货币进行调节", "人民币汇率以市场供求为基础", "人民币汇率参考一篮子货币进行调节", "人民币汇率是有管理的浮动汇率制度"],a:[1, 2, 3],x:'本题考查人民币汇率制度。2005年7月21日，在主动性、可控性、渐进性原则的指导下，改革人民币汇率形成机制，实行以市场供求为基础、参考一篮子货币进行调节、有管理的浮动汇率制度。'},
  {ch:0,q:'关于跨境人民币证券投资的说法，正确的是（）。',o:["境外机构在境内发行的人民币债券称为“点心债”", "跨国企业可在香港发行人民币债券", "境内机构在境外发行的人民币债券称为“熊猫债”"],a:1,x:'本题考查跨境人民币证券投融资。（1）境内机构在境外发行人民币债券。2007年6月，中国人民银行与国家发展和改革委员会联合发布《境内金融机构赴香港特别行政区发行人民币债券管理暂行办法》，明确政策性银行和境内商业银行可在香港特别行政区发行人民币债券。香港市场将这些人民币债券称为“点心债”。目前，海外金融机构、跨国企业和跨国组织均可参与到香港特别行政区人民币债券发行主体中，境内在香港特别行政区上市企业也可以在香港市场融资发债。（2）境外机构在境内发行人民币债券。目前，在境内发行人民币债券（也称为"熊猫债”）的境外机构主要为国际开发机构。'},
  {ch:15,q:'次贷危机从2007年春季开始显现，发生在（）并席卷世界主要金融市场。',o:["英国", "德国", "美国"],a:2,x:'本题考查次贷危机。次贷危机是一场发生在美国，因次级抵押贷款机构破产、投资基金被迫关闭、股市剧烈震荡引起的金融风暴。（2018年试题）'},
  {ch:0,type:'multi',q:'下列关于各类型金融危机之间相互关系的说法，正确的有（）。',o:["各类型的金融危机不会同时爆发", "债务危机的爆发往往伴随着货币危机", "发生内部综合性危机国家的共同特点是金融体系脆弱", "货币危机与一国宏观基本面、市场预期有很大关系"],a:[1,2,3],x:'本题考查金融危机的类型。从几种危机的情况看，它们之间相互影响，任何一个因素的变动都将对经济各层面产生联动作用，如流动性危机的爆发很可能会引发货币危机，债务危机的爆发往往伴随着货币大幅贬值的货币危机等。如果得不到及时控制，局部危机将发展成为外部综合性金融危机，即几种危机同时爆发，或一种危机带动其他危机爆发。发生内部综合性金融危机国家的共同特点是金融体系脆弱，危机由银行传导至整个经济。总的来说，一国货币危机的发生与其宏观基本面、市场预期、制度建设和金融体系发展状况有很大关系，一旦某些因素导致市场信心不足，资本大规模的逃离使得钉住汇率难以维持，最终会引发货币危机。（2019年试题）',flag:'源站答案疑似错误：危机可同时爆发，A项错；正确为BCD'},
  {ch:0,q:'关于综合性金融危机的说法，正确的是（）。',o:["传统的金融危机都属于综合性金融危机", "发生内部综合性金融危机国家的共同特点是外部债务结构不合理，无法按期还债", "综合性金融危机通常指内部综合性金融危机"],a:2,x:'本题考查综合性金融危机。综合性金融危机一方面严重损害了相关国家的经济金融利益，且极易升级为经济危机或政治危机。（2019年试题）2023中级经济师《经济基础知识》练习题精选汇总'},
  {ch:15,type:'multi',q:'2005年7月，我国改革了人民币汇率形成机制。新的人民币汇率制度的特点有（）。',o:["以结售汇为核心", "以市场供求为基础", "盯住一篮子货币", "参考一篮子货币进行调节"],a:[0,2,3],x:'本题考查汇率制度。新的人民币汇率制度的特点是：以市场供求为基础、参考一篮子货币进行调节、有管理的浮动汇率制度。'},
  {ch:22,type:'multi',q:'金本位制度下的固定汇率制度的特点包括（）。',o:["自发的固定汇率制度", "铸币平价是各国汇率的决定基础", "黄金输送点是汇率变动的上下限", "以美元为中心的固定汇率制度"],a:[0, 1, 2],x:'本题考查国际金本位制下固定汇率制度的特点。1880-1914年是国际金本位制的黄金时期，铸币平价是各国汇率的决定基础，黄金输送点是汇率变动上下限。各国货币汇率波动很小，成为自发的固定汇率。D项是布雷顿森林体系的特征。E项是牙买加体系的特征。'},
  {ch:15,type:'multi',q:'一般来说，决定一个国家汇率制度的因素主要有（）。',o:["经济开放程度", "居民消费习惯", "经济规模", "进出口贸易的商品结构和地域分布"],a:[0,2,3],x:'本题考查影响汇率制度选择的因素。影响汇率制度选择的因素有：①经济开放程度；②经济规模；③国内金融市场的发达程度及其国际金融市场的一体程度；④进出口贸易的商品结构和地域分布；⑤相对的通货膨胀率。'},
  {ch:22,q:'布雷顿森林体系实行的固定汇率制以（）为中心。',o:["法郎", "英镑", "瑞郎"],a:2,x:'本题考查汇率制度。在“二战”后布雷顿森林体系下，实行的以美元为中心的固定汇率制度是一种人为的可调整的固定汇率制度。'},
  {ch:15,q:'关于人民币汇率制度的说法，正确的是（）。',o:["决定人民币汇率的基础是美元指数的涨跌", "中国人民银行不再对人民币汇价实行管理", "目前我国实行的人民币汇率制度是以市场供求为基础的、单一的、有管理的浮动汇率制度"],a:2,x:'本题考查人民币汇率制度。2005年7月21日，在主动性、可控性、渐进性原则的指导下，改革人民币汇率形成机制，实行以市场供求为基础、参考一篮子货币进行调节、有管理的浮动汇率制度。人民币汇率不再钉住单一美元，而是按照我国对外经济发展的实际情况，选择若干种主要货币，赋予相应的权重，组成一个货币篮子。选项AC错误。中国人民银行对人民币汇价实行一定程度的管理。选项B错误。'},
  {ch:15,type:'multi',q:'商业银行在办理境外直接投资人民币结算业务时应履行的义务包括（）。',o:["严格遵循“事前管理”的原则进行审查", "严格进行交易真实性和合规性审查", "按照规定报送信息", "履行反洗钱义务"],a:[1,2,3],x:'本题考查跨境人民币业务的类型。商业银行在办理境外直接投资人民币结算业务时应履行下列义务：（1）严格进行交易真实性和合规性审查；（2）按照规定报送信息；（3）履行反洗钱义务；（4）履行反恐融资义务。选项A错误，按照“事后管理”的原则，各商业银行主要依据企业提供的境外直接投资主管部门的核准证书或文件等材料办理直接投资人民币结算业务。',flag:'源站答案疑似错误：应“事后管理”而非“事前管理”，A项错；正确为BCD'},
  {ch:0,q:'境外企业和经济组织或个人可以使用人民币来华开展包括向新设企业出资、并购境内企业、股权转让及对现有企业进行增资、提供贷款等业务，以及将所得人民币资金汇出境外的行为是（）。',o:["外商直接投资人民币结算", "境外直接投资人民币结算", "跨境贸易人民币结算"],a:0,x:'本题考查跨境人民币业务的类型。外商直接投资人民币结算，即境外企业和经济组织或个人可以使用人民币来华开展包括向新设企业出资、并购境内企业、股权转让及对现有企业进行增资、提供贷款等业务，以及将所得人民币资金汇出境外。2023中级经济师《经济基础知识》练习题精选汇总'},
  {ch:16,q:'统计报表按调查对象范围不同，可以分为（）。',o:["全面和非全面统计报表", "基层和综合统计报表", "专业和综合统计报表"],a:0,x:'本题考查统计报表。统计报表的类型多样，按调查对象范围的不同可分为全面统计报表和非全面统计报表。全面统计报表要求调查对象中的每一个单位都填报，非全面统计报表只要求调查对象中的一部分单位填报。目前的大多数统计报表都是全面统计报表。'},
  {ch:16,type:'multi',q:'关于数据科学的说法，正确的有（）。',o:["数据科学主要涉及统计学的范畴", "数据科学是一门通过系统性研究获取与数据相关的知识体系的学科", "数据科学研究的是从“数据”整合成“信息”进而组织成“知识”的整个过程", "数据科学的研究对象是数据"],a:[1,2,3],x:'本题考查数据科学。数据科学是一门通过系统性研究获取与数据相关的知识体系的学科。数据科学研究的是从“数据”整合成“信息”进而组织成“知识”的整个过程，包含对数据进行采集、储存、处理、分析、表现等一系列活动。数据科学的研究对象是数据，研究目标是获得洞察力和理解力，通过对数据的分析，来解释、预测、洞见和决策，为现实世界服务。数据科学涉及的范围非常广泛，例如统计学、计算机科学、可视化、人工智能、领域知识等。选项A说法错误。',flag:'源站答案疑似错误：数据科学不止涉及统计学，A项错；正确为BCD'},
  {ch:16,q:'按报送周期长短，统计报表可以分为（）。',o:["国家、部门和地方统计报表", "日报、月报、季报、年报等", "全面和非全面统计报表"],a:1,x:'本题考查统计报表。目前的大多数统计报表都是全面统计报表，按报送周期长短不同可分为日报、月报、季报、年报等；按报表内容和实施范围不同可分为国家的、部门的、地方的统计报表。'},
  {ch:16,q:'下列关于统计质量评价标准的说法，正确的是（）。',o:["真实性侧重于对统计数据全面系统反映客观实际程度的评价", "准确性侧重于对统计数据生产科学性的评价", "适用性侧重于对基础数据质量的评价"],a:1,x:'本题考查统计数据的质量评价标准。选项A错误，真实性侧重于对基础数据质量的评价。完整性侧重于对统计数据全面系统反映客观实际程度的评价。选项C错误，适用性侧重于对统计用户满意度的评价。经济性侧重于对统计数据成本效益的评价。可比性侧重于对统计工作标准化、规范化程度的评价。'},
  {ch:16,type:'multi',q:'常见的数据挖掘方法包括（）。',o:["监督学习", "半结构化数据", "无监督学习", "半监督学习"],a:[0, 2, 3],x:'本题考查数据挖掘的方法。常见的数据挖掘方法可分为监督学习、无监督学习和半监督学习。'},
  {ch:15,type:'multi',q:'决定一国汇率制度的因素有（）。',o:["经济开放程度", "经济规模", "国际储备总量", "国内金融市场的发达程度"],a:[0, 1, 3],x:'本题考查影响汇率制度选择的因素。影响汇率制度选择的因素有：①经济开放程度；②经济规模；③国内金融市场的发达程度及其国际金融市场的一体程度；④进出口贸易的商品结构和地域分布；⑤相对的通货膨胀率。'},
  {ch:15,q:'金本位制度下汇率制度的特点是实行（）。',o:["有管理的浮动汇率", "人为的固定汇率", "自发的浮动汇率"],a:2,x:'本题考查汇率制度的特点。金本位制度下的固定汇率是自发的固定汇率制度。2023中级经济师《经济基础知识》练习题精选汇总'},
  {ch:16,type:'multi',q:'关于大数据多样性的说法，正确的有（）。',o:["大数据只包括结构化数据", "结构化数据是指存储在数据库里，可以用二维表结构实现表达的数据", "半结构化数据是介于完全结构化数据和完全非结构化数据之间的数据", "半结构化数据具有一定的结构性"],a:[1,2,3],x:'本题考查大数据的特性。大数据类型繁多，包括网络日志、音频、视频、图片、地理位置等各种结构化、半结构化和非结构化的数据。结构化数据是指存储在数据库里，可以用二维表结构实现表达的数据；非结构化数据是指数据结构不规则或不完整，没有预定义的数据，包括所有格式的办公文档、文本、图片、报表、图像、音频信息、视频信息等；半结构化数据是介于完全结构化数据和完全非结构化数据之间的数据，具有一定的结构性，例如员工简历，有的简历只有教育情况，有的简历包括教育、婚姻、户籍、出入境等很多信息。',flag:'源站答案疑似错误：大数据含结构化/半结构化/非结构化，A项“只包括结构化”错；正确为BCD'},
  {ch:16,q:'下列统计处理中，属于推断统计的是（）。',o:["利用统计表展示2020年我国主要工业额", "利用抽样调查数据估计粮食产量", "利用直方图显示分组数据频数分布特征"],a:1,x:'本题考查统计学。推断统计是研究如何利用样本数据来推断总体特征的统计学方法，其内容包括参数估计和假设检验两大类。'},
  {ch:16,q:'下列统计变量中，属于定量变量的是（）。',o:["全员劳动生产率", "文化产业类别", "受教育水平"],a:0,x:'本题考查变量和数据。当变量的取值是数量时，该变量被称为定量变量或数据变量，例如企业销售额、注册员工数量等。'},
  {ch:16,type:'multi',q:'关于统计报表填报要求的说法，正确的有（）。',o:["报送程序统一", "指标统一", "报送时间统一", "填表人统一"],a:[0,1,2,3],x:'本题考查统计调查的方式。统计报表是目前我国收集数据的一种重要方式。统计报表是按照国家有关法规的规定，自上而下地统一布置、自下而上地逐级提供基本统计数据的一种调查方式。统计报表要以一定的原始数据为基础，按照统一的表式、统一的指标、统一的报送时间和报送程序进行填报。',flag:'答案存疑：统计报表要求为统一表式/指标/报送时间/报送程序，疑不含“填表人统一”，建议核实'},
  {ch:16,type:'multi',q:'下列统计调查方式中，仅对调查对象中的一部分单位进行调查的有（）。',o:["典型调查", "全面统计报表", "普查", "抽样调查"],a:[0,3],x:'本题考查统计调查。非全面调查包括非全面统计报表、抽样调查、重点调查和典型调查等。全面调查包括全面统计报表和普查。'},
  {ch:16,q:'根据内容和实施范围不同，统计报表可以分为（）。',o:["日报、月报、季报和年报", "基层和综合统计报表", "全面和非全面统计报表"],a:2,x:'本题考查统计报表。目前的大多数统计报表都是全面统计报表，按报送周期长短不同可分为日报、月报、季报、年报等；按报表内容和实施范围不同可分为国家的、部门的、地方的统计报表。2023中级经济师《经济基础知识》练习题精选汇总'},
  {ch:16,q:'2020年某地级市9个县市区的苹果产量（单位：万吨）是：10，10，12，21，23，38，41，45，72。这组数据的中位数是（）万吨。',o:["38", "23", "22"],a:1,x:'本题考查中位数。首先对数据进行排序：10，10，12，21，23，38，41，45，72，数据有9个，所以中位数为第中间位置的数，即23。'},
  {ch:18,type:'multi',q:'关于众数的说法，正确的有（）。',o:["众数缺乏稳定性", "众数用于描述数据的离散趋势", "众数是指一组数据中出现次数（频数）最多的变量值", "一组数据的众数是唯一的"],a:[0,2,3],x:'本题考查集中趋势的测度。众数是指一组数据中出现次数（频数）最多的变量值。众数适用于描述分类数据和顺序数据的集中趋势，不适用于定量变量，主要适用于分类和顺序变量。优点是不受极端值的影响，尤其是分布明显偏态时，众数的代表性更好。缺点是没有充分利用数据的全部信息，缺乏稳定性，而且可能不唯一。'},
  {ch:16,type:'multi',q:'下列统计量中，用于测度集中趋势的有（）。',o:["中位数", "众数", "平均数", "标准差"],a:[0, 1, 2],x:'本题考查集中趋势的测度。集中趋势是指一组数据向某一中心值靠拢的程度，它反映了一组数据中心点的位置所在。测度集中趋势的指标包括均值、中位数、众数。选项D属于离散程度的测度指标。选项E属于分布形态的测度指标。'},
  {ch:16,type:'multi',q:'下列统计量中，适用于顺序数据的有（）。',o:["中位数", "方差", "标准差", "众数"],a:[0, 3],x:'本题考查集中趋势的测度。众数适用于分类数据和顺序数据；中位数适用于顺序数据和数值型数据；均值、方差、标准差等只适用于数值型数据。'},
  {ch:16,q:'对顺序变量观测的结果称为（）。',o:["顺序数据", "定量数据", "分类数据"],a:0,x:'本题考查变量和数据。数据是对变量进行测量、观测的结果。顺序数据是对顺序变量的观测结果。'},
  {ch:16,q:'下列统计处理中，属于描述统计的是（）。',o:["利用均值测度一组数据的集中趋势", "利用抽样调查数据推断城镇居民平均收入", "利用样本信息推断消费者对某品牌的知晓度"],a:0,x:'本题考查描述统计。描述统计是研究数据收集、整理和描述的统计学方法。其内容包括如何取得所需要的数据，如何用图表或数学方法对数据进行整理和展示，如何描述数据的一般性特征。选项BCD属于推断统计。'},
  {ch:17,type:'multi',q:'关于抽样调查的说法，正确的有（）。',o:["抽样调查只抽取部分样本进行调查", "抽样调查的时效性强", "抽样调查耗费大量人力、物力、财力", "抽样调查根据样本调查结果推断总体数量特征"],a:[0,1,3],x:'本题考查抽样调查。抽样调查是从调查对象的总体中抽取一部分单位作为样本进行调查，并根据样本调查结果来推断总体数量特征的一种非全面调查。所以AD正确。抽样调查具有经济性、时效性强、适应面广的特点。由于调查的样本单位通常是总体单位中的很小一部分，调查的工作量小，因而可以节省大量的人力、物力、财力和时间。所以BE正确，C错误。2023中级经济师《经济基础知识》练习题精选汇总'},
  {ch:18,q:'在相关分析中，如果两个变量间Pearson相关系数r＝0，这表示（）。',o:["两个变量间不存在线性相关关系", "两个变量间没有任何相关关系", "两个变量间存在中度相关关系"],a:0,x:'本题考查相关系数的内容。Pearson相关系数只适用于线性相关关系的判断，因此r＝0只表示两个变量之间不存在线性相关关系，并不说明变量之间没有任何关系，比如它们之间可能存在非线性相关关系。'},
  {ch:16,q:'对于两个定量变量之间的相关分析，适用的统计量是（）。',o:["离散系数", "相关系数", "偏态系数"],a:1,x:'本题考查相关系数。相关系数是度量两个变量之间相关关系的统计量。'},
  {ch:16,type:'multi',q:'根据2010—2017年的统计数据，我国国内生产总值和农村贫困人口规模的相关系数r＝﹣0.975。关于这两个变量相关关系的说法，正确的有（）。',o:["两个变量之间存在正相关关系", "两个变量之间不存在线性相关关系", "两个变量之间完全相关", "两个变量之间高度相关"],a:[2,3],x:'本题考查相关系数。若﹣1≤r＜0，表明变量之间存在负线性相关关系。r的绝对值大于0.8，属于高度相关。所以选项DE正确。'},
  {ch:16,q:'如果一组数据的偏态系数为﹣0.4，则该组数据的分布为（）。',o:["轻度左偏", "中度左偏", "中度右偏"],a:0,x:'本题考查分布形态的测度。偏态系数为0，说明数据的分布是对称的。偏态系数为正，说明分布是右偏的，取值在0～0.5之间说明轻度右偏，取值在0.5～1之间，说明中度右偏，取值大于1说明严重右偏；偏态系数为负，说明分布为左偏，取值在0～－0.5之间，说明轻度左偏，取值在－0.5～－1之间，说明中度左偏，取值小于－1，说明严重左偏。本题中，偏态系数为﹣0.4，说明轻度左偏。'},
  {ch:18,q:'与标准差相比，方差在测度数据离散程度时的缺点是（）。',o:["计算方法复杂", "不适用于数值型数据", "其单位是原数据单位的平方，没有解释意义"],a:2,x:'本题考查离散程度的测度。方差是反映数据离散程度的重要测度指标，但是其单位是原数据单位的平方，没有解释意义。'},
  {ch:16,q:'下列统计量中，用于测度数据分布偏度的是（）。',o:["方差", "标准差", "偏态系数"],a:2,x:'本题考查分布形态的测度。测度数据分布偏度的统计量称为偏态系数。'},
  {ch:16,q:'对数据分布偏态的测度，反映数据分布的（）。',o:["分散度", "集中度", "不对称性"],a:2,x:'本题考查描述统计。偏度是指数据分布的偏斜方向和程度，描述的是数据分布对称程度。测度数据分布偏度的统计量称为偏态系数。2023中级经济师《经济基础知识》练习题精选汇总'},
  {ch:20,q:'在时间序列的水平分析中，报告期水平与某固定时期水平之差是（）。',o:["平均增长量", "逐期增长量", "平均发展水平"],a:2,x:'本题考查累计增长量。累计增长量是报告期水平与某一固定时期水平（通常是时间序列最初水平）之差。'},
  {ch:17,type:'multi',q:'某省在开展住户收支调查时，首先，将省内所有调查小区分为城镇和农村两类，分别独立随机抽取100个城镇调查小区和100个农村调查小区，然后，在每个样本调查小区内对住户进行排序，按照原定间隔抽取20个住户进行问卷调查，该住户收支调查采用的抽样调查有（）。',o:["系统抽样", "整群抽样", "判断抽样", "多阶段抽样"],a:[0,3],x:'本题考查几种基本概率抽样方法。将省内所有调查小区分为城镇和农村两类，分别独立随机抽取100个城镇调查小区和100个农村调查小区，属于分层抽样。在每个样本调查小区内对住户进行排序，按照原定间隔抽取20个住户进行问卷调查，属于系统抽样。而整个抽样过程是多阶段抽样。'},
  {ch:18,q:'关于标准差的表述，错误的是（）。',o:["用来测量数据的离散程度", "与原始数据具有相同的计量单位", "标准差越小，均值的代表性越差"],a:2,x:'本题考查标准差。方差或标准差越小，数据的离散程度越小，均值的代表性越好。'},
  {ch:18,q:'2015年底，某高校学生年龄的算术平均数为20岁，标准差为2岁，则该校学生年龄的离散系数为（）。',o:["0.1", "0.2", "0.3"],a:0,x:'本题考查离散系数。学生年龄的离散系数＝2/20×100%＝0.1。'},
  {ch:18,q:'在调查某企业营业员的日销售额中，分析可得各营业员的销售额均值为500元，方差为64元，则计算营业员的月销售额的离散系数为（）。',o:["0.016", "0.064", "0.128"],a:0,x:'本题考查离散程度的测度。离散系数＝标准差/均值＝8/500＝0.016。'},
  {ch:18,q:'关于pearson相关系数的说法中错误的是（）。',o:["若0＜r≤1，表明变量间存在正线性相关", "若﹣1＜r≤0，表明变量间存在正线性相关", "若r＝1，表明变量间为完全正线性相关"],a:1,x:'本题考查pearson相关系数的取值。若﹣1≤r＜0，表明变量间存在负线性相关。'},
  {ch:18,type:'multi',q:'如果变量x、y之间的pearson相关系数r＝0.9，表明两个变量之间存在（）。',o:["高度相关关系", "完全正相关关系", "完全负相关关系", "正相关关系"],a:[0, 3],x:'本题考查相关系数。当相关系数绝对值大于0.8时，两个变量高度相关；当相关系数大于0小于1时，两个变量正相关。2023中级经济师《经济基础知识》练习题精选汇总'},
  {ch:17,type:'multi',q:'为调查新冠肺炎疫情对某城市餐饮行业个体户经营状况的影响，从市场监督管理局数据库中按照等距抽样方法抽取10000个餐饮行业个体户进行抽样调查，回答率为20％，该调查中可能存在的非抽样误差有（）。',o:["抽样误差", "随机误差", "无回答误差", "计量误差"],a:[1,2,3],x:'本题考查抽样调查中的误差。非抽样误差包括抽样框误差、无回答误差、计量误差。题干是从市场监督管理局数据库中抽取个体户，因有些个体商贩是无照经营的，有些人虽有营业执照，但已经转行，不再经商，故存在抽样框误差。根据题干回答率为20％，说明回答率较低，可能存在无回答误差。同时也可能存在计量误差，如调查人员作弊，调查中的提问错误或记录答案错误，造成调查所获得的数据与其真值之间不一致。'},
  {ch:16,type:'multi',q:'下列统计活动中，一般在数据处理分析阶段完成的有（）。',o:["数据录入", "抽取样本", "数据编码", "明确定义问题"],a:[0, 2],x:'本题考查抽样调查的一般步骤。数据处理分析的过程包括对调查获得的原始数据进行检查、核对，对验收合格的数据进行编码和录入，对录入的数据进行预处理，对数据进行统计分析，对总体参数进行估计等。'},
  {ch:17,q:'在某省住户收支与生活状况调查中，通过对该省城镇住户和农村住户的抽样调查来了解该省住户的收支与生活状况，该抽样调查中的样本是（）。',o:["该省所有被采集数据的住户", "该省每一个被采集数据的住户", "该省所有住户"],a:0,x:'本题考查抽样调查基本概念。样本是总体的一部分，由从总体中按一定原则或程序抽出的部分个体所组成。本题中样本是该省所有被采集数据的住户。总体是该省所有住户。'},
  {ch:17,q:'在抽取样本时，公司领导依据对员工的了解，调查满意度。这种抽样调查方法称为（）。',o:["判断抽样", "方便抽样", "配额抽样"],a:0,x:'本题考查判断抽样。判断抽样是在抽取样本时，调查人员依据调查目的和对调查对象情况的了解，人为确定样本单元。'},
  {ch:20,q:'出生孩次构成属于时间序列中的（）。',o:["平均数时间序列", "时点序列", "相对数时间序列"],a:1,x:'本题考查时间序列的分类。出生孩次是反映一定时点上的瞬间水平的人口数量。平均数时间序列统计指标值是平均数，如人均国内生产总值。相对数时间序列统计指标值是相对数，如城镇人口比重。时期序列反映现象在一段时期内发展的结果，即过程总量。'},
  {ch:0,q:'在某企业员工的工作环境满意度调查中，研究比较不同抽样方法的进度，下列抽样方法中，在员工样本量相同的条件下，不同抽样方式误差最大的是（）。',o:["按照员工编号等距抽样", "简单随机抽样", "按照员工岗位分组的分层抽样"],a:2,x:'本题考查整群抽样。整群抽样的主要缺点是：由于抽取的样本单位比较集中，群内各单位之间存在相似性，差异比较小，而群与群之间的差别往往比较大使得整群抽样的抽样误差比较大。'},
  {ch:9,q:'“就业人口数”属于（）。',o:["相对数时间序列", "平均数时间序列", "时点序列"],a:2,x:'本题考查时间序列的分类。“就业人口数”属于时点序列，每一指标值反映现象在一定时点上的瞬间水平。2023中级经济师《经济基础知识》练习题精选汇总'},
  {ch:0,q:'随着样本量的增大，估计量的值稳定于总体参数的真值，则这个估计量具有（）。',o:["真实性", "一致性", "无偏性"],a:1,x:'本题考查估计量的性质。估计量的一致性：随着样本量的增大，估计量的值如果稳定于总体参数的真值，这个估计量就有一致性，可称为一致估计量。'},
  {ch:17,q:'随机抽取1000个消费者进行电话访问来了解某商品的品牌忠诚度。按照抽样调查理论，这1000个受访者的品牌忠诚度的平均值是（）。',o:["总体", "样本", "总体参数"],a:2,x:'本题考查抽样调查基本概念。样本统计量是根据样本中各单位的数值计算的，是对总体参数的估计，因此也称为估计量。样本统计量是一个随机变量，它取决于样本设计和正好被选入样本的单元特定组合。'},
  {ch:20,type:'multi',q:'关于增长量与平均增长量的说法，正确的有（）。',o:["增长量可分为逐期增长量和累计增长量", "逐期增长量是报告期水平与前一期水平之差", "增长量是报告期发展水平与基期发展水平之差", "平均增长量是时间序列中累计增长量的序时平均数"],a:[0,1,2],x:'本题考查增长量与平均增长量。选项D错误，平均增长量是时间序列中逐期增长量的序时平均数。',flag:'源站答案疑似错误：平均增长量是逐期增长量而非累计增长量的序时平均，D项错；正确为ABC'},
  {ch:17,type:'multi',q:'在简单随机抽样调查中，关于样本量的说法，正确的有（）。',o:["样本量是调查经费与调查精度之间的某种折中和平衡", "在不同的样本量水平上，增加同等样本量所降低的抽样误差是相同的", "总体规模增大，样本量要同比例增大", "允许的调查误差越小，需要的样本量越大"],a:[0,3],x:'本题考查样本量的计算。随着样本量的增大，增加同等样本量所增加的精度幅度呈下降趋势。对小规模的总体，总体规模越大，为保证相同估计精度，样本量也要随之增大（但不是同比例的）。BC错误。'},
  {ch:17,q:'在某省住户收支与生活状况调查中，通过对该城镇住户和农村住户的抽样调查来了解该省城乡居民收入、消费及其他生活状况。该抽样调查的总体是该省（）。',o:["被调查的住户", "每一个被采集数据的用户", "所有住户"],a:2,x:'本题考查抽样调查基本概念。总体即调查对象的全体。根据题干，调查对象为住户，总体为所有住户。'},
  {ch:0,q:'在调查某城市餐饮行业个体户的经营状况时，从该城市的所有调查小区中随机抽取50个，然后对每个被抽中调查小区中所有餐饮行业个体户进行全面调查，这种抽样方法是（）。',o:["判断抽样", "分层抽样", "等距抽样"],a:2,x:'本题考查整群抽样。整群抽样是将总体中所有的基本单位按照一定规则划分为互不重叠的群，抽样时直接抽取群，对抽中的群调查其全部基本单位，对没有抽中的群则不进行调查。根据题干是对被抽中调查小区中所有餐饮行业个体户进行调查。故选整群抽样。'},
  {ch:8,q:'经济周期有涨落相间的交替波动，周期长短不一，无固定规律，时间序列呈现出的这种非固定长度的周期性变动称为（）。',o:["长期趋势", "季节变动", "循环波动"],a:2,x:'本题考查时间序列的分解和预测程序。循环波动（C）是时间序列呈现出的非固定长度的周期性变动。例如，经济周期有涨落相间的交替波动，周期长短不一，无固定规律。2023中级经济师《经济基础知识》练习题精选汇总'},
  {ch:16,q:'利用样本数据估计的一元线性回归方程表达式是（）。',o:["B、", ""],a:0,x:'本题考查估计的回归方程。参数β0和β1为估计量，所以估计的回归方程为。'},
  {ch:19,q:'最小二乘法的原理是使得（）最小。',o:["因变量的观测值与自变量的观测值之间的离差平方和", "因变量的观测值与估计值之间的离差平方和", "自变量的观测值与均值之间的离差平方和"],a:1,x:'本题考查最小二乘法。最小二乘法就是使得因变量的观测值与估计值之间的离差平方和最小来估计参数β0和β1的方法。'},
  {ch:19,type:'multi',q:'在某城市随机抽取1000户居民作为样本对该城市居民消费水平进行研究，对居民月消费支出Y（单位：元）和月收入X（单位：元），建立回归模型，得到估计的回归系数Y＝1300＋0.6X，决定系数0.96，关于该模型的说法正确的有（）。',o:["居民月收入和月消费支出之间正相关", "回归模型的拟合效果很好", "居民月收入难以解释月消费支出的变化", "居民月收入每增长1元，月消费支出将平均增长0.6元"],a:[0,1,3],x:'本题考查模型的检验和预测。由Y=1300+0.6X，可以看出X和Y同方向变化，即正相关，选项A正确；0.6表示X每增加一个单位，Y的平均增加量，选项D正确；将X＝10000元代入回归方程即Y=1300+0.6×10000=7300元，选项E正确。决定系数0.96接近于1，可看出回归模型的拟合效果很好，选项B正确，选项C错误。'},
  {ch:19,type:'multi',q:'根据抽样调查数据中人均可支配收入和人均消费进行回归分析，得到估计的一元线性回归模型Y^=1000+0.7X（X为人均可支配收入，Y是人均消费，单位为元），关于该回归模型的说法，正确的有（）。',o:["人均可支配收入每增加1元，人均消费平均增长0.7元", "人均可支配收入每减少1元，人均消费平均增长0.7元", "人均可支配收入每增加1％，人均消费将平均增长0.7％", "当人均可支配收入为20000元时，人均消费将为15000元"],a:[0, 3],x:'本题考查回归分析。回归模型为Y^=1000+0.7X，β＝0.7，表示人均可支配收入X每增加1元，人均消费平均增长0.7元，选项A正确。当X＝20000时，代入回归模型中，得到Y＝15000，选项D正确。'},
  {ch:19,q:'一元线性回归模型Y＝β0＋β1X＋ε中，β1的含义为（）。',o:["自变量X为0时，因变量Y的平均值", "自变量X每增长1个单位时，因变量Y平均增长β1个单位", "自变量X每增长1％时，因变量Y平均增长β1％"],a:1,x:'本题考查一元线性回归模型。一元线性回归模型中，因变量Y是自变量X的线性函数（β0＋β1X）加上误差项ε。β1表示自变量X每增长1个单位时，因变量Y平均增长β1个单位。'},
  {ch:16,q:'选择合适的统计模型从一个变量的变化来推测另一个变量的变化情况，适用的统计方法是（）。',o:["散点图", "移动平均", "相关系数"],a:2,x:'本题考查回归分析。相关分析与回归分析之间在研究目的和方法上是有明显区别的。相关分析研究变量之间相关的方向和相关的程度。但是相关分析不能指出变量间相互关系的具体形式，也无法从一个变量的变化来推测另一个变量的变化情况。回归分析则是研究变量之间相互关系的具体形式，它对具有相关关系的变量之间的数量联系进行测定，确定一个相关的数学方程式，根据这个数学方程式可以从已知量来推测未知量，从而为估算和预测提供了一个重要的方法。'},
  {ch:0,q:'回归系数t检验的目的是（）。',o:["测算回归模型的拟合效果", "估计回归系数的大小", "检验自变量的经济含义是否正确"],a:2,x:'本题考查回归系数的显著性检验。回归系数的显著性检验主要是用来判断回归模型的自变量对因变量是否有显著影响。2023中级经济师《经济基础知识》练习题精选汇总'},
  {ch:24,type:'multi',q:'通过会计活动，向会计信息使用者提供会计信息的主要内容有（）。',o:["员工规模", "全面预算", "经营成果", "财务状况"],a:[1,2,3],x:'本题考查会计目标。通过会计活动，向会计信息使用者提供对决策有用的，与企业财务状况、经营成果和现金流量等有关的会计信息，以帮助会计信息使用者作出经济决策。'},
  {ch:24,type:'multi',q:'会计要素确认和计量基本原则包括（）。',o:["划分收益性支出和资本性支出原则", "配比原则", "谨慎性原则", "历史成本原则"],a:[0,1,3],x:'本题考查会计要素确认和计量基本原则。会计要素确认和计量基本原则包括：权责发生制原则、配比原则、历史成本原则、划分收益性支出与资本性支出原则。'},
  {ch:24,q:'规定了会计核算内容空间范围的会计基本假设是（）。',o:["会计主体", "持续经营", "会计分期"],a:0,x:'本题考查会计基本前提。会计主体规定了会计核算内容的空间范围。'},
  {ch:24,q:'企业向供货商支付赊欠的货款，引起的会计要素变动是（）。',o:["一项资产和一项所有者权益同时等额减少", "一项负债减少，另一项所有者权益等额增加，资产要素不变", "一项资产和一项负债同时等额增加"],a:2,x:'本题考查经济业务发生所引起的会计要素的变动。企业偿还欠款，银行存款减少，负债也相应减少，所以是一项资产和一项负债同时等额减少。'},
  {ch:0,q:'若一笔收益性支出按资本性支出处理，将造成的影响是（）。',o:["净收益降低", "少计资产价值", "资产价值虚增"],a:2,x:'本题考查会计要素确认和计量基本原则。如果一笔收益性支出按资本性支出处理了，就会造成少计费用而多计资产价值，出现净收益和资产价值虚增的现象。'},
  {ch:24,q:'企业收到应收账款100万元并存入银行，引起的会计要素变动是（）。',o:["一项资产和一项负债同时等额增加", "一项资产和一项所有者权益同时等额减少", "一项资产和一项所有者权益同时等额增加"],a:2,x:'本题考查经济业务发生所引起的会计要素的变动。企业收到应收账款并存入银行，银行存款增加，而应收账款相应减少，是一项资产增加，另一项资产等额减少，负债和所有者权益要素不变。'},
  {ch:0,type:'multi',q:'下列经济活动中，属于经济交易的有（）。',o:["计提折旧", "购买服务", "销售商品", "上缴税收"],a:[1, 2, 3],x:'本题考查会计核算的具体内容。经济业务又称经济交易，是指单位与其他单位和个人之间发生的各种经济利益的交换，如购买固定资产、销售商品、上缴税收等。经济事项是指在单位内部发生的具有经济影响的各类事项，如支付职工工资、报销差旅费、计提折旧等。2023中级经济师《经济基础知识》练习题精选汇总'},
  {ch:24,q:'企业是按收入的权利和支出的义务是否属于本期，而不是按是否在本期实际收付款项来确认收入、费用的入账时间，这体现的是会计要素确认计量原则中的（）。',o:["历史成本原则", "配比原则", "权责发生制原则"],a:2,x:'本题考查权责发生制原则。按照权责发生制原则，凡是当期已经实现的收入、已经发生和应当负担的费用，不论款项是否收付，都应当作为当期的收入、费用；凡是不属于当期的收入、费用，即使款项已经在当期收付了，也不应当作为当期的收入、费用。'},
  {ch:24,type:'multi',q:'会计要素的确认计量原则包括（）。',o:["权责发生制原则", "配比原则", "历史成本原则", "实质重于形式原则"],a:[0,1,2,3],x:'本题考查会计要素的确认计量原则。会计要素的确认计量原则包括权责发生制、配比原则、历史成本原则、划分收益性支出与资本性支出原则。',flag:'答案存疑：确认计量原则不含“实质重于形式”（属信息质量要求），疑为ABC，建议核实'},
  {ch:24,q:'我国行政事业单位财务会计核算采用（）。',o:["永续盘存制", "收付实现制", "实地盘存制"],a:2,x:'本题考查权责发生制。我国行政事业单位预算会计核算采用收付实现制，财务会计核算采用权责发生制，国务院另有规定的，依照其规定。'},
  {ch:24,q:'企业在取得各项财产时应当按照实际成本计算。其后，如果各项财产发生减值，应当按规定计算相应的减值准备。除法律法规和国家统一的会计制度另有规定外，企业一律不得自行调整其账面价值。这一会计确认和计量原则是（）。',o:["历史成本原则", "配比原则", "实质重于形式原则"],a:0,x:'本题考查历史成本原则。历史成本原则，又称实际成本原则或原始成本原则，是指企业各项财产，在取得时应当按照实际成本计量，其后，各项财产如果发生减值，应当按照规定计提相应的减值准备，除法律、行政法规和国家统一的会计制度另有规定外，企业一律不得自行调整其账面价值。'},
  {ch:24,q:'下列会计核算的基本前提中，界定会计核算内容空间范围的是（）。',o:["货币计价", "会计分期", "持续经营"],a:2,x:'本题考查会计的基本前提。会计主体规定了会计核算内容的空间范围。'},
  {ch:24,q:'下列法规制度中，属于会计法规的是（）。',o:["企业会计准则", "预算法", "税收征管法"],a:0,x:'本题考查会计法规。我国现行的会计法规以《会计法》为核心，以会计准则、财务规则和会计制度为主要内容。'},
  {ch:24,type:'multi',q:'会计的基本职能有（）。',o:["监督", "反映", "预算", "控制"],a:[0,3],x:'本题考查会计的基本职能。会计具有核算和监督两项基本职能，其中最基本的职能是核算职能。2023中级经济师《经济基础知识》练习题精选汇总'},
  {ch:0,q:'假设企业的应收账款账户期初余额为100万元，本期借方发生额为50万元，本期贷方发生额为80万元，则其期末余额为（）万元。',o:["100", "230", "70"],a:2,x:'本题考查会计记录。资产、费用、成本类账户：期末余额＝期初余额＋本期借方发生额－本期贷方发生额。应收账款属于资产，所以期末余额＝100＋50－80＝70（万元）。'},
  {ch:24,type:'multi',q:'我国企业对外提供的会计报表至少应当包括（）。',o:["现金流量表", "资产负债表", "会计报表附注", "利润表"],a:[0, 1, 3],x:'本题考查财务会计报告。我国企业对外提供的会计报表至少应当包括资产负债表、利润表、现金流量表等。'},
  {ch:24,q:'关于会计确认的说法，错误的是（）。',o:["会计确认时要明确某一经济业务涉及哪个会计要素的问题", "会计确认是指会计数据进入会计系统时确定如何进行记录的过程", "会计确认采用复式记账法"],a:2,x:'本题考查会计确认。会计确认是指会计数据进入会计系统时确定如何进行记录的过程，即将某一会计事项作为资产、负债、所有者权益、收入、费用或利润等会计要素正式列入会计报表的过程，选项B正确。会计确认是要明确某一经济业务涉及哪个会计要素的问题，选项A正确。权责发生制构成了确认收入和费用的基础，也进一步构成了资产和负债的确认基础，选项D正确。'},
  {ch:25,q:'资产按照购置资产时所付出的对价的公允价值计量，这种计量属性是（）。',o:["可变现净值", "现值", "历史成本"],a:2,x:'本题考查会计计量的属性。历史成本又称原始成本，是指以取得资产时实际发生的成本作为资产的入账价值。在历史成本计量下，资产按照购置时支付的现金或者现金等价物的金额，或者按照购置资产时所付出的对价的公允价值计量。'},
  {ch:24,q:'合并会计报表是指企业对外投资总额占被投资企业的资本总额（）以上的情况，将被投资企业和本企业视为一个整体，将其有关经济指标与本企业的数字合并而编制的合并报表。',o:["60%", "30%", "50%"],a:2,x:'本题考查财务会计报告。合并会计报表是指企业对外投资总额占被投资企业的资本总额50%以上的情况下，将被投资企业和本企业视为一个整体，将其有关经济指标与本企业的数字合并而编制的会计报表。它反映的是投资企业和被投资企业共同的财务状况和经营成果，一般只编制对外会计报表。'},
  {ch:25,q:'在公平交易时，熟悉情况的交易双方自愿进行资产交换或者债务清偿的金额称为（）。',o:["可变现净值", "现值", "价格"],a:2,x:'本题考查会计计量的属性。公允价值是指在公平交易中，熟悉情况的交易双方自愿进行资产交换或者债务清偿的金额。'},
  {ch:0,q:'收益性支出是在本期发生的只与本期收益有关的应当在本期已实现的收益中得到补偿的支出，计入当期损益，在（）中反映。',o:["利润表", "资产负债表", "现金流量表"],a:0,x:'本题考查划分收益性支出与资本性支出原则。收益性支出计入当期损益，在利润表中反映。2023中级经济师《经济基础知识》练习题精选汇总'},
  {ch:24,q:'关于会计凭证的说法，错误的是（）。',o:["会计凭证具有一定格式、用以记录经济业务", "会计凭证是记录经济业务、明确经济责任的书面证明", "填制和审核会计凭证是会计工作的开始"],a:2,x:'本题考查会计记录的方法。记账凭证是会计人员根据审核无误的原始凭证或汇总原始凭证，用来确定经济业务应借、应贷的会计科目和金额而填制的，作为登记账簿直接依据的会计凭证。'},
  {ch:24,type:'multi',q:'在编制财务会计报告之前，为了保证报告的数字真实可靠，应（）。',o:["做到账表相符", "做到账证相符", "做到账账相符", "进行财产清查"],a:[0,1,2,3],x:'本题考查会计记录的方法。会计报告是对账簿记录资料进行的再加工，在编制财务会计报告之前，为了保证报告的数字真实可靠，做到账证相符、账账相符、账实相符，必须进行财产清查。',flag:'答案存疑：编报前要求为账证/账账/账实相符，“账表相符”表述存疑，建议核实'},
  {ch:24,type:'multi',q:'会计工作是不断重复、循环进行的，会计信息生成的主要环节有（）。',o:["会计确认", "会计分析", "会计计量", "会计报告"],a:[0,2,3],x:'本题考查会计循环。会计的最终目的是向会计信息使用者提供有助于进行决策的信息，会计信息是通过确认、计量、记录和报告四个环节生成的。'},
  {ch:25,q:'企业重新取得与其所拥有的某项资产相同或与其功能相当的资产需要支付的现金或现金等价物称为（）。',o:["历史成本", "现值", "重置成本"],a:2,x:'本题考查会计计量的属性。重置成本是指企业重新取得与其所拥有的某项资产相同或与其功能相当的资产需要支付的现金或现金等价物。'},
  {ch:0,q:'适用于规模较小，经济业务量较少的单位的财务处理程序是（）。',o:["多栏式日记账账务处理程序", "科目汇总表账务处理程序", "记账凭证账务处理程序"],a:2,x:'本题考查账务处理程序。记账凭证账务处理程序简单明了，易于理解，总分类账可以较详细地反映经济业务的发生情况。其缺点是登记总分类账的工作量较大。该处理程序适用于规模较小、经济业务量较少的单位。'},
  {ch:24,q:'关于会计报表分类的说法，正确的是（）。',o:["按照会计报表反映经济内容的不同，分为反映财务状况的报表、反映经营成果的报表和反映现金流量的报表", "按照会计报表编制的时间范围不同，分为年度会计报表和月度会计报表", "按照会计报表编制主体不同，分为对外会计报表和对内会计报表"],a:0,x:'本题考查财务会计报告。按照会计报表反映经济内容的不同，分为反映财务状况的报表、反映经营成果的报表和反映现金流量的报表三类。按照会计报表报送对象的不同，分为对外会计报表和对内会计报表两类。按照会计报表编制主体的不同，分为个别会计报表和合并会计报表。按照会计报表编制的时间范围不同，分为年度会计报表、季度会计报表和月度会计报表三类。'},
  {ch:24,type:'multi',q:'关于会计账户的说法，正确的有（）。',o:["账户是对会计要素进行分类核算的工具", "账户设置一般以会计科目作为账户名称", "按照账户所反映的会计要素的具体内容进行分类，可以分为总分类账户和明细分类账户", "账户结构分为两个基本部分，即左方（记账符号为借）、右方（记账符号为贷）"],a:[0, 1, 3],x:'本题考查会计记录。账户可以按照不同的标准进行分类。按照账户所反映的会计要素的具体内容进行分类，可以分为资产类、负债类、所有者权益类、收入类、成本类、费用类和损益类。按照账户所提供信息的详细程度及其统驭关系，可以分为总分类账户和明细分类账户，选项C错误。资产、成本、费用类账户，借方登记增加额、贷方登记减少额；而负债、所有者权益、收入类账户，借方登记减少额、贷方登记增加额，选项E错误。2023中级经济师《经济基础知识》练习题精选汇总'},
  {ch:24,q:'企业在一定会计期间内有关现金和现金等价物的流入和流出的会计报表是（）。',o:["现金流量表", "所有者权益变动表", "利润表"],a:0,x:'本题考查现金流量表的概念。现金流量表是反映企业在一定会计期间内有关现金和现金等价物的流入和流出的报表。'},
  {ch:24,q:'编制会计报表的主要依据是（）。',o:["会计账簿", "原始凭证", "预算"],a:0,x:'本题考查会计报表的概念。会计报表是以日常账簿资料为主要依据编制的，总括反映企业财务状况、经营成果和现金流量等会计信息的书面文件。'},
  {ch:24,q:'关于会计报表的说法，错误的是（）。',o:["会计报表是包括反映企业财务状况、经营成果和现金流量等会计信息的书面文件", "会计报表是单位财务人员向管理层报告工作的书面文件", "会计报表是会计循环过程的终点"],a:1,x:'本题考查会计报表的概念。会计报表是以日常账簿资料为主要依据编制的，总括反映企业财务状况、经营成果和现金流量等会计信息的书面文件。它既是会计核算的最后一个环节，也是会计循环过程的终点。'},
  {ch:24,type:'multi',q:'企业编制会计报表的基本要素包括（）。',o:["公开透明", "便于理解", "全面完整", "真实可靠"],a:[0,1,2,3],x:'本题考查会计报表的编制要求。企业编制的会计报表应当真实可靠、全面完整、编报及时、便于理解。'},
  {ch:0,q:'借贷记账法的记账规则是（）。',o:["有收必有付，收付必相等", "有借必有贷，借贷必相等", "收支平衡，略有结余"],a:1,x:'本题考查借贷记账法。借贷记账法的记账规则是“有借必有贷，借贷必相等”。'},
  {ch:25,q:'关于账务处理程序的说法，错误的是（）。',o:["账务处理程序也称会计核算组织程序", "我国通常采用的主要账务处理程序中不含记账凭证账务处理程序", "会计账务处理程序有多种形式，可由各单位自主选用或设计"],a:1,x:'本题考查账务处理程序。目前，我国各经济单位通常采用的主要账务处理程序有五种：记账凭证账务处理程序、汇总记账凭证账务处理程序、科目汇总表账务处理程序、多栏式日记账账务处理程序和日记总账账务处理程序。'},
  {ch:25,q:'我国《企业会计准则第1号——存货》规定，存货在资产负债表日的计量基础为（）。',o:["现值", "成本与可变现净值孰低", "公允价值"],a:1,x:'本题考查会计计量的属性。我国《企业会计准则第1号——存货》中规定，资产负债表日，存货应当按照成本与可变现净值孰低计量，对可变现净值低于存货成本的差额，应当计提存货跌价准备，计入当期损益。更多推荐：2023中级经济师《经济基础知识》练习题精选汇总'},
  {ch:25,q:'编制资产负债表依据的会计等式是（）。',o:["资产＝收入－费用", "资产＝负债＋所有者权益", "资产＝投资＋利润"],a:1,x:'本题考查资产负债表的概念。资产负债表中包括的会计要素有资产、负债和所有者权益，三者的关系是资产＝负债＋所有者权益。'},
  {ch:25,type:'multi',q:'资产负债表的作用主要体现在（）。',o:["通过分析资产负债表可以了解企业的偿债能力和支付能力", "为报表使用者提供企业所拥有和控制的经济资源及其分布和构成情况的信息", "通过资产负债表可以了解企业利润的形成过程，评价企业的盈利能力", "通过前后期资产负债表的对比可以了解企业资金结构和财务状况的变化情况和趋势"],a:[0,1,3],x:'本题考查资产负债表的作用。编制资产负债表的作用主要体现在：（1）资产负债表为报表使用者提供企业所拥有和控制掌握的经济资源及其分布和构成情况的信息，为经营者分析资产分布是否合理提供依据。（2）资产负债表总括反映企业资金的来源渠道和构成情况。（3）通过对资产负债表的分析，可以了解企业的财务状况，判断企业的偿债能力和支付能力。（4）通过对前后期资产负债表的对比分析，可以了解企业资金结构的变化情况，经营者、投资者和债权人据此可以掌握企业财务状况的变化情况和变化趋势。'},
  {ch:25,q:'为了解企业的资产结构，需要查阅的会计报表是（）。',o:["资产负债表", "收入支出明细表", "利润表"],a:0,x:'本题考查资产负债表。资产负债表为报表使用者提供企业所拥有和控制掌握的经济资源及其分布和构成情况的信息，为经营者分析资产分布是否合理提供依据。'},
  {ch:0,q:'下列经济业务所产生的现金流量中，属于筹资活动产生的现金流量是（）。',o:["取得银行借款的现金", "支付经营租赁费用付出的现金", "取得投资收益收到的现金"],a:0,x:'本题考查现金流量表的编制。选项B属于经营活动产生的现金流量，选项CD属于投资活动产生的现金流量。'},
  {ch:25,q:'下列项目中，在资产负债表中根据总账科目余额直接填列的是（）。',o:["固定资产", "实收资本", "应收账款"],a:1,x:'本题考查资产负债表的编制方法。资产负债表的很多项目，如“短期借款”“应付职工薪酬”“应交税费”“实收资本”“资本公积”“盈余公积”等项目都是根据总账科目的期末余额直接填列。'},
  {ch:24,q:'下列工作中，属于会计报表编制前准备工作的是（）。',o:["绩效评价", "资产评估", "全面财产清查"],a:2,x:'本题考查会计报表编制前的准备工作。会计报表编制前的准备工作：全面财产清查、检查会计事项的处理结果。'},
  {ch:25,q:'下列资产项目中，流动性最强的是（）。',o:["长期股权投资", "无形资产", "原材料"],a:2,x:'本题考查资产负债表的格式和内容。资产负债表上，流动性强的项目排在前面，流动性差的项目排在后面，并按流动资产和非流动资产分项列示，流动资产在前。选项AB属于非流动资产。选项C属于存货，选项D属于其他货币资金，都是流动资产。流动资产在资产负债表上排列为：货币资金、应收票据及应收账款、预付款项、其他应收款、存货和待摊费用等。可见，流动性最强的是选项D。点击查看：2023中级经济师《经济基础知识》练习题精选汇总'},
  {ch:25,q:'下列资产负债表项目中，属于负债项目的是（）。',o:["预付款项", "应收账款", "持有待售负债"],a:2,x:'本题考查资产负债表中的流动负债。选项ABD都是资产类项目。'},
  {ch:25,type:'multi',q:'下列项目中，属于流动资产的有（）。',o:["预付款项", "存货", "应付职工薪酬", "货币资金"],a:[0,1,3],x:'本题考查资产负债表的格式和内容。流动资产在资产负债表上排列为：货币资金、应收票据及应收账款、预付款项、其他应收款、存货和待摊费用等。选项C属于流动负债。'},
  {ch:24,q:'反映企业在某一特定日期财务状况的会计报表是（）。',o:["利润表", "资产负债表", "现金流量表"],a:1,x:'本题考查资产负债表的概念。资产负债表是反映企业在某一特定日期财务状况的会计报表。'},
  {ch:25,q:'在资产负债表上，资产项目是按其流动性进行排列的，流动性强的项目排在前面，流动性差的项目排在后面。下列资产项目中，排在应收账款前面的是（）。',o:["货币资金", "固定资产", "长期股权投资"],a:0,x:'本题考查资产负债表中流动资产的排列顺序。在资产负债表上流动资产类的项目排列为：货币资金、应收票据及应收账款、预付款项、其他应收款、存货和待摊费用等。'},
  {ch:25,q:'我国企业的资产负债表中，资产类项目的排序规则是（）。',o:["按照资产的变现能力顺序由快到慢排列", "按照资产的变现能力顺序由慢到快排列", "按照资产的金额大小顺序由大到小排列"],a:0,x:'本题考查资产负债表的排序。资产类项目的排列顺序是按照其流动性进行排列的，即按照变现能力顺序进行排列。越排在前面，其变现速度越快。所以本题选A。'},
  {ch:25,q:'下列属于非流动负债项目的是（）。',o:["应交税费", "应付股利", "应付债券"],a:2,x:'本题考查资产负债表的格式和内容。流动负债包括短期借款、应付票据及应付账款、预收款项、应付职工薪酬、应交税费、应付股利、其他应付款、持有待售负债和一年内到期的非流动负债。非流动负债包括长期借款、应付债券、长期应付款和其他非流动负债等。更多推荐：2023中级经济师《经济基础知识》练习题精选汇总'},
  {ch:25,type:'multi',q:'编制资产负债表时，下列项目中应根据总账科目期末余额与其备抵科目抵消后的净额填列的有（）。',o:["持有待售资产", "应交税费", "在建工程", "无形资产"],a:[0,2,3],x:'本题考查资产负债表的编制方法。如固定资产、在建工程、无形资产、长期股权投资、其他应收款、持有待售资产等都是根据该账户期末余额与其备抵科目（减值准备）余额抵销后的金额填列。'},
  {ch:25,q:'某企业年末账户余额表中，“预收款项”贷方余额是3000元，“应收账款”贷方余额是2000元，那么在该企业年末资产负债表中“预收款项”项目应填列的金额为（）元。',o:["5000", "3000", "1000"],a:0,x:'本题考查资产负债表的编制方法。预收款项根据“预收款项”和“应收账款”账户所属明细账贷方余额之和填列，即3000＋2000＝5000（元）。'},
  {ch:25,type:'multi',q:'资产负债表上的“货币资金”项目，应根据（）科目的期末余额合计数填列。',o:["库存现金", "银行存款", "持有待售资产", "短期借款"],a:[0,1,3],x:'本题考查资产负债表的编制方法。资产负债表上的“货币资金”项目，应根据库存现金、银行存款、其他货币资金科目的期末余额合计数填列。'},
  {ch:25,q:'下列资产负债表各项目，可以根据有关总账科目余额直接填列的是（）。',o:["预收账款", "资本公积", "未分配利润"],a:1,x:'本题考查资产负债表的编制方法。资产负债表的许多项目，如“短期借款”“应付职工薪酬”“应交税费”“实收资本”“资本公积”“盈余公积”等项目都是根据总账科目的期末余额直接填列。'},
  {ch:25,q:'我国采用的资产负债表格式是（）。',o:["多步式", "单步式", "报告式"],a:2,x:'本题考查资产负债表的格式。资产负债表的格式有账户式和报告式两种。我国采用账户式资产负债表格式。'},
  {ch:25,q:'我国企业的资产负债表中，负债类项目的排序规则是（）。',o:["按照变现能力由快到慢排列", "按照到期日由近到远排列", "按照金额由大到小排列"],a:1,x:'本题考查资产负债表的格式和内容。负债类项目的排列是按照到期日的远近进行的，先到期的排在前面，后到期的排在后面。所以本题选B。更多推荐：2023中级经济师《经济基础知识》练习题精选汇总'},
  {ch:0,type:'multi',q:'影响存货周转率的因素包括（）。',o:["营业成本", "期末存货", "营业收入", "期初存货"],a:[0, 1, 3],x:'本题考查存货周转率。存货周转率是反映存货周转速度的比率，有两种表示方法：（1）周转次数：反映年度内存货平均周转的次数。存货周转次数＝营业成本÷平均存货平均存货＝（期初存货＋期末存货）÷2（2）存货周转天数：反映年度内存货平均周转一次所需要的天数。存货周转天数＝360÷存货周转次数＝平均存货×360÷营业成本'},
  {ch:25,type:'multi',q:'对财务报表进行比率分析时常用的财务比率包括（）。',o:["效率比率", "结构比率", "环比动态比率", "相关比率"],a:[0, 1, 3],x:'本题考查比率分析法。在比率分析中常用的财务比率有相关比率、结构比率和效率比率。'},
  {ch:0,q:'下列经济业务所产生的现金流量中，属于应列入现金“投资活动产生的现金流量”下的项目是（）。',o:["支付职工工资", "购买固定资产支付货款", "支付应交税费"],a:1,x:'本题考查现金流量表的编制方法。选项AC属于经营活动产生的现金流量；选项D属于筹资活动产生的现金流量；选项B属于投资活动产生的现金流量。'},
  {ch:25,q:'下列经济业务中，会导致企业现金流量表中现金流量发生变化的是（）。',o:["将现金存入银行", "以存货清偿债务", "以固定资产对外投资"],a:2,x:'本题考查现金流量表。用存货清偿债务、用固定资产对外投资，均属于非现金各项目之间的增减变动，不涉及现金的收支，不会使现金流量增加或减少。将现金存入银行属于现金各项目之间的变动，也不会使现金流量增加或减少。只有选项D会增加现金流量。'},
  {ch:0,q:'企业持有的期限短、流动性强、易于转换为已知金额的现金、价值变动风险很小的投资，称为（）。',o:["现金", "流动负债", "现金等价物"],a:2,x:'本题考查现金流量表。现金等价物是指企业持有的期限短、流动性强、易于转换为已知金额的现金、价值变动风险很小的投资。'},
  {ch:0,type:'multi',q:'下列经济活动中，会导致企业现金流入的有（）。',o:["购买原材料", "用固定资产对外投资", "对外投资", "收到银行贷款"],a:[2,3],x:'本题考查现金流量表的概念。现金流量是指一定会计期间企业现金和现金等价物流入和流出的数量。企业销售商品或提供劳务、出售固定资产、从银行取得借款等获得的现金，为现金流入；而企业购买原材料或接受劳务、购建固定资产、偿还银行借款等支出的现金，为现金流出。'},
  {ch:25,q:'下列资产负债表项目中，根据若干总账科目期末余额分析计算填列的是（）。',o:["应付职工薪酬", "短期借款", "货币资金"],a:2,x:'本题考查资产负债表的编制方法。根据若干总账科目期末余额分析计算填列的项目，如货币资金、未分配利润。更多推荐：2023中级经济师《经济基础知识》练习题精选汇总'},
  {ch:25,q:'某企业2017年12月31日资产负债表反映，实收资本10500万元，资本公积1000万元，盈余公积2000万元，未分配利润500万元；2018年12月31日资产负债表反映，该企业实收资本10500万元，资本公积1050万元，盈余公积2100万元，未分配利润770万元。则2018年该企业资本保值增值率为（）。',o:["103%", "101.11%", "154%"],a:0,x:'本题考查资本保值增值率的计算。资本保值增值率＝（期末所有者权益÷期初所有者权益）×100%＝（10500＋1050＋2100＋770）÷（10500＋1000＋2000＋500）×100%＝103%。'},
  {ch:0,q:'在计算应收账款周转天数时，应收账款平均余额（）。',o:["应当扣除坏账准备", "按期初应收账款金额计算", "不应当扣除坏账准备"],a:2,x:'本题考查营运能力分析指标。应收账款周转天数＝360／应收账款周转次数＝应收账款平均余额×360／营业收入净额，公式中的360为一年的法定天数。应收账款平均余额中不扣除坏账准备。'},
  {ch:25,q:'以下指标中，反映企业全部资产的使用效率的是（）。',o:["流动比率", "资产总额", "总资产周转率"],a:2,x:'本题考查营运能力分析指标。总资产周转率是企业营业收入净额与全部资产的平均余额的比率，反映企业全部资产的使用效率。'},
  {ch:0,type:'multi',q:'下列财务指标中，能够反映企业营运能力的有（）。',o:["市盈率", "总资产周转率", "存货周转率", "应收账款周转率"],a:[1, 2, 3],x:'本题考查营运能力分析指标。反映企业营运能力的指标包括：应收账款周转率、存货周转率、流动资产周转率、总资产周转率。选项A是反映企业盈利能力的指标。选项E是反映企业偿债能力的指标。'},
  {ch:25,q:'某公司没有优先股份，年报披露的普通股每股收益为0.48元，发行的总股数是2000万股，市盈率为25，则该公司当年实现的净利润为（）万元。',o:["80", "50000", "960"],a:2,x:'本题考查盈利能力分析。普通股每股收益＝（净利润－优先股股利）÷发行在外的普通股股数，因为没有优先股份，所以0.48＝净利润÷2000，即：净利润＝960（万元）。'},
  {ch:25,q:'甲公司2020年取得营业收入200万元，营业成本150万元，发生销售费用10万元，实现营业利润40万元，则该公司2020年的营业利润率为（）。',o:["75％", "26.67％", "20％"],a:2,x:'本题考查盈利能力分析。营业利润率＝（营业利润÷营业收入）×100％＝40÷200×100％＝20％。'},
  {ch:26,q:'下列财务比率指标中，能够反映企业营运能力的是（）。',o:["营业利润率", "流动比率", "存货周转率"],a:2,x:'本题考查营运能力分析。营运能力指标包括：应收账款周转率、存货周转率，流动资产周转率、总资产周转率。更多推荐：2023中级经济师《经济基础知识》练习题精选汇总'},
  {ch:24,q:'政府会计主体在预算年度内预算收入的确认时间一般是（）。',o:["实际收到的时间", "决算上报的时间", "预算上报的时间"],a:0,x:'本题考查政府会计。预算收入是指政府会计主体在预算年度内依法取得并纳入预算管理的现金流入。预算收入一般在实际收到时予以确认，以实际收到的金额计量。'},
  {ch:25,q:'下列会计科目中，应在政府资产负债表上列示的项目是（）。',o:["净资产", "预算收入", "事业收入"],a:0,x:'本题考查政府会计。政府财务会计要素包括资产、负债、净资产、收入和费用。资产、负债和净资产应当列入资产负债表，收入和费用应当列入收入费用表。'},
  {ch:24,q:'目前，我国政府财务会计实行的会计记账基础是（）。',o:["现金制", "永续盘存制", "权责发生制"],a:2,x:'本题考查政府会计。政府的财务会计提供与政府的财务状况、运行情况和现金流量等有关的信息，实行权责发生制。'},
  {ch:26,type:'multi',q:'下列财务分析指标中，用于分析企业偿债能力的有（）。',o:["资产负债率", "净资产收益率", "流动比率", "已获利息倍数"],a:[0,2,3],x:'本题考查偿债能力分析指标。反映企业偿债能力的财务比率指标主要有：流动比率、速动比率、现金比率、资产负债率、产权比率、已获利息倍数。'},
  {ch:26,q:'通常情况下，一个大型工业企业的流动比率，速动比率和现金比率的关系是（）。',o:["流动比率＜速动比率＜现金比率", "现金比率＞流动比率＞速动比率", "流动比率＞速动比率＞现金比率"],a:2,x:'本题考查偿债能力分析。流动比率＝流动资产/流动负债，一般维持在2：1左右。速动比率＝速动资产/流动负债，一般维持在1：1，现金比率＝现金/流动负债，因为流动资产＞速动资产＞现金的数量，所以应该选C。'},
  {ch:0,q:'资本收益率的计算公式为（）。',o:["净利润/资产平均总额×100%", "净利润/所有者权益平均余额×100%", "净利润/营业收入净额×100%"],a:2,x:'本题考查盈利能力分析指标。资本收益率＝[净利润／实收资本（或股本）]×100%。'},
  {ch:0,q:'超过（）的市盈率被认为是不正常的，很可能是股价下跌的前兆，风险很大。',o:["5", "10", "15"],a:2,x:'本题考查盈利能力分析指标。超过20的市盈率被认为是不正常的，很可能是股价下跌的前兆，风险很大。更多推荐：2023中级经济师《经济基础知识》练习题精选汇总'},
  {ch:24,q:'关于政府会计的说法正确的是（）。',o:["政府会计以货币为主要计量单位", "政府会计只包括预算会计", "预算会计实行权责发生制"],a:0,x:'本题考查政府会计的概念。选项B错误，政府会计由预算会计和财务会计构成。选项C错误，预算会计实行收付实现制。选项D错误，预算会计提供与政府预算执行有关的信息。'},
  {ch:24,type:'multi',q:'下列关于政府会计的说法，正确的有（）。',o:["报告政府公共财务资源管理的业绩及履行受托责任情况", "以货币为主要计量单位", "对各政府会计主体财政资金的活动过程和结果进行反映和监督", "确认、计量、记录政府管理国家公共事务和国家资源、国有资产的情况"],a:[0, 1, 2, 3],x:'本题考查政府会计的概念。政府会计是以货币为主要计量单位，对各政府会计主体财政资金的活动过程和结果进行全面、系统、连续的反映和监督，以确认、计量、记录政府管理国家公共事务和国家资源、国有资产的情况，报告政府公共财务资源管理的业绩及履行受托责任情况的专门会计。'},
  {ch:24,q:'报告期内导致政府会计主体净资产减少的、含有服务潜力或者经济利益的经济资源的流出称为（）。',o:["负债", "收入", "资产"],a:2,x:'本题考查政府财务会计要素。费用是指报告期内导致政府会计主体净资产减少的、含有服务潜力或者经济利益的经济资源的流出。'},
  {ch:0,type:'multi',q:'政府财务报告包括（）。',o:["政府预算报告", "政府综合财务报告", "政府决算报告", "政府决算报表"],a:[0,3],x:'本题考查政府会计。政府财务报告包括政府综合财务报告和政府部门财务报告。'},
  {ch:24,type:'multi',q:'下列机构中，属于政府会计主体的有（）。',o:["国有企业", "政党组织", "社会团体", "国家机关"],a:[0,1,2,3],x:'本题考查政府会计。政府会计主体是各级政府以及与本级政府财政部门直接或间接发生预算拨款关系的国家机关、军队、政党组织、社会团体、事业单位和其他单位。'},
  {ch:13,q:'下列会计要素中，属于政府预算会计要素的是（）。',o:["费用", "负债", "预算结余"],a:2,x:'本题考查政府会计。政府预算会计要素包括预算收入、预算支出和预算结余。'},
  {ch:24,q:'政府会计主体过去的经济业务或者事项形成的，由政府会计主体控制的，预期能够产生服务潜力或者带来经济利益流入的经济资源称为（）。',o:["政府资产", "政府负债", "政府收入"],a:0,x:'本题考查政府财务会计要素。政府财务会计要素包括资产、负债、净资产、收入和费用。其中，资产是指政府会计主体过去的经济业务或者事项形成的，由政府会计主体控制的，预期能够产生服务潜力或者带来经济利益流入的经济资源。更多推荐：2023中级经济师《经济基础知识》练习题精选汇总'},
  {ch:0,type:'multi',q:'下列关系中，属于宏观经济管理关系的有（）。',o:["产品质量管理关系", "货币政策关系", "消费者权益保护关系", "财政政策关系"],a:[0,2,3],x:'本题考查经济法。宏观经济管理关系综合运用各种手段，如发展计划、财政政策、货币政策、产业政策等，因而可以分化出各种具体的宏观经济管理关系，如计划关系、财政政策关系、货币政策关系、产业政策关系等。'},
  {ch:28,q:'社会保障法成为调整经济关系的辅助性法律部门，出现在（）。',o:["当代社会", "封建社会", "资本主义社会"],a:0,x:'本题考查法律对经济关系调整经历的三个阶段。进入当代社会，法律体系重新整合，民法、商法和经济法共同对经济关系进行调整，同时社会保障法，环境保护法等新兴法律部门也成为调整经济关系的辅助性法律部门。'},
  {ch:28,type:'multi',q:'经济法调整的市场管理关系包括（）。',o:["维护公平竞争关系", "财政政策关系", "消费者权益保护关系", "产品质量管理关系"],a:[0, 2, 3],x:'本题考查经济法的调整对象。市场管理关系是指国家在市场管理过程中所形成的一种社会关系，市场管理关系由经济法调整。市场管理关系具体包括：①维护公平竞争关系；②产品质量管理关系；③消费者权益保护关系。'},
  {ch:28,q:'调整无形的智力成果的支配关系的法律制度是（）。',o:["知识产权法", "数据安全法", "电子商务法"],a:0,x:'本题考查调整社会主义市场经济的法律体系。人对财产的支配关系，在法律上就表现为物权法律制度。知识产权法律制度作为调整无形的智力成果的支配关系的法律制度，也属于调整财产支配关系的范围。'},
  {ch:28,type:'multi',q:'经济法调整的组织管理性的流转和协作关系包括（）。',o:["产业政策关系", "财政政策关系", "产品质量管理关系", "平等的国家机关或财政主体之间的经济协作关系"],a:[2,3],x:'本题考查经济法。组织管理性的流转和协作关系主要有以下两种表现形式：①国家通过政府机构或设立企业、委托代理人直接参与经济活动或经济关系，如进行招标、订（购）货、发包、出让、信贷、担保等活动时发生的合同关系；②平等的国家机关或财政主体之间的经济协作关系。'},
  {ch:28,type:'multi',q:'通过调整各种社会物质财富的归属和利用关系，直接影响社会生产过程和社会经济结构的法律制度包括（）。',o:["公司法律制度", "物权法律制度", "民事法律制度", "债权法律制度"],a:[0,3],x:'本题考查民商法。物权法律制度和知识产权法律制度通过调整各种社会物质财富的归属和利用关系，直接影响社会生产的过程和社会经济的结构。'},
  {ch:24,q:'政府的财务会计提供与政府的财务状况、运行情况和现金流量等有关的信息，实行（）。',o:["收付实现制", "实地盘存制", "永续盘存制"],a:2,x:'本题考查政府会计的概念。政府的财务会计提供与政府的财务状况、运行情况和现金流量等有关的信息，实行权责发生制。更多推荐：2023中级经济师《经济基础知识》练习题精选汇总'},
  {ch:28,q:'国家在市场管理过程中所形成的社会关系是（），它由经济法调整。',o:["民事法律关系", "经济管理关系", "市场管理关系"],a:2,x:'本题考查市场管理关系的概念。市场管理关系是国家在市场管理过程中所形成的社会关系，它由经济法调整。'},
  {ch:28,type:'multi',q:'在经济法调整对象中，对宏观经济管理关系的说法正确的有（）。',o:["它是一种行政关系", "它是一种经济关系", "它以市场经济体制为基础", "它综合运用各种手段"],a:[1,2,3],x:'本题考查经济管理关系。宏观经济管理关系是一种经济关系而不是行政关系。选项A说法有误。',flag:'源站答案疑似错误：宏观经济管理关系是经济关系而非行政关系，A项错；正确为BCD'},
  {ch:28,type:'multi',q:'在经济法调整对象中，市场管理关系的内容包括（）。',o:["合同法律关系", "维护公平竞争关系", "消费者权益保护关系", "物权法律关系"],a:[0,1,3],x:'本题考查经济法调整对象中的市场管理关系。市场管理关系具体包括：维护公平竞争关系；产品质量管理关系；消费者权益保护关系。'},
  {ch:28,q:'以国家对市场经济进行宏观调控所形成的法律关系为调整对象的法律是（）。',o:["经济法", "民法", "商法"],a:0,x:'本题考查经济法。经济法的调整对象主要是以国家对市场经济进行宏观调控所形成的法律关系。'},
  {ch:28,type:'multi',q:'市场管理关系是经济法的调整对象，具体包括（）。',o:["经济协作关系", "消费者权益保护关系", "产品质量管理关系", "合同法律关系"],a:[0,1,3],x:'本题考查经济法。市场管理关系具体包括以下方面：①维护公平竞争关系；②产品质量管理关系；③消费者权益保护关系。'},
  {ch:28,type:'multi',q:'民法借助（）制度为市场主体善意行使权利和履行义务提供保障。',o:["违约责任", "市场管理", "经济管理", "侵权责任"],a:[0, 3],x:'本题考查民商法。民法借助违约责任、侵权责任制度为市场主体善意行使权利和履行义务提供保障。更多推荐：2023中级经济师《经济基础知识》练习题精选汇总'},
  {ch:29,q:'关于宅基地使用权的说法，错误的是（）。',o:["国家和集体在必要的时候，可以依法收回宅基地的使用权", "宅基地使用权属于一种用益物权", "宅基地使用权的主体主要为农村集体经济组织的成员"],a:2,x:'本题考查宅基地使用权。宅基地使用权属于一种用益物权，宅基地的所有权依然属于集体所有。宅基地使用权人不能因为对宅基地的占有和使用而取得该宅基地的所有权，国家和集体在必要的时候，可以依法收回宅基地的使用权。'},
  {ch:28,q:'甲盖房时误将乙的铝合金门框错拿并安装在自家房屋中。根据所有权取得理论，甲取得该铝合金门框所有权的法律依据是（）。',o:["先占", "混合", "加工"],a:2,x:'本题考查所有权的取得与消灭。附合是指不同所有人的财产互相结合而形成新的财产，虽然该新财产未达到混合的程度，但非经拆毁不能恢复到原来的状态。'},
  {ch:0,type:'multi',q:'关于居住权的说法，正确的有（）。',o:["居住权自登记时设立", "设立居住权，可以根据遗嘱或者遗赠，也可以按照合同约定", "居住权属于用益物权", "居住权不得继承"],a:[0, 1, 2, 3],x:'本题考查居住权。居住权是用益物权的一种，指对他人所有的住房及其附属设施占有、使用的权利。设立居住权，可以根据遗嘱或者遗赠，也可以按照合同约定。居住权无偿设立，但是当事人另有约定的除外。设立居住权的，应当向登记机构申请居住权登记。居住权自登记时设立。居住权不得转让、继承。'},
  {ch:29,q:'不动产物权消灭时进行的登记称为（）。',o:["更正登记", "变更登记", "异议登记"],a:2,x:'本题考查不动产登记的类型。注销登记是指不动产物权消灭时所进行的登记。例如，地役权解除时进行的注销登记。'},
  {ch:28,q:'根据民法典，建筑物区分所有权属于（）。',o:["自物权", "他物权", "担保物权"],a:0,x:'本题考查物权的种类。自物权，即权利人对自己所有的标的物依法进行全面支配的物权。“全面支配”意味着支配范围的全面性和支配时间的无限性。只有所有权符合这一特征，故自物权即所有权，它是物权中最完整、最充分的权利。'},
  {ch:28,q:'《中华人民共和国民法典》第405条规定：“抵押权设立前，抵押财产已经出租并转移占有的，原租赁关系不受该抵押权的影响”，该规定体现出（）。',o:["债权平等", "一物不容二主", "物权优先"],a:2,x:'本题考查物权的特征。抵押权设立前，抵押财产已经出租并转移占有的，原租赁关系不受该抵押权的影响。此为“买卖不破租赁”原则。买卖不破租赁是指租赁物交付后的租赁权不因租赁物所有权的移转或其他物权的设定而受到影响。'},
  {ch:29,q:'关于所有权的说法，错误的是（）。',o:["所有权不允许任何人妨害，即在法律上不会受到任何的限制", "所有权内容的核心是处分权", "所有权包括占有、使用、收益和处分四项权能"],a:0,x:'本题考查所有权的概念和法律特征。所有权指所有人对自己的不动产或者动产依法享有的占有、使用、收益和处分的权利，选项C正确。处分权是所有权内容的核心，是拥有所有权的根本标志，选项B正确。所有权是一种独占的支配权，所有人对其财产享有的所有权，可以依法排斥他人的非法干涉，不允许其他任何人加以妨碍或者侵害，并不是在法律上不会受到任何的限制，选项A错误。所有人对所有物享有占有、使用、收益和处分的完整权利，是最完整、全面的一种物权形式，选项D正确。更多推荐：2023中级经济师《经济基础知识》练习题精选汇总'},
  {ch:0,q:'甲向乙借8万元，以自己所有的一个清代青花瓷花瓶交给乙作保。借款期限届满甲未还钱，乙多次交涉无果后将青花瓷瓶变卖，卖得12万元，还给甲4万元，则乙行使的权利是（）。',o:["动产质权", "抵押权", "留置权"],a:0,x:'本题考查质权。青花瓷瓶是动产，已经交付给债权人乙，债务人不履行债务时，债权人享有就“青花瓷瓶”的价值优先受偿的权利，即动产质权。'},
  {ch:29,type:'multi',q:'关于物权的客体"物"的说法，正确的有（）。',o:["物必须是独立物", "物只能独立于人身之外", "物在特殊情形下也可指行为", "物必须是有体物"],a:[0,1,3],x:'本题考查物权的概念和特征。物权的标的在范围上是十分广泛的，但都必须是特定物。作为物权客体的物必须是独立物和有体物，而不可能是行为。此外，物权只能以独立于人身之外的物作为客体。'},
  {ch:0,type:'multi',q:'孳息分为天然孳息和法定孳息，下列孳息中，属于法定孳息的有（）。',o:["果树上采摘下的苹果", "存款获得的利息", "母牛生下的小牛", "羊身上剪掉的羊毛"],a:[0,3],x:'本题考查所有权的取得。法定孳息指因法律关系所获得的收益，如存款取得的利息，出租人根据租赁合同收取的租金等。选项ACD属于天然孳息。'},
  {ch:0,type:'multi',q:'关于土地承包经营权的说法，正确的有（）。',o:["土地承包经营权的主体是公民或集体组织", "土地承包经营权具有一般物权具有的优先效力", "土地承包经营权不具有追及效力", "土地承包经营合同是确认土地承包经营权的主要依据"],a:[0,1,3],x:'本题考查用益物权。土地承包经营权具有以下法律特征：①承包经营合同是确认土地承包经营权的主要依据。②土地承包经营权的主体是公民或集体组织。③土地承包经营权的客体为全民所有的土地和集体所有的土地。④土地承包经营权属于一种新型的用益物权。土地承包经营权具有一般物权所具有的优先权、追及权等效力。选项C说法错误。'},
  {ch:0,q:'村民韩某盖房挖地基时挖出一大坛银元，坛内还有一块木牌，上写“为防日寇搜查，特埋于此。王天民”。经查，王天民是同村村民王某的爷爷，抗战期间王天民的家人除王某一人在姨娘家躲过此难之外，其他人都被日寇杀害。此银元应（）。',o:["归王某所有", "归韩某所有", "属无主财产，应归国家所有"],a:0,x:'本题考查所有权的取得。遗失物自发布招领公告之日起一年内无人认领的，归国家所有。拾得漂流物、发现埋藏物或者隐藏物的，参照适用拾得遗失物的有关规定。此题中埋藏物所有者明确，应归其所有者的家人所有。'},
  {ch:0,q:'关于居住权的设立，说法错误的是（）。',o:["居住权不可以转让、继承", "居住权无偿设立，但是当事人另有约定的除外", "设立居住权的，应当向登记机构申请居住权登记，居住权自居住之日起设立"],a:2,x:'本题考查居住权。设立居住权的，应当向登记机构申请居住权登记。居住权自登记时设立，选项C错误。'},
  {ch:28,type:'multi',q:'根据《民法典》的规定，下列关于居住权的说法正确的有（）。',o:["居住权是对他人所有的住房及其附属设施占有、使用的权利", "设立居住权的，应当向登记机构申请居住权登记", "居住权自登记时设立", "居住权可以转让、继承"],a:[0,1,2,3],x:'本题考查居住权。居住权是用益物权的一种，指对他人所有的住房及其附属设施占有、使用的权利。设立居住权的，应当向登记机构申请居住权登记。居住权自登记时设立。居住权不得转让、继承。居住权期限届满或者居住权人死亡的，居住权消灭。更多推荐：2023中级经济师《经济基础知识》练习题精选汇总'},
  {ch:30,type:'multi',q:'某游戏公司与某科技公司签订一份软件开发合同，约定由科技公司为其开发一款APP，验收合格后再付款，科技公司按时提供服务。游戏公司验收时发现该APP软件大量抄袭市面上已在用的某款游戏APP的内容，对此，该游戏公司可以行使的权利有（）。',o:["合同解除权", "违约责任请求权", "同时履行抗辩权", "先履行抗辩权"],a:[0, 1, 3],x:'本题考查合同的履行。双方约定游戏公司验收合格后再付款，故科技公司为先履行义务人，游戏公司为后履行义务人。先履行抗辩权是指在双务合同中履行义务顺序在后的一方当事人，在履行义务顺序在先的一方当事人没有履行或不适当履行义务时，拒绝先履行一方请求其履行义务的权利，本题中“游戏公司验收时发现该APP软件大量抄袭市面上已在用的某款游戏APP的内容”，故游戏公司可行使先履行抗辩权。同时由于科技公司提供的服务不符合要求，故游戏公司可以行使合同解除权和违约责任请求权。'},
  {ch:30,q:'合同终止的最正常和最主要的形式是（）。',o:["混同", "提存", "抵消"],a:2,x:'本题考查合同的终止。合同的履行是合同终止的最正常和最主要的形式。'},
  {ch:30,q:'合同订立过程中，关于承诺的说法，错误的是（）。',o:["承诺的内容必须与要约的内容一致", "承诺必须在有效期限内作出", "要约以对话方式作出的，应当即时作出承诺"],a:2,x:'本题考查合同的订立。承诺只能撤回，不能撤销。'},
  {ch:29,type:'multi',q:'下列权利中，属于担保物权的有（）。',o:["抵押权", "留置权", "地役权", "建设用地使用权"],a:[0, 1],x:'本题考查担保物权。几种主要的担保物权：抵押权、质权、留置权。'},
  {ch:0,q:'关于质权的说法，错误的是（）。',o:["质权设定必须转移占有", "质权具有从属性", "质权既可以适用于动产也可适用于不动产"],a:2,x:'本题考查质权。选项C错误，质权的标的主要为动产或权利，不包括不动产。'},
  {ch:30,q:'甲与乙订立合同约定，为满足甲的住房观景需要，甲向乙支付10万元，乙在5年内不得在自有土地上建造8米以上建筑。甲对乙享有的这项权利是（）。',o:["地役权", "建设用地使用权", "担保权"],a:0,x:'本题考查用益物权。地役权是指按照合同约定利用他人的不动产，以提高自己不动产效益的权利。需要利用他人土地才能发挥效用的土地，称为需役地；提供给他人使用的土地，称为供役地。'},
  {ch:29,type:'multi',q:'下列物权中，以占有为权利象征的有（）。',o:["留置权", "动产质权", "动产所有权", "不动产所有权"],a:[0, 1, 2],x:'本题考查物权的特征。动产所有权以动产的占有为权利象征，动产质权、留置权也以占有为权利象征；不动产则以登记为权利象征。更多推荐：2023中级经济师《经济基础知识》练习题精选汇总'},
  {ch:30,q:'有名合同和无名合同的主要区别是（）。',o:["合同是否具有法律规定的名称", "合同的成立是否要求具备特定形式", "合同当事人各方承担权利义务的方式不同"],a:0,x:'本题考查合同的分类。根据法律上是否规定一定的名称，可以将合同分为有名合同和无名合同。'},
  {ch:30,q:'债权与债务同归于一人而使合同关系终止的事实是（）。',o:["抵销", "提存", "混同"],a:2,x:'本题考查合同的终止。混同是指债权与债务同归于一人而使合同关系终止的事实。混同以债权与债务归于一人而成立，与人的意志无关，因而属于事件的范畴。'},
  {ch:30,q:'甲公司与乙公司签订买卖合同，约定由甲公司在签约后一个月内支付货款，乙公司在甲支付货款后再交付货物。甲公司支付货款前3天，发现乙公司因一批货物存在严重不良隐患被曝光，因此甲公司可以实施（）。',o:["同时履行抗辩权", "不安抗辩权", "先履行抗辩权"],a:1,x:'本题考查合同的履行。不安抗辩权是指在双务合同中有先给付义务的当事人，在有证据证明后给付人具有丧失或者可能丧失履行债务能力的情况时，可以中止自己先给付义务的履行。'},
  {ch:0,type:'multi',q:'关于约定解除与协议解除的说法，正确的有（）。',o:["约定解除属于事先的约定，而协议解除属于事后的约定", "当事人约定解除权的，一定会产生解除合同的后果", "约定解除权的行使是一种单方行为，协议解除是一种双方行为", "协议解除合同是通过建立一个新合同解除旧合同"],a:[0,2,3],x:'本题考查合同的解除。约定解除属于事先的约定，协议解除属于事后的约定，选项A正确。当事人约定解除权的，并不一定会产生解除合同的后果，只有在条件成就时，当事人依据事先的约定，行使解除权而解除合同，选项B错误。协议解除是指经当事人双方意思表示一致而解除合同的行为。经协议解除合同的，实际就是通过订立一个新的合同来解除原来的合同。约定解除是基于当事人行使解除权而解除合同，而解除权的行使是一种单方行为。选项CDE正确。'},
  {ch:30,q:'A公司向B公司出售货物，双方约定送货上门。A公司的法定代表人甲委托快递公司进行运输，快递员乙在送货途中发生交通事故，导致货物不能按期交付给B公司，B公司应当向（）主张违约责任。',o:["甲", "乙", "快递公司"],a:2,x:'本题考查违约责任。我国《民法典》第523条规定：当事人约定由第三人向债权人履行债务的，第三人不履行债务或者履行债务不符合约定，债务人应当向债权人承担违约责任。违约责任只在合同关系的当事人之间产生，尽管约定了合同以外的第三人可以作为合同履行的主体，但是由于该第三人不是合同的当事人，所以违约责任还是由债务人承担。更多推荐：2023中级经济师《经济基础知识》练习题精选汇总'},
  {ch:28,q:'根据我国《民法典》的规定：当事人约定由第三人向债权人履行债务的，第三人不履行债务或者履行债务不符合约定，（）应当承担违约责任。',o:["债务人", "债权人", "该第三人"],a:0,x:'本题考查违约责任。我国《民法典》第523条规定：当事人约定由第三人向债权人履行债务的，第三人不履行债务或者履行债务不符合约定，债务人应当向债权人承担违约责任。违约责任只在合同关系的当事人之间产生，尽管约定了合同以外的第三人可以作为合同履行的主体，但是由于该第三人不是合同的当事人，所以违约责任还是由债务人承担。'},
  {ch:30,q:'在合同履行期限届满之前，当事人一方明确表示或者以自己的行为表明不履行合同义务的行为称为（）。',o:["实际违约", "预期违约", "不可抗力"],a:1,x:'本题考查预期违约的概念。预期违约即在合同有效成立后履行期限届满前的违约行为。'},
  {ch:30,q:'甲与乙签订了一份电脑买卖合同，甲为卖方，乙为买方。合同约定：甲将电脑发货给丙。因为乙与丙也签订了一份电脑买卖合同，乙为卖方，丙为买方。现因为甲发给丙的电脑存在质量问题，引发纠纷。丙应向（）追究违约责任。',o:["乙", "甲或乙", "甲"],a:0,x:'本题考查违约责任。当事人约定由第三人向债权人履行债务的，第三人不履行债务或者履行债务不符合约定，债务人应当向债权人承担违约责任。由此可见，甲履行债务不符合约定，应当由乙对丙承担违约责任。乙再向甲追究违约责任。'},
  {ch:30,type:'multi',q:'关于不可抗力的说法，正确的有（）。',o:["不可抗力只要发生就构成违约的免责事由", "不可抗力包括客观情况和主观情况", "不可抗力属于事件的范畴", "不可抗力具有不可预测性"],a:[1,2,3],x:'本题考查违约责任。不可抗力是指不能预见、不能避免并不能克服的客观情况。不可抗力仅指客观情况，属于事件范畴，并不包括民事主体行为。并不是所有不可抗力的发生都能构成违约的免责事由。只有当不可抗力发生在合同履行期内，才能构成免责事由。'},
  {ch:30,type:'multi',q:'关于合同权利转让的说法，正确的有（）。',o:["所转让的权利应具有可转让性", "合同权利的转让应当通知债务人", "合同权利的转让会导致合同当事人的变化，也会导致合同所约定的权利发生改变", "合同权利的全部或部分转让必须经过原债务人同意"],a:[0,1,3],x:'本题考查合同的转让。合同的转让只是发生合同当事人的变化，合同所约定的权利义务并不发生改变，选项C错误。合同权利的转让与受让发生在债权人和第三人之间，转让本身并不需要债务人的同意，只需要通知债务人，选项D错误。'},
  {ch:30,q:'重大误解的当事人自知道或者应当知道撤销事由之日起（）内没有行使撤销权，撤销权消灭。',o:["90日", "1年", "2年"],a:0,x:'本题考查可撤销合同。重大误解的当事人自知道或者应当知道撤销事由之日起90日内没有行使撤销权，撤销权消灭。'},
  {ch:30,type:'multi',q:'一般保证的保证人在主合同纠纷未经审判或者仲裁，并就债务人财产依法强制执行仍不能履行债务前，有权拒绝向债权人承担保证责任，但是有下列（）情形之一的除外。',o:["债务人不履行到期债务", "债务人下落不明，且无财产可供执行", "人民法院已经受理债务人破产案件", "保证人书面表示放弃本款规定的权利"],a:[0,1,2,3],x:'本题考查保证方式。一般保证的保证人在主合同纠纷未经审判或者仲裁，并就债务人财产依法强制执行仍不能履行债务前，有权拒绝向债权人承担保证责任，但是有下列情形之一的除外：（1）债务人下落不明，且无财产可供执行；（2）人民法院已经受理债务人破产案件；（3）债权人有证据证明债务人的财产不足以履行全部债务或者丧失履行债务能力；（4）保证人书面表示放弃本款规定的权利。更多推荐：2023中级经济师《经济基础知识》练习题精选汇总'},
  {ch:30,type:'multi',q:'下列合同中，属于诺成合同的有（）。',o:["买卖合同", "租赁合同", "保管合同", "借用合同"],a:[0,1,3],x:'本题考查合同的分类。选项CD属于实践合同。'},
  {ch:30,type:'multi',q:'合同可分为诺成合同和实践合同。下列合同中，属于实践合同的有（）。',o:["信用合同", "保管合同", "租赁合同", "买卖合同"],a:[0,3],x:'本题考查合同的分类。实践合同是指除了当事人双方意思表示一致以外，还需要有一方当事人实际交付标的物的行为才能成立的合同，所以实践合同也称要物合同。保管合同、借用合同、定金合同等都属于实践合同。'},
  {ch:30,type:'multi',q:'下列属于承担违约责任方式的有（）。',o:["继续履行", "支付定金", "支付违约金", "违约损害赔偿"],a:[0, 2, 3],x:'本题考查承担违约责任的方式。承担违约责任的方式包括继续履行、支付违约金和违约损害赔偿。'},
  {ch:30,q:'违约责任的首要条件是（）。',o:["违约动机", "违约表现", "违约行为"],a:2,x:'本题考查违约责任的构成条件。违约行为是违约责任的首要条件。'},
  {ch:30,q:'承担违约责任的方式不包括（）。',o:["继续履行", "停止侵害", "支付违约金"],a:1,x:'本题考查承担违约责任方式的有关知识。承担违约责任的方式包括继续履行、支付违约金和违约损害赔偿。'},
  {ch:30,type:'multi',q:'合同中的下列情形中不能免责的有（）。',o:["受害人的过错造成财产损失的", "因故意造成对方财产损失的", "因不可抗力造成对方财产损失的", "造成对方人身伤害的"],a:[0,2,3],x:'本题考查免责条款。违约的免责事由包括不可抗力和受害人的过错。但是出现造成对方人身伤害的，以及因故意或重大过失造成对方财产损失的，免责条款无效'},
  {ch:31,type:'multi',q:'下列事务中，属于公司清算组的职权范围的有（）。',o:["清理债权、债务", "代表公司参与民事诉讼活动", "处理与清算有关的公司未了结的业务", "代表公司对外进行清算之外的经营活动"],a:[0,1,2,3],x:'本题考查清算组的职权。清算组在清算期间行使下列职权：①清理公司财产，分别编制资产负债表和财产清单；②通知、公告债权人；③处理与清算有关的公司未了结的业务；④清缴所欠税款以及清算过程中产生的税款；⑤清理债权、债务；⑥处理公司清偿债务后的剩余财产；⑦代表公司参与民事诉讼活动。'},
  {ch:31,q:'根据《中华人民共和国公司法》，公司经营管理发生严重困难，继续存续会使股东利益受到重大损失，通过其他途径不能解决的，持有公司全部股东表决权（）以上的股东，可以请求人民法院解散公司。',o:["60%", "10%", "25%"],a:1,x:'本题考查股东权利。公司经营管理发生严重困难，继续存续会使股东利益受到重大损失，通过其他途径不能解决的，持有公司全部股东表决权10%以上的股东，可以请求人民法院解散公司。'},
  {ch:31,q:'公司发行股票时，其发行价格（）票面金额。',o:["不得等于", "不得超过", "只能等于"],a:2,x:'本题考查股票发行与回购。股票发行价格可以按票面金额，也可以超过票面金额，但不得低于票面金额。'},
  {ch:31,q:'有限责任公司的首次股东会会议的召集人是（）。',o:["董事长", "出资最多的股东", "公司发起人"],a:1,x:'本题考查公司的组织机构。有限责任公司首次股东会会议由出资最多的股东召集和主持。'},
  {ch:0,type:'multi',q:'企业应当按规定期限通过企业信用信息公示系统公示有关企业信息，下列属于企业应公示的信息有（）。',o:["有限责任公司股东股权转让等股权变更信息", "企业投资设立企业、购买股权信息", "企业通讯地址、邮政编码、联系电话、电子邮箱等信息", "企业从业人数、资产总额、负债总额、对外提供保证担保等信息"],a:[0,1,2,3],x:'本题考查企业信息公示。选项D是由企业选择是否向社会公示的信息。具体包括企业从业人数、资产总额、负债总额、对外提供保证担保、所有者权益合计、营业总收入、主营业务收入、利润总额、净利润、纳税总额信息。'},
  {ch:31,q:'设立有限责任公司应当具备的条件不包括（）。',o:["股东人数在200人以下", "公司有名称", "公司有住所"],a:0,x:'本题考查公司设立的条件。设立有限责任公司，应当具备下列条件：（1）股东符合法定人数。有限责任公司由50个以下股东出资设立。（2）股东出资及公司资本方面的要求。（3）股东共同制定公司章程。（4）有公司名称，建立符合有限责任公司要求的组织机构。（5）有公司住所。'},
  {ch:31,q:'某股份有限公司董事会由11名董事组成，根据我国公司法，该公司董事会的利润分配决议必须至少由（）名董事通过才能生效。',o:["8", "7", "6"],a:2,x:'本题考查董事会。董事会作出决议，必须经全体董事的过半数通过'},
  {ch:31,type:'multi',q:'关于募集设立的股份有限公司的资本制度的说法，正确的有（）。',o:["注册资本为公司登记机关登记的认购股本总额", "发起人认购的股份不得少于公司股份总数的40%", "发起人认购的股份不得少于公司股份总教的35%", "全体股东应当在公司成立后2年内缴清认缴的出资"],a:[1,3],x:'本题考查公司设立的条件。股份有限公司采取募集方式设立的，注册资本为在公司登记机关登记的实收股本总额。以募集设立方式设立股份有限公司的，发起人认购的股份不得少于公司股份总数的35%；但是，法律、行政法规另有规定的，从其规定。'},
  {ch:31,type:'multi',q:'根据《中华人民共和国公司法》，对公司负有法定的忠实义务和勤勉义务的有（）。',o:["董事", "股东", "监事", "员工"],a:[0,2,3],x:'本题考查董事、监事和高级管理人员的法定义务。公司的董事、监事和高级管理人员应当遵守法律、行政法规和公司章程，对公司负有忠实义务和勤勉义务。'},
  {ch:31,q:'甲和乙设立有限责任公司。关于该有限责任公司设立的说法，错误的是（）。',o:["在不违反法律法规的前提下，该公司可以使用乙的姓名作为公司名称", "该公司的注册资本可约定为20万元人民币", "甲和乙签订的设立公司的相关协议可以代替公司的章程"],a:2,x:'本题考查公司设立的条件。有限责任公司是由股东共同制定公司章程。设立公司必须依法制定公司章程。公司章程对公司、股东、董事监事、高级管理人员具有约束力。股东应当在公司章程上签名、盖章。故C错误。'},
  {ch:31,q:'股份有限公司的发起人持有的本公司股份，自公司成立之日起（）内不得转让。',o:["2年", "1年", "3年"],a:1,x:'本题考查股权转让权。发起人持有的本公司股份，自公司成立之日起1年内不得转让。'},
  {ch:31,q:'国有独资公司监事会成员不得少于（）人。',o:["5", "2", "3"],a:0,x:'本题考查国有独资公司的特别规定。国有独资公司监事会成员不得少于5人，其中职工代表的比例不得低于1/3，具体比例由公司章程规定。'},
  {ch:31,type:'multi',q:'下列人员中，可以担任公司法定代表人的有（）。',o:["总经理", "监事", "执行董事", "董事长"],a:[0, 2, 3],x:'本题考查公司的登记事项。公司法定代表人依照公司章程的规定，由董事长、执行董事或者经理担任，并依法登记。'},
  {ch:31,q:'国有独资公司不设股东会，行使股东会职权的是（）。',o:["国有资产监督管理机构", "监事会", "职工代表大会"],a:0,x:'本题考查国有独资公司的特别规定。国有独资公司不设股东会，由国有资产监督管理机构行使股东会职权。国有资产监督管理机构可以授权公司董事会行使股东会的部分职权，决定公司的重大事项，但公司的合并、分立、解散、增加或者减少注册资本和发行公司债券，必须由国有资产监督管理机构决定'},
  {ch:31,q:'下列公司中，必须设立独立董事的是（）。',o:["有限责任公司", "上市公司", "国有独资公司"],a:1,x:'本题考查上市公司的特别规定。上市公司设独立董事。上市公司独立董事是指不在公司担任除董事外的其他职务，并与其所受聘的上市公司及其主要股东不存在可能妨碍其进行独立客观判断的关系的董事。'},
  {ch:31,q:'根据《中华人民共和国公司法》，公司是指依照法定的条件与程序设立、以营利为目的、股东以其出资额为限对公司承担责任、公司以其全部资产为限对外承担民事责任的具备法人资格的（）。',o:["单位", "经济组织", "特别法人"],a:1,x:'本题考查公司的概念。公司是依照法定的条件和程序设立，以营利为目的，股东对公司债务承担有限责任的法人组织。'},
  {ch:31,q:'根据《公司法》属于有限责任公司董事会职权的是（）。',o:["对公司增加或减少注册资本作出决议", "聘任或解聘公司经理", "对发行公司债券作出决议"],a:1,x:'本题考查董事会的职权。有限责任公司、股份有限公司的董事会对股东（大）会负责，行使下列职权：①召集股东会会议，并向股东会报告工作；②执行股东会的决议；③决定公司的经营计划和投资方案；④制定公司的年度财务预算方案、决算方案；⑤制定公司的利润分配方案和弥补亏损方案；⑥制定公司增加或者减少注册资本以及发行公司债券的方案；⑦制定公司合并、分立、解散或者变更公司形式的方案；⑧决定公司内部管理机构的设置；⑨决定聘任或者解聘公司经理及其报酬事项，并根据经理的提名决定聘任或者解聘公司副经理、财务负责人及其报酬事项；制定公司的基本管理制度；⑩公司章程规定的其他职权。选项ACD属于股东（大）会的职权。'},
  {ch:31,q:'公司为减少注册资本而收购本公司股份后，应当自收购之日起（）内注销。',o:["30日", "6个月", "3年"],a:2,x:'本题考查股份发行和回购。我国《公司法》对股份有限公司股权回购的态度是原则禁止，例外允许。第142条规定，公司不得收购本公司股份，但有下列6种情形之一的可以回购：①减少公司注册资本；②与持有本公司股份的其他公司合并；③将股份用于员工持股计划或者股权激励；④股东因对股东大会作出的公司合并、分立决议持异议，要求公司收购其股份；⑤将股份用于转换上市公司发行的可转换为股票的公司债券；⑥上市公司为维护公司价值及股东权益所必需。公司收购本公司股份后，属于第①项情形的，应当自收购之日起10日内注销；属于第②④项情形的，应当在6个月内转让或者注销；属于第③⑤⑥项情形的，公司合计持有的本公司股份数不得超过本公司已发行股份总额的10%，并应当在3年内转让或者注销。'},
  {ch:36,type:'multi',q:'股东可以用于出资的非货币财产有（）。',o:["特许经营权", "商誉", "土地使用权", "实物"],a:[1,2,3],x:'本题考查公司设立的条件。股东可以用货币出资，也可以用实物、知识产权、土地使用权等可以用货币估价并可以依法转让的非货币财产作价出资，但是，法律、行政法规规定不得作为出资的财产除外。'},
  {ch:31,q:'股份有限公司的最高权力机关是（）。',o:["监事会", "董事会", "股东大会"],a:2,x:'本题考查股东（大）会。股东大会是股份有限公司的最高权力机关。'},
  {ch:31,q:'国有独资公司的监事会成员中职工代表的比例不得低于（）。',o:["2/3", "1/3", "1/2"],a:1,x:'本题考查国有独资公司的特别规定。国有独资公司监事会成员不得少于5人，其中职工代表的比例不得低于1/3，具体比例由公司章程规定'},
  {ch:0,q:'在《外商投资法》施行前依照《中外合资经营企业法》《中外合作经营企业法》《外资企业法》设立的外商投资企业，在《外商投资法》施行后（）内可继续保留原企业组织形式。',o:["5年", "6年", "8年"],a:0,x:'本题考查公司法的概念。在《外商投资法》施行前依照《中外合资经营企业法》《中外合作经营企业法》《外资企业法》设立的外商投资企业，在《外商投资法》施行后5年内可继续保留原企业组织形式。'},
  {ch:31,type:'multi',q:'根据公司法的规定，有下列（）情形之一的，应当在两个月内召开临时股东大会。',o:["董事会认为必要时", "监事会提议召开时", "公司未弥补的亏损达实收股本总额1/5时", "单独或者合计持有公司8%以上股份的股东请求时"],a:[0,1,3],x:'本题考查股东（大）会。有下列情形之一的，应当在两个月内召开临时股东大会：①董事人数不足《公司法》规定人数或者公司章程所定人数的2/3时；②公司未弥补的亏损达实收股本总额1/3时；③单独或者合计持有公司10%以上股份的股东请求时；④董事会认为必要时；⑤监事会提议召开时；⑥公司章程规定的其他情形。'},
  {ch:31,q:'关于股份有限公司董事会的说法正确的是（）。',o:["董事会成员为3人至13人", "董事会成员中应当有公司职工代表", "董事会设董事长1人，可以设副董事长"],a:2,x:'本题考查董事会。董事会成员为5人至19人，选项A说法错误。董事会成员中可以有公司职工代表，选项B说法错误。董事长和副董事长由董事会以全体董事的过半数选举产生，选项D说法错误。'},
  {ch:31,q:'根据《中华人民共和国公司法》，下列人员中，可以担任有限责任公司监事的是（）。',o:["公司董事长", "公司高级管理人员", "公司股东"],a:2,x:'本题考查监事会。董事、高级管理人员不得兼任监事，所以本题选C。'},
  {ch:31,type:'multi',q:'有限责任公司监事会行使的职权有（）。',o:["检查公司财务", "提议召开临时股东会会议", "执行股东会的决议", "决定公司的经营计划和投资方案"],a:[0,1,3],x:'本题考查监事会。监事会、不设监事会的公司的监事行使下列职权：①检查公司财务；②对董事、高级管理人员执行公司职务的行为进行监督，对违反法律、行政法规、公司章程或者股东会决议的董事、高级管理人员提出罢免的建议；③当董事、高级管理人员的行为损害公司的利益时，要求董事、高级管理人员予以纠正；④提议召开临时股东会会议，在董事会不履行《公司法》规定的召集和主持股东会会议职责时召集和主持股东会会议；⑤向股东会会议提出提案；⑥依法对董事、高级管理人员提起诉讼；⑦公司章程规定的其他职权。选项CD属于董事会的职权。'},
  {ch:31,q:'关于股份有限公司的设立方式，下列说法错误的是（）。',o:["可以采用发起方式设立，也可以采用募集方式设立", "采取发起方式设立的，在发起人认购的股份缴足前，不得向他人募集股份", "采取募集方式设立的，由发起人制定并通过公司章程"],a:2,x:'本题考查公司设立的条件。采用发起方式设立股份有限公司，由发起人制定并通过公司章程。采用募集方式设立股份有限公司，由发起人制定公司章程并经创立大会通过。'},
  {ch:31,q:'根据《中华人民共和国公司法》，股份有限公司的董事会成员人数范围是（）人。',o:["2～200", "3～13", "5～19"],a:2,x:'本题考查董事会。股份有限公司设董事会，其成员为5人至19人'},
  {ch:34,q:'劳动者无过失，下列（）情况下企业可以合法解除劳动关系。',o:["不胜任工作，经调整岗位仍不胜任", "患病无法工作", "企业破产"],a:0,x:'本题考查劳动合同的解除。劳动者无过错但由于主客观原因使劳动合同无法履行，用人单位须提前30日以书面形式通知劳动者本人或者额外支付劳动者1个月工资后，可以解除劳动合同。包括：①劳动者患病或者非因工负伤，在规定的医疗期满后不能从事原工作，也不能从事由用人单位另行安排的工作的；②劳动者不能胜任工作，经过培训或者调整工作岗位，仍不能胜任工作的；③劳动合同订立时所依据的客观情况发生重大变化，致使劳动合同无法履行，经用人单位与劳动者协商，未能就变更劳动合同内容达成协议的。'},
  {ch:0,q:'抽奖式有奖销售最高不得超过（）。',o:["2万元", "5千元", "1万元"],a:2,x:'本题考查不正当竞争行为的种类。抽奖式的有奖销售，最高奖的金额不得超过5万元。'},
  {ch:28,q:'2022年，张某因产品存在缺陷而受到损害，其向人民法院提起诉讼要求赔偿的诉讼时效期限是（）。',o:["4年", "2年", "1年"],a:2,x:'本题考查产品质量法律制度。《民法典》第188条规定，向人民法院请求保护民事权利的诉讼时效期间为3年。法律另有规定的，依照其规定。从新法优于旧法的法律适用原则考虑，产品责任的诉讼时效应适用《民法典》诉讼时效的规定，即为3年。'},
  {ch:33,type:'multi',q:'根据《中华人民共和国产品质量法》，衡量产品质量的标准有（）。',o:["国际标准", "地方标准", "国家标准", "企业标准"],a:[0,1,2,3],x:'本题考查产品质量法律制度。对产品质量的衡量，形成相应的产品质量标准，主要包括国家标准、地方标准、行业标准及企业标准。'},
  {ch:28,type:'multi',q:'根据《中华人民共和国反不正当竞争法》，经营者从事某些类型的不正当竞争行为，权利人因侵权受到的实际损失，侵权人因侵权获得的利益难以确定的，人民法院可根据侵权人行为情节判决给予权利人，这些类型的不正当竞争行为有（）。',o:["诋毁商业行为", "混淆行为", "网络不正当竞争行为", "侵犯商业秘密行为"],a:[1, 3],x:'本题考查反不正当竞争法律制度。经营者从事混淆行为或侵犯商业秘密的行为，权利人因被侵权所受到的实际损失、侵权人因侵权所获得的利益难以确定的，由人民法院根据侵权行为的情节判决给予权利人500万元以下的赔偿。'},

  {ch:31,q:'收购本公司股份时，公司合计持有的本公司股份不得超过本公司已发行股份总额的10%，并应当在3年内转让或注销。这种收购的情形不包括（）。',o:["将股份用于员工持股计划或者股权激励", "与持有本公司股份的其他公司合并", "将股份用于转换上市公司发行的可转换为股票的公司债券"],a:1,x:'本题考查股份发行与回购。公司不得收购本公司股份，但有下列6种情形之一的可以回购：（1）减少公司注册资本；（2）与持有本公司股份的其他公司合并；（3）将股份用于员工持股计划或者股权激励；（4）股东因对股东大会作出的公司合并、分立决议持异议，要求公司收购其股份;（5）将股份用于转换上市公司发行的可转换为股票的公司债券；（6）上市公司为维护公司价值及股东权益所必需。属于第（3）（5）（6）项情形收购本公司股份的，公司合计持有的本公司股份不得超过本公司已发行股份总额的10%，并应当在3年内转让或注销'},

  {ch:9,q:'2013年10月22日，甲公司开始在自己生产的白酒上使用\'荷生\'商标，并一直持续至2020年3月2日。2019年2月1日，乙公司申请在烧酒上注册\'荷生\'商标，2019年7月21日核准注册。2019年9月23日，乙公司要求甲公司在白酒上停止使用\'荷生\'商标。对此，下列说法错误的是()',o:["乙公司有权禁止甲公司在自己的白酒产品上继续使用\\'荷生\\'商标", "乙公司有权禁止甲公司在黄酒上使用\\'荷生\\'商标", "乙公司有权禁止甲公司许可丙公司在白酒上使用\\'荷生\\'商标", "乙公司有权要求甲公司在其白酒产品上附加适当区别标识"],a:0,x:'根据《商标法》第59条，在先使用人可以在原使用范围内继续使用该商标，注册商标专用权人无权禁止。'},
  {ch:9,q:'荷花贸易公司准备申请\'荷花及图\'商标，与西来胜知识产权代理公司签订合同，委托其办理商标注册申请事宜。申请商标注册时，应提交的申请书件不包括()',o:["商标注册申请书", "荷花贸易公司营业执照复印件", "荷花贸易公司与西来胜知识产权代理公司之间的委托合同", "\\'荷花及图\\'商标图样"],a:2,x:'办理商标注册申请应提交商标注册申请书、申请人身份证明文件复印件、商标代理委托书、商标图样等。委托合同不是必须提交的申请书件。'},
  {ch:9,q:'关于商标注册申请的实质审查，下列说法错误的是()',o:["立体商标是由不具有显著特征的三维标志和具有显著特征的其他平面标志组合而成的，该商标注册后的专用权保护范围仅限于具有显著特征的平面标志部分", "颜色组合商标申请人应当在商标说明中列明颜色名称和色号，并描述该颜色组合商标在商业活动中的具体使用方式", "声音商标应当由音乐性质的声音构成", "申请注册集体商标的，应当提交使用管理规则"],a:2,x:'声音商标可以由音乐性质的声音构成，也可以由非音乐性质的声音构成（如自然界的声音），或两者兼有。'},

  {ch:6,type:'multi',q:'非传统商标按照构成要素不同划分，可分为( )。',o:["立体商标", "触觉商标", "听觉商标", "味觉商标", "服务商标"],a:[0, 1, 2, 3],x:'本题考查商标的种类。相比传统商标，非传统商标构成要素以人的接触、感知为基础，按照构成要素不同划分，可分为立体商标、听觉商标、味觉商标、触觉商标、颜色组合商标。'},
  {ch:8,type:'multi',q:'目前，国际上商标专用权的取得原则有( )。',o:["使用原则", "公平原则", "注册原则", "申请原则", "混合原则"],a:[0, 2, 4],x:'本题考查商标专用权。目前，国际上商标专用权的取得有以下三种原则：使用原则、注册原则和混合原则。'},
  {ch:8,type:'single',q:'以核准注册的商标和核定使用的商品为限的是( )。',o:["注册商标的专用权", "驰名商标专用权", "地理标志专用权", "商标许可权"],a:0,x:'本题考查商标专用权。我国《商标法》第五十六条规定，注册商标的专用权，以核准注册的商标和核定使用的商品为限。'},
  {ch:6,type:'multi',q:'商标注册人在使用注册商标的过程中，自行改变( )的，由管理商标工作的部门责令限期改正。',o:["注册商标", "注册人名义", "注册人地址", "注册商标开始使用日期", "其他注册事项"],a:[0, 1, 2, 4],x:'本题考查注册商标的不当使用。商标注册人在使用注册商标的过程中，自行改变注册商标、注册人名义、地址或者其他注册事项的，由管理商标工作的部门责令限期改正。'},
  {ch:6,type:'multi',q:'《区分表》按照《尼斯分类》的原则和标准，结合中国国情，依据商品的( )，以及服务的性质、目的、内容等相同或类似标准，以一定顺序排列组成，分为商品和服务两大部分，共45个类别。',o:["功能", "原料", "生产工艺", "销售场所", "使用功能"],a:[0, 1, 2, 3],x:'本题考查商标注册申请。《区分表》按照《尼斯分类》的原则和标准，结合中国国情，依据商品的功能、原料、生产工艺、销售场所，以及服务的性质、目的、内容等相同或类似标准，以一定顺序排列组成，分为商品和服务两大部分，共45个类别。其中，商品为第1类～第34类，共34个类别；服务为第35类～第45类，共11个类别，我国1993年接受服务商标注册申请。'},
  {ch:6,type:'single',q:'当事人对国家知识产权局作出的驳回或者部分驳回申请决定、异议成立决定、注册商标无效及撤销决定不服的，可以自收到通知之日起( )内申请复审。',o:["7日", "15日", "30日", "60日"],a:1,x:'本题考查商标评审案件的受理。当事人对国家知识产权局作出的驳回或者部分驳回申请决定、异议成立决定、注册商标无效及撤销决定不服的，可以自收到通知之日起15日内申请复审。'},
  {ch:7,type:'multi',q:'《国家创新驱动发展战略纲要》中明确提出要实施( )战略。',o:["知识产权", "标准", "商标", "质量", "品牌"],a:[0, 1, 3, 4],x:'本题考查商标品牌战略的制定和实施。《国家创新驱动发展战略纲要》中明确提出要实施知识产权、标准、质量和品牌战略'},
  {ch:7,type:'multi',q:'商标使用的具体表现形式包括( )。',o:["使用在商品、商品包装或者容器上", "使用在商品交易文书上", "使用在相关地点地名上", "使用在广告宣传上", "使用在与服务有联系的文件资料上"],a:[0, 1, 3, 4],x:'本题考查商标的使用。商标可以用于商品、商品包装、容器以及商品交易文书上，可以用于服务场所以及服务交易文书上，可以用于广告宣传、展览以及其他商业活动中。'},
  {ch:8,type:'multi',q:'收到转让申请之后，国家知识产权局需要对转让申请是否符合法定条件以书面审查方式进行审查，审查内容包含( )。',o:["对转让容易导致混淆或有其他不良影响的审查", "对转让申请文件的审查", "对转受让双方民事主体资格的审查", "对商标转让合同的审查", "对商标专用权权利有效性的审查"],a:[0, 1, 2, 4],x:'本题考查注册商标的转让。收到转让申请之后，国家知识产权局需要对转让申请是否符合法定条件以书面审查方式进行审查。包括转让申请文件、转受让双方民事主体资格、商标专用权权利有效性审查、相同或者近似商标是否一并转让的审查、对转让容易导致混淆或有其他不良影响的审查。'},
  {ch:9,type:'single',q:'技术措施可以分为( )。',o:["控制作品传播的技术措施和停止侵犯权利的技术措施", "控制作品接触的技术措施和停止侵犯权利的技术措施", "控制作品接触的技术措施和禁止侵犯权利的技术措施", "控制作品传播的技术措施和禁止侵犯权利的技术措施"],a:2,x:'本题考查技术措施及相关法律责任。技术措施可以分为控制作品接触的技术措施和禁止侵犯权利的技术措施。'},
  {ch:9,type:'multi',q:'著作人身权，又被称为著作权( )权利，是作者对其创作的作品所享有的与其人身不可分割的非财产权利。',o:["精神", "物质", "知识", "思想"],a:0,x:'本题考查著作人身权。著作人身权，又被称为著作权精神权利，是作者对其创作的作品所享有的与其人身不可分割的非财产权利。'},
  {ch:9,type:'multi',q:'根据我国著作权法，受保护的著作权类型有( )。',o:["追续权", "汇编权", "摄制权", "信息网络传播权", "展览权"],a:[1, 2, 3, 4],x:'本题考查著作权国际保护的基本原则。对于追续权，只有在作者本国法律承认这种保护的情况下，才可以在其他成员方内要求保护。'},
  {ch:9,type:'single',q:'根据我国著作权法的规定，下列不属于邻接权的是( )。',o:["表演者权", "广播组织者权", "期刊出版者的专有出版权", "录音制作者权"],a:2,x:'本题考查邻接权。出版者对其出版的图书和期刊的版式设计享有的权利属于出版者享有的邻接权。选项C属于著作财产权中的复制权。'},
  {ch:9,type:'multi',q:'根据许可使用的权利性质，可将著作权许可分为( )。',o:["公开许可", "独占许可", "自我许可", "排他许可", "普通许可"],a:[1, 3, 4],x:'本题考查著作权转让与许可的关系。根据许可使用的权利性质，可将著作权许可分为独占许可、排他许可和普通许可'},
  {ch:9,type:'multi',q:'下列属于WPPT规定的内容有( )。',o:["对于将为商业目的发行的录音制品直接或间接地用于广播或用于对公众的任何传播，表演者和录音制品制作者享有获得一次性公平报酬的权利", "成员方可将其国内立法中为著作权规定的限制或例外适用于表演者和录音制作者的权利，只要符合“两步检验法”", "成员方可将其国内立法中为著作权规定的限制或例外适用于表演者和录音制作者的权利，只要符合“三步检验法”", "成员方应采取适当的措施保护技术措施", "成员方应采取适当的措施保护权利管理信息"],a:[0, 2, 3, 4],x:'本题考查著作权国际保护的发展。WPPT规定的内容包括：成员方可将其国内立法中为著作权规定的限制或例外适用于表演者和录音制作者的权利，只要符合“三步检验法”。'},
  {ch:9,type:'single',q:'文学、艺术和科学领域内具有独创性并能以一定形式表现的其他尚未在现行《著作权法》中类型化的智力成果，( )。',o:["属于《著作权法》 保护的作品", "不能获得《著作权法》 的保护", "需要专业机构鉴定才能获得《著作权法》的保护", "需要有法律、行政法规的规定才能获得《著作权法》的保护"],a:0,x:'本题考查著作权客体。文学、艺术和科学领域内具有独创性并能以一定形式表现的其他尚未在现行《著作权法》中类型化的作品，也属于《著作权法》保护的作品。'},
  {ch:9,type:'single',q:'在满足法定许可的情形下，著作权人仅享有( )权。',o:["独占", "转让", "禁止", "获酬"],a:3,x:'本题考查著作权许可的类型。在满足法定许可的情形下，著作权人不享有禁止权，仅享有获酬权。'},
  {ch:9,type:'single',q:'我国《著作权法》所规定的“作品”，是指文学、艺术和科学领域内具有( )并能以一定形式表现的智力成果。',o:["独创性", "时效性", "私密性", "实用性"],a:0,x:'本题考查著作权客体。我国《著作权法》所规定的“作品”，是指文学、艺术和科学领域内具有独创性并能以一定形式表现的智力成果。'},
  {ch:9,type:'multi',q:'著作权许可合同以作品使用权为标的，合同应包括的内容有( )。',o:["许可使用的权利种类", "许可使用的权利是专有使用权或者非专有使用权", "许可使用的地域范围、期间", "许可使用的审核部门", "违约责任"],a:[0, 1, 2, 4],x:'本题考查著作权许可的类型。著作权许可合同以作品使用权为标的，包括以下内容：①许可使用的权利种类；②许可使用的权利是专有使用权或者非专有使用权；③许可使用的地域范围、期间；④付酬标准和办法；⑤违约责任；⑥双方认为需要约定的其他内容。'},
  {ch:9,type:'single',q:'著作权质权实现，是著作权质权( )的一种常见方式。',o:["消灭", "转让", "交易", "更改"],a:0,x:'本题考查著作权质押。著作权质权实现，是著作权质权消灭的一种常见方式。'},
  {ch:9,type:'multi',q:'有下列( )情形之一的，申请人应当申请注销著作权质权登记。',o:["出质人和质权人协商一致同意注销的", "主合同履行完毕的", "质权实现的", "质权人放弃质权的", "出质著作权存在权属争议的"],a:[0, 1, 2, 3],x:'本题考查著作权质押。有下列情形之一的，申请人应当申请注销质权登记：①出质人和质权人协商一致同意注销的；②主合同履行完毕的；③质权实现的；④质权人放弃质权的；⑤其他导致质权消灭的情形'},
  {ch:9,type:'single',q:'放映权需要借助一定的( )来实现，著作权人所享有的放映权仅限于特定作品类型。',o:["网络", "信息技术", "技术设备", "专业人员"],a:2,x:'本题考查著作财产权。放映权需要借助一定的技术设备来实现，著作权人所享有的放映权仅限于特定作品类型。'},
  {ch:9,type:'multi',q:'复制权，即以( )等方式将作品制作一份或者多份的权利。',o:["翻拍", "印刷", "购买", "录像", "数字化"],a:[0, 1, 3, 4],x:'本题考查著作财产权。复制权，即以印刷、复印、拓印、录音、录像、翻录、翻拍、数字化等方式将作品制作一份或者多份的权利。'},
  {ch:9,type:'single',q:'对于改编、翻译、注释、整理已有作品而产生的作品称为( )。',o:["汇编作品", "视听作品", "职务作品", "演绎作品"],a:3,x:'本题考查特殊情况下的著作权归属。对于改编、翻译、注释、整理已有作品而产生的是演绎作品。'},
  {ch:9,type:'single',q:'在经济权利方面，《伯尔尼公约》要求成员方必须赋予的著作财产权不包括( )。',o:["翻译和授权翻译其作品的专有权利", "以任何方式(包括录音和录像)和采取任何形式复制作品的专有权利", "反对对其作品的任何有损其声誉的歪曲、割裂或其他更改，或其他损害行为的专有权利", "戏剧作品、音乐戏剧作品和音乐作品的作者授权用各种手段公开播送其作品的表演和演奏的专有权利"],a:2,x:'本题考查著作权国际保护的发展。反对对其作品的任何有损其声誉的歪曲、割裂或其他更改，或其他损害行为，是公约规定的作者的著作人身权，不是公约成员方必须赋予的著作财产权。'},
  {ch:9,type:'single',q:'摄影作品和作为艺术作品保护的实用艺术作品的保护期限由《伯尔尼公约》各成员方的法律规定；但这一期限不应少于自该作品完成之后算起的( )。',o:["25年", "30年", "50年", "60年"],a:0,x:'本题考查著作权国际保护的发展。摄影作品和作为艺术作品保护的实用艺术作品的保护期限由各成员方的法律规定；但这一期限不应少于自该作品完成之后算起的25年。'},
  {ch:9,type:'single',q:'自然人、法人或者非法人组织根据法律规定，可以不经著作权人许可而使用其作品，但应该按照规定支付报酬，该许可制度是( )。',o:["普通许可", "独占许可", "法律许可", "法定许可"],a:3,x:'本题考查著作权许可的类型。法定许可，是自然人、法人或者非法人组织根据法律规定，可以不经著作权人许可而使用其作品，但应该按照规定支付报酬的制度。'},
  {ch:9,type:'multi',q:'著作权国际保护的方式有( )。',o:["通过互惠原则提供对等保护", "通过双边条约的规定提供保护", "通过多边条约的规定提供保护", "通过平等原则提供对等保护", "通过互相尊重原则提供对等保护"],a:[0, 1, 2],x:'本题考查著作权国际保护的发展。著作权国际保护的方式主要有两种，一是通过互惠原则提供对等保护，二是通过双边或多边条约的规定提供保护'},
  {ch:9,type:'single',q:'出版者所享有的邻接权，主要指的是( )。',o:["作品编纂权", "作品复制权", "版式修改权", "版式设计权"],a:3,x:'本题考查邻接权。出版者所享有的邻接权，主要指的是版式设计权。'},
  {ch:9,type:'single',q:'根据我国《著作权法》，著作权转让合同可以不包括( )。',o:["作品的名称", "转让的权利种类、地域范围", "转让期限", "违约责任"],a:2,x:'本题考查著作权转让合同。根据我国《著作权法》，著作权转让合同应当包括以下内容：①作品的名称；②转让的权利种类、地域范围；③转让价金；④交付转让价金的日期和方式；⑤违约责任；⑥双方认为需要约定的其他内容。'},
  {ch:9,type:'single',q:'表演者对其表演享有的权利不包括( )。',o:["表明表演者身份的权利", "出租权", "许可他人通过信息网络向公众传播其表演，并获得报酬的权利", "许可他人录音录像，并获得报酬的权利"],a:1,x:'本题考查表演者享有的邻接权。表演者对其表演享有下列权利：①表明表演者身份；②保护表演形象不受歪曲；③许可他人从现场直播和公开传送其现场表演，并获得报酬；④许可他人录音录像，并获得报酬；⑤许可他人复制、发行、出租录有其表演的录音录像制品，并获得报酬；⑥许可他人通过信息网络向公众传播其表演，并获得报酬。注意区分不同的邻接权的权利内容的差异。'},
  {ch:9,type:'single',q:'对于构成销售侵权复制品罪的情形，罚金数额一般在违法所得的( )，或者按照违法经营数额的50%以上1倍以下确定。',o:["1倍以上2倍以下", "1倍以上3倍以下", "1倍以上5倍以下", "1倍以上10倍以下"],a:2,x:'本题考查侵犯著作权的法律责任。罚金数额一般在违法所得的1倍以上5倍以下，或者按照非法经营数额的50%以上1倍以下确定。'},
  {ch:9,type:'multi',q:'对于构成著作权行政违法的行为，著作权主管部门可以采取警告、责令停止侵权行为，没收、无害化销毁处理侵权复制品以及主要用于制作侵权复制品的材料、工具、设备等，并可处以罚款。下列情形属于“情节严重”的有( )。',o:["违法所得数额(即获利数额)1500元以上的", "非法经营数额在1.5万元以上的", "经营侵权制品在250册(张或份)以上的", "因侵犯著作权曾经被追究法律责任，又侵犯著作权的", "造成其他重大影响或者严重后果的"],a:[1, 2, 3, 4],x:'本题考查侵犯著作权的法律责任。罚金数额一般在违法所得的1倍以上5倍以下，或者按照非法经营数额的50%以上1倍以下确定。'},
  {ch:9,type:'multi',q:'对于侵犯著作权罪和销售侵权复制品罪，下列情形不适用缓刑的有( )。',o:["因侵犯知识产权被刑事处罚后，再次侵犯知识产权构成犯罪的", "因侵犯知识产权被行政处罚后，再次侵犯知识产权构成犯罪的", "不具有悔罪表现的", "拒不交出违法所得的", "延迟交出违法所得的"],a:[0, 1, 2, 3],x:'本题考查侵犯著作权的法律责任。对于侵犯著作权罪和销售侵权复制品罪，符合刑法规定的缓刑条件的，依法适用缓刑。但是，有下列情形之一的，一般不适用缓刑：①因侵犯知识产权被刑事处罚或者行政处罚后，再次侵犯知识产权构成犯罪的；②不具有悔罪表现的；③拒不交出违法所得的；④其他不宜适用缓刑的情形。'},
  {ch:9,type:'single',q:'有偿许可他人临时使用视听作品、计算机软件的原件或复制件的权利称为( )。',o:["出租权", "发行权", "复制权", "放映权"],a:0,x:'本题考查著作财产权。出租权，即有偿许可他人临时使用电影作品和以类似摄制电影的方法创作的作品、计算机软件的权利，计算机软件不是出租的主要标的的除外'},
  {ch:7,type:'single',q:'国家知识产权局发布初步审定公告，公告内容包括该集体商标、证明商标的基本信息及使用管理规则的全文或摘要。自初步审定公告之日起( )个月内，在先权利人、利害关系人可提出异议。',o:["1", "2", "3", "5"],a:2,x:'本题考查地理标志申请程序要求。国家知识产权局发布初步审定公告，公告内容包括该集体商标、证明商标的基本信息及使用管理规则的全文或摘要。自初步审定公告之日起3个月内，在先权利人、利害关系人可提出异议。'},
  {ch:8,type:'single',q:'地理标志保护产品的地方标准由( )标准化行政主管部门组织草拟并发布。',o:["国家", "省级地方人民政府", "市级地方人民政府", "县级地方人民政府"],a:1,x:'本题考查地理标志保护的实质性要求。国家标准化行政主管部门组织草拟并发布地理标志保护产品的国家标准，省级地方人民政府标准化行政主管部门组织草拟并发布地理标志保护产品的地方标准。'},
  {ch:9,type:'single',q:'根据我国《刑法》，以营利为目的，销售明知属于规定的侵权复制品，违法所得数额巨大或者有其他严重情节的，构成销售侵权复制品罪，违法所得数额在( )的，属于“违法所得数额巨大”。',o:["5万元以上", "10万元以上", "20万元以上", "25万元以上"],a:1,x:'本题考查侵犯著作权的行为。根据我国《刑法》，以营利为目的，销售明知属于上述规定的侵权复制品，违法所得数额巨大或者有其他严重情节的，构成销售侵权复制品罪。违法所得数额在10万元以上的，属于“违法所得数额巨大”。'},
  {ch:12,type:'multi',q:'著作权国际保护的基本原则包括( )。',o:["独立保护原则", "自动保护原则", "国民待遇原则", "最低保护标准原则", "最低保护原则"],a:[0, 1, 2, 3],x:'本题考查著作权国际保护的基本原则。著作权国际保护的基本原则包括：独立保护原则、自动保护原则、国民待遇原则和最低保护标准原则。'},
  {ch:9,type:'multi',q:'著作权集体管理组织有权以自己名义从事的活动有( )。',o:["与使用者订立著作权或者与著作权有关的权利许可使用合同", "向使用者收取使用费", "向权利人转付使用费", "对著作权进行购买", "进行涉及著作权或者与著作权有关的权利的诉讼、仲裁、调解活动"],a:[0, 1, 2, 4],x:'本题考查著作权集体管理组织。著作权集体管理组织有权以自己名义从事下列活动：①与使用者订立著作权或者与著作权有关的权利许可使用合同；②向使用者收取使用费；③向权利人转付使用费；④进行涉及著作权或者与著作权有关的权利的诉讼、仲裁、调解活动。'},
  {ch:9,type:'single',q:'第一次确认了作者对其作品享有财产权的法律文件是( )。',o:["《伯尔尼公约》", "《作者权法》", "《安娜女王法》", "《世界版权公约》"],a:2,x:'本题考查著作权制度的历史发展。英国1709年的《安娜女王法》第一次确认了作者对其作品享有财产权，并确立了作者在著作权法上的主体地位。'},
  {ch:9,type:'single',q:'著作权投资是实现( )相结合的重要路径，对文娱产业的发展具有积极意义。',o:["“人”与“物”", "“人”与“力”", "“人”与“财”", "“物”与“财”"],a:2,x:'本题考查著作权资本市场与证券化。著作权投资是实现“人”与“财”相结合的重要路径，对文娱产业的发展具有积极意义'},
  {ch:7,type:'single',q:'作为集体商标、证明商标注册的地理标志使用地理标志专用标志的，应同时使用地理标志专用标志和该集体商标或证明商标，并加注( )。',o:["地理标志名称", "地理标志标准代号", "批准公告号", "商标注册号"],a:3,x:'本题考查地理标志专用标志的合法使用。作为集体商标、证明商标注册的地理标志使用地理标志专用标志的，应同时使用地理标志专用标志和该集体商标或证明商标，并加注商标注册号。'},
  {ch:7,type:'single',q:'地理标志保护产品和作为集体商标、证明商标注册的地理标志使用地理标志专用标志的，应在地理标志专用标志的指定位置标注统一社会( )代码。',o:["信用", "商业", "专业", "监管"],a:0,x:'本题考查地理标志专用标志的合法使用。地理标志保护产品和作为集体商标、证明商标注册的地理标志使用地理标志专用标志的，应在地理标志专用标志的指定位置标注统一社会信用代码。'},
  {ch:7,type:'single',q:'外国人或者外国企业在我国申请将地理标志作为集体商标、证明商标注册的，申请人应按要求提交有关证明文件和申请书，其中不包括( )。',o:["商标注册申请书、商标代理委托书", "使用该集体商标、证明商标的权利、义务", "主体资格证明文件", "经认证的该地理标志以其名义在其原属国受法律保护的证明"],a:1,x:'本题考查地理标志申请程序要求。外国人或者外国企业在我国申请将地理标志作为集体商标、证明商标注册的，申请人应按要求提交有关证明文件和申请书，包括：①商标注册申请书、商标代理委托书；②主体资格证明文件；③经认证的该地理标志以其名义在其原属国受法律保护的证明；④申请人监督检测能力证明材料；⑤地理标志产品特定质量、信誉或其他特征及其与该地领域自然因素或人文因素关系的说明；⑥地理标志所标示的地区范围；⑦集体商标、证明商标使用管理规则；⑧其他辅助证明材料。'},
  {ch:7,type:'multi',q:'许可他人使用其证明商标的，注册人应在一年内将其使用许可报国家知识产权局备案，备案材料包括( )等事项。',o:["许可人信息", "被许可人信息", "许可登记", "许可期限", "许可使用的商品范围"],a:[0, 1, 3, 4],x:'本题考查地理标志申请程序要求。许可他人使用其证明商标的，注册人应在一年内将其使用许可报国家知识产权局备案，备案材料包括许可人信息、被许可人信息、许可期限、许可使用的商品范围等事项。'},
  {ch:8,type:'multi',q:'省级知识产权管理部门，按照分工，负责对拟申报的地理标志产品的保护申请提出初审意见，并将相关文件、资料上报国家知识产权局。申请材料包括( )。',o:["地理标志保护产品专用标志使用申请书", "有关地方政府关于划定地理标志产品产地范围的建议", "有关地方政府建立申请、保护机制的正式文件", "地理标志产品的证明材料", "产地所在地知识产权管理部门出具的产地检验报告"],a:[1, 2, 3],x:'本题考查地理标志申请程序要求。省级知识产权管理部门，按照分工，负责对拟申报的地理标志产品的保护申请提出初审意见，并将相关文件、资料上报国家知识产权局。申请材料包括：①有关地方政府关于划定地理标志产品产地范围的建议。②有关地方政府建立申请、保护机制的正式文件。③地理标志产品的证明材料。'},
  {ch:6,type:'single',q:'以地理标志作为集体商标注册的，注册人应详细说明该集体组织成员的名称和地址，集体组织成员发生变化的，注册人应向国家知识产权局申请变更注册事项，国家知识产权局予以( )。',o:["审查", "管理", "监督", "公告"],a:3,x:'本题考查地理标志申请程序要求。以地理标志作为集体商标注册的，注册人应详细说明该集体组织成员的名称和地址，集体组织成员发生变化的，注册人应向国家知识产权局申请变更注册事项，国家知识产权局予以公告。'},
  {ch:8,type:'multi',q:'下列行为属于侵犯该集体商标、证明商标的注册商标专用权的有( )。',o:["未经集体商标、证明商标注册人的许可，在同一种商品上使用与其注册的集体商标、证明商标相同的商标的", "销售侵犯集体商标、证明商标注册商标专用权的商品的", "给他人的集体商标、证明商标注册商标专用权造成其他损害的", "伪造、擅自制造他人注册的集体商标、证明商标标识或者销售伪造、擅自制造的注册的集体商标、证明商标标识的", "经过集体商标、证明商标注册人同意，更换其注册的集体商标、证明商标并将该更换商标的商品又投入市场的"],a:[0, 1, 2, 3],x:'本题考查作为证明商标或者集体商标注册的地理标志的保护。未经集体商标、证明商标注册人同意，更换其注册的集体商标、证明商标并将该更换商标的商品又投入市场的属侵犯该集体商标、证明商标的注册商标专用权'},
  {ch:10,type:'single',q:'某项行为是否构成对商业秘密的侵犯，可以从行为主体、行为表现、侵犯客体和行为人的主观要件等方面进行分析判断。其中，行为人客观上实施了法律规定的商业秘密侵权行为属于( )。',o:["行为主体", "行为表现", "主观要件", "侵犯客体"],a:1,x:'本题考查侵犯商业秘密行为的构成要件。行为表现是指行为人客观上实施了法律规定的商业秘密侵权行为。'},
  {ch:8,type:'multi',q:'涉及假冒地理标志产品的行为主要包括( )。',o:["擅自使用或伪造地理标志名称及专用标志的行为", "不符合地理标志产品标准和管理规范要求而使用该地理标志产品的名称的行为", "使用与专用标志相近、易产生误解的名称或标识及可能误导消费者的文字或图案标识，使消费者将该产品误认为地理标志保护产品的行为", "将已经批准的地理标志产品名称、专用标志只用于产自本地区的产品上", "销售假冒地理标志产品的行为"],a:[0, 1, 2, 4],x:'本题考查地理标志产品的保护。涉及假冒地理标志产品的行为五种：(1)擅自使用或伪造地理标志名称及专用标志的行为。(2)不符合地理标志产品标准和管理规范要求而使用该地理标志产品的名称的行为。(3)使用与专用标志相近、易产生误解的名称或标识及可能误导消费者的文字或图案标识，使消费者将该产品误认为地理标志保护产品的行为。(4)将已经批准的地理标志产品名称、专用标志用于并非产自本地区的产品上，即使已标明真实产地，或使用翻译名称，或伴有如“种”“型”“式”“类”“风格”等之类表述，仍然可能误导公众的行为。(5)销售假冒地理标志产品的行为。'},
  {ch:8,type:'single',q:'产地范围可以按照省、市、县、乡的行政区划划分，( )养殖范围还应包括含经纬度的自然水域界定。',o:["林业", "农产品", "水产品", "牲畜"],a:2,x:'本题考查地理标志产品的保护。产地范围可以按照省、市、县、乡的行政区划划分，水产品养殖范围还应包括含经纬度的自然水域界定。'},
  {ch:8,type:'multi',q:'《巴黎公约》将( )作为知识产权独立形态予以保护。',o:["“货源标记”", "“国民待遇”", "“原产地名称”", "“出厂时间”", "“服务标记”"],a:[0, 2],x:'本题考查主要地理标志国际保护制度。《巴黎公约》将“货源标记”和“原产地名称”作为知识产权独立形态予以保护。'},
  {ch:8,type:'single',q:'《TRIPs协定》要求在世界贸易组织内部进一步谈判，推动建立一个( )地理标志的多边通报和注册体系。',o:["专利", "香槟", "白酒", "葡萄酒"],a:3,x:'本题考查主要地理标志国际保护制度。《TRIPs协定》要求在世界贸易组织内部进一步谈判，推动建立一个葡萄酒地理标志的多边通报和注册体系，该体系延伸到烈酒。'},
  {ch:8,type:'single',q:'1989年，国家工商行政管理局履行了( )对原产地名称保护的有关国际义务。',o:["《TRIPs协定》", "《制止商品产地虚假或欺骗性标记马德里协定》", "《巴黎公约》", "《里斯本协定》"],a:2,x:'本题考查主要地理标志国际保护制度。1989年，国家工商行政管理局履行了《巴黎公约》对原产地名称保护的有关国际义务。'},

  {ch:10,type:'single',q:'成果管理系统主要收集集成电路布图设计的( )，跟踪研发人员的集成电路布图设计成果进度。',o:["研究技术", "创新成果", "申请进度", "使用进程"],a:1,x:'本题考查集成电路布图设计专有权的管理。成果管理系统主要收集集成电路布图设计的创新成果，跟踪研发人员的集成电路布图设计成果进度。'},
  {ch:10,type:'single',q:'具有( )的集成电路布图设计是受保护的集成电路布图设计。',o:["单一性", "私有性", "独创性", "专有性"],a:2,x:'本题考查集成电路布图设计及其保护概述。具有独创性的集成电路布图设计是受保护的集成电路布图设计'},
