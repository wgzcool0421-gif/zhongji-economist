  {ch:10,type:'single',q:'狭义的知识产权是指( )。',o:["专利权、著作权、商号权", "商标权、商号权、商业秘密权", "著作权(含邻接权)、专利权、商标权", "商业秘密权、地理标志权、集成电路布图设计权"],a:2,x:'本题考查知识产权的概念与范围。狭义的知识产权，即传统意义上的知识产权，包括著作权(含邻接权)、专利权、商标权三个主要组成部分。广义的知识产权包括专利权、著作权、邻接权、商标权、商号权、商业秘密权、地理标志权、集成电路布图设计权等权利。'},
  {ch:1,type:'multi',q:'知识产权是一种( )。',o:["民事权利", "法定权利", "私权", "无形财产权", "公私混合型权利"],a:[0, 1, 2, 3],x:'本题考查知识产权的性质。知识产权是一种新型的民事权利，是一种法定权利，其类型、内容均由法律设定，不能通过合同约定，是一种有别于财产所有权的无形财产权。《与贸易有关的知识产权协定》在其序言中强调有效保护知识产权的必要性时，要求各缔约方确认知识产权是一项“私权”。'},
  {ch:1,type:'single',q:'人们对于自己的智力活动创造的成果和经营管理活动中的标记、商誉依法享有的权利称为( )。',o:["财产权", "商标权", "知识产权", "专利权"],a:2,x:'本题考查知识产权的概念与范围。知识产权是人们对于自己的智力活动创造的成果和经营管理活动中的标记、商誉依法享有的权利。'},
  {ch:1,type:'multi',q:'法律对于知识产权的保护是多层次、多角度的，我国相关法律为权利人提供的侵权救济措施包括( )。',o:["经济救济措施", "民事救济措施", "行政救济措施", "司法救济措施", "刑事救济措施"],a:[1, 2, 4],x:'本题考查知识产权的保护。法律对于知识产权的保护是多层次、多角度的，我国相关法律为权利人提供了以下三种侵权救济措施：民事救济措施、行政救济措施、刑事救济措施。'},
  {ch:1,type:'single',q:'我国知识产权保护模式为( )。',o:["双轨制", "单轨制", "保护制", "平行制"],a:0,x:'本题考查知识产权的保护。我国知识产权保护模式为“双轨制”，即知识产权侵权纠纷发生后，权利人既可请求有关行政主管机关处理，也可直接向有管辖权的人民法院起诉。'},
  {ch:13,type:'single',q:'知识产权摩擦已经成为我国外贸发展的一大障碍，也是我国( )必须克服的困难。',o:["从“加工中心”走向“创新中心”", "从“加工中心”走向“制造中心”", "从“加工中心”走向“生产中心”", "从“制造中心”走向“生产中心”"],a:1,x:'本题考查对外贸易中的知识产权保护。改革开放以来，我国进出口贸易发展迅速，然而，在对外贸易快速发展的同时，我国企业在海内外市场遭遇的知识产权纠纷也不断增加。知识产权摩擦已经成为我国外贸发展的一大障碍，也是我国从“加工中心”走向“制造中心”必须克服的困难。'},
  {ch:1,type:'single',q:'基于遗传资源提供者与利用者之间的个案情形进行规定，体现了对遗传资源提供者与利用者主权与意志的尊重的原则是( )。',o:["公平原则", "(发展中国家)优先原则", "共同商定原则", "共同发展原则"],a:2,x:'本题考查遗传资源。共同商定原则乃是基于遗传资源提供者与利用者之间的个案情形进行规定的，是对遗传资源提供者与利用者主权与意志的尊重'},
  {ch:2,type:'multi',q:'《企业知识产权管理规范》规定了企业知识产权管理体系的一系列要求，这些要求包括( )。',o:["检查", "策划", "实施", "观察", "改进"],a:[0, 1, 2, 4],x:'本题考查企业知识产权管理规范。《企业知识产权管理规范》规定了企业策划、实施、检查、改进知识产权管理体系的要求。'},
  {ch:2,type:'single',q:'下列不属于我国知识产权公共服务发展现状的是( )。',o:["知识产权公共服务体系建设逐步完善", "知识产权公共服务体制机制改革进一步深化", "知识产权公务服务还未纳入知识产权全链条当中", "知识产权信息服务能力和成效显著提升"],a:2,x:'本题考查知识产权公共服务。党的十八大以来，习近平总书记提出要打通知识产权创造、运用、保护、管理、服务全链条，首次把知识产权服务作为知识产权全链条的一个重要环节，也把知识产权服务提高到前所未有的战略高度。'},
  {ch:2,type:'single',q:'为满足创新主体或市场主体普遍性的、基础性的知识产权需求和促进对知识产权制度的熟练运用而开展传播和推广知识产权相关的公共服务，体现了知识产权公共服务的( )。',o:["普及性", "帮扶性", "指引性", "便利性"],a:0,x:'本题考查知识产权公共服务的特征。普及性是指为满足创新主体或市场主体普遍性的、基础性的知识产权需求和促进对知识产权制度的熟练运用而开展的传播和推广知识产权相关的公共服务。'},
  {ch:2,type:'single',q:'我国已颁布实施的知识产权管理国家标准不包括( )。',o:["《企业知识产权管理规范》", "《科研组织知识产权管理规范》", "《高等学校知识产权管理规范》", "《军工单位知识产权管理规范》"],a:3,x:'本题考查我国目前主要知识产权管理标准。我国颁布实施的知识产权管理国家标准有《企业知识产权管理规范》《科研组织知识产权管理规范》《高等学校知识产权管理规范》，归口单位均为全国知识管理标准化技术委员会。'},
  {ch:5,type:'single',q:'通过签订普通许可合同的方式，在允许被许可人使用或实施其知识产权的同时，许可人仍然保留在该地域内使用或实施其知识产权的权利，同时许可人也可以在未经被许可人同意的情况下将其知识产权的使用权再授予被许可人之外的第三人，这种专利许可方式是( )。',o:["一般许可", "普通许可", "独占许可", "排他许可"],a:1,x:'本题考查知识产权的转让与许可。知识产权普通许可也称为知识产权非独占性许可，是最常见的知识产权许可方式。知识产权普通许可是指通过签订普通许可合同的方式，在允许被许可人使用或实施其知识产权的同时，许可人仍然保留在该地域内使用或实施其知识产权的权利，同时许可人也可以在未经被许可人同意的情况下将其知识产权的使用权再授予被许可人之外的第三人。'},
  {ch:1,type:'single',q:'关于知识产权的时间性，下列说法错误的是( )。',o:["绝大多数类型的知识产权仅在法律规定的期限内受到保护", "知识产权的时间性是知识产权与有形财产权的区别之一", "知识产权在时间上的有限性，是世界各国为了促进科学文化发展、鼓励智力成果公开所普遍采用的原则", "根据各类知识产权的性质、特征及本国实际情况，各国法律对著作权、专利权、商标权都规定了相同的保护期"],a:3,x:'本题考查知识产权的性质与特征。知识产权不是没有时间限制的永恒权利。绝大多数类型的知识产权仅在法律规定的期限内受到保护，一旦超过法律规定的有效期限，这一权利就自行消灭，相关知识产品即成为整个社会的共同财富，为全人类所共有。这一特点是知识产权与有形财产权的区别之一。知识产权在时间上的有限性，是世界各国为了促进科学文化发展、鼓励智力成果公开所普遍采用的原则。根据各类知识产权的性质、特征及本国实际情况，各国法律对著作权、专利权、商标权都规定了长短不一的保护期。'},
  {ch:1,type:'multi',q:'知识产权的基本特征包括( )。',o:["有限性", "地域性", "空间性", "时间性", "专有性"],a:[1, 3, 4],x:'本题考查知识产权的性质与特征。知识产权的基本特征可以概括为“专有性”“地域性”和“时间性”'},
  {ch:2,type:'multi',q:'下列属于现行知识产权管理标准的共性的有( )。',o:["目的性", "科学性", "系统性", "专业性", "可操作性"],a:[0, 1, 2, 4],x:'本题考查现行知识产权管理标准的共性与区别。现行知识产权管理标准的共性主要包括五个方面： (1)目的性。共同目的是为市场主体组织建立、运行并持续改进其知识产权管理体系提供标准化指引。 (2)科学性。均借鉴了PDCA循环的科学管理理念，提出基于过程方法的知识产权管理模型。该模型指导策划、实施、检查、改进知识产权管理体系，满足知识产权管理需求，实现激励创造、灵活运用、全面保护和系统管理知识产权的目标。 (3)系统性。均提出了全业务、全流程的知识产权管理要求，在管理机构、资源管理、基础管理、实施和运行的生产经营环节等方面都充分体现出了全面、系统的管理要求，不同主体依据相应的管理标准均可以构建系统的知识产权管理体系。 (4)可操作性。综合考虑了不同主体的现实状况和实际需求，兼顾了同现有体系的融合性，明晰了组织结构中不同层级的职责与定位，明确了有关机构和项目全过程管理的内容与要求，确保标准实施任务清晰、操作可行。 (5)前瞻性。标准内容既考虑了我国市场主体和创新主体的实际情况，同时还提出了适度超前的知识产权管理要求。'},
  {ch:2,type:'multi',q:'根据管理主体的不同，知识产权管理可以分为( )。',o:["知识产权行政管理", "行业知识产权管理", "企业知识产权管理", "事业单位知识产权管理", "法律法规知识产权管理"],a:[0, 1, 2, 3],x:'本题考查知识产权管理分类。根据管理主体的不同，知识产权管理可以分为知识产权行政管理、行业知识产权管理、企业知识产权管理、事业单位知识产权管理等。'},
  {ch:1,type:'single',q:'《高等学校知识产权管理规范》规定高等学校知识产权基础管理的内容不包括( )。',o:["人力资源", "财务资源", "资源保障", "评估与分级"],a:3,x:'本题考查高等学校知识产权管理规范。《高等学校知识产权管理规范》规定了高等学校知识产权基础管理的内容，包括人力资源、财务资源、资源保障、基础设施、信息资源等方面的管理要求。'},
  {ch:2,type:'single',q:'现行知识产权管理标准的区别不包括( )。',o:["标准化对象不同", "可操作性不同", "管理目标不同", "管理架构不同"],a:1,x:'本题考查现行知识产权管理标准的共性与区别。现行知识产权管理标准的区别体现在四个方面：标准化对象不同、管理目标不同、管理架构不同、内容侧重不同。'},
  {ch:2,type:'single',q:'《企业知识产权管理规范》的框架内容中，在人力资源、基础设施、财务资源、信息资源方面做出管理要求的是( )。',o:["基础管理", "资源管理", "实施和运行", "审核和改进"],a:1,x:'本题考查企业知识产权管理规范。“资源管理”，规定了企业知识产权资源管理的要求，包括人力资源、基础设施、财务资源、信息资源的管理要求。'},
  {ch:1,type:'single',q:'财产权第一次产生或者不依靠原所有人的权利而取得，称为( )。',o:["继受取得", "原始取得", "合同转让", "创造"],a:1,x:'本题考查知识产权的取得。原始取得是指财产权第一次产生或者不依靠原所有人的权利而取得财产权。'},
  {ch:1,type:'multi',q:'依据权利的取得是否以权利人的意志为转移，知识产权的取得方式可以分为( )。',o:["创造取得", "原始取得", "合法取得", "继受取得", "购买取得"],a:[1, 3],x:'本题考查知识产权的取得。依据权利的取得是否以权利人的意志为转移，知识产权的取得方式可以分为原始取得和继受取得'},
  {ch:12,type:'single',q:'众多知识产权公约所确认的首要原则是( )。',o:["国民待遇原则", "最低保护标准原则", "公共利益原则", "最惠国待遇原则"],a:0,x:'本题考查知识产权国际保护制度的成因、主要原则。国民待遇原则是众多知识产权公约所确认的首要原则。其基本含义是指在知识产权保护方面，各缔约国(成员方)之间相互给予平等待遇，使缔约国国民与本国国民享受同等待遇。'},
  {ch:12,type:'multi',q:'一般认为，知识产权国际保护制度的主要原则应包括( )。',o:["国际待遇原则", "国民待遇原则", "最低保护标准原则", "最高限制原则", "公共利益原则"],a:[1, 2, 4],x:'本题考查知识产权国际保护制度的成因、主要原则。一般认为，知识产权国际保护制度的主要原则应包括国民待遇原则、最低保护标准原则和公共利益原则。'},
  {ch:12,type:'single',q:'下列国际条约中，未对公共利益原则作明确宣示的是( )。',o:["《巴黎公约》", "《版权条约》", "《互联网公约》", "《知识产权协定》"],a:0,x:'本题考查公共利益原则。《版权条约》、《表演与录音制品条约》(概称为《互联网条约》)、《知识产权协定》都对公共利益原则作了明确的宣示。《巴黎公约》《伯尔尼公约》是通过知识产权限制的有关制度来体现公共利益原则的。'},
  {ch:2,type:'multi',q:'知识产权管理体系内部审核的实施包括( )。',o:["内部审核策划", "制订内部审核计划", "编制内部审核检查表", "开展审核活动", "确定审核人员"],a:[0, 1, 2, 3],x:'本题考查知识产权管理体系。内部审核的实施主要包括以下六个环节：内部审核策划、制订内部审核计划、编制内部审核检查表、开展审核活动、形成审核发现、撰写内部审核报告。'},
  {ch:2,type:'multi',q:'知识产权管理体系的内部完善，通常包括( )。',o:["外部审核", "内部审核", "管理评审", "自我评价", "其他自我完善改进机制"],a:[1, 2, 4],x:'本题考查知识产权管理体系。知识产权管理体系的内部完善，通常包括内部审核、管理评审以及其他自我完善改进机制。'},
  {ch:2,type:'single',q:'组织对知识产权管理体系的建立及运行实施情况的结果开展自我检查，通过对检查过程中收集的资料和信息进行分析，发现问题与不足，自我完善与改进，为第三方外部审核做准备，这种管理活动称为( )。',o:["内部审核", "自我评审", "外部审核", "管理评审"],a:0,x:'本题考查知识产权管理体系。内部审核是指组织对知识产权管理体系的建立及运行实施情况的结果开展自我检查的管理活动，主要目的在于通过对检查过程中收集的资料和信息进行分析，发现问题与不足，自我完善与改进，为第三方外部审核做准备。'},
  {ch:2,type:'single',q:'《科研组织知识产权管理规范》中“基础管理”包括( )。',o:["人力资源、科研设施管理、合同管理、信息管理四个方面的管理要求", "获取、维护、运用 和保护的知识产权管理流程", "合同和保密管理环节的知识产权要求", "人力资源、财务资源、资源保障、基础设施、信息资源等方面的管理要求"],a:0,x:'本题考查科研组织知识产权管理规范。《科研组织知识产权管理规范》中，“基础管理”规定了科研组织知识产权基础管理的内容，包括人力资源、科研设施 管理、合同管理、信息管理四个方面的管理要求。选项BC属于《企业知识产权管理规范》中“基础管理”的内容。选项D属于《高等学校知识产权管理规范》中“基础管理”的内容'},
  {ch:3,type:'single',q:'PCT为申请人提供的最大优惠体现在( )上。',o:["国际专利申请的受理程序", "国际专利申请的审查程序", "国际专利申请的纠纷处理", "国际专利申请的权利保护"],a:0,x:'本题考查按照《专利合作条约》提出的国际专利申请。PCT为申请人提供的最大优惠体现在国际专利申请的受理程序上。'},
  {ch:3,type:'single',q:'《巴黎公约》的调整对象是( )。',o:["工业产权", "专利权", "商标权", "著作权"],a:0,x:'本题考查按照《专利合作条约》提出的国际专利申请。《巴黎公约》的调整对象是工业产权。包括发明专利权、实用新型、工业品外观设计、商标权、服务标记、厂商名称、货物标记或原产地名称以及制止不正当竞争等。'},
  {ch:3,type:'single',q:'按照( )提出的国际专利申请常被简称为国际专利申请。',o:["《专利法实施细则》", "《专利合作条约》", "《欧洲专利公约》", "《专利法》"],a:1,x:'本题考查按照《专利合作条约》提出的国际专利申请。按照《专利合作条约》(PCT)提出的国际专利申请常被简称为国际专利申请。'},
  {ch:2,type:'multi',q:'知识产权公共服务资源供给包括( )。',o:["知识产权数椐信息供给", "知识产权自然资源供给", "知识产权公共服务平台和工具", "知识产权咨询服务和公益援助", "知识产权宣传教育和人才培养"],a:[0, 2, 3, 4],x:'本题考查知识产权公共服务资源供给。知识产权公共服务产品等资源供给日益丰富，形成了多元化、多渠道的公共服务资源供给，包括知识产权数椐信息供给、知识产权公共服务平台和工具、知识产权咨询服务和公益援助、知识产权宣传教育和人才培养等。'},
  {ch:12,type:'multi',q:'除《巴黎公约》外，专利国际条约主要还有( )。',o:["《专利合作条约》", "《工业品外观设计国际保存海牙协定》", "《商标国际注册马德里协定》", "《布达佩斯条约》", "《国际专利分类斯特拉斯堡协定》"],a:[0, 1, 3, 4],x:'本题考查知识产权国际保护条约。除《巴黎公约》外，专利国际条约主要还有《专利合作条约》、《工业品外观设计国际保存海牙协定》、《布达佩斯条约》、《国际专利分类斯特拉斯堡协定》。'},
  {ch:1,type:'single',q:'从制度意义的角度看，( )是调整因知识产品而产生的各种社会关系的法律规范的总和，它是国际上通行的确认、保护和利用文学产权、工业产权以及其他智力成果专有权利的一种专门法律制度。',o:["物权法", "知识产权法", "著作权法", "产权法"],a:1,x:'本题考查知识产权政策法律体系。从制度意义的角度看，知识产权法是调整因知识产品而产生的各种社会关系的法律规范的总和，它是国际上通行的确认、保护和利用文学产权、工业产权以及其他智力成果专有权利的一种专门法律制度。'},
  {ch:12,type:'single',q:'国民待遇原则与最惠国待遇原则都是针对( )知识产权保护所设定的规则。',o:["外国人", "本国人", "所有人", "以上三个选项均不正确"],a:0,x:'本题考查知识产权国际保护制度的成因、主要原则。国民待遇原则与最惠国待遇原则都是针对外国人知识产权保护所设定的规则，但两者有所不同。前者意在给予外国人与本国人以同等待遇，解决的是“内外有别”的不平等待遇问题；后者意在给予其他外国人与特定外国人以同等待遇，解决的是“外外有别”的歧视性待遇问题'},
  {ch:12,type:'multi',q:'PCT与《巴黎公约》的不同体现在( )方面。',o:["调整对象", "审查标准", "受理程序", "权利保护", "协调作用"],a:[0, 4],x:'本题考查按照《专利合作条约》提出的国际专利申请。PCT与《巴黎公约》有以下两方面的不同：(1)《巴黎公约》的调整对象是工业产权。包括发明专利权、实用新型、工业品外观设计、商标权、服务标记、厂商名称、货物标记或原产地名称以及制止不正当竞争等。而PCT仅涉及工业产权中的一部分，即专利权以及与之相关的发明人证书、实用证书、实用新型、增补专利或增补证书。不过，本节仅介绍涉及专利的主要内容。(2)《巴黎公约》的协调作用主要体现在各个国家的法律层面，如履行国民待遇原则、承认优先权效力等。而PCT创建了一个旨在方便专利申请人在多国申请专利的机制，包括相应的机构。'},
  {ch:3,type:'single',q:'申请人自发明或者实用新型在中国第一次提出专利申请之日起( )个月内，又向国务院专利行政部门就相同主题提出专利申请的，可以享有优先权。',o:["3", "6", "12", "24"],a:2,x:'本题考查发明和实用新型的授权条件。申请人自发明或者实用新型在中国第一次提出专利申请之日(以下简称中国首次申请)起12个月内，又向国务院专利行政部门就相同主题提出专利申请(以下简称中国在后申请)的，可以享有优先权。这种优先权称为本国优先权。'},
  {ch:3,type:'multi',q:'国际专利申请的受理通过后，将形成的国际专利申请文本有( )。',o:["受理本", "登记本", "检索本", "审查本", "公布本"],a:[0, 1, 2],x:'本题考查按照《专利合作条约》提出的国际专利申请。国际专利申请的受理通过后，将形成三份国际专利申请文本：一份为“受理本”由受理局保存；一份为“登记本”提交国际局；另一份为“检索本”送交国际检索单位。其中，“登记本”被视为国际专利申请的正本，国际局据此在申请日之后18个月后迅速公布国际专利申请(国际公布前申请被撤回或视为撤回的不予公布)。'},
  {ch:3,type:'single',q:'发明和实用新型的新颖性概念不包括( )。',o:["发明或者实用新型不属于现有技术", "发明或者实用新型属于现有技术", "没有任何单位或者个人就同样的发明或者实用新型在申请日以前向国务院专利行政部门提出过申请", "记载在申请日以后(含申请日)公布的专利申请文件或者公告的专利文件中"],a:1,x:'本题考查发明和实用新型的授权条件。所谓新颖性，是指该发明或者实用新型不属于现有技术；也没有任何单位或者个人就同样的发明或者实用新型在申请日以前向国务院专利行政部门提出过申请，并记载在申请日以后(含申请日)公布的专利申请文件或者公告的专利文件中。'},
  {ch:3,type:'multi',q:'关于国际专利申请受理的特点，PCT为申请人提供的最大优惠体现在国际专利申请的受理程序上，具体可概括为( )。',o:["一个申请人", "一种语言", "一个受理局", "一笔申请费", "一份申请文件和一个国际申请日"],a:[1, 2, 3, 4],x:'本题考查按照《专利合作条约》提出的国际专利申请。PCT为申请人提供的最大优惠体现在国际专利申请的受理程序上，具体可概括为五个“一”，即一份申请文件、一个受理局、一笔申请费、一种语言及一个国际申请日。'},
  {ch:3,type:'single',q:'国际专利申请的受理通过后，将形成三份国际专利申请文本，其中，( )被视为国际专利申请的正本，国际局据此在申请日之后18个月后迅速公布国际专利申请。',o:["受理本", "登记本", "检索本", "审查本"],a:1,x:'本题考查按照《专利合作条约》提出的国际专利申请。国际专利申请的受理通过后，将形成三份国际专利申请文本：一份为“受理本”由受理局保存；一份为“登记本”提交国际局；另一份为“检索本”送交国际检索单位。其中，“登记本”被视为国际专利申请的正本，国际局据此在申请日之后18个月后迅速公布国际专利申请(国际公布前申请被撤回或视为撤回的不予公布)。'},
  {ch:3,type:'single',q:'“登记本”被视为国际专利申请的正本，国际局据此在申请日之后( )后迅速公布国际申请，国际公布前申请被撤回或视为撤回的不予公布。',o:["1年", "半年", "6个月", "18个月"],a:3,x:'本题考查按照《专利合作条约》提出的国际专利申请。国际专利申请的受理通过后，将形成三份国际专利申请文本：一份为“受理本”由国际受理局保存；一份为“登记本”提交国际局；另一份为“检索本”送交国际检索单位。其中，“登记本”被视为国际专利申请的正本，国际局据此在申请日之后18个月后迅速公布国际专利申请(国际公布前申请被撤回或视为撤回的不予公布)'},
  {ch:3,type:'single',q:'一份规范的说明书一般分为八个部分撰写，在理解发明或实用新型时，作为目标的是( )。',o:["背景技术", "所要解决的技术问题", "技术方案", "有益效果"],a:1,x:'本题考查发明和实用新型专利申请文件。在理解发明或实用新型时，第三部分背景技术是起点，第四部分所要解决的技术问题是目标，第五部分技术方案是途径，第六部分有益效果是最终落点，而第八部分具体实施方式在判断发明或实用新型是否充分公开、是否为权利要求提供支持方面具有重要作用。'},
  {ch:3,type:'single',q:'根据《专利法实施细则》的规定，对于发明或者实用新型的从属权利要求的内容，下列说法错误的是( )。',o:["从属权利要求应当包括引用部分和限定部分", "引用部分写明引用的权利要求的编号及其主题名称", "限定部分写明发明或者实用新型附加的技术特征", "引用两项以上权利要求的多项从属权利要求，可以作为另一项多项从属权利要求的基础"],a:3,x:'本题考查发明和实用新型专利申请文件。引用两项以上权利要求的多项从属权利要求，只能以择一方式引用在前的权利要求，并不得作为另一项多项从属权利要求的基础。'},
  {ch:3,type:'single',q:'下列选项中，专利申请文件不包括( )。',o:["请求书", "权利要求书", "专利报道", "说明书附图"],a:2,x:'本题考查发明和实用新型专利申请文件。专利申请文件包括请求书及权利要求书、说明书、说明书附图或图片、照片、简要说明以及摘要。'},
  {ch:3,type:'multi',q:'《专利法》规定，申请专利的发明创造在申请日以前6个月内，( )，不丧失新颖性。',o:["在中国各地区展览会上展出的", "在中国政府主办或者承认的国际展览会上首次展出的", "在规定的学术会议或者技术会议上首次发表的", "在国家出现紧急状态或者非常情况时，为公共利益目的首次公开的", "他人未经申请人同意而泄露其内容的"],a:[1, 2, 3, 4],x:'本题考查发明和实用新型的授权条件。《专利法》第二十四条规定，申请专利的发明创造在申请日以前6个月内，有下列情形之一的，不丧失新颖性：①在国家出现紧急状态或者非常情况时，为公共利益目的首次公开的；②在中国政府主办或者承认的国际展览会上首次展出的；③在规定的学术会议或者技术会议上首次发表的；④他人未经申请人同意而泄露其内容的。'},
  {ch:3,type:'multi',q:'发明和实用新型的授权条件为( )。',o:["新颖性", "美观性", "创造性", "实用性", "权利冲突"],a:[0, 2, 3],x:'本题考查发明和实用新型的授权条件。发明和实用新型的授权条件：新颖性、创造性、实用性。'},
  {ch:3,type:'single',q:'同样的发明创造只能授予一项专利权，这里所述的“同样的发明创造”是指( )申请(或专利)中存在的保护范围相同的权利要求。',o:["一件或一件以上", "两件", "两件或两件以上", "两件以上"],a:2,x:'本题考查发明和实用新型的授权条件。对于内容相同的专利申请，有关法条除《专利法》第二十二条中的抵触申请外，还有第九条。其中规定，同样的发明创造只能授予一项专利权。这里所述的“同样的发明创造”是指两件或两件以上申请(或专利)中存在的保护范围相同的权利要求。'},
  {ch:3,type:'single',q:'下列选项中，与发明和实用新型的新颖性无关的是( )。',o:["优先权", "宽限期", "实用性", "同样的发明或者实用新型"],a:2,x:'本题考查发明和实用新型的授权条件。实用性同发明和实用新型的新颖性无关'},
  {ch:3,type:'multi',q:'“合法权利”是指依照中华人民共和国法律享有并且在涉案专利申请日仍然有效的权利或者权益，包括( )等。',o:["商标权", "企业名称权", "专利权", "著作权", "肖像权"],a:[0, 1, 3, 4],x:'本题考查外观设计的授权条件。“合法权利”是指依照中华人民共和国法律享有并且在涉案专利申请日仍然有效的权利或者权益。包括商标权、著作权、企业名称权(含商号权)、肖像权，以及知名商品特有包装或者装潢使用权等。'},
  {ch:3,type:'single',q:'一项外观设计专利权被认定与他人在申请日(有优先权的，指优先权日)以前已经取得的合法权利相冲突的，应当宣告该项外观设计专利权( )。',o:["无效", "有效", "效力待定", "重审"],a:0,x:'本题考查外观设计的授权条件。一项外观设计专利权被认定与他人在申请日(有优先权的，指优先权日)以前已经取得的合法权利相冲突的，应当宣告该项外观设计专利权无效。'},
  {ch:3,type:'multi',q:'实践中，导致发明和实用新型专利申请文件中的权利要求不清楚的因素通常包括( )。',o:["权利要求的术语不清楚", "权利要求从属关系不清楚", "权利要求的范围指向不清楚", "权利要求的结果不清楚", "权利要求的主题名称没有清楚地表达要求保护的客体类型"],a:[0, 1, 2, 4],x:'本题考查发明和实用新型专利申请文件。实践中，导致权利要求不清楚的因素通常包括以下四类：(1)权利要求的主题名称没有清楚地表达要求保护的客体类型。(2)权利要求的术语不清楚。(3)权利要求从属关系不清楚。(4)权利要求的范围指向不清楚。'},
  {ch:3,type:'single',q:'不属于现有设计，是指在现有设计中，既没有与涉案专利相同的外观设计，也没有与涉案专利( )的外观设计。',o:["内容相同", "特征相同", "功能相同", "实质相同"],a:3,x:'本题考查外观设计的授权条件。不属于现有设计，是指在现有设计中，既没有与涉案专利相同的外观设计，也没有与涉案专利实质相同的外观设计。'},
  {ch:3,type:'single',q:'在理解发明或实用新型时，下列对于各部分之间的关联性描述正确的是( )。',o:["背景技术是起点", "所要解决的技术问题是最终落点", "技术方案是目标", "有益效果是途径"],a:0,x:'本题考查发明和实用新型专利申请文件。尽管一份规范的说明书一般分为八个部分撰写，但是，它们之间具有密切的关联。例如，在理解发明或实用新型时，第三部分背景技术是起点，第四部分所要解决的技术问题是目标，第五部分技术方案是途径，第六部分有益效果是最终落点，而第八部分具体实施方式在判断发明或实用新型是否充分公开、是否为权利要求提供支持方面具有重要作用。'},
  {ch:3,type:'multi',q:'按照保护范围之间的关系，发明和实用新型专利申请文件中的权利要求可分为( )。',o:["产品权利要求", "独立权利要求", "方法权利要求", "从属权利要求", "功能权力要求"],a:[1, 3],x:'本题考查发明和实用新型专利申请文件。按照保护范围之间的关系，权利要求还可分为独立权利要求和从属权利要求。'},
  {ch:3,type:'single',q:'下列不属于发明和实用新型专利申请文件中说明书的构成的是( )。',o:["发明或实用新型名称", "技术领域", "申请书", "技术方案"],a:2,x:'本题考查发明和实用新型专利申请文件。说明书的构成包括以下八个部分：发明或实用新型名称、技术领域、背景技术、所要解决的技术问题、技术方案、有益效果、附图说明、具体实施方式'},
  {ch:4,type:'single',q:'记载发明或者实用新型及确定其保护范围的法律文件是( )。',o:["说明书和权利要求书", "说明书及附图", "权利要求书", "说明书"],a:0,x:'本题考查发明和实用新型专利的保护范围。说明书和权利要求书是记载发明或者实用新型及确定其保护范围的法律文件。说明书及附图主要用于清楚、完整地描述发明或者实用新型，使所属技术领域的技术人员能够理解和实施该发明或者实用新型。权利要求书以说明书为依据，清楚、简要地限定要求专利保护的范围。'},
  {ch:3,type:'multi',q:'专利申请权权属纠纷主要包括( )。',o:["发明人主体确认的纠纷", "外观设计的设计人主体确认的纠纷", "合作完成的发明创造中，确认有权申请专利主体的纠纷", "职务发明创造中，给予发明人奖励和报酬的纠纷", "一项发明成果是否为职务发明创造的纠纷"],a:[0, 1, 2, 4],x:'本题考查专利权属纠纷。专利申请权权属纠纷主要包括以下三种情形：关于一项发明成果是职务发明创造还是非职务发明创造的纠纷；关于谁是发明创造的发明人或设计人的纠纷；关于合作完成或者接受委托完成的发明创造，谁有权申请专利的纠纷。'},
  {ch:3,type:'multi',q:'《专利法》提出的三类专利保护客体有( )。',o:["科学发现", "发明", "实用新型", "智力活动", "外观设计"],a:[1, 2, 4],x:'本题考查专利保护客体。《专利法》规定的第一类发明创造即为发明，第二类发明创造为实用新型，第三类发明创造为外观设计。'},
  {ch:3,type:'multi',q:'下列属于智力活动规则或方法的有( )。',o:["演绎、推理和运筹的方法", "发现自然规律", "计算机程序本身", "字典的编排方法", "数学理论和换算方法"],a:[0, 2, 3, 4],x:'本题考查专利保护客体。演绎、推理和运筹的方法；数学理论和换算方法；信息表述方法；计算机程序本身；图书分类规则、字典的编排方法、情报检索的方法、专利分类法；日历的编排规则和方法；商业方法。这类发明创造判断起来比较简单，因而处理方式也比较直接，即判定其属于智力活动规则或方法，不授予专利权。'},
  {ch:3,type:'multi',q:'根据《专利法实施细则》第二十八条，外观设计专利申请文件中的简要说明应当包括的内容有( )。',o:["外观设计产品的使用方法", "外观设计产品的名称", "外观设计产品的用途", "外观设计的设计要点", "指定一幅最能表明设计要点的图片或者照片"],a:[1, 2, 3, 4],x:'本题考查外观设计专利申请文件。根据《专利法实施细则》第二十八条，简要说明应当包括下列四项内容：(1)外观设计产品的名称。(2)外观设计产品的用途。(3)外观设计的设计要点。(4)指定一幅最能表明设计要点的图片或者照片。'},
  {ch:3,type:'single',q:'下列选项中不可以构成外观设计的是( )。',o:["产品的形状", "产品的形状和图案", "产品的色彩", "产品的形状、图案和色彩"],a:2,x:'本题考查专利保护客体。可以构成外观设计的组合有：产品的形状，产品的图案，产品的形状和图案，产品的形状和色彩，产品的图案和色彩，产品的形状、图案和色彩。'},
  {ch:3,type:'single',q:'对产品、方法或者其改进所提出的新的技术方案称为( )。',o:["发明", "实用新型", "外观设计", "科学发现"],a:0,x:'本题考查专利保护客体。发明的定义为：对产品、方法或者其改进所提出的新的技术方案'},
  {ch:3,type:'single',q:'原则上，职务发明的专利申请权和专利权归属于( )。',o:["发明人", "单位", "设计人", "设计人与单位共有"],a:1,x:'本题考查专利权属纠纷。原则上，职务发明的专利申请权和专利权归属于其单位，非职务发明的专利申请权和专利权归属于其发明人或者设计人。但是，职务发明还需分两种情形分别对待：①利用本单位的物质技术条件所完成的职务发明，单位与发明人或者设计人可以通过签订合同对专利申请权和专利权的归属作出约定。双方可以约定专利申请权和专利权归任何一方，或者双方共有，只要达成一致均被法律认可。②执行本单位的任务所完成的职务发明，其专利申请权和专利权只能归单位所有，单位与发明人或者设计人之间无权自行约定。'},
  {ch:3,type:'single',q:'职务发明的专利申请权和专利权虽然归单位所有，但是完成该职务发明的发明人或者设计人的署名权归( )所有。',o:["对该发明创造的实质性特点做出创造性贡献的人", "单位", "只负责组织工作的人", "只为物质技术条件的利用提供方便的人"],a:0,x:'本题考查专利权属纠纷。职务发明的专利申请权和专利权虽然归单位所有，但是完成该职务发明的发明人或者设计人的署名权仍然归其个人所有，必须依法给予保护。这里的发明人或者设计人，是指对该发明创造的实质性特点做出创造性贡献的人。在完成发明创造过程中，只负责组织工作的人、为物质技术条件的利用提供方便的人或者从事其他辅助工作的人，不是发明人或者设计人。'},
  {ch:3,type:'multi',q:'下列关于专利权属纠纷的说法，正确的有( )。',o:["委托发明和合作发明，其发明成果的专利申请权和专利权归属规定是一致的", "委托发明和合作发明，在当事各方未就此作出约定的情况下，按照法律的规定确定发明成果的专利申请权和专利权归属", "委托发明和合作发明，在当事各方未就此作出约定或约定不明确的情况下，专利申请权和专利权归完成或者共同完成该发明成果的单位或者个人所有", "委托发明和合作发明，专利申请权和专利权归出资的委托方所有", "委托发明和合作发明，在当事各方约定不明确的情况下，统一采用“谁发明谁拥有”的规则"],a:[0, 1, 2, 4],x:'本题考查专利权属纠纷。委托发明和合作发明，其发明成果的专利申请权和专利权归属规定是一致的：法律首先尊重当事人的意思自治，即各相关方可以自行约定委托发明成果的专利申请权和专利权归属；在当事各方未就此作出约定或约定不明确的情况下，再按照法律的规定确定发明成果的专利申请权和专利权归属，并且统一采用“谁发明谁拥有”的规则，即专利申请权和专利权归完成或者共同完成该发明成果的单位或者个人所有，而不是归出资的委托方所有。'},
  {ch:1,type:'single',q:'当事人对负责专利执法的部门查处假冒专利行为时作出的罚款、没收违法所得等行政处罚不服的，可以自收到通知之日起( )内向有管辖权的人民法院提起行政诉讼。',o:["15日", "28日", "1个月", "3个月"],a:0,x:'本题考查专利行政纠纷。根据专利法的规定，负责专利执法的部门认定假冒专利成立时，可以处以违法所得5倍以下的罚款；没有违法所得或者违法所得在5万元以下的，可以处25万元以下的罚款。当事人对处罚决定不服的，可以自收到通知书之日起15日内向有管辖权的人民法院提起行政诉讼。'},
  {ch:4,type:'multi',q:'我国企业遇到的海外专利风险类型，主要包括( )风险。',o:["海关扣押", "盗窃商业秘密", "贸易调查", "专利侵权诉讼", "并购合同纠纷"],a:[0, 2, 3, 4],x:'本题考查海外专利纠纷的类型。从我国企业遇到的海外专利纠纷的类型来看，主要包括：专利侵权诉讼；海外展会专利纠纷；贸易调查，具有代表性的如美国的“337调查”；海关扣押；其他海外专利纠纷。并购合同纠纷属于其他海外专利纠纷。'},
  {ch:4,type:'single',q:'专利行政裁决的特点不包括( )。',o:["程序简便", "效率高", "专业性强", "灵活性大"],a:3,x:'本题考查专利侵权纠纷行政裁决。专利侵权纠纷行政裁决与其他纠纷解决途径相比具有很多的优越性：效率高、程序简便清晰、成本低、专业性强。'},
  {ch:4,type:'single',q:'记载发明或者实用新型及确定其保护范围的法律文件是( )。',o:["说明书和权利要求书", "说明书及附图", "权利要求书", "说明书"],a:0,x:'本题考查发明和实用新型专利的保护范围。说明书和权利要求书是记载发明或者实用新型及确定其保护范围的法律文件。说明书及附图主要用于清楚、完整地描述发明或者实用新型，使所属技术领域的技术人员能够理解和实施该发明或者实用新型。权利要求书以说明书为依据，清楚、简要地限定要求专利保护的范围'},
  {ch:4,type:'single',q:'为了很好的保护好专利权人的权利，我国采用( )原则对专利权确定保护范围。',o:["中心限定原则", "周边限定原则", "折衷原则", "公平公正原则"],a:2,x:'本题考查专利权保护范围确定的原则。目前，全球主要国家都采用折衷原则确定专利权的保护范围。实践中，我国也采用折衷原则确定专利权的保护范围，北京市高级人民法院发布的《专利侵权判定指南(2017)》更是明确将折衷原则列为确定专利权保护范围的解释原则。'},
  {ch:4,type:'single',q:'纠纷当事人对侵权纠纷裁决不服的可以以行政裁决机关为被告向( )提起行政诉讼。',o:["人民法院", "专利行政部门", "国务院专利行政部门", "侵权行为地的管理专利工作的部门"],a:0,x:'本题考查专利侵权纠纷行政裁决。《专利法》第六十五条规定了纠纷当事人对侵权纠纷裁决不服的可以以行政裁决机关为被告向人民法院提起行政诉讼，而损害赔偿争议若调解不成则要向人民法院再提起民事诉讼。'},
  {ch:1,type:'single',q:'目前，全球主要国家确定专利权的保护范围都采用( )。',o:["折衷原则", "中心限定原则", "周边限定原则", "公平公正原则"],a:0,x:'本题考查专利权保护范围确定的原则。目前，全球主要国家都采用折衷原则确定专利权的保护范围。'},
  {ch:1,type:'single',q:'在确定专利权的保护范围时，根据说明书及附图、现有技术、专利对现有技术所做的贡献等因素合理确定专利权的保护范围的原则是( )。',o:["中心限定原则", "周边限定原则", "公平公正原则", "折衷原则"],a:3,x:'本题考查专利权保护范围确定的原则。折衷原则是指在确定专利权的保护范围时，既以权利要求书为依据，但又不完全局限于权利要求书的文字记载，而是根据说明书及附图、现有技术、专利对现有技术所做的贡献等因素合理确定专利权的保护范围。'},
  {ch:1,type:'multi',q:'长期以来，在确定专利权的保护范围方面形成的代表性的原则包括( )。',o:["中心限定原则", "周边限定原则", "公平公正原则", "折衷原则", "系统性原则"],a:[0, 1, 3],x:'本题考查专利权保护范围确定的原则。长期以来，在确定专利权的保护范围方面形成了三种代表性的原则，分别是中心限定原则、周边限定原则和折衷原则。'},
  {ch:4,type:'single',q:'一项发明创造在被授予专利权之后，有关当事人之间就谁应当是真正的专利权人所发生的争执称为( )。',o:["专利权属纠纷", "专利侵权纠纷", "专利合同纠纷", "专利权权属纠纷 查看答案解析"],a:3,x:'本题考查专利权属纠纷。专利权权属纠纷，是指一项发明创造在被授予专利权之后，有关当事人之间就谁应当是真正的专利权人所发生的争执。'},
  {ch:4,type:'single',q:'下列因素一般不会导致专利权转让合同纠纷的是( )。',o:["专利权属存在争议", "专利权事先已经失效，或者事后被宣告无效", "专利权受到第三方侵犯", "转让人没有取得共同专利权人的同意"],a:2,x:'本题考查专利合同纠纷。专利权转让合同的当事人之间比较容易产生纠纷。引起这类纠纷的原因主要包括：①专利权属存在争议；②专利权事先已经失效，或者事后被宣告无效；③转让人没有取得共同专利权人的同意；④转让人隐瞒专利许可实施状况；⑤受让人对专利权人的技术支持、专利的技术效果不满意等'},
  {ch:4,type:'single',q:'权利要求书应当以( )为依据，清楚、简要地限定要求专利保护的范围。',o:["说明书和权利要求书", "说明书及附图", "权利要求书", "说明书"],a:3,x:'本题考查发明和实用新型专利的保护范围。《专利法》第二十六条第四款规定：权利要求书应当以说明书为依据，清楚、简要地限定要求专利保护的范围。其中，“以说明书为依据”“清楚”“简要”即是以权利要求为准的基本条件。'},
  {ch:4,type:'multi',q:'专利合同纠纷的类别包括( )。',o:["专利技术实施许可合同纠纷", "专利侵权调解合同纠纷", "专利产品开发合同纠纷", "专利技术中介服务合同纠纷", "专利权转让合同纠纷"],a:[0, 2, 3, 4],x:'本题考查专利合同纠纷。专利合同纠纷是指当事人之间围绕与专利有关的合同所发生的争执，主要包括专利产品开发合同纠纷、专利权转让合同纠纷、专利技术实施许可合同纠纷、专利技术中介服务合同纠纷等。'},
  {ch:4,type:'single',q:'专利侵权纠纷行政裁决与其他纠纷解决途径相比，优越性不包括( )。',o:["专利行政部门处理专利侵权纠纷，效率更高", "专利侵权案件经形式审查严格，程序更复杂", "专利行政裁决具有成本优势，有效降低了救济成本", "行政裁决与其他解决途径相比专业性更强"],a:1,x:'本题考查专利侵权纠纷行政裁决。专利侵权纠纷行政裁决与其他纠纷解决途径相比具有很多的优越性。①从效率上看，专利行政部门处理专利侵权纠纷，应当自立案之日起3个月内结案。案件特别复杂需要延长期限的，由专利行政部门负责人批准可最多延长不超过1个月。②从程序上看，专利侵权案件经形式审查合格符合受理条件即可受理，经过专利行政部门向纠纷双方转送文书、择期进行口头审理等程序后，相关专利行政部门即作出侵权与否的行政裁决决定，程序简便清晰。③从成本上看，专利行政裁决还具有成本优势，目前法律尚未授权专利行政机关可以进行判决赔偿，但被侵权的专利权人到行政机关寻求救济并不需缴纳受理费，同时，简便的程序也能有效降低其救济成本。④从专业性角度看，行政裁决与其他解决途径相比专业性更强，更适于解决专利民事纠纷。国家知识产权局有关统计显示，近年来，当事人因不服专利侵权纠纷裁定提起行政诉讼的案件诉讼率偏低，而一审案件中，行政机关胜诉率较高。'},
  {ch:3,type:'single',q:'针对中心限定原则对专利权人保护的优缺点，下列说法错误的是( )。',o:["可以为专利权提供尽可能大的保护", "有效防止有人利用专利申请文件撰写的漏洞规避相应的责任", "大大降低了对专利申请文件的撰写要求", "使专利权的保护范围更加明确"],a:3,x:'本题考查专利权保护范围确定的原则。中心限定原则对专利权人有利，可以为专利权提供尽可能大的保护，有效防止有人利用专利申请文件撰写的漏洞规避相应的责任，大大降低了对专利申请文件的撰写要求。权利要求书不必进行高度的抽象和概括，即使由于各种原因没有在权利要求书中写入的技术特征或技术方案，也有可能在将来的侵权诉讼中获得保护。中心限定原则的弊端也很明显，就是会导致专利权的保护范围比较模糊，增大了不确定性，而且过度扩大解释对社会公众来说会有些不公平，也会阻碍科技的创新发展。'},
  {ch:4,type:'multi',q:'在进行专利侵权纠纷中，赔偿损失是专利侵权最常见的民事责任。我国《专利法》规定的计算损害赔偿数额的方法包括( )。',o:["权利人实际损失", "法定赔偿", "侵权人获利", "精神损失", "许可费合理倍数"],a:[0, 1, 2, 4],x:'本题考查专利侵权纠纷。赔偿损失是专利侵权最常见的民事责任。我国《专利法》规定了四种计算损害赔偿数额的方法，分别简称为权利人实际损失、侵权人获利、许可费合理倍数以及法定赔偿。'},
  {ch:4,type:'multi',q:'专利纠纷多元解决机制主要包括( )。',o:["专利侵权纠纷行政裁决", "专利行政纠纷调解", "专利诉讼", "专利仲裁", "专利申诉"],a:[0, 2, 3],x:'本题考查专利纠纷多元解决机制。专利纠纷多元解决机制主要包括专利侵权纠纷行政裁决、专利诉讼、专利仲裁等。'},
  {ch:3,type:'single',q:'A公司委托B公司开发一款防新型冠状病毒的口罩，由于委托协议未明确约定研发成果专利申请权的归属，研发成果交付后，A公司和B公司都认为只有自己有申请专利的权利，由此双方产生了纠纷，属于( )。',o:["关于一项发明成果是职务发明创造还是非职务发明创造的纠纷", "关于谁是发明创造的发明人或设计人的纠纷", "关于合作完成或者接受委托完成的发明创造，谁有权申请专利的纠纷", "关于当事人之间谁应当是真正的专利权人所发生的纠纷"],a:2,x:'本题考查专利权属纠纷。关于合作完成或者接受委托完成的发明创造，谁有权申请专利的纠纷。例如，A公司委托B公司开发一款防新型冠状病毒的口罩，由于委托协议未明确约定研发成果专利申请权的归属，研发成果交付后，A公司和B公司都认为只有自己有申请专利的权利，由此双方产生了纠纷'},
  {ch:4,type:'multi',q:'针对海外专利纠纷的解决策略，下列属于制订应诉策略的有( )。',o:["针对诉讼程序提出异议", "进行构成侵权的抗辩", "缩小专利权保护范围", "现有技术抗辩和提出专利权无效请求", "提起反制性质的诉讼"],a:[0, 2, 3, 4],x:'本题考查海外专利纠纷的应对。制定应诉策略：①针对诉讼程序提出异议，如原告不具备提起诉讼的资格、受理案件的法院无管辖权或者超过诉讼时效等；②进行不构成侵权的抗辩，如根据侵权判定标准，结合当地相关法律，搜集证据证明被诉侵权产品未落入专利权的保护范围，不构成专利侵权；③缩小专利权保护范围，如提供权利人申请专利时所做的放弃或缩小权利要求范围的陈述，通过禁止反悔原则，限缩权利要求保护范围，使原吿侵权诉讼不成立；④现有技术抗辩，如提供证据证明被告使用的技术为公知技术，进行不侵权的抗辩；⑤提出专利权无效请求，对诉讼涉及的穿利权进行稳定性分析，如判定权利不稳定，可依据当地法律法规提出专利权无效或撤销的请求，令对方失去提起诉讼的权利基础；⑥提起反制性质的诉讼，分析对方产品是否落入到己方或关联企业的知识产权保护范围，一旦发现对方产品侵犯己方知识产权，可在当地提起反制性的诉讼，谋求和解。'},
  {ch:1,type:'single',q:'相似外观设计专利权的保护范围由( )分别确定。',o:["简要说明的内容", "基本设计", "各个独立的外观设计", "非相关的外观设计"],a:2,x:'本题考查外观设计专利权的保护范围。相似外观设计专利权的保护范围由各个独立的外观设计分别确定。基本设计与其他各项相似设计均可以作为确定各自外观设计专利权保护范围的依据。'},
  {ch:4,type:'single',q:'美国的“337调查”属于我国海外专利纠纷类型中的( )。',o:["专利侵权诉讼", "海外展会专利纠纷", "贸易调查", "海关扣押"],a:2,x:'本题考查海外专利纠纷的类型。企业在开拓海外市场过程中，一旦遭遇专利侵权纠纷，势必将会花费高额的费用，付出巨大的时间成本。从我国企业遇到的海外专利纠纷的类型来看，主要包括：专利侵权诉讼；海外展会专利纠纷；贸易调查，具有代表性的如美国的“337调查”；海关扣押；其他海外专利纠纷。'},
  {ch:4,type:'single',q:'在我国海外专利纠纷类型中，以引发诉讼主体的类型来分，可以分为( )。',o:["竞争对手型诉讼、NPE型诉讼和合作方诉讼", "竞争对手型诉讼和NPE型诉讼", "NPE型诉讼和合作方诉讼", "市场阻止型诉讼和许可收益型诉讼"],a:0,x:'本题考查海外专利纠纷的类型。海外专利诉讼可以分为多种类型：以引发诉讼主体的类型来分，可以分为竞争对手型诉讼、NPE(非专利实施主体，Non-Practicing Entities)型诉讼和合作方(客户、采购方)诉讼；以诉讼目的不同，可以分为市场阻止型诉讼和许可收益型诉讼。'},
  {ch:4,type:'multi',q:'下列关于发明与实用新型专利保护范围的说法，正确的有( )。',o:["每一项权利要求应当清楚，构成权利要求书的所有权利要求作为一个整体也应当清楚", "每项权利要求的类型应当清楚，权利要求的主题名称应当能够清楚地表明该权利要求的类型，是产品权利要求还是方法权利要求", "每项权利要求所确定的保护范围应当清楚", "为保证保护范围相对更清楚，可以使用“例如”“最好是”等用语", "权利要求的用语应当规范，在恰当的时候使用“厚”“薄”“强”“弱”等含义的用语"],a:[0, 1, 2],x:'本题考查发明和实用新型专利的保护范围。权利要求书应当清楚的含义是：每一项权利要求应当清楚，构成权利要求书的所有权利要求作为一个整体也应当清楚。①要求每项权利要求的类型应当清楚，权利要求的主题名称应当能够清楚地表明该权利要求的类型，是产品权利要求还是方法权利要求。②要求每项权利要求所确定的保护范围应当清楚，为此权利要求的用语应当规范，不得使用“厚”“薄”“强”“弱”等含义不确定的用语，不得使用“例如”“最好是”“尤其是”“必要时”“接近”“等”“或类似物”等导致保护范围不清楚的类似用语。'},
  {ch:3,type:'single',q:'发明或者实用新型专利权的保护范围以其权利要求的内容为准。对于“以其权利要求的内容为准”的含义理解正确的是( )。',o:["在说明书或者附图中描述而未被概括到权利要求中的技术方案，应纳入发明或者实用新型专利权的保护范围", "发明或者实用新型专利权的保护范围仅包括权利要求记载的技术特征所确定的内容", "权利要求只是确定了一个总的发明构思，仅具有指导作用", "权利要求存在多个文本的，以最终有效的文本为准"],a:3,x:'本题考查发明和实用新型专利的保护范围。“以其权利要求的内容为准”包含以下五层含义。(1)确定发明或者实用新型专利权的保护范围时，应当以国务院专利行政部门公告授权的专利文本或者已经发生法律效力的无效宣告请求审查决定及相关的确权行政判决所确定的权利要求为准。权利要求存在多个文本的，以最终有效的文本为准。(2)发明或者实用新型专利权的保护范围应当根据权利要求的内容来确定，而不能背离权利要求的内容。既不能将专利权的保护范围严格限定为权利要求的字面含义，只将说明书及附图用于解释权利要求中含糊不清之处；也不能认为权利要求只是确定了一个总的发明构思，仅具有指导作用，而将专利权的保护范围扩展到所属领域的技术人员通过阅读说明书及附图所能理解的更大范围。(3)仅在说明书或者附图中描述而未被概括到权利要求中的技术方案，视为专利权人放弃了对该技术方案的保护，不应纳入发明或者实用新型专利权的保护范围。(4)发明或者实用新型专利权的保护范围既包括权利要求记载的技术特征所确定的内容，也包括与权利要求所记载的技术特征相等同的技术特征所确定的内容。(5)如果权利要求与专利说明书出现不一致或者相互矛盾，在专利权未被无效宣告程序宣告无效的情况下，应当按照专利权有效原则，以权利要求的字面含义所确定的保护范围为准。'},
  {ch:1,type:'single',q:'专利所要克服技术缺陷的技术方案，以及整体上属于现有技术的技术方案，就属于不应纳入保护范围的内容，这体现了权利要求解释的( )。',o:["折衷原则", "公平原则", "公正原则", "整体原则"],a:1,x:'本题考查发明和实用新型专利的保护范围。公平原则体现在解释权利要求时，不仅要充分考虑专利对现有技术所做的贡献，合理界定专利权利要求限定的保护范围，保护权利人的利益，还要充分考虑权利要求的公示作用，兼顾社会公众的信赖利益，不能把不应纳入保护的内容解释到权利要求的范围当中。例如，专利所要克服技术缺陷的技术方案，以及整体上属于现有技术的技术方案，就属于不应纳入保护范围的内容'},
  {ch:5,type:'single',q:'专利权人许可他人在合同约定地域、期限以及方式的范围内实施其专利技术，并允许被许可人在一定条件下再许可第三人使用该技术的许可，是指( )。',o:["独占许可", "交叉许可", "普通许可", "分许可"],a:3,x:'本题考查专利许可。分许可，是指专利权人许可他人在合同约定地域、期限及方式的范围内实施其专利技术，并允许被许可人在一定的条件下再许可第三人使用该技术的许可。'},
  {ch:5,type:'multi',q:'按流程划分，专利检索的步骤主要包括( )。',o:["构建检索需求表达式", "整理技术空白点", "收集和整理检索要素", "确定检索目标的技术方案", "修正检索表达式"],a:[0, 2, 3, 4],x:'本题考查专利检索的步骤。从流程上看，专利检索主要包括确定检索目标的技术方案、收集和整理检索要素、构建检索表达式、修正检索表达式四个步骤。'},
  {ch:5,type:'multi',q:'下列专利运用方式中，属于为行为主体实现直接收益的方式有( )。',o:["专利导航", "专利许可", "专利自实施", "专利转让", "专利质押"],a:[1, 2, 3, 4],x:'本题考查专利运用的含义与内容。专利的产业化既包括专利的自实施，也包括许可、交易、转让后的他人实施。对于行为主体而言，无论是哪种方式的产业化都能够带来社会生产效率的提升，因此专利产业化所实现的收益都属于直接收益。专利商品化的表现形式包括专利许可、专利交易、专利转让等。对于行为主体而言，无论是哪种方式的商品化都能够带来社会配置效率的提升，因此专利商品化所实现的收益都属于直接收益。专利金融化的表现形式包括专利质押融资、专利保险、专利股权化、专利证券化等，其所实现的收益都属于直接收益。'},
  {ch:5,type:'single',q:'关于开放许可的说法，正确的是( )。',o:["开放许可不需要支付使用费", "开放许可只能是独占许可", "开放许可只能普通或者排他许可", "开放许可属于自愿许可的范畴，但政府可以通过参与其中提供相关服务"],a:3,x:'本题考查开放许可。开放许可会明确许可使用费支付方式、标准，选项A错误。开放许可只能是普通许可，不能就该专利给予独占或者排他许可，选项BC错误。开放许可属于自愿许可的范畴，但政府可以通过参与其中提供相关服务，选项D正确。'},
  {ch:5,type:'multi',q:'第四次修正后的《专利法》关于专利开放许可的规定，说法正确的有( )。',o:["就实用新型、外观设计专利提出开放许可声明的，应当提供专利权评价报告", "专利权人撤回开放许可声明的，不需要再以书面方式提出", "开放许可实施期间，对专利权人缴纳专利年费相应给予减免", "当事人实施开放许可发生纠纷的，可以由当事人协商解决", "当事人实施开放许可发生纠纷，不愿协商或者协商不成的，只能向人民法院起诉，不能再请求国务院专利行政部门调解"],a:[0, 2, 3],x:'本题考查开放许可。专利权人撤回开放许可声明的，应当以书面方式提出，并由国务院专利行政部门予以公告，选项B错误。当事人实施开放许可发生纠纷，不愿协商或者协商不成的，可以请求国务院专利行政部门进行调解，也可以向人民法院起诉。'},
  {ch:4,type:'single',q:'在判定被控侵权技术方案是否落入专利权的保护范围时，应当审查权利人主张的权利要求所记载的全部技术特征，并逐一进行比较。这是采用( )进行判断。',o:["全面覆盖原则", "反悔原则", "捐献原则", "禁止反悔原则"],a:0,x:'本题考查专利侵权纠纷。全面覆盖原则是指在判定被控侵权技术方案是否落入专利权的保护范围时，应当审查权利人主张的权利要求所记载的全部技术特征，并以权利要求中记载的全部技术特征与被控侵权技术方案所对应的全部技术特征逐一进行比较。'},
  {ch:1,type:'multi',q:'关于外观设计专利权的保护范围，下列说法正确的有( )。',o:["外观设计专利权的保护范围以表示在图片或者照片中的该产品的外观设计为准", "外观设计专利权所保护的应当是同类产品外观设计的范围", "不是同类产品，即使外观设计相同，也不能认为是侵犯了专利权", "不是同类产品，如果外观设计相同，则认为是侵犯了专利权", "基本设计与其他各项相似设计均可以作为确定各自外观设计专利权保护范围的依据"],a:[0, 1, 2, 4],x:'本题考查外观设计专利权的保护范围。根据《专利法》第六十四条，外观设计专利权的保护范围以表示在图片或者照片中的该产品的外观设计为准，简要说明可以用于解释图片或者照片所表示的该产品的外观设计。外观设计专利权所保护的“表示在图片或者照片中的该产品的外观设计”的范围，应当是同类产品外观设计的范围；不是同类产品，即使外观设计相同，也不能认为是侵犯了专利权。简要说明中记载的产品名称和产品用途是确定外观设计产品种类的依据。对整体视觉效果不产生影响的产品的大小、材料、内部结构，应当排除在外观设计专利权的保护范围之外。相似外观设计专利权的保护范围由各个独立的外观设计分别确定。基本设计与其他各项相似设计均可以作为确定各自外观设计专利权保护范围的依据'},
  {ch:5,type:'multi',q:'不同专利质押模式的区别主要体现在( )等方面，它们各有优劣。',o:["抵押资金", "政府的参与程度", "合同类型", "质押模式", "担保模式"],a:[1, 3, 4],x:'本题考查专利质押。不同专利质押模式的区别主要体现在政府的参与程度、质押模式、担保模式等方面，它们各有优劣。'},
  {ch:5,type:'multi',q:'各个银行对企业申请专利质押贷款的基本条件要求不尽相同，一般需要企业满足的条件包括( )。',o:["符合规定的中小企业规模标准", "股权清晰，有必要且合理的组织机构、经营管理制度和财务管理制度", "生产经营合法，产品有市场或有明确的市场预期", "企业无银行违约记录，商业信誉良好，企业实际控制人无银行违约记录", "有合理的产业结构"],a:[0, 1, 2, 3],x:'本题考查专利质押。各个银行对企业申请专利质押贷款的基本条件要求不尽相同，但一般需要企业满足以下条件：符合规定的中小企业规模标准；股权清晰，有必要且合理的组织机构、经营管理制度和财务管理制度；生产经营合法，产品有市场或有明确的市场预期；企业无银行违约记录，商业信誉良好，企业实际控制人无银行违约记录；有生产经营场所和相对稳定的员工队伍；借款用途合规合法；申请贷款企业应为设立质押知识产权的实施主体；企业同意对设立质押知识产权进行法律审查和资产评估。'},
  {ch:5,type:'multi',q:'专利质押常见的风险主要有( )。',o:["操作风险", "法律风险", "经济风险", "变现风险", "回收风险"],a:[1, 2, 3],x:'本题考查专利质押。专利质押常见的风险主要有法律风险、经济风险、变现风险。'},
  {ch:5,type:'multi',q:'为了降低专利质押的高成本和金融机构面临的高风险，促进专利质押活动的开展，目前，在专利质押实践中，常见的风险控制机制有( )。',o:["保证资产收购价格机制", "联合担保机制", "专利转让机制", "专利质押反担保机制", "专利质押融资风险补偿机制"],a:[0, 1, 3, 4],x:'本题考查专利质押。为了降低专利质押的高成本和金融机构面临的高风险，促进专利质押活动的开展，目前，在专利质押实践中，常见的风险控制机制有：保证资产收购价格机制、联合担保机制、专利质押反担保机制、专利质押融资风险补偿机制。'},
  {ch:1,type:'single',q:'专利执行保险的承保费用不包括( )。',o:["专家作证费", "律师费", "和解费", "败诉赔偿费用"],a:3,x:'本题考查专利保险。专利执行保险的承保范围为主张被告侵权的所有专利诉讼的费用，律师费、和解费、出庭费、专家作证费等开支均包含在内，但并不包含败诉的损害赔偿费用。'},
  {ch:5,type:'single',q:'自由型专利质押中，政府的角色为( )。',o:["政策引导", "信用增强", "再担保", "分担风险"],a:0,x:'本题考查专利质押的模式。在自由型专利质押模式下，政府的角色主要是出台政策并加以引导，避免了过多的行政干预，质押主要由市场自主进行，基本实现市场化操作。'},
  {ch:5,type:'single',q:'银行在进行专利质押贷款调查时，贷前调查的内容不包括( )。',o:["企业员工规模", "企业再融资情况", "企业法人治理结构", "知识产权授权许可使用情况"],a:0,x:'本题考查专利质押的流程。银行贷前调查是指银行对企业业务经营和知识产权有关状况开展的法律调查，调查内容一般包括企业法人治理结构、企业实际控制人资信状况、企业经营模式与现状、企业经营规划与资金使用计划、企业融资现状、知识产权注册登记情况、知识产权在生产经营中的作用、知识产权授权许可使用情况等'},
  {ch:5,type:'single',q:'专利质押的流程中，贷款调查一般包括银行贷前调查和( )。',o:["贷款审批", "贷款受理", "合作机构出具意见", "质押登记"],a:2,x:'本题考查专利质押的流程。贷款调查一般包括银行贷前调查和合作机构出具意见。'},
  {ch:5,type:'single',q:'专利在其权利存续期间，其权利状态存在不稳定的可能性，一项已明确了权利归属的专利在存续期间有被他人提出异议，甚至导致撤销而无效的可能。因此，专利价值的确定首先要( )。',o:["确权", "转让", "出售", "质押"],a:0,x:'本题考查专利质押。专利价值的确定首先要确权，因为专利在其权利存续期间，其权利状态存在不稳定的可能性，一项已明确了权利归属的专利在存续期间有被他人提出异议，甚至导致撤销而无效的可能。'},
  {ch:5,type:'single',q:'金融机构应当委托专业机构对作为担保品的专利进行权利( )的研判。',o:["长期性", "间断性", "持续性", "稳定性"],a:3,x:'本题考查专利质押。金融机构应当委托专业机构对作为担保品的专利进行权利稳定性的研判。'},
  {ch:5,type:'single',q:'下列关于专利质押的经济风险，说法错误的是( )。',o:["对于提供融资的质权人来说，希望质押物的价值可以上涨或者至少维持不变，这样才能达到质押的目的", "企业专利价值的实现与企业的产品和服务不能联系在一起", "产品的生命周期、市场的竞争程度、企业自身经营等各种复杂的因素都会对专利价值的波动产生影响", "对于质权人来说，根据专利现值的评估结果接受该项专利作为融资担保时，要承担可能导致该项专利预期价值下降的经济风险"],a:1,x:'本题考查专利质押。企业专利价值的实现需要与企业的产品和服务联系在一起。'},
  {ch:5,type:'single',q:'关于政府服务型专利质押模式，下列说法正确的是( )。',o:["引入了专业担保机构", "增加了政府的负担和银行的风险", "政府除政策制定者外还起到了担保和分担风险的作用", "减少了担保的成本，质押率相对较高"],a:0,x:'本题考查专利质押的模式。在政府主导型专利质押模式下，政府除政策制定者外还起到了担保和分担风险的作用，虽然存在一定的行政干预，但由于减少了担保的成本，质押率相对较高，选项CD错误。在政府服务型专利质押模式下，政府唱主角，是主要的推动者，同时还引入了专业担保机构，一定程度上减小了政府的负担和银行的风险，但企业相应地增加了融资成本，融资速度也受到影响，选项B错误，选项A正确。'},
  {ch:5,type:'single',q:'设立一个专项基金，当金融机构发放专利质押贷款到期后企业未能还款，通过处置质押品不能完全实现其债权时，由专项基金给予未实现债权的款项补偿，这种专利质押的风险控制机制是( )。',o:["保证资产收购价格机制", "联合担保机制", "专利质押反担保机制", "专利质押融资风险补偿机制"],a:3,x:'本题考查专利质押。专利质押融资风险补偿机制是指设立一个专项基金，当金融机构发放专利质押贷款到期后企业未能还款，通过处置质押品不能完全实现其债权时，由专项基金给予未实现债权的款项补偿。'},
  {ch:5,type:'multi',q:'专利金融化是专利运用的重要内容，其表现形式主要包括( )。',o:["专利质押", "专利保险", "专利转让", "专利股权化", "专利证券化"],a:[0, 1, 3, 4],x:'本题考查专利质押。专利金融化是专利运用的重要内容，主要包括专利质押、专利保险、专利股权化、专利证券化等表现形式'},
  {ch:5,type:'single',q:'债务人或者第三方担保人依法以其合法拥有的专利权的财产权利出质，将该财产权作为债权的担保，债务人不履行债务时，债权人有权依法以该财产权折价或者以拍卖、变卖该财产权的价款优先受偿，这种专利运用方式是( )。',o:["专利保险", "专利质押", "专利转让", "专利股权化"],a:1,x:'本题考查专利质押。专利质押，也称专利质押融资，是指债务人或者第三方担保人依法以其合法拥有的专利权的财产权利出质，将该财产权作为债权的担保，债务人不履行债务时，债权人有权依法以该财产权折价或者以拍卖、变卖该财产权的价款优先受偿。'},
  {ch:5,type:'single',q:'关于自由型专利质押模式，下列说法错误的是( )。',o:["风险主要由银行承担", "难以获得较高的质押率", "企业相应地增加了融资成本", "政府的角色主要是出台政策并加以引导"],a:2,x:'本题考查专利质押的模式。在自由型专利质押模式下，政府的角色主要是出台政策并加以引导，避免了过多的行政干预，质押主要由市场自主进行，基本实现市场化操作。但是，在这种模式下，风险主要由银行承担，因而采用这种模式难以获得较高的质押率。选项C是政府服务型专利质押模式的特点。'},
  {ch:5,type:'single',q:'近年来，在有关部门的大力推动下，各地方政府相继开展专利质押的模式探索，其融资模式也各有特色，其中不包括( )。',o:["自由型专利质押", "非自由型专利质押", "政府主导型专利质押", "政府服务型专利质押"],a:1,x:'本题考查专利质押。近年来，在有关部门的大力推动下，各地方政府相继开展专利质押的模式探索，其融资模式也各有特色，主要分为自由型专利质押、政府主导型专利质押、政府服务型专利质押三种类型。'},
  {ch:5,type:'single',q:'在自由型专利质押模式下，( )的角色主要是出台政策并加以引导，避免了过多的行政干预，质押主要由市场自主进行，基本实现市场化操作。',o:["担保机构", "专利权人", "银行", "政府"],a:3,x:'本题考查专利质押。在自由型专利质押模式下，政府的角色主要是出台政策并加以引导，避免了过多的行政干预，质押主要由市场自主进行，基本实现市场化操作。'},
  {ch:5,type:'single',q:'在政府服务型专利质押模式下，政府唱主角，是主要的推动者，同时还引入了( )，一定程度上减小了政府的负担和银行的风险，但企业相应地增加了融资成本，融资速度也受到影响。',o:["专业担保机构", "专利权人", "银行", "政府"],a:0,x:'本题考查专利质押。在政府服务型专利质押模式下，政府唱主角，是主要的推动者，同时还引入了专业担保机构，一定程度上减小了政府的负担和银行的风险，但企业相应地增加了融资成本，融资速度也受到影响。'},
  {ch:5,type:'single',q:'专利质押的流程不包括( )。',o:["贷款申请", "贷款审批", "质押登记", "内部审核"],a:3,x:'本题考查专利质押。专利质押的流程一般包括贷款申请、贷款受理、贷款调查、贷款审批、签约、质押登记和放款等七个环节。'},
  {ch:5,type:'single',q:'贷款调查主要考察借款人的还款能力和资信状况，审查专利权的( )及市场价值等，一般包括银行贷前调查和合作机构出具意见。',o:["实用性", "持续性", "唯一性", "有效性"],a:3,x:'本题考查专利质押。贷款调查主要考察借款人的还款能力和资信状况，审查专利权的有效性及市场价值等，一般包括银行贷前调查和合作机构出具意见'},
  {ch:6,type:'multi',q:'商标评审案件的受理中，可以请求宣告注册商标无效的有( )。',o:["申请不予注册复审的被异议人", "依绝对理由的任何单位或个人", "依相对理由的在先权利人", "依相对理由的利害关系人", "申请商标驳回复审的商标注册申请人"],a:[1, 2, 3],x:'本题考查商标评审案件的受理。任何单位或个人依绝对理由，或者在先权利人(利害关系人)依相对理由，可以请求宣告注册商标无效。'},
  {ch:6,type:'multi',q:'商标行政复议案件审理的法律依据主要有( )。',o:["《行政复议法》", "《商标法》》", "《行政复议法实施条例》", "《商标法实施条例》", "《国际互联网条约》"],a:[0, 1, 2, 3],x:'本题考查商标行政复议案件的审理。商标行政复议案件审理的法律依据主要有《行政复议法》《行政复议法实施条例》《商标法》《商标法实施条例》等。'},
  {ch:6,type:'single',q:'根据我国商标法，下列说法正确的是( )。',o:["目前只接受单一颜色作为商标注册", "目前不接受颜色组合作为商标申请注册", "单一颜色一般不具有显著特征", "颜色组合一般不具有显著特征"],a:2,x:'本题考查商标的类型。我国目前只接受颜色组合作为商标注册，而不接受单一颜色作为商标申请注册，单一颜色一般不具有显著特征。'},
  {ch:5,type:'multi',q:'合同计价的主要影响因素包括( )。',o:["专利许可贸易合同价格的组成", "经济效益和社会效益", "专利实施的难易程度", "当事人的权利与承担的风险", "买方的支付能力和投产规模"],a:[1, 2, 3, 4],x:'本题考查专利许可。合同计价的主要影响因素包括经济效益和社会效益、专利实施的难易程度、当事人的权利与承担的风险、付款方式、买方的支付能力和投产规模、技术的市场寿命周期和市场供求关系等。'},
  {ch:5,type:'multi',q:'专利许可合同价格的组成大体包括( )。',o:["基础费", "人工费", "技术服务费", "项目设计费", "技术资料费"],a:[0, 2, 3, 4],x:'本题考查专利许可。专利许可合同价格的组成大体包括基础费、技术服务费、项目设计费、技术资料费、项目联络费、技术培训费六部分。'},
  {ch:5,type:'multi',q:'在签订专利许可贸易合同时常见的禁用条款有( )。',o:["搭售条款", "不竞争条款", "反控条款", "对购买渠道的不合理限制", "对改良许可专利技术的限制"],a:[0, 1, 3, 4],x:'本题考查专利许可。在签订专利许可贸易合同时常见的禁用条款有五种：搭售条款、不竞争条款、不得反控条款、对购买渠道的不合理限制、对改良许可专利技术的限制。'},
  {ch:5,type:'single',q:'主要由市场自主进行的专利质押模式是( )。',o:["自由型专利质押", "政府主导型专利质押", "政府服务型专利质押", "政府指令型专利质押"],a:0,x:'本题考查专利质押的模式。在自由型专利质押模式下，政府的角色主要是出台政策并加以引导，避免了过多的行政干预，质押主要由市场自主进行，基本实现市场化操作'},
  {ch:6,type:'single',q:'下列互为类似商品的是( )。',o:["衬衫与裤子", "汽车与汽油", "餐馆与饭店", "土豆与马铃薯"],a:0,x:'本题考查商标注册申请的审查。类似商品是指在功能、用途、生产部门，销售渠道，消费对象等方面相同或基本相同的商品。例如，毛巾与枕巾、衬衫与裤子互为类似商品。选项B属于互补品，选项C属于类似服务、选项D属于相同商品。'},
  {ch:6,type:'multi',q:'下列商标中，在申请注册时应当在申请书中说明商标使用方式的有( )。',o:["声音商标", "服务商标", "商品商标", "颜色组合商标", "立体商标"],a:[0, 3],x:'本题考查商标注册申请的审查。申请注册颜色组合商标的，申请人应当在商标说明中列明颜色名称和色号，并描述该颜色组合商标在商业活动中的具体使用方式。声音商标可以由音乐性质的声音构成，如一段乐曲；也可以由非音乐性质的声音构成，如自然界的声音、人或动物的声音；或是由音乐性质与非音乐性质兼有的声音构成。申请人应当说明以何种方式或者在何种情形下使用声音商标。'},
  {ch:3,type:'single',q:'依据《商标法》，下列属于行政裁决的一种特殊形式的是( )。',o:["撤销复审", "无效宣告", "不予注册复审", "无效宣告复审"],a:1,x:'本题考查商标评审。无效宣告是行政裁决的一种特殊形式。'},
  {ch:6,type:'single',q:'对已经受理的案件，就当事人提出的评审请求，事实理由及相应的证据材料进行审查，对案件事实作出认定，并依法作出裁定的过程，即为( )。',o:["商标评审案件的审理", "商标注册申请", "商标复审程序", "案件审理程序"],a:0,x:'本题考查商标评审案件的审理。商标评审案件的审理是指对已经受理的案件，就当事人提出的评审请求，事实理由及相应的证据材料进行审查，对案件事实作出认定，并依法作出裁定的过程，案件审理程序是整个商标评审程序的核心。'},
  {ch:6,type:'single',q:'整个商标评审程序的核心是( )。',o:["商标异议程序", "商标注册程序", "商标复审程序", "案件审理程序"],a:3,x:'本题考查商标评审案件的审理。商标评审案件的审理是指对已经受理的案件，就当事人提出的评审请求，事实理由及相应的证据材料进行审查，对案件事实作出认定，并依法作出裁定的过程，案件审理程序是整个商标评审程序的核心。'},
  {ch:6,type:'single',q:'根据《商标评审规则》的相关规定，审理商标评审案件应当组成合议组进行审理，合议组由( )组成。',o:["2人以上偶数的商标评审人员", "4人以上偶数的商标评审人员", "3人以上单数的商标评审人员", "5人以上单数的商标评审人员"],a:2,x:'本题考查商标评审案件的受理。合议组由3人以上单数的商标评审人员组成。合议组审理案件，实行少数服从多数的原则。'},
  {ch:3,type:'multi',q:'下列复审程序中，属于对经国家知识产权局决定的行政行为的再审查，也是商标行政授权确权程序中给予当事人重要的行政救济手段的有( )。',o:["撤销复审", "无效宣告", "驳回复审", "无效宣告复审", "不予注册复审"],a:[0, 2, 3, 4],x:'本题考查商标评审。依据《商标法》规定，商标评审程序处理商标争议事宜，涉及的案件类型包括驳回复审、不予注册复审、撤销复审、无效宣告复审及无效宣告。前四种复审程序是对经国家知识产权局决定的行政行为的再审查，是商标行政授权确权程序中给予当事人重要的行政救济手段，而无效宣告是行政裁决的一种特殊形式'},
  {ch:1,type:'single',q:'下列关于商标法的自愿注册原则，说法错误的是( )。',o:["自然人、法人或者其他组织在生产经营活动中，对其商品或者服务需要取得商标专用权的，应当向国家知识产权局申请商标注册", "《商标法》对所有的商标都实行自愿注册原则", "法律、行政法规规定必须使用注册商标的商品，必须申请商标注册，未经核准注册的，不得在市场销售", "卷烟、雪茄烟和有包装的烟丝必须申请商标注册，未经核准注册的，不得生产、销售"],a:1,x:'本题考查商标法的基本原则。《商标法》实行自愿注册原则为主的同时，对极少数商标仍然要求强制注册。'},
  {ch:1,type:'multi',q:'商标法的基本原则有( )。',o:["自愿注册原则", "注册保护原则", "诚实信用原则", "公平公正原则", "行政保护与司法保护并举原则"],a:[0, 1, 2, 4],x:'本题考查商标法的基本原则。从整体内容看，商标法体现了以下几个基本原则：自愿注册原则、注册保护原则、申请在先原则、诚实信用原则、行政保护与司法保护并举原则。'},
  {ch:8,type:'single',q:'在先使用人只要在法律规定的期间内提出对在后使用人注册商标的撤销请求，不仅可以撤销他人的已注册商标，而且其商标还可能通过申请获准注册，取得商标权，其依据的商标专用权取得原则是( )。',o:["使用原则", "注册原则", "自愿原则", "混合原则"],a:3,x:'本题考查商标专用权取得的原则。混合原则是使用原则和注册原则的折中适用原则。依这一原则，在先使用人只要在法律规定的期间内提出对在后使用人注册商标的撤销请求，不仅可以撤销他人的已注册商标，而且其商标还可能通过申请获准注册，取得商标权。'},
  {ch:6,type:'single',q:'根据《中华人民共和国商标法》，不能申请注册商标的标志是( )。',o:["声音", "颜色组合", "文字", "气味"],a:3,x:'本题考查商标的定义。根据《中华人民共和国商标法》第八条的规定，商标可定义如下：任何能够将自然人、法人或者其他组织的商品(服务)与他人的商品(服务)区别开的标志，均可以作为商标申请注册。商标由文字、图形、字母、数字、三维标志、颜色组合和声音等，以及上述要素的组合构成。'},
  {ch:1,type:'single',q:'商标应当具有( )。',o:["一致性", "新颖性", "实用性", "显著性"],a:3,x:'本题考查商标的特征。商标是依附于商品或服务而存在的标志；商标是区别商品或服务来源的标志；商标应当具有显著特征；商标是一种可以为人所感知的符号。'},
  {ch:6,type:'single',q:'下列属于近似商标的是( )。',o:["“BMKBGA”与“BMKBAG”", "“球”与“球王”", "“3D时代”与“U9时代”", "“北美风情”与“北欧风情”"],a:0,x:'本题考查商标注册申请的审查。近似商标是指文字、数字、图形、颜色或声音等商标的构成要素，在发音、视觉、意义或排列顺序以及整体上虽有一定区别，但易产生混淆的商标。例如，“丰泽园”与“丰泽源”近似，“BMKBGA”与“BMKBAG”近似，“熊猫”与“panda”近似。'},
  {ch:6,type:'single',q:'下列属于相同商标的是( )。',o:["“丰泽园”与“丰泽源”", "“Susanna”与“SUSANNA”", "“熊猫”与“panda”", "“BMKBGA”与“BMKBAG”"],a:1,x:'本题考查商标注册申请的审查。相同商标指两个标识完全相同，或者在视觉或听觉上基本无差别、足以使相关公众产生误认的商标。例如，“Susanna”与“SUSANNA”为相同商标，即表现形式的细微差别不影响商标相同这一判断结论。选项BCD属于近似商标'},
  {ch:1,type:'single',q:'中国商标史上第一本《商标法》出版于( )。',o:["晚清时期", "北洋政府时期", "广州国民政府时期", "南京国民政府时期"],a:1,x:'本题考查我国商标法律制度。1923年，北洋政府颁布《商标法》，成为中国近代史商标法律与管理的一个重要分水岭。'},
  {ch:6,type:'single',q:'新中国成立后，第一部商标方面的法规颁布于( )。',o:["1950年", "1956年", "1959年", "1960年"],a:0,x:'本题考查我国商标法律制度。1950年颁布了《商标注册暂行条例》及《商标注册暂行条例实施细则》，实行全国商标统一注册制度。它是新中国第一部商标法规，为商标注册与管理制度的建立和发展打下了良好基础。'},
  {ch:8,type:'single',q:'( )是民法的基本原则之一，商标专用权作为一项民事权利，在商标的申请注册及使用中亦应遵守这一原则。',o:["自愿注册原则", "注册保护原则", "诚实信用原则", "申请在先原则"],a:2,x:'本题考查商标法的基本原则。诚实信用原则，是民法的基本原则之一，商标专用权作为一项民事权利，在商标的申请注册及使用中亦应遵守这一原则。参见教材P108。'},
  {ch:1,type:'single',q:'我国商标法律制度的突出特点是( )。',o:["自愿注册原则", "注册保护原则", "诚实信用原则", "行政保护与司法保护并举原则"],a:3,x:'本题考查商标法的基本原则。行政保护与司法保护并举原则是我国商标法律制度的突出特点。'},
  {ch:1,type:'single',q:'下列不属于我国商标法的基本原则的是( )。',o:["自愿注册原则", "申请在先原则", "国际接轨原则", "诚实信用原则"],a:2,x:'本题考查商标法的基本原则。从整体内容看，商标法体现了以下几个基本原则：自愿注册原则、注册保护原则、申请在先原则、诚实信用原则、行政保护与司法保护并举原则。'},
  {ch:7,type:'single',q:'商标使用人可以根据需要自主决定对其使用的商标是否申请注册以获得商标专用权的原则是( )。',o:["自愿注册原则", "注册保护原则", "诚实信用原则", "申请在先原则"],a:0,x:'本题考查商标法的基本原则。自愿注册原则，是指商标使用人可以根据需要自主决定对其使用的商标是否申请注册以获得商标专用权的原则'},
  {ch:2,type:'single',q:'商标注册申请实质审查的内容不包括( )。',o:["对不以使用为目的的恶意商标注册申请的审查", "对禁止作为商标使用的标志的审查", "对商标代理机构在代理服务以外商品项目上申请注册商标的审查", "对代理人未经授权，以自己的名义申请注册被代理人的商标的审查"],a:3,x:'本题考查实质审查。禁止性条款的审查，是审查注册申请是否违反《商标法》禁止注册或使用的规定。法律依据主要包括:《商标法》第四条(不以使用为目的的恶意商标注册申请)，第十条(不得作为商标使用的标志)，第十一条(缺乏显著性的标志)，第十二条(缺乏显著特征的三维标志)以及第十九条第四款(商标代理机构不得申请注册的商标)。'},
  {ch:1,type:'single',q:'在服务目的、内容、方式、对象等方面相同或基本相同的服务是( )。',o:["类似商品", "类似服务", "同一种商品", "同一种服务"],a:1,x:'本题考查类似服务的概念。类似服务是指在服务目的、内容、方式、对象等方面相同或基本相同的服务。'},
  {ch:1,type:'single',q:'两个标识完全相同，或者在视觉或听觉上基本无差别、足以使相关公众产生误认的商标指的是( )。',o:["类似商标", "类似服务", "同一种商品", "相同商标"],a:3,x:'本题考查相同的概念。相同商标指两个标识完全相同，或者在视觉或听觉上基本无差别、足以使相关公众产生误认的商标。'},
  {ch:6,type:'single',q:'下列关于实质审查结果中的初步审定的说法，正确的是( )。',o:["初步审定的商标，享有商标专用权", "拟核准注册的商标可不公告", "初步审定的商标是未注册商标，不享有商标专用权", "初步审定不可以作出核准注册的决定"],a:2,x:'本题考查初步审定。初步审定是指对申请注册的商标，经审查认为其符合法律有关规定，国家知识产权局作出可以核准注册的决定。初步审定的商标是未注册商标，不享有商标专用权。国家知识产权局将拟核准注册的商标予以公告，称为初步审定公告，以《商标公告》形式公示，以便公众能够及时、准确、完整地了解他人商标的申请注册情况，并在法定期限内提出商标异议。'},
  {ch:6,type:'single',q:'需要分割的，申请人应当自收到国家知识产权局《商标注册申请部分驳回通知书》之日起( )日内，向国家知识产权局提出分割申请。',o:["14", "7", "15", "10"],a:2,x:'本题考查分割的申请时限。需要分割的，申请人应当自收到国家知识产权局《商标注册申请部分驳回通知书》之日起15日内，向国家知识产权局提出分割申请。'},
  {ch:2,type:'multi',q:'商标注册申请形式审查的内容主要包括( )。',o:["申请人资格是否合法", "申请人地址是否正确、准确", "申请人名义、章戳是否与营业执照一致", "申请人要求核定的商品或者服务是否填写得具体、规范，分类是否准确", "通过代理办理的，有代理人委托书就可以"],a:[0, 1, 2, 3],x:'本题考查形式审查的内容。形式审查内容主要包括：①申请人资格是否合法；②申请人地址是否正确、准确；③申请人名义、章戳是否与营业执照一致；④申请人要求核定的商品或者服务是否填写得具体、规范，分类是否准确；⑤通过代理办理的，代理人委托书是否符合要求；⑥商标图样的质量、规格是否符合要求；⑦应附的证件、说明是否完备；⑧是否缴纳费用'},
  {ch:1,type:'single',q:'属于注册商标不使用的正当理由是( )。',o:["国家发布新的产品质量标准", "商标注册人死亡", "商标注册人破产", "国家颁布产品新标准后，按照国家标准进行改造"],a:2,x:'本题考查注册商标的撤销。《商标法》第四十九条第二款规定：“注册商标成为其核定使用的商品的通用名称或者没有正当理由连续三年不使用的，任何单位或个人可以向商标局申请撤销该注册商标。商标局应当自收到申请之日起九个月内做出决定。有特殊情况需要延长的，经国务院工商行政管理部门批准，可以延长三个月。”'},
  {ch:1,type:'single',q:'关于注册商标的续展，下列说法错误的是( )。',o:["商标注册人在注册商标有效期满后6个月内申请续展的，应当缴纳延迟费", "续展注册证明应当与商标注册证一并使用", "当事人不服国家知识产权局不予核准决定的，可以申请复审", "外国人或外国企业申请注册商标续展的，应当委托国家认可的具有商标代理资格的组织代理"],a:2,x:'本题考查注册商标的续展。当事人不服国家知识产权局不予核准决定的，可以提起行政复议或者直接向人民法院提起行政诉讼。'},
  {ch:6,type:'multi',q:'关于注册商标的续展，下列说法正确的有( )。',o:["商标注册人应当在注册商标有效期届满前12个月内提出续展申请", "宽展期届满后申请续展注册的，应当缴纳延迟费", "办理续展注册的，应提交申请人身份证明文件复印件", "国家知识产权局核准续展的，在商标注册证上加注发还", "当事人不服国家知识产权局不予核准决定的，可以提起行政复议或者直接向人民法院提起行政诉讼"],a:[0, 2, 4],x:'本题考查注册商标的续展。商标注册人应当在注册商标有效期届满前12个月内提出续展申请。如果未能在此期间提出申请的，法律规定还另外给予了6个月的宽展期，即在有效期届满后6个月内，可以允许办理续展注册的申请手续，但需要缴纳延迟费。宽展期届满后，仍未申请续展的，注销该注册商标。所以选项B错误。经审查符合法律规定的，国家知识产权局核准后发给申请人续展注册证明，并刊登公告。续展注册证明应当与商标注册证一并使用。所以选项D错误。'},
  {ch:6,type:'single',q:'关于商标注册事项的更正，下列说法正确的是( )。',o:["商标注册申请人可以申请更正商标图样", "商标注册人可以申请更正商标图样", "商标注册人可以通过更正申请增减商品或服务项目", "申请更正商标注册事项，必要时应提供证据"],a:3,x:'本题考查商标注册事项的更正。涉及商标权利主体更替、权利范围等实质性内容错误，不能通过更正程序改正。所谓实质性内容，是指商标图样的更改、商品或服务项目的增减、商标权利人的更换等，这些内容涉及对其他当事人的权利的影响。注册人或申请人发现其商标申请文件或注册文件存在明显错误的，可以申请更正。应在申请书中具体说明需要更正的内容和事项，必要时需要提供证据。'},
  {ch:6,type:'single',q:'下列情形中，国家知识产权局可以撤销该注册商标的是( )。',o:["注册商标成为其核定使用的商品的通用名称的", "使用注册商标时，未标明“注册商标”或者注册标记的", "使用注册商标时，加注TM标记的", "注册商标系以不正当手段取得注册的"],a:0,x:'本题考查注册商标的撤销。注册商标成为其核定使用的商品的通用名称的，任何单位或者个人可以向国家知识产权局申请撤销该注册商标。使用注册商标时，可以标明“注册商标”或者注册标记，标注是商标注册人的权利，不是义务。使用注册商标时，加注TM标记的，不属于自行改变注册商标，不能因此而撤销其注册商标。以不正当手段取得商标注册的，可宣告该注册商标无效。'},
  {ch:7,type:'multi',q:'关于商标使用许可，下列说法正确的有( )。',o:["商标使用许可合同经国家知识产权局备案后方才生效", "商标使用许可合同未经国家知识产权局备案的，不能对抗善意第三人", "商标权人无权监督被许可人使用其注册商标的商品质量", "被许可人应当保证使用该注册商标的商品质量", "必须在使用该注册商标的商品上标明被许可人的商品产地"],a:[1, 3, 4],x:'本题考查注册商标的使用许可。《商标法》第四十三条规定：“商标注册人可以通过签订商标使用许可合同，许可他人使用其注册商标。许可人应当监督被许可人使用其注册商标的商品质量。被许可人应当保证使用该注册商标的商品质量。经许可使用他人注册商标的，必须在使用该注册商标的商品上标明被许可人的名称和商品产地。许可他人使用其注册商标的，许可人应当将其商标使用许可报商标局备案，由商标局公告。商标使用许可未经备案不得对抗善意第三人。”'},
  {ch:7,type:'single',q:'关于商标使用许可的被许可人是否有权对侵犯被许可商标的行为提起诉讼，下列说法正确的是( )。',o:["排他许可的被许可人只能与商标注册人共同起诉", "独占许可的被许可人只能和商标注册人共同提起诉讼", "经商标注册人明确授权，普通许可的被许可人可提起诉讼", "在商标注册人不提起诉讼的情况下，独占许可的被许可人可提起诉讼"],a:2,x:'本题考查注册商标的使用许可。在发生商标专用权被侵害时，排他使用许可合同的被许可人可与商标注册人共同起诉，也可以在商标注册人不起诉的情况下自行提起诉讼。独占被许可人有权就商标侵权单独向法院提起诉讼。普通使用许可的被许可人经商标注册人明确授权，可以提起诉讼'},
  {ch:6,type:'multi',q:'注册商标撤销的情况包括( )。',o:["自行改变商标注册事项的", "申请变更商标注册事项的", "连续3年不使用注册商标的", "许可他人使用该注册商标的", "注册商标成为核定使用商品的通用名称的"],a:[0, 2, 4],x:'本题考查注册商标的撤销。注册商标的撤销包括三种情况：(1)连续3年不使用注册商标的撤销；(2)注册商标成为核定使用商品的通用名称的；(3)自行改变商标注册事项的。'},
  {ch:6,type:'single',q:'下列不能作为商标注册的是( )。',o:["军徽", "事业单位徽记", "企业徽记", "行业协会徽记"],a:0,x:'本题考查商标的不当使用。为维护公共利益和公序良俗，《商标法》第十条采取列举方式规定了不得作为商标使用的标志。“不得作为商标使用”，是指除了禁止这些标志作为商标注册外，还禁止作为商标使用。'},
  {ch:8,type:'single',q:'转让商标，受让人自( )之日起享有注册商标专用权。',o:["提出转让申请", "转让商标申请核准", "商标转让公告", "转让商标协议生效"],a:2,x:'本题考查注册商标的转让。《商标法》第四十二条规定：“转让注册商标的，转让人和受让人应当签订转让协议，并共同向商标局提出申请。转让注册商标经核准后，予以公告。受让人自公告之日起享有商标专用权。”'},
  {ch:8,type:'single',q:'注册商标的有效期自( )起算。',o:["初步审定日", "申请日", "核发商标注册证", "核准注册"],a:3,x:'本题考查商标的不当使用。经国家知识产权局核准注册的商标才是注册商标，注册商标权利人依法享有注册商标专用权，并承担相应法律义务。'},
  {ch:6,type:'single',q:'下列关于商标转让的说法，错误的是( )。',o:["受让人享有商标专用权始于核准公告之日", "商标局对注册商标转让的审查不包括是否容易导致混淆或者有其他不良影响", "转让人和受让人应当签订转让协议并共同提出申请", "注册商标受让人应当保障注册商标的商品质量"],a:1,x:'本题考查注册商标的转让。《商标法》第四十二条规定：“转让注册商标的，转让人和受让人应当签订转让协议，并共同向商标局提出申请。受让人应当保证使用该注册商标的商品质量。转让注册商标的，商标注册人对其在同一种商品上注册的近似的商标，或者在类似商品上注册的相同或者近似的商标，应当一并转让。对容易导致混淆或者有其他不良影响的转让，商标局不予核准，书面通知申请人并说明理由。转让注册商标经核准后，予以公告。受让人向公告之日起享有商标专用权。”'},
  {ch:7,type:'multi',q:'属于核准在商品上的注册商标的正确使用方法有( )。',o:["使用在酒店的床具上", "使用在商品销售发票上", "使用在销售该类商品的服务场所上", "使用在商品的外包装上", "使用在加油站服务人员的工作服装上"],a:[1, 2, 3],x:'本题考查商标使用的方式。核准在商品上的注册商标，可以用于商品、商品包装、容器以及商品交易文书上。选项AE属于核准在服务上的注册商标的使用。'},
  {ch:7,type:'multi',q:'关于我国商标品牌战略的说法，正确的有( )。',o:["我国商标品牌战略是独立于国家知识产权战略的形式", "我国商标品牌战略的形成需要国家战略的引领", "我国商标品牌战略的实施具有国家战略总体推动的特点", "我国商标品牌战略对于构建品牌经济，提升商标品牌在经济社会中的作用具有重要意义", "我国商标品牌定位和传播策略是商标品牌战略实施的重要策略"],a:[1, 2, 3],x:'本题考查商标品牌战略的制定和实施。商标品牌战略的形成需要国家战略引领；商标战略的组织实施需要国家战略总体推动，从而建立商标战略实施机制。国家工商总局作为实施商标战略的职能部门，于2009年6月2日下发《关于贯彻落实＜国家知识产权战略纲要＞大力推进商标战略实施的意见》(以下简称《实施意见》)。《实施意见》对从2008年至2020年商标战略的指导思想、战略目标和战略任务作了规划，从11个方面明确了在“十三五”时期实施商标品牌战略的主要目标和具体任务'},
  {ch:6,type:'single',q:'关于注册商标注销的法律规定，下列说法错误的是( )。',o:["注册商标有效期满未办理续展手续的，注销其注册商标", "商标注册人申请注销其注册商标或者注销其商标在部分指定商品或服务项目上的注册的，应当向国家知识产权局提交商标注销申请书，《商标注册证》不需交回", "商标注册人申请注销其注册商标或者注销其商标在部分指定商品或服务项目上的注册，经国家知识产权局核准注销的，该注册商标或者该注册商标专用权在该部分指定商品或服务项目上的效力自国家知识产权局收到其注销申请之日起终止", "《商标法实施条例》规定，商标注册人申请注销其商标在部分指定商品或服务项目上的注册的，重新核发《商标注册证》，并予以公告"],a:1,x:'本题考查注册商标的注销。商标注册人申请注销其注册商标或者注销其商标在部分指定商品上的注册的，应当向国家知识产权局提交商标注销申请书，并交冋原《商标注册证》。'},
  {ch:7,type:'single',q:'关于注册商标注销的概念及效力，下列说法错误的是( )。',o:["注册商标的注销是指国家知识产权局依职权或者根据商标注册人的申请，将注册商标注销或者将注册商标在部分指定商品或服务项目上的注册予以注销的法律程序", "注册商标的注销需要缴纳一定的费用", "注销申请经国家知识产权局核准后，其商标专用权自国家知识产权局收到其注销申请之日起终止", "当注册商标有效期满后，在法律规定的宽展期内注册人仍未提出续展申请的，国家知识产权局注销该注册商标，该商标专用权自有效期满次日起终止"],a:1,x:'本题考查注册商标的注销。注销注册商标不需要缴纳费用。'},
  {ch:1,type:'multi',q:'注销注册商标可通过的途径有( )。',o:["依申请注销", "依职权注销", "公告注销", "强制注销", "交费注销"],a:[0, 1],x:'本题考查注册商标的注销。注销注册商标可通过以下两种途径进行，且不需要缴纳费用，分别是依申请注销、依职权注销。'},
  {ch:6,type:'single',q:'关于注册事项更正的法律程序，下列说法错误的是( )。',o:["商标注册申请人或者注册人发现商标申请文件或者注册文件有明显错误的，可以申请更正", "更正错误可以涉及商标申请文件或者注册文件的实质性内容", "商标注册申请人或者注册人依照商标法第三十八条规定提出更正申请的，应当向商标局提交更正申请书", "已经刊发初步审定公告或者注册公告的商标经更正的，刊发更正公告"],a:1,x:'本题考查注册事项的更正。商标注册申请人或者注册人发现商标申请文件或者注册文件有明显错误的，可以申请更正。商标局依法在其职权范围内作出更正，并通知当事人。前款所称更正错误不涉及商标申请文件或者注册文件的实质性内容。'},
  {ch:2,type:'multi',q:'注册事项发生的错误，不能进行更正的有( )。',o:["涉及商标权利主体更替", "涉及商标图样的更改", "涉及商标权利范围", "涉及商品或服务项目的增减", "有明显的文字错误"],a:[0, 1, 2, 3],x:'本题考查注册事项的更正。错误类型主要有两类：一类是涉及商标权利主体更替、权利范围等实质性内容错误，不能通过更正程序改正。所谓实质性内容，是指商标图样的更改、商品或服务项目的增减、商标权利人的更换等，这些内容涉及对其他当事人的权利的影响。另一类是非实质性内容错误，是指由于申请人或代理人在填写申请文件时疏忽大意等原因造成的错误，如明显的文字错误，不涉及商标权利主体更替和商标权利范围的变动，可以更正。'},
  {ch:2,type:'multi',q:'注册人或申请人发现其商标申请文件或注册文件存在明显错误的，可以申请更正。申请时应视情况提交的申请材料包括( )。',o:["更正商标申请或者注册事项申请书", "申请更正费用明细", "申请人的身份证明文件(营业执照副本、身份证等)复印件", "委托商标代理机构办理的，提交商标代理委托书", "更正注册事项涉及《商标注册证》或变更、转让和续展证明内容发生变动、需要重新制发证书文件的，应同时交回原《商标注册证》或原变更、转让或续展证明的原件"],a:[0, 2, 3, 4],x:'本题考查注册事项的更正。注册人或申请人发现其商标申请文件或注册文件存在明显错误的，可以申请更正。申请时应视情况提交以下申请材料。 (1)更正商标申请或者注册事项申请书。 (2)申请人的身份证明文件(营业执照副本、身份证等)复印件。 (3)委托商标代理机构办理的，提交商标代理委托书。 (4)更正注册事项涉及《商标注册证》或变更、转让和续展证明内容发生变动、需要重新制发证书文件的，应同时交回原《商标注册证》或原变更、转让或续展证明的原件。'},
  {ch:6,type:'single',q:'关于注册商标和未注册商标的说法，错误的是( )。',o:["未注册商标在商标法体系内不享有注册商标专用权", "使用未注册的商标是一种欺骗相关公众的行为，扰乱了商标注册管理秩序", "经国家知识产权局核准注册的商标才是注册商标，注册商标权利人依法享有注册商标专用权，并承担相应法律义务", "用注册商标，可以在商品、商品包装、说明书或者其他附着物上标明“注册商标”或者注册标记"],a:1,x:'本题考查注册商标的不当使用。选项B说法有误，未注册商标冒充注册商标才是一种欺骗相关公众的行为，扰乱了商标注册管理秩序。使用未注册商标是没有问题的，只是不享有商标专用权'},
  {ch:1,type:'single',q:'注册商标每次续展注册的有效期为( )年，该商标上一届有效期满次日起计算。',o:["8", "9", "10", "11"],a:2,x:'本题考查注册商标的续展。注册商标每次续展注册的有效期为10年，该商标上一届有效期满次日起计算。'},
  {ch:7,type:'single',q:'注册商标需要续展注册的，应当向( )提交商标续展注册申请书。',o:["国家知识产权局", "国家版权局", "国家工商总局", "国家统计局"],a:0,x:'本题考查注册商标的续展。注册商标需要续展注册的，应当向国家知识产权局提交商标续展注册申请书。'},
  {ch:1,type:'single',q:'根据《商标法》第四十条、《商标法实施条例》第三十三条的规定，注册人应当在注册商标有效期届满前12个月内提出续展申请。如果未能在此期间提出申请的，法律规定还另外给予了( )个月的宽展期。',o:["5", "6", "7", "8"],a:1,x:'本题考查注册商标的续展。根据《商标法》第四十条、《商标法实施条例》第三十三条的规定，注册人应当在注册商标有效期届满前12个月内提出续展申请。如果未能在此期间提出申请的，法律规定还另外给予了6个月的宽展期。'},
  {ch:2,type:'single',q:'根据《商标法》第十八条规定，外国人或外国企业应当委托依法设立的( )代理。',o:["商标申请机构", "商标代理机构", "商标注册机构", "商标转让机构"],a:1,x:'本题考查注册商标的续展。根据《商标法》第十八条规定，外国人或外国企业应当委托依法设立的商标代理机构代理。'},
  {ch:2,type:'multi',q:'注册商标办理续展申请应当提交的文件包括( )。',o:["商标续展注册申请书", "续展注册证明", "申请人身份证明文件(营业执照、身份证等)复印件", "登记机关出具的变更证明文件", "委托代理组织办理的，应附商标代理委托书"],a:[0, 2, 4],x:'本题考查注册商标的续展。办理续展申请应当提交的文件包括：商标续展注册申请书；申请人身份证明文件(营业执照、身份证等)复印件；委托代理组织办理的，应附商标代理委托书。'},
  {ch:6,type:'multi',q:'注册商标申请续展的，国家知识产权局进行审查的内容包括( )。',o:["是否有续展注册证明", "是否为合法商标权利人", "是否有商标续展注册申请书", "是否在法律规定的期限内提出申请", "续展商标是否存在注销、撤销等失效情况"],a:[1, 3, 4],x:'本题考查注册商标的续展。国家知识产权局对是否为合法商标权利人，是否在法律规定的期限内提出申请，续展商标是否存在注销、撤销等失效情况等内容进行审查。'},
  {ch:8,type:'multi',q:'关于注册商标注销的说法，正确的有( )。',o:["商标注册人可以申请注销其注册商标", "商标注册人可以申请注销在部分指定商品或服务上的注册", "注册商标有效期满未办理续展手续的，注销其注册商标", "商标注册人在续展注册宽展期未申请续展的，由国家知识产权局注销其注册商标", "商标注册人注销在部分指定商品或服务项目上的注册的，该注册商标专用权在该部分指定商品上的效力自商标注销公告之日起终止"],a:[0, 1, 2, 3],x:'本题考查注册商标的注销。注册商标期满未办理续展手续的，注销其注册商标。商标注册人申请注销其注册商标或者注销其商标在部分指定商品或服务项目上的注册，经国家知识产权局核准注销的，该注册商标或者该注册商标专用权在该部分指定商品或服务项目上的效力自国家知识产权局收到其注销申请之日起终止'},
  {ch:8,type:'single',q:'下列行为中，不属于仿冒注册商标行为的是( )。',o:["未经商标注册人许可，在同一种商品上使用与其注册商标相同的商标", "未经商标注册人许可，在同一种商品上使用与其注册商标近似的商标", "未经商标注册人许可，在类似商品上使用与其注册商标相同的商标", "未经商标注册人许可，在类似商品上使用与其注册商标近似的商标"],a:0,x:'本题考查侵犯注册商标专用权行为类型。仿冒注册商标行为包括三种情况：①在同一种商品上使用与他人注册商标相近似的商标；②在类似的商品上使用与他人注册商标相同的商标；③在类似的商品上使用与他人注册商标相近似的商标。选项A属于假冒注册商标行为。'},
  {ch:2,type:'single',q:'关于商标代理，下列说法错误的是( )。',o:["设立商标代理机构不需要取得行政许可", "律师事务所可以从事商标代理业务", "商标代理机构从事商标评审代理业务的，应当向省级市场监督管理部门备案", "商标代理机构对在代理过程中知悉的被代理人的商业秘密，负有保密义务"],a:2,x:'本题考查考查商标代理机构。商标代理机构从事国家知识产权局主管的商标事宜代理业务的，应当向国家知识产权局备案。'},
  {ch:7,type:'multi',q:'根据《商标法》，有下列( )行为，由管理商标工作的部门予以制止，限期改正，并可以予以通报，违法经营额5万元以上的，可以处违法经营额20%以下的罚款，没有违法经营额或者违法经营额不足5万元的，可以处1万元以下的罚款。',o:["使用未注册商标的", "在台历上使用国徽作为商标的", "在葡萄酒上使用“葡萄”作为商标的", "餐厅使用“世界第一”作为商标的", "将未注册商标冒充注册商标使用的"],a:[1, 3, 4],x:'本题考查商标违法行为。对于将未注册商标冒充注册商标使用的，或者使用未注册商标违反《商标法》第十条禁止使用的相关规定的，由管理商标工作的部门予以制止，限期改正，并可以予以通报，违法经营额5万元以上的，可以处违法经营额20%以下的罚款，没有违法经营额或者违法经营额不足5万元的，可以处1万元以下的罚款。在台历上使用国徽作为商标的，在餐厅上使用“世界第一”作为商标的，均违反《商标法》第十条的规定。'},
  {ch:8,type:'single',q:'某餐厅在其菜单上标明菜品使用了“樟树港辣椒”，其使用的辣椒产品也确符合该地理标志产品的使用条件，这种仅用于说明菜品真实原料的行为，即构成( )。',o:["在先使用", "指示性使用", "描述性使用", "在先使用"],a:1,x:'本题考查注册商标专用权的权利限制。指示性使用是指使用他人注册商标中的文字或图形等要素，用以说明自己提供的商品或服务能够与使用该商标的商品或服务配套，或者为了说明自己提供的商品或服务的功能、用途、原料、制作工艺或者服务对象等，并不会导致消费者对商品或者服务来源的混淆。这种仅用于说明菜品真实原料的行为，即构成指示性使用。'},
  {ch:1,type:'single',q:'注册商标成为其核定使用的商品的通用名称或者没有正当理由连续( )年不使用的，任何单位或个人可以向商标局申请撤销该注册商标。',o:["三", "五", "六", "十"],a:0,x:'本题考查注册商标的撤销。注册商标成为其核定使用的商品的通用名称或者没有正当理由连续三年不使用的，任何单位或个人可以向商标局申请撤销该注册商标。'},
  {ch:6,type:'single',q:'注册商标有效期满，需要继续使用的，商标注册人应当在期满前( )个月内按照规定办理续展手续。',o:["9", "10", "11", "12"],a:3,x:'本题考查注册商标的续展。注册商标有效期满，需要继续使用的，商标注册人应当在期满前12个月内按照规定办理续展手续'},
  {ch:8,type:'single',q:'关于注册商标的在先使用，下列说法错误的是( )。',o:["注册商标所有权人的专有权利不得损害任何的在先权利，也不得影响成员方规定以使用为基础的权利获得的可能性", "在先使用是指他人在注册商标申请注册前，已经在相同或类似商品或服务上使用了相同或近似的商标", "商标注册人申请商标注册前，他人已经在同一种商品或者类似商品上先于商标注册人使用与注册商标相同或者近似并有一定影响的商标的，注册商标专用权人可以禁止该使用人在原使用范围内继续使用该商标，也可以要求其附加适当区别标识", "他人对标识的在先使用已经实际投入了成本，向市场输出了商品或服务，并发挥了区别作用，积累了一定的商誉。虽然在原范围内的继续使用可能会带来市场混淆，但如果仅仅因为尚未注册而剥夺在先使用人的使用权甚至商誉，有违市场公平竞争秩序,也与《商标法》的立法本意相悖"],a:2,x:'本题考查注册商标专用权的权利限制。商标注册人申请商标注册前，他人已经在同一种商品或者类似商品上先于商标注册人使用与注册商标相同或者近似并有一定影响的商标的，注册商标专用权人无权禁止该使用人在原使用范围内继续使用该商标，但可以要求其附加适当区别标识。他人对标识的在先使用已经实际投入了成本，向市场输出了商品或服务，并发挥了区别作用，积累了一定的商誉。虽然在原范围内的继续使用可能会带来市场混淆，但如果仅仅因为尚未注册而剥夺在先使用人的使用权甚至商誉，有违市场公平竞争秩序,也与《商标法》的立法本意相悖。'},
  {ch:8,type:'single',q:'《商标法》规定，销售带有商标的商品在一定意义上构成对商标的使用，其目的是为了保护商标注册人权利，防止假冒注册商标和造成消费者混淆，但在使用注册商标的商品经商标注册人允许已经进入市场流通领域公开流通的情况下，该商品上的商标专用权应当被视为“( )”，不能用于阻止市场正常流通行为。',o:["用尽", "进行", "开始", "结束"],a:0,x:'本题考查注册商标专用权的权利限制。《商标法》规定，销售带有商标的商品在一定意义上构成对商标的使用，其目的是为了保护商标注册人权利，防止假冒注册商标和造成消费者混淆，但在使用注册商标的商品经商标注册人允许已经进入市场流通领域公开流通的情况下，该商品上的商标专用权应当被视为“用尽”，不能用于阻止市场正常流通行为。'},
  {ch:8,type:'multi',q:'注册商标专用权的权利范围，主要是指商标注册人对其所注册的商标所享有的( )的范围。',o:["公开权", "使用权", "私有权", "排他权", "售卖权"],a:[1, 3],x:'本题考查注册商标专用权的权利限制。注册商标专用权的权利范围，主要是指商标注册人对其所注册的商标所享有的使用权和排他权的范围。'},
  {ch:8,type:'multi',q:'下列关于注册商标使用权的说法，正确的有( )。',o:["注册商标的专用权，以核准注册的商标和核定使用的商品或服务为限", "“核准注册的商标”是指商标注册部门依商标申请人的注册申请而核准注册的商标", "“核定使用的商品或服务”是指注册商标核准使用的具体商品名称或服务项目名称", "商标注册人有权在自己已经注册核定使用的商品或服务上独立自主地使用自己的注册商标，标注注册标记，在超出这个范围之外的商标和商品或服务上，则无权以注册商标的形式使用", "注册商标需要在核定使用的商品或者服务之外享有商标专用权的，可以不提出注册申请，需要改变其标志的，应当重新提出注册申请"],a:[0, 1, 2, 3],x:'本题考查注册商标专用权的权利限制。注册商标需要在核定使用的商品或者服务之外享有商标专用权的，应当另行提出注册申请，需要改变其标志的，应当重新提出注册申请。'},
  {ch:8,type:'multi',q:'注册商标专用权的范围是有限制的，但是下列( )情况下，他人对与注册商标相同或者近似标识的使用并不构成侵权。',o:["描述性使用", "在先使用", "指示性使用", "在后使用", "商标权用尽"],a:[0, 1, 2, 4],x:'本题考查注册商标专用权的权利限制。注册商标专用权的范围是有限制的，在一些特定情况下，他人对与注册商标相同或者近似标识的使用并不构成侵权。比如：描述性使用、指示性使用、在先使用和商标权用尽。'},
  {ch:8,type:'single',q:'判断商标是否相同或近似，应遵循的原则不包括( )。',o:["以相关公众的一般注意力为标准进行判断", "相关专家的一般注意力为标准进行判断", "考虑已注册商标的显著性和知名度等要素", "准确运用整体、要部和隔离比对方法"],a:1,x:'本题考查侵犯注册商标专用权行为的判定因素。商标相同或近似的判定应当遵循以下三条原则综合判断：以相关公众的一般注意力为标准进行判断；准确运用整体、要部和隔离比对方法；考虑已注册商标的显著性和知名度等要素。'},
  {ch:8,type:'single',q:'将他人未注册驰名商标作为企业名称中的字号使用，误导公众，应依据( )处理。',o:["《专利法》", "《商标法》", "《企业名称登记管理规定》", "《反不正当竞争法》"],a:3,x:'本题考查驰名商标的保护。《商标法》第五十八条规定，将他人未注册的驰名商标作为企业名称中的字号使用，误导公众，构成不正当竞争行为的，依照《中华人民共和国反不正当竞争法》处理'},
  {ch:2,type:'single',q:'《商标法》第六十八条的规定，商标代理机构违反( )原则，侵害委托人合法利益的，应当依法承担民事责任，并由商标代理行业组织按照章程规定予以惩戒。',o:["公平竞争", "诚实信用", "爱岗敬业", "公平自愿"],a:1,x:'本题考查违法从事商标代理的法律责任。《商标法》第六十八条的规定，商标代理机构违反诚实信用原则，侵害委托人合法利益的，应当依法承担民事责任，并由商标代理行业组织按照章程规定予以惩戒。'},
  {ch:2,type:'multi',q:'商标代理机构违反法律规定从事商标代理业务应承担的责任包括( )。',o:["经济责任", "行政责任", "民事责任", "刑事责任", "直接责任"],a:[1, 2, 3],x:'本题考查违法从事商标代理的法律责任。商标代理机构违反法律规定从事商标代理业务应承担的责任包括：行政责任、民事责任和刑事责任。'},
  {ch:2,type:'multi',q:'违反商标代理机构的行为规范而受到处罚的对象包括( )。',o:["行政主管部门", "商标注册人", "商标代理机构", "直接负责的主管人员", "其他直接责任人员"],a:[2, 3, 4],x:'本题考查违法从事商标代理的法律责任。违反商标代理机构的行为规范而受到处罚的对象不仅包括商标代理机构，还包括直接负责的主管人员和其他直接责任人员。'},
  {ch:2,type:'multi',q:'国家知识产权局可以通过当事人投诉举报，地方管理商标工作的部门通报查处案件，在( )工作中发现违法行为和公安司法机关通报案件等途径知悉商标代理机构的严重违法行为，依据事实和法律作出停止受理的决定。',o:["注册", "转让", "管理", "评审", "代理"],a:[0, 2, 3],x:'本题考查违法从事商标代理的法律责任。国家知识产权局可以通过当事人投诉举报，地方管理商标工作的部门通报查处案件，在注册、管理、评审工作中发现违法行为和公安司法机关通报案件等途径知悉商标代理机构的严重违法行为，依据事实和法律作出停止受理的决定。'},
  {ch:8,type:'single',q:'关于注册商标专用权的说法，错误的是( )。',o:["禁止他人在与自己被核定使用的商品或服务相类似的商品或服务上使用与自己注册商标相同或者近似的商标", "禁止他人擅自在相同的商品或服务上使用与自己注册商标相同的商标", "禁止他人擅自在相同的商品或服务上使用与自己注册商标相近似的商标", "禁止他人擅自在注册商标核定商品之外的商品上使用与注册商标近似的标志"],a:3,x:'本题考查注册商标专用权的权利限制。注册商标专用权人有权禁止他人擅自在相同的商品或服务上使用与自己注册商标相同的商标，同时还包括了注册商标专用权人有权禁止他人擅自在相同的商品或服务上使用与自己注册商标相近似的商标，有权禁止他人在与自己被核定使用的商品或服务相类似的商品或服务上使用与自己注册商标相同或者近似的商标，有权禁止他人以任何形式实施侵害自己注册商标专用权的行为。'},
  {ch:8,type:'single',q:'注册商标的专用权，以( )为限。',o:["核准注册的商标和核定使用的商品或服务", "申请注册的商标和申请使用的商品或服务", "实际使用的商标和商品", "在先使用的商标和商品"],a:0,x:'本题考查注册商标专用权的权利限制。注册商标的专用权，以核准注册的商标和核定使用的商品或服务为限。'},
  {ch:8,type:'single',q:'他人在注册商标申请注册前，已经在相同或类似商品或服务上使用了相同或近似的商标，这种行为称为( )。',o:["指示性使用", "描述性使用", "在先使用", "商标权用尽"],a:2,x:'本题考查注册商标专用权的权利限制。在先使用是指他人在注册商标申请注册前，已经在相同或类似商品或服务上使用了相同或近似的商标'},
  {ch:2,type:'single',q:'国家知识产权局可以依照《商标法》的规定，作出停止受理该商标代理机构商标代理业务( )个月以上直至永久停止受理的决定。',o:["1", "3", "6", "12"],a:2,x:'本题考查违法从事商标代理的法律责任。国家知识产权局可以依照《商标法》的规定，作出停止受理该商标代理机构商标代理业务6个月以上直至永久停止受理的决定。'},
  {ch:2,type:'single',q:'商标代理机构有《商标法》第六十八条所规定的违法行为且情节严重的，国家知识产权局可以决定( )其办理商标代理业务，予以公告。',o:["收费受理", "停止受理", "没收", "开始"],a:1,x:'本题考查违法从事商标代理的法律责任。商标代理机构有《商标法》第六十八条所规定的违法行为且情节严重的，国家知识产权局可以决定停止受理其办理商标代理业务，予以公告。'},
  {ch:2,type:'single',q:'商标代理机构有《商标法》第六十八条规定中提到的行为的，由行为人所在地或者违法行为发生地县级以上管理商标工作的部门进行查处，并将查处情况通报( )。',o:["国家政务机关", "国家行政机关", "国家专利局", "国家知识产权局"],a:3,x:'本题考查违法从事商标代理的法律责任。商标代理机构有《商标法》第六十八条规定中提到的行为的，由行为人所在地或者违法行为发生地县级以上管理商标工作的部门进行查处，并将查处情况通报国家知识产权局。'},
  {ch:2,type:'multi',q:'2003年2月27日，国务院下发文件，取消了( )行政审批。',o:["商标代理收费", "商标代理预约", "商标代理机构", "商标代理人资格", "商标代理时效"],a:[2, 3],x:'本题考查商标代理制度的历史沿革及代理行业的管理。2003年2月27日，国务院下发文件，取消了商标代理机构和商标代理人资格两项行政审批。'},
  {ch:2,type:'multi',q:'1993年6月，商标代理制开始在全国范围内普遍推行。1994年6月，国家工商行政管理局颁布《商标代理组织管理暂行办法》，就( )等方面作了比较全面的规范，使我国商标代理行业走上了规范化、法制化的发展道路。',o:["商标代理人资格的取得、职业道德", "商标代理组织的设立条件、业务范围、审批程序", "商标代理金额", "代理人和代理组织的违规行为的处罚", "商标代理范围"],a:[0, 1, 3],x:'本题考查商标代理制度的历史沿革及代理行业的管理。1993年6月，商标代理制开始在全国范围内普遍推行。1994年6月，国家工商行政管理局颁布《商标代理组织管理暂行办法》，就商标代理人资格的取得、职业道德及商标代理组织的设立条件、业务范围、审批程序及代理人和代理组织的违规行为的处罚等方面作了比较全面的规范，使我国商标代理行业走上了规范化、法制化的发展道路。'},
  {ch:9,type:'multi',q:'著作权质权登记，即将著作权质权的( )记载于《著作权质权登记簿》。',o:["交易", "设立", "变更", "转让", "消灭"],a:[1, 2, 3, 4],x:'本题考查著作权质押。著作权质权登记，即将著作权质权的设立、变更、转让和消灭记载于《著作权质权登记簿》。'},
  {ch:9,type:'single',q:'主要用于防止、限制未经权利人许可浏览、欣赏作品、邻接权保护的客体行为的措施是( )。',o:["控制作品传播的技术措施", "停止侵犯权利的技术措施", "控制作品接触的技术措施", "禁止侵犯权利的技术措施"],a:2,x:'本题考查技术措施及相关法律责任。控制作品接触的技术措施主要用于防止、限制未经权利人许可浏览、欣赏作品、邻接权保护的客体的行为'},
  {ch:9,type:'single',q:'侵权产品没有标价或者无法查清其实际销售价格的，按照( )计算价格。',o:["被侵权产品的市场中间价格", "其他产品标价的平均价格", "被侵权产品的评估价格", "被侵权产品的成本价格"],a:0,x:'本题考查侵犯著作权的行为。侵权产品没有标价或者无法查清其实际销售价格的，按照被侵权产品的市场中间价格计算。'},
  {ch:9,type:'single',q:'侵犯著作权罪的成立以违法所得数额较大或者有其他严重情节为定罪要件，以违法所得数额巨大或者有其他特别严重情节为加重处罚条件。违法所得数额在15万元以上的，属于( )。',o:["“违法所得数额巨大”", "“有其他严重情节”", "“违法所得数额较大”", "“有其他特别严重情节”"],a:0,x:'本题考查侵犯著作权的行为。违法所得数额在15万元以上的，属于“违法所得数额巨大”。'},
  {ch:9,type:'single',q:'针对我国《著作权法》，下列行为不构成行政违法的是( )。',o:["出版他人享有专有出版权的图书的", "故意制造、进口或者向他人提供主要用于避开或者破坏技术措施的装置或者部件，或者故意为他人避开或者破坏技术措施提供技术服务的", "网络服务提供者无正当理由拒绝提供或者拖延提供涉嫌侵权的服务对象的姓名(名称)、联系方式、网络地址等资料的", "为扶助贫困通过信息网络向农村地区提供作品、表演、录音录像制品在规定范围的"],a:3,x:'本题考查侵犯著作权的行为。根据我国《著作权法》，以下著作权民事侵权行为在损害公共利益的情况下，构成行政违法：④为扶助贫困通过信息网络向农村地区提供作品、表演、录音录像制品超过规定范围，或者未按照公告的标准支付报酬，或者未在提供前公告作品、表演、录音录像制品的名称和作者、表演者、录音录像制作者的姓名(名称)以及报酬标准的，或者在权利人不同意提供其作品、表演、录音录像制品后未立即删除的。'},
  {ch:11,type:'multi',q:'民间文学艺术作品反映了一个( )文化艺术遗产的独特部分，在世代传承过程中，其不断发生着变化。',o:["民族", "国家", "社区", "群族", "社群"],a:[0, 3, 4],x:'本题考查民间文学艺术作品。民间文学艺术作品反映了一个民族、群族或者社群文化艺术遗产的独特部分，在世代传承过程中，其不断发生着变化。'},
  {ch:9,type:'single',q:'根据我国《著作权法》，“民间文学艺术作品的著作权保护办法由( )另行规定。',o:["国家文化局", "国家版权局", "国务院", "国家出版社"],a:2,x:'本题考查民间文学艺术作品。根据我国《著作权法》，“民间文学艺术作品的著作权保护办法由国务院另行规定。'},
  {ch:9,type:'multi',q:'下列构成间接规避行为的情形有( )。',o:["故意制造、进口主要用于规避技术措施的装置或者部件", "向公众提供主要用于规避技术措施的装置或者部件", "故意为他人规避技术措施提供技术服务", "无意为他人规避技术措施提供技术服务", "通过合法途径下载受技术措施保护的作品后，对附加在作品之上的技术措施进行去除"],a:[0, 1, 2],x:'本题考查技术措施及相关法律责任。构成间接规避行为的情形主要有两种：一是故意制造、进口或者向公众提供有关装置或者部件，二是故意为他人规避技术措施提供技术服务。'},
  {ch:9,type:'single',q:'可以规避技术措施的行为不包括( )。',o:["为学校课堂教学或者科学研究，提供少量已经发表的作品，供教学或者科研人员使用，而该作品无法通过正常途径获取", "以营利为目的，以阅读障碍者能够感知的无障碍方式向其提供已经发表的作品，而该作品无法通过正常途径获取", "国家机关依照行政、监察、司法程序执行公务", "对计算机及其系统或者网络的安全性能进行测试"],a:1,x:'本题考查技术措施及相关法律责任。可以规避技术措施的是：不以营利为目的，以阅读障碍者能够感知的无障碍方式向其提供已经发表的作品，而该作品无法通过正常途径获取'},
  {ch:9,type:'single',q:'申请人应当自国家著作权主管部门发给著作权集体管理许可证之日起( )日内，依照有关社会团体登记管理的行政法规到国务院民政部门办理登记手续。',o:["15", "30", "45", "90"],a:1,x:'本题考查著作权集体管理组织。申请人应当自国家著作权主管部门发给著作权集体管理许可证之日起30日内，依照有关社会团体登记管理的行政法规到国务院民政部门办理登记手续。'},
  {ch:9,type:'single',q:'中国电影著作权协会的性质是( )。',o:["营利性机构", "著作权集体管理组织", "官方机构", "行政机关"],a:1,x:'本题考查著作权集体管理组织。我国著作权集体管理组织是非营利性社会团体，依照有关社会团体登记管理的行政法规和《著作权集体管理条例》的规定进行登记并开展活动。我国著作权集体管理组织的业务活动具有独占性。'},
  {ch:12,type:'single',q:'根据《伯尔尼公约》，对国民待遇原则的重要补充原则是( )。',o:["独立保护原则", "自动保护原则", "国民待遇原则", "最低保护标准原则"],a:3,x:'本题考查著作权国际保护的基本原则。最低保护标准原则是对国民待遇原则的重要补充。'},
  {ch:9,type:'single',q:'区分原始主体与继受主体的一个关键意义在于，继受主体一般无法享有( )。',o:["著作复制权", "著作发行权", "著作人身权", "著作广播权"],a:2,x:'本题考查著作权的一般主体。区分原始主体与继受主体的一个关键意义在于，继受主体一般无法享有著作人身权。'},
  {ch:9,type:'single',q:'《伯尔尼公约》第五条规定，著作权法上规定的权利的享有和行使无须履行任何手续，也无论作品起源国是否存在保护，这一规定体现了( )。',o:["独立保护原则", "自动保护原则", "国民待遇原则", "最低保护标准原则"],a:1,x:'本题考查著作权国际保护的基本原则。根据《伯尔尼公约》第五条的规定，自动保护原则指的是著作权法上规定的权利的享有和行使无须履行任何手续，也无论作品起源国是否存在保护。'},
  {ch:9,type:'single',q:'决定作品是否公之于众的权利即( )。',o:["署名权", "修改权", "发表权", "保护作品完整权"],a:2,x:'本题考查著作人身权。发表权，即决定作品是否公之于众的权利。'},
  {ch:9,type:'multi',q:'著作权的一般主体，可以分为( )。',o:["创作主体", "思想主体", "原始主体", "非原始主体", "继受主体"],a:[0, 2, 4],x:'本题考查著作权的一般主体。著作权的一般主体，可以分为创作主体、原始主体和继受主体'},
  {ch:9,type:'multi',q:'民间文学艺术作品除满足一般作品的构成要件之外，还需具有的特征包括( )。',o:["民间文学艺术作品反映了一个民族、群族或者社群文化艺术遗产的独特部分，在世代传承过程中，其不断发生着变化", "民间文学艺术作品具有群体创作、作者难以确定等特点", "民间文学艺术作品处于连续、缓慢的创作过程之中，具有一定的继承性", "民间文学艺术作品通常仅在本民族、群族或者社群所在地域范围内流传，具有较为严格的地域性", "民间文学艺术作品具有很高的经济价值"],a:[1, 2, 3],x:'本题考查民间文学艺术作品。民间文学艺术作品除满足一般作品的构成要件之外，还具有如下特征：①民间文学艺术作品具有群体创作、作者难以确定等特点，为有效保护民间文学艺术作品，实践中通常由权利人所在地区的主管部门行使著作权人的权利；②民间文学艺术作品处于连续、缓慢的创作过程之中，具有一定的继承性；③民间文学艺术作品通常仅在本民族、群族或者社群所在地域范围内流传，具有较为严格的地域性。'},
  {ch:9,type:'multi',q:'技术措施可以分为( )。',o:["控制作品接触的技术措施", "禁止侵犯权利的技术措施", "信息存储空间服务提供者", "网络搜索链接服务提供者", "网络搜索链接服务接收者"],a:[0, 1],x:'本题考查技术措施及相关法律责任。技术措施可以分为控制作品接触的技术措施和禁止侵犯权利的技术措施。'},
  {ch:9,type:'multi',q:'表演者对其表演享有的权利包括( )。',o:["许可他人修改的权利", "表明表演者身份的权利", "保护表演形象不受歪曲的权利", "许可他人从现场直播和公开传送其现场表演，并获得报酬的权利", "许可他人录音录像，并获得报酬的权利"],a:[1, 2, 3, 4],x:'本题考查邻接权。表演者对其表演享有的权利有以下五个方面： (1)表明表演者身份的权利。 (2)保护表演形象不受歪曲的权利。 (3)许可他人从现场直播和公开传送其现场表演，并获得报酬的权利。 (4)许可他人录音录像，并获得报酬的权利。 (5)许可他人复制、发行、出租录有其表演的录音录像制品，并获得报酬的权利；以及许可他人通过信息网络向公众传播其表演，并获得报酬的权利。'},
  {ch:9,type:'single',q:'根据我国《著作权法》，著作权转让合同可以不包括( )。',o:["作品的名称", "转让的权利种类、地域范围", "转让期限", "违约责任"],a:2,x:'本题考查著作权转让合同。根据我国《著作权法》，著作权转让合同应当包括以下内容：①作品的名称；②转让的权利种类、地域范围；③转让价金；④交付转让价金的日期和方式；⑤违约责任；⑥双方认为需要约定的其他内容。'},
  {ch:9,type:'single',q:'第一次确认了作者对其作品享有财产权的法律文件是( )。',o:["《伯尔尼公约》", "《作者权法》", "《安娜女王法》", "《世界版权公约》"],a:2,x:'本题考查著作权制度的历史发展。英国1709年的《安娜女王法》第一次确认了作者对其作品享有财产权，并确立了作者在著作权法上的主体地位。'},
  {ch:9,type:'single',q:'经审查符合要求的，登记机构应当自受理之日起( )日内予以登记，并向出质人和质权人发放《著作权质权登记证书》。',o:["5", "10", "15", "30"],a:1,x:'本题考查著作权质押。经审查符合要求的，登记机构应当自受理之日起10日内予以登记，并向出质人和质权人发放《著作权质权登记证书》。'},
  {ch:9,type:'multi',q:'依法享有著作权或者与著作权有关的权利的( )，可以发起设立著作权集体管理组织。',o:["中国公民", "外国华侨", "外国公民", "法人", "非法人组织"],a:[0, 3, 4],x:'本题考查著作权集体管理组织。依法享有著作权或者与著作权有关的权利的中国公民、法人或者非法人组织，可以发起设立著作权集体管理组织'},
  {ch:9,type:'single',q:'对于未采取书面形式的著作权转让合同，若一方已经履行主要义务，且对方接受的，该合同( )。',o:["成立", "不成立", "签订书面形式合同后成立", "备案后成立"],a:0,x:'本题考查著作权转让合同。对于未采取书面形式的著作权转让合同，若一方已经履行主要义务，且对方接受的，该合同成立。'},
  {ch:9,type:'single',q:'表演者对其表演享有的权利不包括( )。',o:["表明表演者身份的权利", "出租权", "许可他人通过信息网络向公众传播其表演，并获得报酬的权利", "许可他人录音录像，并获得报酬的权利"],a:1,x:'本题考查表演者享有的邻接权。表演者对其表演享有下列权利：①表明表演者身份；②保护表演形象不受歪曲；③许可他人从现场直播和公开传送其现场表演，并获得报酬；④许可他人录音录像，并获得报酬；⑤许可他人复制、发行、出租录有其表演的录音录像制品，并获得报酬；⑥许可他人通过信息网络向公众传播其表演，并获得报酬。注意区分不同的邻接权的权利内容的差异。'},
  {ch:9,type:'single',q:'1709年，《安娜女王法》在英国下议院获得通过，该法第一次确认了作者对其作品享有( )。',o:["人身权", "邻接权", "财产权", "出售权"],a:2,x:'本题考查著作权制度的历史发展。1709年，《安娜女王法》在英国下议院获得通过，该法第一次确认了作者对其作品享有财产权，并确立了作者在著作权法上的主体地位。'},
  {ch:9,type:'multi',q:'起初，一些国家通过在国内法中规定互惠条款，突破著作权保护的地域限制。后来，一些国家开始签订涉及著作权保护的双边协定。再后来，双边协定又逐渐发展为多边协定，其主要代表有( )。',o:["《伯尔尼公约》", "《世界版权公约》", "《安娜女王法》", "《TRIPs协定》", "《大清著作权律》"],a:[0, 1, 3],x:'本题考查著作权制度的历史发展。起初，一些国家通过在国内法中规定互惠条款，突破著作权保护的地域限制。后来，一些国家开始签订涉及著作权保护的双边协定。再后来，双边协定又逐渐发展为多边协定，其主要代表为1886年缔结的《伯尔尼公约》，1952年缔结的《世界版权公约》以及1994年生效的《TRIPs协定》。'},
  {ch:9,type:'single',q:'我国著作权集体管理组织是( )社会团体，依照有关社会团体登记管理的行政法规和《著作权集体管理条例》的规定进行登记并开展活动。',o:["营利性", "非营利性", "公益性", "教育性"],a:1,x:'本题考查著作权集体管理组织。我国著作权集体管理组织是非营利性社会团体，依照有关社会团体登记管理的行政法规和《著作权集体管理条例》的规定进行登记并开展活动。'},
  {ch:9,type:'single',q:'15世纪的欧洲，( )的普及带来了复制成本的降低，这一方面催生了印刷产业，另一方面也为思想的传播提供了便利，从而对当时欧洲统治者和教会控制思想的能力构成威胁。',o:["造纸术", "印刷术", "指南针", "文字"],a:1,x:'本题考查著作权制度的历史发展。15世纪的欧洲，印刷术的普及带来了复制成本的降低，这一方面催生了印刷产业，另一方面也为思想的传播提供了便利，从而对当时欧洲统治者和教会控制思想的能力构成威胁。'},
  {ch:9,type:'single',q:'被称为“禁令救济”，是最常见的制止侵权行为的救济方式的是( )。',o:["消除影响", "停止侵害", "赔偿损失", "赔礼道歉"],a:1,x:'本题考查侵犯著作权的法律责任。停止侵害，又被称为“禁令救济”，是最常见的制止侵权行为的救济方式'},
  {ch:7,type:'multi',q:'对作为集体商标、证明商标注册的地理标志进行实质审查，审查的内容包括( )。',o:["申请人的主体资格", "生产地域范围", "申请材料是否齐全", "在先权利冲突", "特定质量、信誉或其他特征与该地域自然因素、人文因素的关系说明"],a:[0, 1, 3, 4],x:'本题考查作为集体商标、证明商标注册的地理标志的实质审查。实质审查包括：(1)申请人主体资格审查。(2)生产地域范围的审查。(3)特定质量、信誉或其他特征与该地域自然因素、人文因素关系说明的审查。(4)客观存在及其声誉证明材料的审査。(5)禁用条款及显著特征的审查。(6)在先权利冲突审查。'},
  {ch:7,type:'multi',q:'关于作为集体商标、证明商标注册的地理标志的实质审查，下列说法正确的有( )。',o:["地理标志的特定质量、信誉或者其他特征，应主要由该地理标志所标示的地区的自然因素或者人文因素所决定", "地理标志所标示的地域范围为一个县、市范围内的，应由其上一级人民政府或者行业主管部门出具批准文件", "申请地理标志集体商标注册的团体、协会或者其他组织，应当由来自该地理标志标示的地区范围内的成员组成", "应结合地理标志名称的由来、地理标志产品的特定品质及其与生产地域自然环境之间的联系、公众对该地理标志的认知等因素来判断是否违反禁用条款", "进行商标相同、近似比对审查时，应进行个案判断"],a:[0, 2, 3, 4],x:'本题考查作为集体商标、证明商标注册的地理标志的实质审查。选项B说法错误，地理标志所标示的地域范围为一个县、市范围内的，由该县、市人民政府或者行业主管部门出具批准文件；地域范围为两个以上县、市范围的，由其共同上一级人民政府或者行业主管部门出具同意其申请注册并监督管理该地理标志的批准文件。'},
  {ch:8,type:'single',q:'张某准备在A市，B县、C县范围内申请地理标志产品保护，按照要求应当由( )提出产地建议。',o:["仅可由B县人民政府提出", "仅可由C县人民政府提出", "可以由A市政府提出", "要A市、B县、C县人民政府共同提出"],a:2,x:'本题考查地理标志保护的实质性要求。提出产地建议的政府级别：一县之内——县政府提产地建议；跨县的——市级政府提产地建议；跨市＋重大——省级政府提产地建议。'},
  {ch:8,type:'single',q:'下列关于《区域全面经济伙伴关系协定》(RCEP)说法错误的是( )。',o:["RCEP设知识产权专章，注重对地理标志的保护", "RCEP的签订标志着当前世界上人口最多、经贸规模最大、最具发展潜力的自由贸易区正式启航", "RCEP由东盟于2012年发起，历经8年、31轮正式谈判，15个国家参与了缔约", "RCEP对地理标志做出了重新定义"],a:3,x:'本题考查区域全面经济伙伴关系协定。RCEP采纳了 《TRIPs协定》中地理标志的定义，为各成员国提供不同的保护模式选择和透明的保护指引，妥善处理有关异议，并衔接各成员国国际协定中的地理标志保护义务。'},
  {ch:8,type:'single',q:'有关《中欧地理标志协定》的意义，下列说法错误的是( )。',o:["《协定》主文共14条，另外还包含7个附录", "第一批“100+100”清单的地理标志互认互保在协定生效日起实施", "第二批“175+175”清单的地理标志互认互保将在未来几年分批实施", "我国不是《中欧地理标志协定》的缔约国"],a:3,x:'本题考查中欧地理标志协定。协定主文共14条，另外还包含7个附录；协定附录分两批对中欧双方各275个地理标志产品实施互认互保；第一批“100+100”清单已在协定生效日实施，第二批“175+175”清单将在未来几年分批实施。'},
  {ch:8,type:'multi',q:'下列关于地理标志权利构成要素的说法，正确的有( )。',o:["通用名称可以作为地理标志的名称", "水产品养殖范围应包括经纬度的自然水域", "国家知识产权局为管理地理标志产品专用标志的管理部门", "加工产品需要具备原料信息", "需要说明产品特色、质量与产地的自然因素、人文因素之间的关系"],a:[1, 3, 4],x:'本题考查地理标志产品的保护。通用名称不能作为地理标志名称进行使用。地方知识产权管理部门负责地理标志专用标志使用的日常监督。产品特色、质量与产地的自然因素和人文因素之间的关系应当进行说明，属于产品特色、质量与地域关联性的构成要素。如果是加工产品，还须提供原材料的相关信息。'},
  {ch:9,type:'single',q:'出版者所享有的邻接权，主要指的是( )。',o:["作品编纂权", "作品复制权", "版式修改权", "版式设计权"],a:3,x:'本题考查邻接权。出版者所享有的邻接权，主要指的是版式设计权'},

  {ch:1,type:'single',q:'下列属于工业产权保护范围的是（）。',o:["某教材的版式设计", "手机的外观设计", "录音录像制品", "广播、电视节目的信号"],a:1,x:'选项A、C、D都属于邻接权的保护范畴。'},
  {ch:1,type:'single',q:'下列选项中，不属于知识产权保护范围的是（  ）。',o:["火锅底料的保密配方", "“龙井茶”地理标志", "专利审查员创作的关于提高专利撰写质量的论文", "某种心理测验方法"],a:3,x:'从客体范围来看，知识产权包括专利权、著作权(含邻接权，又称版权)、商标权、商号权、商业秘密、地理标志、集成电路布图设计权等。 ABC选项，火锅底料的保密配方、“龙井茶”地理标志、论文分别属于商业秘密、地理标志和著作权的保护对象。 D选项，心理测验方法属于智力活动的规则和方法，不受知识产权保护。 题目问的是的，故选D选项。'},
  {ch:1,type:'multi',q:'下列知识产权中，法律未规定保护期限的是(  )。',o:["商标权", "邻接权", "商业秘密权", "植物新品种权", "地理标志权"],a:[2, 4],x:'根据各类知识产权的性质、特征及本国实际情况，各国法律对著作权、专利权、商标权都规定了长短不一的保护期。著作权和专利权不能像商标权一样可以不断续展，而是必须规定一定的期限，使这些智力成果能够从个人的专有财产适时进入公有领域，转变为人类共有的财富。商业秘密、地理标志则具有不同性质，其保护没有期限限制。故CE正确。ABD错误，均有时间限制。'},
  {ch:1,type:'multi',q:'我国现行知识产权法律体系包括下列（  ）。',o:["著作权法律制度", "专利权法律制度", "商标权法律制度", "商品化权法律制度", "反不正当竞争法律制度"],a:[0, 1, 2, 4],x:'我国现行知识产权法律体系主要包括以下七种法律制度。 ①著作权法律制度。 ②专利权法律制度。 ③商标权法律制度。 ④商号权法律制度。 ⑤地理标志法律制度。 ⑥商业秘密法律制度。 ⑦反不正当竞争法律制度。 故选ABCE，D选项为干扰选项。'},
  {ch:1,type:'single',q:'下列属于知识产权 “综合运用” 形式的是（ ）',o:["商标权利人自行使用其注册商标", "专利权利人委托机构进行专利布局", "企业将专利技术转让给其他公司", "通过知识产权运营平台实现价值最大化"],a:2,x:'“综合运用” 强调对外扩散使用的外部性和综合性，包括转让、许可、投融资等；选项 A 属于 “使用实施”，选项 B 属于主体角度的委托运用，选项 D 属于 “价值运营”。'},
  {ch:5,type:'single',q:'下列不属于知识产权许可方式的是（）。',o:["知识产权独占许可", "知识产权普通许可", "知识产权专属许可", "知识产权排他许可"],a:2,x:'知识产权许可是指以签订知识产权许可合同的方式，许可被许可人在一定期限、一定地域内，以一定方式使用或实施其知识产权，并由被许可人支付许可费的一种许可贸易，包括普通许可、独占许可、排他许可、开放许可。'},
  {ch:1,type:'single',q:'下列关于知识产权特征的说法错误的是（  ）。',o:["知识产权客体的无形性是知识产权的本质属性", "知识产权的专有性意味着知识产权不能转让", "知识产权的地域性在信息网络技术时代仍然存在", "知识产权不是没有时间限制的永恒权利"],a:1,x:'B选项错误，知识产权转让是知识产权进行流转交易的重要运用形式。基于市场机制的高效转让，可以使知识产权顺畅流入使用价值或运用水平更高的领域，从而实现创新资源的高效流转和优化配置。 注意题目问的是错误的，故应选B选项。'},
  {ch:2,type:'multi',q:'知识产权运用的总体目标包括（ ）',o:["实现知识产权在法律、商业、市场等多方面的综合价值", "发挥知识产权的制度供给和资源供给双重作用", "推动知识产权转化为现实生产力或竞争力", "仅通过知识产权运用替代其他链条环节的功能", "保障知识产权制度激励创新的基本功能"],a:[0, 1, 2, 4],x:'知识产权运用的总体目标是实现知识产权在法律、商业、市场、技术、信息等多个方面的综合价值，发挥知识产权的制度供给和资源供给双重作用，促进知识产权转化为现实生产力或竞争力，进而实现知识产权制度激励创新的基本保障功能。知识产权工作链条各环节缺一不可，运用无法替代其他环节（D 错误），故选ACDE。'},
  {ch:2,type:'multi',q:'下列关于知识产权运用类型的说法，错误的有（ ）',o:["从主体角度，“许可他人使用” 属于知识产权运用的一种", "从形式角度，“知识产权证券化” 不属于知识产权运用", "“综合运用” 阶段仅包含权利人自行实施知识产权的行为", "“使用实施” 阶段的典型例子包括知识产权转让和投融资", "委托专业机构运用知识产权属于从主体角度的运用类型"],a:[1, 2, 3],x:'选项 B 错误，知识产权证券化属于从形式角度的运用类型；选项 C 错误，“综合运用” 强调对外扩散使用，而非仅自行实施；选项 D 错误，转让和投融资属于 “综合运用” 阶段的形式；选项 A、E 说法正确。 题目问错误的，故选BCD。 中级经济师'},
  {ch:12,type:'single',q:'最低保护标准原则的主要目的是（）。',o:["促进国际贸易的自由化", "统一各国知识产权的立法形式", "促使缔约方在知识产权保护水平方面统一标准", "提高发展中国家的知识产权保护水平"],a:2,x:'最低保护标准原则旨在促使缔约方在知识产权保护水平方面统一标准。缔约方以立法形式将知识产权国际公约(国际法)的相关规定转化为本国知识产权制度(本国法)的具体规范，遵循的原则即是最低保护标准原则。'},
  {ch:6,type:'single',q:'旨在解决商标注册用的商品和服务统一分类问题的是(  )。',o:["《马德里协定》", "《维也纳协定》", "《商标法条约》", "《尼斯协定》"],a:3,x:'《马德里协定》旨在解决商标的国际注册问题。《商标法条约》的主要目标在于使各国商标注册制度更加简化和协调。《尼斯协定》的主旨是解决商标注册用的商品和服务统一的分类问题。该协定按照商品或服务的用途、原料等，将商标注册用商品或服务项目分为若干个类别。故D选项正确。'},
  {ch:12,type:'multi',q:'知识产权国际保护中最低保护标准的“标准”包括(  )。',o:["权利保护对象", "权利取得方式", "权利的内容", "权利的限制", "权利保护的立法体系"],a:[0, 1, 2, 3],x:'最低保护标准原则是指各缔约方依据本国法，对某条约缔约方国民的知识产权保护不能低于该条约规定的最低标准，这些标准包括权利保护对象、权利取得方式、权利内容及限制、权利保护期间等相关内容。该原则在《伯尔尼公约》第五条、第十九条，《TRIPs协定》第一条等条款中均有体现。故选ABCD。'},
  {ch:12,type:'multi',q:'下列选项中，保护工业产权的国际公约有(  )。',o:["《罗马公约》", "《马德里协定》", "《与贸易有关的知识产权协定》", "《巴黎公约》", "《伯尔尼公约》"],a:[1, 2, 3],x:'《罗马公约》和《伯尔尼公约》是保护著作权的国际条约。 故选BCD。'},
  {ch:12,type:'multi',q:'便于在多国获得知识产权保护的条约有（    ）。',o:["《专利合作条约》", "《马德里协定》", "《巴黎公约》", "《尼斯协定》", "《布达佩斯条约》"],a:[0, 1, 4],x:'知识产权国际保护条约按其性质可以分为三类：一是提供实体性知识产权保护的条约，如《巴黎公约》《伯尔尼公约》等；二是便于在多国获得知识产权保护的条约，如PCT、《马德里协定》、《国际承认用于专利程序的微生物保存布达佩斯条约》(以下简称《布达佩斯条约》)等；三是建立相关国际分类的知识产权条约，如《商标注册用商品与服务国际分类尼斯协定》(以下简称《尼斯协定》)、《建立商标图形要素国际分类维也纳协定》等。故选ABE。 中级经济师'},
  {ch:1,type:'single',q:'知识产权密集型产业对经济增长的贡献率提升，体现了知识产权对经济社会发展的哪项作用？（ ）',o:["推动产业升级", "促进社会文化繁荣", "保护创新成果", "维护公平竞争"],a:0,x:'“知识产权密集型产业”“产业结构优化升级” 是核心，对应 “推动产业升级” 的作用，即通过保护知识产权激励技术创新，促进传统产业转型和新兴产业发展。故选A选项。 B 项侧重文化领域，C 项属于科技创新层面，D 项属于营商环境层面，均不符合。'},
  {ch:1,type:'single',q:'某企业因担心创新成果被抄袭而不愿投入研发，后因当地加强知识产权保护，该企业重拾信心并加大研发投入。这体现了知识产权对营商环境的哪项作用？（ ）',o:["维护公平竞争", "增强市场信心", "规范市场秩序", "提升国家竞争力"],a:1,x:'对保护营商环境的作用 (一)维护公平竞争 知识产权保护能够确保市场主体在公平的环境中竞争。拥有知识产权的企业或个人凭借其创新成果获得市场竞争优势是合法且受到保护的，而那些试图通过不正当手段抄袭、模仿他人创新成果来获取利益的行为则会受到法律的制裁。这就防止了“劣币驱逐良币”的现象发生，维护了市场的公平竞争秩序，鼓励企业或个人通过创新来提升自身竞争力，而不是通过不正当手段获取利益。 (二)增强市场信心 对于投资者和企业来说，一个良好的知识产权保护环境意味着他们的创新成果和商业投资能够得到有效的法律保障。这增强了他们对市场的信心，愿意加大在研发、创新和商业拓展方面的投入。同时，知识产权的稳定性和可预期性也使得企业在进行商业决策时更加放心，有利于吸引国内外的投资和技术合作，促进营商环境的优化和经济的繁荣。 (三)规范市场秩序 知识产权相关法律法规为市场主体的行为提供了明确的规范和指引。明确了什么是可以做的，什么是不允许做的，减少了不确定性。一旦出现知识产权纠纷，有完善的法律程序和机制来进行解决，使市场主体能够在一个有序、规范的环境中开展经营活动，提高了市场运行的效率和稳定性。 案例中企业因知识'},
  {ch:1,type:'multi',q:'以下关于外国专利代理机构在华设立常驻代表机构的描述，正确的是（）。',o:["代表机构的名称应由外国专利代理机构国籍、外国专利代理机构中文名称、驻在城市名称以及“分公司”字样组成", "外国专利代理机构申请在华设立常驻代表机构，应向国家市场监督管理总局提出申请", "代表机构应当自收到批准决定之日起两个月内，进行机构备案", "机构备案时需要提交的材料包括代表机构的基本情况说明和首席代表、代表的身份证明等材料", "管理部门应在受理许可申请之日起一年内作出是否批准的决定"],a:[2, 3],x:'①代表机构名称组成：外国专利代理机构国籍、外国专利代理机构中文名称、驻在城市名称以及“代表处”字样。②外国专利代理机构申请在华设立常驻代表机构，应当向国家知识产权局提出申请，按照要求提交有关材料。国家知识产权局应当自受理许可申请之日起三个月内作出是否批准的决定。③代表机构应当自收到国家知识产权局批准决定之日起两个月内，将有关材料提交代表机构所在地的省、自治区、直辖市人民政府知识产权管理部门备案。有关材料：代表机构的基本情况说明，包括名称、住所、首席代表、代表、业务范围等内容；首席代表、代表的身份证明等材料。'},
  {ch:1,type:'multi',q:'下列属于知识产权对科技创新作用的有（ ）',o:["授予创新者独占权，防止成果被窃取", "创新者通过转让知识产权获得经济收益", "公开专利技术内容，促进知识共享", "规范市场主体行为，维护竞争秩序", "推动高新技术产业发展"],a:[0, 1, 2],x:'A 项对应 “保护创新成果”，B 项对应 “提供经济回报”，C 项对应 “促进知识传播与交流”，均属于对科技创新的作用。 D 项属于对营商环境的 “规范市场秩序” 作用，E 项属于对经济社会发展的 “推动产业升级” 作用，故 D、E 错误。'},
  {ch:1,type:'multi',q:'知识产权保护对营商环境的作用包括（ ）',o:["防止 “劣币驱逐良币”，维护公平竞争", "增强投资者对市场的信心，吸引投资", "通过法律法规明确市场主体行为规范", "推动传统产业向高端化转型", "保障企业创新成果，鼓励通过创新提升竞争力"],a:[0, 1, 2, 4],x:'A 项对应 “维护公平竞争”，B 项对应 “增强市场信心”，C 项对应 “规范市场秩序”，E 项是 “维护公平竞争” 的延伸（鼓励创新提升竞争力），均属于营商环境作用。故选ABCE。 D 项属于对经济社会发展的 “推动产业升级” 作用，故 D 错误。 中级经济师'},
  {ch:2,type:'single',q:'《知识产权领域中央与地方财政事权和支出责任划分改革方案》实施时间是（ ）',o:["2023 年 12 月 26 日", "2023 年 12 月 29 日", "2024 年 1 月 1 日", "2024 年 12 月 26 日"],a:2,x:'根据中国政府网发布的信息，《知识产权领域中央与地方财政事权和支出责任划分改革方案》自 2024 年 1 月 1 日起实施。故C选项正确。'},
  {ch:2,type:'single',q:'下列不属于我国颁布实施的知识产权管理国家标准的是()。',o:["《企业知识产权合规管理体系要求》", "《科研组织知识产权管理规范》", "《高等学校知识产权管理规范》", "《企业知识产权体系要求》"],a:3,x:'目前，我国颁布实施的知识产权管理国家标准有《企业知识产权合规管理体系要求》《科研组织知识产权管理规范》《高等学校知识产权管理规范》，归口以及执行单位均为全国知识管理标准化技术委员会。'},
  {ch:2,type:'multi',q:'根据管理客体的不同，知识产权管理可以分为(  )。',o:["专利管理", "商标管理", "版权管理", "商业秘密管理", "知识产权运用管理"],a:[0, 1, 2, 3],x:'根据管理客体的不同，知识产权管理可以分为专利管理、商标管理、版权管理、集成电路布图设计管理、地理标志管理、植物新品种管理、商业秘密管理等。故ABCD选项正确。 E选项属于按管理内容不同的分类。'},
  {ch:2,type:'multi',q:'下列属于按管理主体分类的知识产权管理类型有（ ）',o:["知识产权行政管理", "企业知识产权管理", "著作权管理", "事业单位知识产权管理", "知识产权创造管理"],a:[0, 1, 3],x:'根据管理主体的不同，知识产权管理可以分为知识产权行政管理、行业知识产权管理、企业知识产权管理、事业单位知识产权管理等。故 A、B、D 正确。 C 项属于按客体分类（客体为著作权），E 项属于按内容分类（内容为创造环节），均不符合 “主体分类”，为错误选项。 中级经济师'},
  {ch:2,type:'single',q:'下列关于知识产权公共服务的说法中，错误的是(　　)。',o:["知识产权公共服务由政府主导", "知识产权公共服务主要解决的是市场失灵所引发的政府服务问题", "知识产权公共服务由政府提供", "政府部门应充分发挥公共服务职能，有效地服务于市场和社会需求"],a:2,x:'目前，国内提供知识产权公共服务的主体既有政府部门(包括但不限于负责专利、商标事务的国家知识产权局、各地方知识产权局等)，也有以政府部门为依托的事业单位(如专利检索咨询中心、专利信息中心等)，还有一些行业协会，甚至是部分私营企业。'},
  {ch:2,type:'single',q:'知识产权公共服务的普及性特征是指（）。',o:["为满足创新主体或市场主体普遍性、基础性的知识产权需求和促进对知识产权制度的熟练运用而开展传播和推广知识产权相关的公共服务", "为指导创新主体或市场主体应对知识产权风险和促进知识产权高质量发展而开展公共服务", "为支持创新主体或市场主体的知识产权活动而不断优化公共资源配置、促进公共资源高效利用", "为便于创新主体或市场主体在知识产权活动中简化和协调各项程序，提升服务效率、优化服务水平而开展公共服务"],a:0,x:'知识产权公共服务具有以下特征：普及性指为满足创新主体或市场主体普遍性、基础性的知识产权需求和促进对知识产权制度的熟练运用而开展传播和推广知识产权相关的公共服务；帮扶性指为提升创新主体或市场主体的知识产权综合运用能力而开展公共服务。指引性指为指导创新主体或市场主体应对知识产权风险和促进知识产权高质量发展而开展公共服务；便利性指为便于创新主体或市场主体在知识产权活动中简化和协调各项程序，提升服务效率、优化服务水平而开展公共服务；支撑性指为支持创新主体或市场主体的知识产权活动而不断优化公共资源配置、促进公共资源高效利用。'},
  {ch:2,type:'single',q:'随着我国知识产权公共服务产品等资源供给日益丰富，并且形成了多元化、多渠道的公共服务资源供给。下列不属于我国知识产权公共服务内容的是（）。',o:["知识产权咨询服务和公益援助", "知识产权数据信息的供给", "知识产权金融化交易平台", "组织知识产权宣传教育和人才培养"],a:2,x:'近年来，我国知识产权公共服务内容日益完备，知识产权公共服务产品等资源供 给日益丰富，形成了多元化、多渠道的公共服务资源供给，包括知识产权数据信息供给、知识产权公共服务平台和工具、知识产权咨询服务和公益援助、知识产权宣传教育和人才培养等。题目问的是，故选C选项。'},
  {ch:2,type:'multi',q:'下列属于知识产权公共服务所具有的特征是（）。',o:["普及性", "帮扶性", "指引性", "便利性", "创新性"],a:[0, 1, 2, 3],x:'知识产权公共服务具有普及性、帮扶性、指引性、便利性和支撑性特征。 ①普及性，指知识产权公共服务是为满足创新主体或市场主体普遍性、基础性的知识产权需 求和促进对知识产权制度的熟练运用而开展的传播和推广知识产权相关的公共服务； ②帮扶性，指知识产权公共服务是为提升创新主体或市场主体的知识产权综合运用能 力而开展的公共服务； ③指引性，指知识产权公共服务是为指导创新主体或市场主体 应对知识产权风险和促进知识产权高质量发展而开展的公共服务； ④便利性，指知识 产权公共服务是便于创新主体或市场主体在知识产权活动中简化和协调各项程序、提 升服务效率、优化服务水平而开展的公共服务； ⑤支撑性，指知识产权公共服务是为 支持创新主体或市场主体的知识产权活动而不断优化公共资源配置、促进公共资源高 效利用的公共服务。 故选ABCD。'},
  {ch:2,type:'multi',q:'知识产权公共服务的特征有(  )。',o:["选择性", "帮扶性", "便利性", "指引性", "支撑性"],a:[1, 2, 3, 4],x:'知识产权公共服务具有普及性、帮扶性、指引性、便利性和支撑性的特征。 中级经济师'},
  {ch:2,type:'single',q:'某律师事务所拟开展专利代理业务，已知该所有5名执业律师，其中1人具有专利代理人资格但并无执业经历，下列说法正确的是()',o:["该所不符合申请办理执业许可证的条件，因该所无人具有专利代理执业经历", "该所符合申请办理执业许可证的条件", "该所不符合申请办理执业许可证的条件，因该所仅有1人具有专利代理人资格", "该所不符合申请办理执业许可证的条件，因为律师事务所不能从事专利代理业务"],a:2,x:'本题考查专利代理机构的申请条件。律师事务所申请办理执业许可证的条件包括:有独立的经营场所;有两名以上合伙人或者专职律师具有专利代理师资格证。C正确，ABD错误。'},
  {ch:2,type:'single',q:'专利代理机构经营场所发生变化的，应当自办理企业变更登记之日起()日内向国家知识产权局申请办理变更手续。',o:["15", "30", "45", "60"],a:1,x:'专利代理机构名称、经营场所、合伙协议或者公司章程、合伙人或者执行事务合伙人、股东或者法定代表人发生变化的，应当自办理企业变更登记之日起三十日内向国家知识产权局申请办理变更手续。故B选项正确。'},
  {ch:2,type:'single',q:'A市律师机构准备开展专利代理业务，已知该律所有10名执业律师，其中1人具有专利代理人资格但并无执业经历，下列说法正确的是( )。',o:["该所不符合申请办理执业许可证的条件，因该所仅有1人具有专利代理人资格", "该所不符合申请办理执业许可证的条件，因该所无人具有专利代理执业经历", "该所符合申请办理执业许可证的条件", "该所不符合申请办理执业许可证的条件，因为律师事务所不能从事专利代理业务"],a:0,x:'律师事务所申请办理执业许可证的条件包括:有独立的经营场所;有两名以上合伙人或者专职律师具有专利代理师资格证。A正确，BCD错误。'},
  {ch:2,type:'multi',q:'下列情形中的人员不得作为专利代理机构的合伙人或股东的有（）。',o:["因故意犯罪受过刑事处罚的人员", "不能专职在专利代理机构工作的人员", "不具有完全民事行为能力的人员", "专利代理机构以欺骗、贿赂等不正当手段取得执业许可证，被依法撤销、吊销的，其合伙人、股东、法定代表人自处罚决定作出之日起三年内不得在专利代理机构新任合伙人或者股东、法定代表人", "所在专利代理机构解散，已经妥善处理各种未办结的专利代理业务"],a:[0, 1, 2, 3],x:'不得作为专利代理机构的合伙人、股东的情形具体包括：①不具有完全民事行为能力（C选项正确）；②因故意犯罪受过刑事处罚（A选项正确）；③不能专职在专利代理机构工作（B选项正确）；④所在专利代理机构解散或者被撤销、吊销执业许可证，未妥善处理各种尚未办结的专利代理业务；⑤专利代理机构以欺骗、贿赂等不正当手段取得执业许可证，被依法撤销、吊销的，其合伙人、股东、法定代表人自处罚决定作出之日起三年内不得在专利代理机构新任合伙人或者股东、法定代表人（D选项正确）。故ABCD选项正确。E选项为干扰选项。'},
  {ch:2,type:'multi',q:'下列选项中，应将专利代理机构被列入经营异常名录的是()。',o:["未在规定的期限提交年度报告", "取得专利代理机构执业许可证或者提交年度报告时提供虚假信息", "因逃税被税务部门罚款", "就同一专利权的事务接受有利益冲突的其他当事人的委托", "通过登记的经营场所无法联系"],a:[0, 1, 4],x:'被列入经营异常名录的情形包括：未在规定的期限提交年度报告（A选项正确）；取得专利代理机构执业许可证或者提交年度报告时提供虚假信息（B选项正确）；擅自变更名称、办公场所、执行事务合伙人或者法定代表人、合伙人或者股东；分支机构设立、变更、注销未按照规定办理备案手续；不再符合执业许可条件，省、自治区、直辖市人民政府管理专利工作的部门责令其整改，期限届满仍不符合条件；专利代理机构公示信息与其在市场监督管理部门或者司法行政部门的登记信息不一致；通过登记的经营场所无法联系（E选项正确）。CD不符合题意，故选ABE。'},
  {ch:2,type:'multi',q:'下列选项，属于“擅自开展专利代理业务”的是()。',o:["借用他人资质开展专利代理业务", "租用他人资质开展专利代理业务", "盗用他人资质开展专利代理业务", "专利代理师资格证被吊销后，仍以专利代理师的名义招揽业务", "同时在两个以上专利代理机构从事专利代理业务"],a:[0, 1, 2, 3],x:'擅自开展专利代理业务”的违法行为:(一)通过租用、借用等方式利用他人资质开展专利代理业务（ABC选项正确）;(二)未取得专利代理机构执业许可证或者不符合专利代理师执业条件，擅自代理专利申请、宣告专利权无效等相关业务，或者以专利代理机构、专利代理师的名义招揽业务;(三)专利代理机构执业许可证或者专利代理师资格证被撤销或者吊销后，擅自代理专利申请、宣告专利权无效等相关业务，或者以专利代理机构、专利代理师的名义招揽业务（D选项正确）。ABCD正确。 E属于违法行为，但不属于擅自开展专利代理业务。 中级经济师'},
  {ch:2,type:'single',q:'以下关于商标代理机构备案有效期限及延续备案的说法正确的是（）。',o:["商标代理机构备案的有效期为一年", "商标代理机构延续备案无需办理，可以自动延续", "商标代理机构延续备案的有效期为两年", "商标代理机构若需继续从事代理业务，可以在有效期届满前六个月内办理延续备案"],a:3,x:'商标代理机构备案的有效期为三年（A选项错误）。有效期届满需要继续从事代理业务的，商标代理机构可以在有效期届满前六个月内办理延续备案（B选项错误，D选项正确）。每次延续备案的有效期为三年（C选项错误），自原备案有效期满次日起计算。故选D选项。'},
  {ch:2,type:'single',q:'商标代理机构知道或者应当知道委托人申请注册的商标属于《商标法》第四条规定的情形而接受其委托的，由管理商标工作的部门责令限期改正，给予警告，处（）的罚款。',o:["一万元以上五万元以下", "一万元以上十万元以下", "五万元以下", "十万元以下"],a:1,x:'商标代理机构违反《商标法》第六十八条规定的，由管理商标工作的部门责令限期改正，给予警告，处一万元以上十万元以下的罚款。对直接负责的主管人员和其他直接责任人员给予警告，处五千元以上五万元以下的罚款。故B选项正确。'},
  {ch:2,type:'multi',q:'商标代理机构可以以委托人的名义在代理权限范围内依法办理的事宜包括（）。',o:["个人背景调查", "代写私人信件", "商标纠纷的处理", "社交护送", "商标注册申请"],a:[2, 4],x:'商标代理机构接受委托人的委托，可以以委托人的名义在代理权限范围内依法办理以下事宜：商标注册申请，商标变更、续展、转让、注销，商标异议，商标撤销、无效宣告，商标复审、商标纠纷的处理，以及其他商标事宜。'},
  {ch:2,type:'multi',q:'下列属于商标代理的有（）。',o:["用编造的法律文件办理商标业务", "以诋毁其他商标代理机构手段招徕商标代理业务", "知道被转让商标属于恶意申请的注册商标，仍帮助恶意注册人办理转让的", "在同一商标案件中接受有利害冲突的双方当事人委托", "在法律咨询服务上申请商标注册"],a:[0, 1, 2, 3],x:'根据《商标法》《商标法实施条例》《商标代理监督管理规定》,商标代理违法行为包括：伪造、变造法律书的行为；以诋毁其他商标代理机构等手段招徕业务的行为；以欺诈等方式招徕业务的行为；通过网络从事商标代理违法业务的行为；以其他不正当手段扰乱商标代理市场秩序的行为；违反《商标法》第十九条第三款规定的行为；申请注册代理服务以外其他商标的行为；接受有利益冲突的双方当事人委托的行为等。'},
  {ch:2,type:'multi',q:'属于《商标法》及其实施条例规定的商标代理机构的违法行为的有(  )。',o:["在同一商标案件中接受有利益冲突的双方当事人委托的", "商标代理机构对其代理服务申请商标注册的", "以欺诈、虚假宣传、引人误解或者商业贿赂等方式招徕业务的", "隐瞒事实，提供虚假证据，或者威胁、诱导他人隐蹒事实，提供虚假证据的", "以诋毁其他商标代理机构等手段招徕商标代理业务的"],a:[0, 2, 3, 4],x:'《商标法》第68条规定的商标代理机构的违法行为包括：①办理商标事宜过程中，伪造、变造或者使用伪造、变造的法律文件、印章、签名的；②以诋毁其他商标代理机构等手段招徕商标代理业务（E选项正确）或者以其他不正当手段扰乱商标代理市场秩序的；③违反《商标法》第四条、第十九条第三款和第四款规定的。 《商标法实施条例》第八十八条对前述“以其他不正当手段扰乱商标代理市场秩序的行为”进行了细化，包括：①以欺诈、虚假宣传、引人误解或者商业贿赂等方式招徕业务的（C选项正确）；②隐瞒事实，提供虚假证据，或者威胁、诱导他人隐瞒事实，提供虚假证据的（D选项正确）；③在同一商标案件中接受有利益冲突的双方当事人委托的（A选项正确）。 故选ACDE。 B选项“商标代理机构对其代理服务申请商标注册的”并不属于违法行为，《商标法》第十九条第三款规定：商标代理机构知道或者应当知道委托人申请注册的商标属于本法第四条、第十五条和第三十二条规定情形的，不得接受其委托。商标代理机构除对其代理服务申请商标注册外，不得申请注册其他商标。 这条规定明确指出，商标代理机构可以为其提供的代理服务申请商标注册。因此，这种行为是合法的，并不属于违'},
  {ch:3,type:'single',q:'下列关于专利权利要求书的理解正确的是（）。',o:["从属权利要求的保护范围并不必然落入其引用的权利要求的保护范围之内", "侵犯一项从属权利要求不必然会侵犯独立权利要求，反之则不会", "从属权利要求保护的可以是多个技术方案，而独立权利要求保护的只能是一个技术方案", "在确定权利要求保护范围时，权利要求中的所有技术特征均应当予以考虑"],a:3,x:'B 选项错误，对于从属权利要求来说，其限定的保护范围由被引用的权利要求的全部特征和自身权利要求的附加特征共同构成，如果引用不当，也会导致在保护范围不清楚。 A 选项错误：从属权利要求的保护范围必然落入其引用的权利要求的保护范围之内。 C 选项错误：独立权利要求可以保护多个并列的技术方案。 D 选项正确，在类型上区分权利要求的目的是为了确定权利要求的保护范围。通常情况下，在确定权利要求的保护范围时，权利要求中的所有特征均应当予以考虑，而每一个特征的实际限定作用应当最终体现在该权利要求所要求保护的主题上。'},
  {ch:3,type:'single',q:'下列写入外观设计专利申请简要说明中的内容错误的是（    ）。',o:["外观设计产品名称", "产品内部设有旋转装置", "省略视图或者请求保护色彩的，应在简要说明中写明", "对同一产品的多项相似外观设计提出一件外观设计专利申请的，应当在简要说明中指定其中一项作为基本设计"],a:1,x:'根据《专利法实施细则》第三十一条，简要说明应当包括下列五项内容。 (1)外观设计产品的名称。简要说明中的产品名称应当与请求书中的产品名称一致。 (2)外观设计产品的用途。简要说明中应当写明有助于确定产品类别的用途。对于具有多种用途的产品，简要说明应当写明所述产品的多种用途。 (3)外观设计的设计要点。设计要点是指与现有设计相区别的产品的形状、图案及其结合，或者色彩与形状、图案的结合，或者产品的部位。对设计要点的描述应当简明扼要。 (4)指定一幅最能表明设计要点的图片或者照片。指定的图片或者照片用于出版专利公报。 (5)申请局部外观设计专利的，必要时在简要说明中写明请求保护的局部。此外，还有一些特殊情形应当在简要说明中写明，例如，在请求保护色彩或者省略视图，或者对同一产品的多项相似外观设计提出一件外观设计专利申请等情形下，应当分别在简要说明中说明色彩或者省略视图的具体原因，或者指定其中一项作为基本设计。 B选项涉及的是产品的性能，属于技术领域，且外观设计不涉及产品内部的情形。因此，B选项内容不应写入外观设计专利申请简要说明中，故选B选项。 ACD均为正确描述，故不选。'},
  {ch:3,type:'single',q:'一项实用新型专利申请，权利要求主题为“一种写字台”。其说明书中除公开了写字台相关结构及实施例外，还公开了与之匹配的扶手椅，但扶手椅结构中出现自相矛盾之处以至于本领域技术人员无法确定扶手椅采用的结构。这种情形属于（）。',o:["说明书未满足清楚、完整地公开实用新型以使所属领域技术人员能够实现的要求", "不违反专利法有关专利文件撰写的规定", "权利要求缺少必要技术特征", "权利要求得不到说明书支持"],a:1,x:'《专利法》第二十六条第三款规定，说明书应当对发明或者实用新型作出清楚、完整的说明，以所属技术领域的技术人员能够实现为准。在理解该法条时，需要特别注意，判断的核心是针对权利要求所限定的发明或者实用新型。有些说明书中描述的方案比较多，而其中的有些内容与权利要求并无直接的关联，由于这些内容即便描述得不清楚、不完整，也不影响权利要求所限定方案的实现，因而该事实本身不足以构成说明书不符合《专利法》第二十六条第三款的理由。'},
  {ch:3,type:'multi',q:'下列关于组件产品和成套产品的说法，正确的有（ ）',o:["组件产品包括无组装关系、组装关系唯一、组装关系不唯一三类", "成套产品需由两件以上属于同一大类的独立产品组成", "组装关系不唯一的组件产品，视图名称前需标注 “套件” 字样", "成套产品中每件产品需有独立使用价值，组合后又有组合使用价值", "扑克牌属于无组装关系的组件产品"],a:[0, 1, 3, 4],x:'选项 A、B、D、E 均符合组件产品和成套产品的定义及分类；选项 C 错误，组装关系不唯一的组件产品视图名称前应标注 “组件” 字样，“套件” 用于成套产品，故错误。 中级经济师'},
  {ch:3,type:'single',q:'以下关于专利新颖性（发明或实用型新）的理解，错误的是(  )。',o:["新颖性，是指该发明或者实用新型不属于现有技术", "新颖性，是指没有任何单位或者个人就同样的发明或者实用新型在申请日以前向国务院专利行政部门提出过申请，并记载在申请日以后公布的专利申请文件或者公告的专利文件中", "新颖性，是指与现有技术相比，该发明或者实用新型具有突出的实质性特点和显著的进步", "新颖性，是指该发明或者实用新型的技术不属于申请日以前在国内外为公众所知的技术"],a:2,x:'C选项错误，新颖性是指该发明或者实用新型不属于现有技术，也没有任何单位或者个人就同样的发明或者实用新型在申请日以前向国家知识产权局提出过申请，并记载在申请日以后公布的专利申请文件或者公告的专利文件中。选项C描述的是创造性的要求，而不是新颖性的要求。 题目问的是错误的，故选C选项。 ABD均为正确描述，故不选。'},
  {ch:3,type:'single',q:'下列选项中，符合申请外观设计专利基本条件的是（    ）。',o:["一种新口感的饮料", "一种新口感饮料的制作方法", "一种造型独特的饮料瓶", "一幅饮料的宣传海报"],a:2,x:'根据《专利法》第2条的规定，外观设计是指对产品的形状、图案或者其结合以及色彩与形状、图案的结合所作出的富有美感并适于工业应用的新设计。 选项C中的饮料瓶符合这些条件。而选项A和B涉及的是产品的口感和制作方法，不属于外观设计保护范围；选项D是一种平面印刷品，主要起标识作用，也不属于外观设计保护范围。 故选C选项。'},
  {ch:3,type:'single',q:'以下关于优先权的理解，错误的是(  )。',o:["我国专利法优先权包括外国优先权和本国优先权两类", "本国优先权只适用于发明、实用新型的申请", "申请人自发明在中国第一次提出专利申请之日起12个月内，又向国务院专利行政部门就相同主题提出专利申请的，可以享有优先权", "申请人自发明在外国第一次提出专利申请之日起12个月内，又在中国就相同主题提出专利申请的，依照双边协议或者共同参加的国际条约，或者依照互认优先权的原则，可以享有优先权"],a:1,x:'选项 B 错误，本国优先权不仅适用于发明和实用新型的申请，还适用于外观设计的申请。 注意题目问的是错误的，故选B选项。 ACD均为正确描述。'},
  {ch:3,type:'multi',q:'根据《专利法》的规定，授予专利权的外观设计不得与他人在申请日以前已经取得的合法权利相冲突。下列属于该规定所指的合法权利的有（    ）。',o:["发明、实用新型专利权", "企业的商标权", "企业的名称权", "知名商品特有的包装", "含有明星照片的海报设计"],a:[1, 2, 3, 4],x:'一项外观设计专利权被认定与他人在申请日(有优先权的指优先权日)以前已经取得的合法权利相冲突的，应当宣告该项外观设计专利权无效。“他人”是指专利权人以外的民事主体，包括自然人、法人或者其他组织。“合法权利”是指依照我国法律享有并且在涉案专利申请日仍然有效的权利或者权益，包括商标权（A选项）、著作权、企业名称权（C选项）、肖像权（E选项），以及知名商品特有包装（D选项）或者装潢使用权等。“在申请日以前已经取得”是指在先合法权利的取得日在涉案专利申请日之前。“相冲突”是指未经权利人许可，外观设计专利权使用了在先合法权利的客体，从而导致专利权的实施将会损害在先权利人的相关合法权利或者权益。 故选BCDE。A选项为干扰选项。'},
  {ch:3,type:'multi',q:'关于下列成果可否获得专利权的说法，判断错误的是（    ）。',o:["甲设计的一套图书分类的新规则，可获得方法发明专利权", "乙设计的新型传染病的检测方法，能迅速准确诊断传染病，该诊断方法不能被授予专利权", "丙通过转基因方法研发出一种新的大豆品种，该新品种可以被授予专利权", "丁研发出一种用原子核变换方法获得的新物质，该新物质可以获得发明专利", "戊设计出一幅平面印刷品，包括图案和色彩二者的结合，主要起标识作用，该设计可以获得外观设计专利"],a:[0, 2, 3, 4],x:'根据《专利法》第25条：对下列各项，不授予专利权：（一）科学发现；（二）智力活动的规则和方法；（三）疾病的诊断和治疗方法；（四）动物和植物品种；（五）原子核变换方法以及用原子核变换方法获得的物质；（六）对平面印刷品的图案、色彩或者二者的结合作出的主要起标识作用的设计。对前款第（四）项所列产品的生产方法，可以依照本法规定授予专利权。 图书分类的新规则属于智力活动的规则和方法，属于《专利法》第25条规定，不授予专利权的范围。A项错误。 疾病的诊断和治疗方法不授予专利权。B项正确。 动植物新品种不受专利保护，但对于动物和植物品种的生产方法，可以授予专利权。C项错误。 由于原子核变换方法以及用该方法所获得的物质，关系到国家的经济、国防、科研和公共生活的重大利益，不宜为单位或私人垄断，因此不能被授予专利权。D项错误。 E选项所述“主要起标识作用”即指主要功能在于使公众识别所涉及的产品、服务的来源等，属于商标的功能，因此戊设计的印刷品不可以获得外观设计专利。E项错误。 题目问的是错误的是，故选ACDE.'},
  {ch:3,type:'multi',q:'申请外观设计专利的发明创造不会与如下现有权利产生冲突的是(  )。',o:["某个企业的商号", "某个企业创始人的个人传记签名售书会海报", "某个企业的驰名商标", "某个企业刚授权的发明专利", "某个企业使用多年的实用新型专利"],a:[3, 4],x:'一项外观设计专利权被认定与他人在申请日(有优先权的指优先权日)以前已经取得的合法权利相冲突的，应当宣告该项外观设计专利权无效。“他人”是指专利权人以外的民事主体，包括自然人、法人或者其他组织。“合法权利”是指依照我国法律享有并且在涉案专利申请日仍然有效的权利或者权益，包括商标权、著作权、企业名称权、肖像权，以及知名商品特有包装或者装潢使用权等。“在申请日以前已经取得”是指在先合法权利的取得日在涉案专利申请日之前。“相冲突”是指未经权利人许可，外观设计专利权使用了在先合法权利的客体，从而导致专利权的实施将会损害在先权利人的相关合法权利或者权益。 D选项正确：发明专利与外观设计专利保护的对象不同，发明专利保护的是技术方案，而外观设计专利保护的是产品的外观。因此，外观设计专利不会与发明专利产生权利冲突。 E选项正确：实用新型专利保护的是产品的形状、构造或其结合所提出的适于实用的新技术方案，与外观设计专利保护的产品外观不冲突。 其他选项可能会与外观设计专利产生权利冲突： A选项错误：商号可能与外观设计中的文字标识产生冲突。 B选项错误：海报上的设计元素（如图案、色彩）可能与外观设计产生冲突。'},
  {ch:3,type:'single',q:'关于无效宣告请求程序中专利文件的修改规则，下列说法错误的是（）。',o:["发明或者实用新型专利文件的修改仅限于权利要求书，外观设计专利的专利权人不得修改其专利文件", "无效宣告请求程序中修改专利文件的限制严于授权前的修改限制", "专利权人可以修改说明书和附图", "专利文件的修改不得超出原说明书和权利要求书记载的范围"],a:2,x:'无效宣告请求程序中关于专利文件的修改，对发明或者实用新型专利文件的修改仅限于权利要求书，外观设计专利的专利权人不得修改其专利文件。权利要求的修改有四个“不得”：①不得改变原权利要求的主题名称；②与授权的权利要求相比，不得扩大原专利的保护范围；③一般不得增加未包含在授权的权利要求书中的技术特征；④不得超出原说明书和权利要求书记载的范围。'},
  {ch:3,type:'single',q:'下列不能作为驳回一项专利申请的理由的是（）。',o:["权利要求书存在实质性缺陷", "说明书存在实质性缺陷", "摘要未具体说明发明内容", "缺少必要的附图"],a:2,x:'授予专利权的发明和实用新型，应当具备新颖性、创造性和实用性。说明书应当对发明或者实用新型作出清楚、完整的说明，以所属技术领域的技术人员能够实现为准；必要的时候，应当有附图。摘要应当简要说明发明或者实用新型的技术要点。'},
