  {ch:0,q:'下列各项业务，会引起现金流量变动的是（）。',o:["现金购买原材料", "将现金存入银行", "用固定资产向外投资"],a:0,x:'本题考查现金流量表。选项B只是涉及现金各项目之间的变动，选项CD属于非现金项目之间的增减变动，都不会引起现金流量的变动。正保会计网校中级经济师好课已就位，随报随学！其中，高效实验班入学测试、阶段测评、还赠送机考模拟系统，两科联报更划算！'},
  {ch:0,type:'multi',q:'财务分析的基本方法有（）。',o:["比较分析法", "比率分析法", "事前分析法", "趋势分析法"],a:[0, 1, 3],x:'本题考查财务报表分析的基本方法。财务报表分析常用的方法包括比率分析法、比较分析法和趋势分析法等基本方法。'},
  {ch:30,q:'企业财务目标实现的稳健保证是（）。',o:["偿债能力", "营运能力", "盈利能力"],a:0,x:'本题考查财务报表分析的内容。偿债能力是企业偿还到期债务的能力，是企业财务目标实现的稳健保证。'},
  {ch:0,q:'下列属于现金的是（）。',o:["银行存款", "国库券", "股票"],a:0,x:'本题考查现金流量表。现金是指企业的库存现金、可随时支付的存款，包括库存现金、银行存款、其他货币资金。'},
  {ch:25,q:'企业取得借款所收到的现金，属于现金流量表上反映（）的现金流入。',o:["与经营活动有关", "与投资活动有关", "与筹资活动有关"],a:2,x:'本题考查现金流量表的编制。企业取得借款所收到的现金是筹资活动现金流量。'},
  {ch:25,q:'将净利润调节为经营活动的现金流量实际上就是采用（）编制经营活动的现金流量。',o:["直接法", "间接法", "水平法"],a:1,x:'本题考查现金流量表的编制。将净利润调节为经营活动的现金流量实际上就是采用间接法编制经营活动的现金流量。'},
  {ch:25,q:'取得子公司及其他营业单位支付的现金净额，属于现金流量表上反映（）的现金流入。',o:["与经营活动有关", "与投资活动有关", "与筹资活动有关"],a:1,x:'本题考查现金流量表的编制。取得子公司及其他营业单位支付的现金净额是投资活动产生的现金流入。'},
  {ch:0,type:'multi',q:'下列经济业务所产生的现金流量中，应列入“筹资活动产生的现金流量”项目的有（）。',o:["发行股票或接受投入资本", "分配现金股利", "取得和偿还银行借款", "处置子公司及其他营业单位收到的现金净额"],a:[0,1,2,3],x:'本题考查现金流量表的编制。选项D属于投资活动的现金流量。正保会计网校中级经济师好课已就位，随报随学！其中，高效实验班入学测试、阶段测评、还赠送机考模拟系统，两科联报更划算！'},
  {ch:26,q:'下列指标中，不属于反映企业盈利能力的指标是（）。',o:["资产净利润率", "市盈率", "总资产周转率"],a:2,x:'本题考查盈利能力分析指标。盈利能力分析运用的财务比率指标主要有：营业利润率、营业净利润率、资产净利润率、资本收益率、净资产收益率、资产净利润率、普通股每股收益、市盈率、资本保值增值率。C选项属于反映企业营运能力的指标。'},
  {ch:25,q:'在财务报表分析中，企业息税前利润与利息费用的比率称为（）。',o:["已获利息倍数", "市盈率", "流动比率"],a:0,x:'本题考查偿债能力分析指标。已获利息倍数又叫利息保障倍数，是指企业息税前利润与利息费用的比率，反映企业用经营所得支付债务利息的能力，用来衡量盈利能力对债务偿付的保证程度。（2015年试题）'},
  {ch:25,q:'资产负债率也称负债比率或举债经营比率，是（）。',o:["负债总额对全部资产总额之比", "资产总额对全部负债总额之比", "负债总额对所有者权益总额之比"],a:0,x:'本题考查偿债能力分析指标。资产负债率也称负债比率或举债经营比率，是指负债总额对全部资产总额之比，用来衡量企业利用债权人提供的资金进行经营活动的能力，反映债权人发放贷款的安全程度。'},
  {ch:0,q:'衡量短期债务清偿能力最常用的比率是（）。',o:["市盈率", "总资产周转率", "产权比率"],a:2,x:'本题考查偿债能力分析指标。流动比率是衡量短期债务清偿能力最常用的比率，是衡量企业短期风险的指标。'},
  {ch:26,type:'multi',q:'下列指标中，属于反映企业偿债能力的指标有（）。',o:["产权比率", "速动比率", "现金比率", "市盈率"],a:[0, 1, 2],x:'本题考查偿债能力分析指标。反映企业偿债能力的财务比率指标主要有：流动比率、速动比率、现金比率、资产负债率、产权比率、已获利息倍数。'},
  {ch:26,q:'一般认为流动比率不宜过高也不宜过低，应维持在（）左右。',o:["1∶1", "2∶1", "1∶2"],a:1,x:'本题考查偿债能力分析指标。一般认为流动比率不宜过高也不宜过低，应维持在2∶1左右。速动比率一般应维持在1∶1左右。'},
  {ch:0,type:'multi',q:'在计算已获利息倍数时，需要使用的指标有（）。',o:["息税前利润", "息税后利润", "利息费用", "财务费用"],a:[0, 2],x:'本题考查已获利息倍数指标。已获利息倍数又叫利息保障倍数，是指企业息税前利润与利息费用的比率，其计算公式为：已获利息倍数＝息税前利润／利息费用＝（利润总额＋利息费用）／利息费用。正保会计网校中级经济师好课已就位，随报随学！其中，高效实验班入学测试、阶段测评、还赠送机考模拟系统，两科联报更划算！'},
  {ch:24,type:'multi',q:'政府财务会计要素包括资产、负债和（）。',o:["收入", "利润", "费用", "净资产"],a:[0, 2, 3],x:'本题考查政府财务会计要素。政府财务会计要素包括资产、负债、净资产、收入和费用。'},
  {ch:24,q:'政府会计中的预算会计核算一般采用的是（）。',o:["收付实现制", "实地盘存制", "永续盘存制"],a:0,x:'本题考查政府会计的概念。政府会计由预算会计和财务会计构成。预算会计提供与政府预算执行有关的信息，实行收付实现制，国务院另有规定的，依照其规定。'},
  {ch:25,q:'流动资产周转率是对企业营运能力进行分析的指标之一，它是（）与全部流动资产的平均余额的比率。',o:["利润", "净利润", "营业收入"],a:2,x:'本题考查营运能力分析指标。流动资产周转率是营业收入净额与全部流动资产的平均余额的比率。'},
  {ch:0,type:'multi',q:'下列各项指标中，反映企业营运能力的有（）。',o:["应收账款周转天数", "流动资产周转率", "资本保值增值率", "产权比率"],a:[0,1,3],x:'本题考查营运能力分析指标。反映企业营运能力的指标包括：应收账款周转率、存货周转率、流动资产周转率、总资产周转率。选项C是反映企业盈利能力的指标。选项D是反映企业偿债能力的指标。'},
  {ch:0,q:'市盈率是反映企业（）的指标。',o:["盈利能力", "偿债能力", "发展能力"],a:0,x:'本题考查反映企业盈利能力的指标。市盈率是反映企业盈利能力的指标。（2012年试题）'},
  {ch:0,q:'现金比率反映的是（）。',o:["企业可在短期内转变为现金的流动资产偿还到期流动负债的能力", "企业用经营所得支付债务利息的能力", "企业立即偿还到期债务的能力"],a:2,x:'本题考查偿债能力分析指标。现金比率反映企业的即可变现能力，可以显示企业立即偿还到期债务的能力。选项A是流动比率反映的；选项B是已获利息倍数反映的；选项D是用资产负债率来衡量的。'},
  {ch:26,type:'multi',q:'下列指标中，属于反映企业长期偿债能力的有（）。',o:["市盈率", "产权比率", "现金比率", "流动比率"],a:[0,3],x:'本题考查偿债能力分析指标。产权比率、资产负债率是反映企业长期偿债能力的指标。选项A是反映企业盈利能力的指标。选项CD是反映企业短期偿债能力的指标。正保会计网校中级经济师好课已就位，随报随学！其中，高效实验班入学测试、阶段测评、还赠送机考模拟系统，两科联报更划算！'},
  {ch:28,q:'法律调整的对象是（）。',o:["人际关系", "社会关系", "个体之间的关系"],a:1,x:'本题考查法律的调整对象。法律调整的对象是社会关系。'},
  {ch:28,q:'法律对经济关系调整的阶段中，起主导作用的是民商法的阶段是（）。',o:["第一阶段", "第二阶段", "第三阶段"],a:1,x:'本题考查法律对经济关系调整的阶段。第二阶段时期，对经济关系调整起主导作用的是民商法。'},
  {ch:24,q:'综合反映政府会计主体年度预算收支执行结果的文件是（）。',o:["政府决算报告", "政府财务报表附注", "政府部门财务报告"],a:0,x:'本题考查政府决算报告的概念。政府决算报告是综合反映政府会计主体年度预算收支执行结果的文件。'},
  {ch:24,type:'multi',q:'政府会计的组成部分包括（）。',o:["决策会计", "责任会计", "预算会计", "成本会计"],a:[1,3],x:'本题考查政府会计的概念。政府会计由预算会计和财务会计构成。预算会计提供与政府预算执行有关的信息，实行收付实现制，国务院另有规定的，依照其规定。财务会计提供与政府的财务状况、运行情况和现金流量等有关信息，实行权责发生制。'},
  {ch:25,q:'事业净资产项目应当列入（）。',o:["现金流量表", "利润表", "资产负债表"],a:2,x:'本题考查政府会计要素。政府财务会计要素包括资产、负债、净资产、收入和费用。净资产项目应当列入资产负债表。'},
  {ch:13,type:'multi',q:'政府预算会计要素包括（）。',o:["预算收入", "预算结余", "预算支出", "预算费用"],a:[0, 1, 2],x:'本题考查政府预算会计要素。政府预算会计要素包括预算收入、预算支出和预算结余。'},
  {ch:24,q:'政府会计主体过去的经济业务或者事项形成的，由政府会计主体控制的，预期能够产生服务潜力或者带来经济利益流入的经济资源是（）。',o:["负债", "收入", "资产"],a:2,x:'本题考查政府财务会计要素。资产是指政府会计主体过去的经济业务或者事项形成的，由政府会计主体控制的，预期能够产生服务潜力或者带来经济利益流入的经济资源。正保会计网校中级经济师好课已就位，随报随学！其中，高效实验班入学测试、阶段测评、还赠送机考模拟系统，两科联报更划算！'},
  {ch:29,type:'multi',q:'共同共有和按份共有的区别在于（）。',o:["对共有物的管理不同", "享有的权利不同", "权利的主体不同", "对第三人行使权利不同"],a:[0,1,3],x:'本题考查共同共有和按份共有的区别。主要体现在以下方面：（1）成立的原因不同；（2）对共有物的管理不同；（3）享有的权利不同；（4）对第三人行使权利不同；（5）分割共有物的限制不同。'},
  {ch:29,q:'共同共有以（）的存在为前提。',o:["所有权", "共同关系", "家庭关系"],a:1,x:'本题考查共同共有。共同共有以共同关系的存在为前提。共同关系，是指以基于共同目的而形成的关系。如家庭关系、夫妻关系。共同关系不存在，共同共有也就不存在。'},
  {ch:29,type:'multi',q:'下列关于担保物权的表述中，正确的有（）。',o:["担保物权是主权利", "担保物权具有物上代位性", "担保物权具有法定性和从属性", "担保物权具有价值权性"],a:[1,2,3],x:'本题考查担保物权的特征。担保物权是从物权，选项A说法错误。',flag:'源站答案疑似错误：担保物权是从物权而非主权利，A项错；正确为BCD'},
  {ch:29,q:'担保期间，担保财产毁损、灭失的，担保物权人可以就获得的赔偿金优先受偿。这体现了担保物权的（）特征。',o:["价值权性", "从属性", "不可分性"],a:2,x:'本题考查担保物权的特征。担保物权具有物上代位性。担保物权的实质在于对标的物交换价值的直接支配。因此，担保标的物变化为其他的价值形态时，担保物权所具有的支配效力及于变形物或者代替物。担保物因毁损灭失所获得的赔偿金成为担保物的代替物，担保物权人可就该代替物行使担保物权。'},
  {ch:29,type:'multi',q:'下列权利中，属于有期限物权的有（）。',o:["抵押权", "所有权", "质权", "留置权"],a:[0,2,3],x:'本题考查物权的种类。有期限物权是指有存续期限的物权。抵押权、质权、留置权、地役权属于有期限物权。'},
  {ch:29,q:'不动产物权的具体内容发生变化时进行的登记是（）。',o:["转移登记", "更正登记", "变更登记"],a:2,x:'本题考查不动产登记。变更登记是不动产物权的具体内容发生变化时进行的登记。'},
  {ch:28,q:'社会保障法称为调整经济关系的辅助性法律部门，出现在（）。',o:["当代社会", "封建社会", "资本主义社会"],a:0,x:'本题考查法律对经济关系调整经历的三个阶段。进入当代社会，法律体系重新整合，民法、商法和经济法共同对经济关系进行调整，同时社会保障法，环境保护法等新兴法律部门也成为调整经济关系的辅助性法律部门。正保会计网校中级经济师好课已就位，随报随学！其中，高效实验班入学测试、阶段测评、还赠送机考模拟系统，两科联报更划算！'},
  {ch:29,type:'multi',q:'所有权的原始取得方式包括（）。',o:["添附", "先占", "生产", "国有化和没收"],a:[0, 1, 2, 3],x:'本题考查所有权的原始取得方式。原始取得的方式主要有生产、孳息、国有化、没收、先占、添附、发现埋藏物和隐藏物、拾得遗失物、善意取得。选项E属于继受取得的方式。'},
  {ch:28,q:'不同所有人的物因一定的行为而结合在一起形成不可分割的物或具有新质的物，这在民法理论上称为（）。',o:["合并", "继受所得", "添附"],a:2,x:'本题考查添附的概念。所谓添附，是指不同所有人的物因一定的行为而结合在一起形成不可分割的物或具有新质的物。'},
  {ch:29,q:'所有权并非占有、使用、收益和处分四项权利的简单相加，而是一个整体的权利，可以统一行使，也可以将其部分权能转移他人，这体现了所有权（）的法律特征。',o:["独占性", "全面性", "单一性"],a:2,x:'本题考查所有权的概念和法律特征。所有权单一性指所有权并非占有、使用、收益和处分四项权利的简单相加，而是一个整体的权利，可以统一行使，也可以将其部分权能转移他人。'},
  {ch:0,q:'登记机构予以异议登记的，申请人在异议登记之日起（）日内不起诉，异议登记失效。',o:["5", "10", "15"],a:2,x:'本题考查不动产登记。登记机构予以异议登记的，申请人在异议登记之日起15日内不起诉，异议登记失效。'},
  {ch:29,q:'下列选项中属于所有权内容的核心且是拥有所有权的根本标志的是（）。',o:["使用权", "处分权", "收益权"],a:1,x:'本题考查所有权的概念。处分权是所有权内容的核心，是拥有所有权的根本标志。'},
  {ch:29,q:'所有人对自己的不动产或者动产依法享有的占有、使用、收益和处分的权利称为（）。',o:["占有权", "所有权", "用益物权"],a:1,x:'本题考查所有权的概念。所有权是指所有人对自己的不动产或者动产依法享有的占有、使用、收益和处分的权利。'},
  {ch:29,type:'multi',q:'根据物权的权利人行使权利的范围不同，物权可分为（）。',o:["自物权", "主物权", "他物权", "从物权"],a:[0, 2],x:'本题考查物权的种类。根据物权的权利人行使权利的范围不同，物权可分为自物权和他物权。'},
  {ch:29,q:'下列选项中不属于物权特征的是（）。',o:["是一种支配权", "客体一般为物", "是一种相对权"],a:2,x:'本题考查物权的特征。物权是绝对权，选项C说法错误。'},
  {ch:30,q:'若同一不动产上先后设立了两个登记的抵押权，则二者的受偿顺序为（）。',o:["登记在先的优先受清偿", "登记在后的优先受清偿", "二者按照比例受偿"],a:0,x:'本题考查物权的优先效力。同一标的物上存在着两个或者两个以上内容相同或者性质相同的物权时，成立在先的优先于成立在后的物权。'},
  {ch:29,q:'关于物权特征的说法，错误的是（）。',o:["物权是绝对权", "物权具有优先效力", "物权具有追及效力"],a:2,x:'本题考查物权的特征。物权是绝对权、支配权、具有优先效力和追及效力。债权具有请求权。'},
  {ch:0,q:'债权必须有相对的义务人给予协助方可顺利实现对应的（）。',o:["请求权", "相对权", "绝对权"],a:0,x:'本题考查物权的特征。债权必须有相对的义务人给予协助方可顺利实现请求权。而物权的权利人可以自由地根据自己的意志行使自己的权利，无须他人给予协助，更不须征得他人的同意。'},
  {ch:28,q:'通过一定的法律行为或基于法定的事实从原所有人处取得所有权的方式称为（）。',o:["善意取得", "继受取得", "原始取得"],a:1,x:'本题考查继受取得的概念。继受取得是指通过一定的法律行为或基于法定的事实从原所有人处取得所有权的方式。'},
  {ch:28,type:'multi',q:'物权法律制度的基本原则包括（）。',o:["诚实信用原则", "物权法定原则", "一物一权原则", "物权公示原则"],a:[1, 2, 3],x:'本题考查物权法律制度的基本原则。物权法律制度的基本原则包括物权法定原则、一物一权原则和物权公示原则。AE两项是民法的基本原则。'},
  {ch:28,q:'物权法律制度的“一物一权原则”指的是一个特定的标的物上只有一个（）。',o:["所有权", "抵押权", "用益物权"],a:0,x:'本题考查物权法律制度的基本原则。一物一权原则指的是一个特定的标的物上只有一个所有权，不得设有两个以上相互冲突和矛盾的物权。'},
  {ch:29,type:'multi',q:'物权法定原则的具体内容包括（）。',o:["物权种类法定化", "物权效力法定化", "物权内容法定化", "物权的得丧变更法定化"],a:[0, 1, 2, 3],x:'本题考查物权法律制度的基本原则。物权法定原则的具体内容包括：（1）物权种类法定化。非经法律准许，当事人不得创设新类型的物权。（2）物权内容法定化。物权制度的所有内容均是由法律直接加以规定的（3）物权效力法定化。物权的法律后果源自法律的直接规定。（4）物权的得丧变更法定化。非经法定程序，不得取得、变更和消灭物权。（5）物权保护方法法定化。物权保护方法和债权保护方法均为法定的物权的保护方法。'},
  {ch:29,q:'根据物权的发生是否基于当事人的意思为标准可将物权分为（）。',o:["自物权和他物权", "用益物权和担保物权", "主物权和从物权"],a:2,x:'本题考查物权的种类。根据物权的发生是否基于当事人的意思为标准可将物权分为法定物权和意定物权。'},
  {ch:29,q:'下列属于无期限物权的是（）。',o:["质权", "留置权", "抵押权"],a:2,x:'本题考查物权的种类。抵押权、质权、留置权属于有期限物权，所有权属于无期限物权。'},
  {ch:30,q:'合同担保的目的是（）。',o:["督促债权人履行合同义务", "督促债务人履行合同义务", "保全债权人的债权"],a:1,x:'本题考查合同担保的法律特征。合同担保的目的是督促债务人履行合同义务。'},
  {ch:30,q:'定金的数额由当事人约定，但不得超过主合同标的额的（）。',o:["15%", "20%", "25%"],a:1,x:'本题考查定金的数额。定金的数额由当事人约定，但不得超过主合同标的额的百分之二十，超过部分不产生定金的效力。'},
  {ch:30,type:'multi',q:'定金与违约金的区别在于（）。',o:["定金的给付一般是在订立合同之时，也可以在合同履行之前给付，而不是在违约时支付", "违约金有证明合同成立和预先给付的效力，而定金没有", "定金主要是担保作用，违约金则是违约责任的一种形式", "定金的数额不超过主合同的总金额的20%，而违约金没此限制"],a:[0, 2, 3],x:'本题考查违约金与定金的区别。定金与违约金的区别：（1）交付时间不同。定金的给付一般是在订立合同之时，也可以在合同履行之前，而不是在违约时支付；（2）效力不同。定金有证明合同成立和预先给付的效力，而违约金没有；（3）性质不同。定金主要起合同担保的作用，而违约金则是违约责任的一种形式。定金的数额不得超过主合同标的额的20%，具体数额由双方当事人协商决定。本题选项ACD正确。'},
  {ch:30,q:'保证人和债权人约定，当债务人不履行债务时，保证人按照约定履行债务或者承担责任的行为称为（）。',o:["抵押", "定金", "保证"],a:2,x:'本题考查保证的概念。保证是指保证人和债权人约定，当债务人不履行债务时，保证人按照约定履行债务或者承担责任的行为。'},
  {ch:30,q:'下列权利中，属于合同保全制度内容的是（）。',o:["不动产抵押权", "留置权", "债权人的代位权"],a:2,x:'本题考查合同的保全。合同的保全，是指法律为防止因债务人财产的不当减少致使债权人债权的实现受到危害，而设置的保全债务人责任财产的法律制度，具体包括债权人代位权制度和债权人撤销权制度。'},
  {ch:0,q:'当债务人所为的减少其财产的行为危害债权实现时，债权人为保全其债权可以（）。',o:["向债务人表示撤销其行为", "向工商行政管理机关请求撤销债务人的行为", "请求人民法院撤销债务人的行为"],a:2,x:'本题考查债权人的撤销权。债权人撤销权是指当债务人所为的减少其财产的行为危害债权实现时，债权人为保全其债权得请求法院撤销债务人该行为的权利。'},
  {ch:0,q:'在我国，确认土地承包经营的主要依据是（）。',o:["国家法律的规定", "集体经济组织的规定", "国家土地政策"],a:2,x:'本题考查土地承包经营权。土地承包经营权指由公民或集体组织，对国家所有或集体所有的土地从事生产活动，依照承包合同的规定而享有的占有、使用和收益的权利。承包经营合同是确认土地承包经营权的主要依据。正保会计网校中级经济师好课已就位，随报随学！其中，高效实验班入学测试、阶段测评、还赠送机考模拟系统，两科联报更划算！'},
  {ch:30,type:'multi',q:'先履行抗辩权成立的条件包括（）。',o:["双方当事人互负债务", "两个债务之间存在先后履行顺序", "先履行一方未履行", "后给付义务人有不能给付的危险"],a:[0,1,2,3],x:'本题考查先履行抗辩权的行使。根据我国《民法典》的规定：双方当事人互负债务，有先后履行顺序，先履行一方未履行的或者先履行一方履行债务不符合约定的，后履行一方有权拒绝其相应的履行要求。',flag:'答案存疑：先履行抗辩权条件通常不含“后给付义务人有不能给付危险”（更接近不安抗辩权），建议核实'},
  {ch:30,type:'multi',q:'合同履行的基本原则包括（）。',o:["合理性原则", "全面履行原则", "绿色原则", "公平原则"],a:[0,1,3],x:'本题考查合同履行的基本原则。合同履行的基本原则是全面履行原则、诚信原则、绿色原则。'},
  {ch:30,type:'multi',q:'根据诚信原则，当事人在履行合同时，应积极履行的义务包括（）。',o:["保密义务", "协助履行义务", "付款义务", "通知义务"],a:[0, 1, 3],x:'本题考查合同履行的基本原则。当事人遵循诚信原则，应履行：（1）通知义务；（2）协助履行义务；（3）保密义务。'},
  {ch:28,type:'multi',q:'根据《民法典》，当事人在订立合同过程中有（）情形，给对方造成损失的，应当承担缔约过失责任。',o:["违反保密义务", "故意提供虚假情况", "重大误解", "恶意磋商"],a:[0,2,3],x:'本题考查缔约过失责任。我国《民法典》第500条规定：“当事人在订立合同过程中有下列情形之一，给对方造成损失的，应当承担损害赔偿责任：（一）假借订立合同，恶意进行磋商；（二）故意隐瞒与订立合同有关的重要事实或者提供虚假情况；（三）有其他违背诚实信用原则的行为。”'},
  {ch:30,q:'根据法律规定或当事人约定的措施保证合同义务人履行义务的一项法律制度指的是合同的（）。',o:["变更", "解除", "担保"],a:2,x:'本题考查合同担保的概念。合同的担保是指根据法律规定或当事人约定的担保措施保证合同义务人履行义务的一项法律制度。'},
  {ch:30,q:'以下不属于要约邀请的是（）。',o:["拍卖公告", "招标广告", "悬赏广告"],a:2,x:'本题考查要约邀请。典型的要约邀请包括：拍卖公告、招标公告、招股说明书、债券募集办法、基金招募说明书、商业广告和宣传、寄送的价目表等。悬赏广告属于要约，而不是要约邀请。'},
  {ch:30,type:'multi',q:'承诺必须具备的要件有（）。',o:["承诺只能由受要约人向要约人作出", "承诺只能由要约人向受要约人作出", "承诺必须在有效期限内作出", "承诺的内容必须与要约的内容一致"],a:[0, 2, 3],x:'本题考查承诺必须具备的要件。承诺必须具备的要件包括：（1）承诺只能由受要约人向要约人作出。（2）承诺必须在有效期限内作出。（3）承诺的内容必须与要约的内容一致。正保会计网校中级经济师好课已就位，随报随学！其中，高效实验班入学测试、阶段测评、还赠送机考模拟系统，两科联报更划算！'},
  {ch:28,type:'multi',q:'合同担保的法律特征有（）。',o:["具有从属性", "具有独立性", "具有自愿性", "具有平等性"],a:[0,2,3],x:'本题考查合同担保的法律特征。担保合同作为从合同，不能脱离主合同而独立存在，所以合同担保不具有独立性。'},
  {ch:29,q:'下列属于非物权担保形式的是（）。',o:["质权", "保证", "抵押"],a:1,x:'本题考查合同担保的形式。抵押、质权、留置都属于担保物权。共有属于所有权。保证和定金属于非物权的担保形式。'},
  {ch:30,type:'multi',q:'合同双方当事人在全面履行合同时要做到（）。',o:["履行主体适当", "履行数量适当", "履行期限适当", "履行标的适当"],a:[0,2,3],x:'本题考查合同的全面履行原则。全面履行原则的具体要求如下：履行主体适当、履行标的适当、履行期限适当、履行地点和方式适当。'},
  {ch:28,type:'multi',q:'根据《民法典》，当事人可以解除合同的情形有（）。',o:["因不可抗力致使不能实现合同目的", "债权债务同归于一人", "在履行期限届满之前，当事人一方明确表示或者以自己的行为表明不履行主要债务", "当事人一方迟延履行主要债务，经催告后在合理期限内仍未履行"],a:[0,2,3],x:'本题考查合同法定解除的条件。法定解除的条件如下：（1）因不可抗力致使不能实现合同目的；（2）在履行期限届满之前，当事人一方明确表示或者以自己的行为表明不履行主要债务；（3）当事人一方迟延履行主要债务，经催告后在合理期限内仍未履行；（4）当事人一方迟延履行债务或者有其他违约行为致使不能实现合同目的；（5）法律规定的其他情形。选项B属于合同终止中的混同。'},
  {ch:28,type:'multi',q:'按照《民法典》的规定，应当先履行债务的当事人有确切证据证明对方有（）情况之一的，可通过行使不安抗辩权，中止履行。',o:["经营情况严重恶化的", "转移财产、抽逃资金、以逃避债务的", "丧失商业信誉的", "有丧失或可能丧失履行债务能力等其他情形的"],a:[0, 1, 2, 3],x:'本题考查不安抗辩权的行使。根据《民法典》第527条的规定：应当先履行债务的当事人，有确切证据证明对方有下列情形之一出现时，可以中止履行：（1）经营状况严重恶化；（2）转移财产、抽逃资金，以逃避债务；（3）丧失商业信誉；（4）有丧失或者可能丧失履行债务能力的其他情形。'},
  {ch:30,q:'下列属于效力待定合同的是（）。',o:["一方乘人之危迫使对方签订的合同", "行为人与相对人以虚假的意思表示签订的合同", "重大误解的合同"],a:2,x:'本题考查效力存在瑕疵的合同。选项AC属于可撤销合同。选项B属于无效合同。'},
  {ch:25,q:'根据《民法典》的规定，合同当事人互负债务，有先后履行顺序，先履行一方未履行，后履行一方有权拒绝其履行要求。当事人行使的措施是（）。',o:["行使同时履行抗辩权", "行使先履行抗辩权", "行使不安抗辩权"],a:1,x:'本题考查合同的履行。先履行抗辩权，即双方当事人互负债务，有先后履行顺序，先履行一方未履行的或者先履行一方履行债务不符合约定的，后履行一方有权拒绝其相应的履行要求。正保会计网校中级经济师好课已就位，随报随学！其中，高效实验班入学测试、阶段测评、还赠送机考模拟系统，两科联报更划算！'},
  {ch:30,q:'根据合同的分类，赠与合同属于（）。',o:["从合同", "双务合同", "要式合同"],a:2,x:'本题考查合同的分类。赠与合同属于单务合同。'},
  {ch:30,type:'multi',q:'以下属于诺成合同的有（）。',o:["保管合同", "赠与合同", "借用合同", "买卖合同"],a:[0,2,3],x:'本题考查合同的分类。诺成合同是指当事人双方意思表示一致即可成立的合同，也称不要物合同。在《民法典》中凡是没有规定以实际交付标的物为合同成立条件的合同都是诺成合同，绝大多数合同都是诺成合同。保管合同和借用合同属于实践合同。'},
  {ch:30,q:'合同当事人一方将其权利和义务一并转让给第三人，第三人概括承受该合同权利义务的行为被称为（）。',o:["债权转让", "债务承担", "代位权"],a:2,x:'本题考查合同权利义务概括转让的概念。权利义务概括转让是指合同当事人一方将其权利和义务一并转让给第三人，第三人概括承受该合同权利义务的行为。'},
  {ch:30,q:'实践合同和诺成合同是以（）为标准进行划分的。',o:["合同当事人双方权利义务的分担方式", "法律上是否规定一定的名称", "是否以交付标的物为成立要件"],a:2,x:'本题考查合同的分类。选项A是划分双务合同与单务合同的标准。选项B是划分有名合同与无名合同的标准。选项D是划分要式合同与不要式合同的标准。'},
  {ch:30,q:'下列合同中，属于单务合同的是（）。',o:["买卖合同", "租赁合同", "赠与合同"],a:2,x:'本题考查合同的分类。单务合同是指合同当事人一方只负有义务而不享有权利，另一方只享有权利而不负担义务的合同。赠与合同属于单务合同。买卖合同、租赁合同属于双务合同。保管合同属于实践合同。'},
  {ch:30,q:'甲乙签订了一份供货合同。合同约定甲先供货，乙后付款。在供货前，甲有证据证明乙经营状况严重恶化无付款能力。对此，甲可依法主张（）。',o:["同时履行抗辩权", "合同撤销权", "先履行抗辩权"],a:2,x:'本题考查不安抗辩权。不安抗辩权是指在双务合同中有先给付义务的当事人在有证据证明后给付人具有丧失或者可能丧失履行债务能力的情况时，可以中止自己先给付义务的履行。本题甲属于先履行给付义务的人，所以他可以主张不安抗辩权。'},
  {ch:30,type:'multi',q:'根据《民法典》，下列合同中，属于可撤销合同的有（）。',o:["限制行为能力人订立的合同", "因无权代理而订立的合同", "基于重大误解订立的合同", "订立时显失公平的合同"],a:[2, 3],x:'本题考查效力存在瑕疵的合同。下列合同，一方当事人有权请求人民法院或者仲裁机关予以撤销：（1）基于重大误解订立的合同；（2）一方以欺诈手段，使对方在违背真实意思的情况下订立的合同；（3）一方或者第三人以胁迫手段，使对方在违背真实意思的情况下订立的合同；（4）一方利用对方处于危困状态、缺乏判断能力等情形，致使订立的合同显失公平的。选项AB属于效力待定合同。选项E属于无效合同。正保会计网校中级经济师好课已就位，随报随学！其中，高效实验班入学测试、阶段测评、还赠送机考模拟系统，两科联报更划算！'},
  {ch:31,type:'multi',q:'下列人员中，不得担任公司的董事、监事、高级管理人员的有（）。',o:["限制民事行为能力人", "个人所负数额较大的债务到期未清偿的人", "因犯罪被剥夺政治权利，执行期满未逾5年的人", "无民事行为能力人"],a:[0, 1, 2, 3],x:'本题考查董事、监事及高级管理人员的资格和义务。有下列情形之一的，不得担任公司的董事、监事、高级管理人员：（1）无民事行为能力或者限制民事行为能力；（2）因贪污、贿赂、侵犯财产、挪用财产或者破坏社会主义市场经济秩序，被判处刑罚，执行期满未逾5年，或者因犯罪被剥夺政治权利，执行期满未逾5年；（3）担任破产清算的公司、企业的董事或者厂长、经理，对该公司、企业的破产负有个人责任的，自该公司、企业破产清算完结之日起未逾3年；（4）担任因违法被吊销营业执照、责令关闭的公司、企业的法定代表人，并负有个人责任的，自该公司、企业被吊销营业执照之日起未逾3年；（5）个人所负数额较大的债务到期未清偿。'},
  {ch:31,q:'代表（）以上表决权的股东、（）以上董事或者监事会，可以提议召开股份有限公司董事会临时会议。',o:["1/10，1/3", "1/10，2/3", "1/3，半数"],a:0,x:'本题考查董事会。代表1/10以上表决权的股东、1/3以上董事或者监事会，可以提议召开股份有限公司董事会临时会议。'},
  {ch:31,q:'股份有限公司的董事会每年度至少召开（）会议，每次会议应当于会议召开（）前通知全体董事和监事。',o:["一次，10日", "两次，15日", "一次，15日"],a:2,x:'本题考查董事会。股份有限公司的董事会每年度至少召开两次会议，每次会议应当于会议召开10日前通知全体董事和监事。'},
  {ch:0,q:'甲向乙借了30元钱，同时甲又为乙修好了收音机，修理费恰好是30元。则他们之间的债权债务可以（）。',o:["提存", "混同", "免除"],a:2,x:'本题考查抵销的概念。抵销是指当事人双方相互负有同种类的给付义务时，将两项义务相互冲抵，使其相互在对等额内消灭。'},
  {ch:30,q:'合同终止最正常和最主要的形式是（）。',o:["抵销", "混同", "免除债务"],a:2,x:'本题考查合同关系消灭的形式。合同履行是合同终止最正常和最主要的形式。'},
  {ch:30,q:'一个人在签保证合同时未明确保证方式，视同（）方式处理。',o:["一般保证", "连带保证", "无效保证"],a:0,x:'本题考查合同的担保。在设立保证时，保证人与债权人应就保证方式加以约定，如果保证合同当事人双方对保证方式没有约定或者约定不明确的，按照一般保证承担保证责任。'},
  {ch:30,q:'下列合同中，属于从合同的是（）。',o:["保管合同", "租赁合同", "买卖合同"],a:2,x:'本题考查合同的分类。从合同是指不能单独存在的，必须以主合同的存在为前提的合同，抵押合同属于从合同。正保会计网校中级经济师好课已就位，随报随学！其中，高效实验班入学测试、阶段测评、还赠送机考模拟系统，两科联报更划算！'},
  {ch:31,q:'根据《公司登记管理条例》规定，有限责任公司的股东不得以（）作价出资。',o:["货币", "实物", "劳务"],a:2,x:'本题考查公司设立的条件。《公司登记管理条例》规定，股东不得以劳务、信用、自然人姓名、商誉、特许经营权或者设定担保的财产等作价出资。'},
  {ch:31,type:'multi',q:'我国《公司法》将公司的类型分为（）。',o:["外资企业", "国有独资公司", "有限责任公司", "股份有限公司"],a:[2, 3],x:'本题考查公司的种类。根据我国《公司法》规定，公司包括有限责任公司和股份有限公司两种类型。'},
  {ch:31,q:'以募集方式设立股份有限公司的，应当于创立大会结束后（）内向公司登记机关申请设立登记。',o:["10日", "30日", "45日"],a:1,x:'本题考查公司设立登记。以募集方式设立股份有限公司的，应当于创立大会结束后30日内向公司登记机关申请设立登记。'},
  {ch:31,q:'公司除因合并或分立需解散以外，应当在解散事由出现之日起（）日内成立清算组，开始清算。',o:["30", "10", "15"],a:2,x:'本题考查公司的合并分立、解散和清算。公司除因合并或分立需解散以外，应当在解散事由出现之日起15日内成立清算组，开始清算。'},
  {ch:31,q:'设立股份有限公司，应当由（）向公司登记机关申请设立登记。',o:["监事会", "董事会", "股东大会"],a:1,x:'本题考查公司设立登记。设立股份有限公司，应当由董事会向公司登记机关申请设立登记。'},
  {ch:31,type:'multi',q:'根据《中华人民共和国公司法》，公司解散的原因有（）。',o:["公司章程规定的营业期限届满", "股东会或者股东大会决议解散", "依法被吊销营业执照", "因公司合并需要解散"],a:[0, 1, 2, 3],x:'本题考查公司解散的原因。公司解散的原因有：（1）公司章程规定的营业期限届满或者公司章程规定的其他解散事由出现；（2）股东会或者股东大会决议解散；（3）因公司合并或者分立需要解散；（4）依法被吊销营业执照、责令关闭或者被撤销；（5）人民法院判决予以解散。公司经营管理发生严重困难，继续存续会使股东利益受到重大损失，通过其他途径不能解决的，持有公司全部股东表决权10%以上的股东，可以请求人民法院解散公司。'},
  {ch:31,q:'根据《中华人民共和国公司法》公司解散后，股份有限公司的清算组由（）组成。',o:["董事", "股东", "董事和股东"],a:2,x:'本题考查公司的清算。股份有限公司的清算组由董事或者股东大会确定的人员组成。正保会计网校中级经济师好课已就位，随报随学！其中，高效实验班入学测试、阶段测评、还赠送机考模拟系统，两科联报更划算！'},
  {ch:31,type:'multi',q:'股东大会是公司的权力机构，其行使的职权包括（）。',o:["对发行公司债券作出决议", "决定公司内部管理机构的设置", "决定公司的经营方针和投资计划", "制定公司的年度财务预算方案、决算方案"],a:[0,2,3],x:'本题考查股东（大）会。股东（大）会是公司的权力机构，行使下列职权：①决定公司的经营方针和投资计划；②选举和更换非由职工代表担任的董事、监事，决定有关董事、监事的报酬事项；③审议批准董事会的报告；④审议批准监事会或者监事的报告；⑤审议批准公司的年度财务预算方案、决算方案；⑥审议批准公司的利润分配方案和弥补亏损方案；⑦对公司增加或者减少注册资本作出决议；⑧对发行公司债券作出决议；⑨对公司合并、分立、解散、清算或者变更公司形式作出决议；⑩修改公司章程；⑪公司章程规定的其他职权。选项BD属于董事会的职权。'},
  {ch:36,q:'股份有限公司股东大会对公司合并作出决议，必须经（）通过。',o:["出席会议的股东2/3以上", "股东所持表决权的2/3以上", "出席会议的股东所持表决权的2/3以上"],a:2,x:'本题考查股东（大）会。股份有限公司股东大会作出修改公司章程、增加或者减少注册资本的决议，以及公司合并、分立、解散或者变更公司形式的决议，必须经出席会议的股东所持表决权的2/3以上。'},
  {ch:31,type:'multi',q:'有限责任公司股东会讨论的下列事项决议中，须经代表三分之二以上表决权的股东通过的有（）。',o:["修改公司章程", "解聘公司高级管理人员", "公司合并、分立、解散", "变更公司形式"],a:[0,2,3],x:'本题考查股东（大）会。股东会会议作出修改公司章程、增加或者减少注册资本的决议，以及公司合并、分立、解散或者变更公司形式的决议，必须经代表2/3以上表决权的股东通过。'},
  {ch:31,q:'根据（）不同，公司可分为无限公司、两合公司、有限责任公司、股份有限公司和股份两合公司。',o:["组织结构", "公司资本来源", "公司股权或股份转让的自由度"],a:0,x:'本题考查公司的种类。根据组织结构不同，公司可分为无限公司、两合公司、有限责任公司、股份有限公司和股份两合公司。'},
  {ch:31,type:'multi',q:'公司的主要特征包括（）。',o:["公司具有法人人格", "股东承担无限责任", "股东承担有限责任", "公司是营利法人"],a:[0, 2, 3],x:'本题考查公司的特征。公司的主要特征包括：（1）公司具有法人人格。（2）公司是营利法人。（3）股东承担有限责任。'},
  {ch:31,type:'multi',q:'有下列（）情形之一的，不得担任公司的董事、监事、高级管理人员。',o:["限制民事行为能力", "无民事行为能力", "曾受治安拘留处罚", "个人所负数额较大的债务到期未清偿"],a:[0, 1, 3],x:'本题考查董事、监事、高级管理人员的任职资格。我国《公司法》规定，有下列情形之一的，不得担任公司的董事、监事、高级管理人员：（1）无民事行为能力或者限制民事行为能力；（2）因贪污、贿赂、侵犯财产、挪用财产或者破坏社会主义市场经济秩序，被判处刑罚，执行期满未逾5年，或者因犯罪被剥夺政治权利，执行期满未逾5年的；（3）担任破产清算的公司、企业的董事长或者厂长、经理，对该公司、企业的破产负有个人责任的，自该公司、企业破产清算完结之日起未逾3年；（4）担任因违法被吊销营业执照、责令关闭的公司、企业的法定代表人，并负有个人责任的，自该公司、企业被吊销营业执照之日起未逾3年；（5）个人所负数额较大的债务到期未清偿。'},
  {ch:31,q:'国家单独出资、由国务院或者地方人民政府授权本级人民政府国有资产监督管理机构履行出资人职责的有限责任公司是（）。',o:["无限责任公司", "股份有限公司", "国有独资公司"],a:2,x:'本题考查国有独资公司。国有独资公司是国家单独出资、由国务院或者地方人民政府授权本级人民政府国有资产监督管理机构履行出资人职责的有限责任公司。正保会计网校中级经济师好课已就位，随报随学！其中，高效实验班入学测试、阶段测评、还赠送机考模拟系统，两科联报更划算！'},
  {ch:31,type:'multi',q:'公司收购本公司股份，可以依照公司章程的规定或者股东大会的授权，经2/3以上董事出席的董事会会议决议的情形包括（）。',o:["与持有本公司股份的其他公司合并", "上市公司为维护公司价值及股东权益所必需", "将股份用于员工持股计划或者股权激励", "将股份用于转换上市公司发行的可转换为股票的公司债券"],a:[1, 2, 3],x:'本题考查股份的发行与回购。公司不得收购本公司股份，但有下列6种情形之一的可以回购：（1）减少公司注册资本；（2）与持有本公司股份的其他公司合并；（3）将股份用于员工持股计划或者股权激励；（4）股东因对股东大会作出的公司合并、分立决议持异议，要求公司收购其股份。（5）将股份用于转换上市公司发行的可转换为股票的公司债券；（6）上市公司为维护公司价值及股东权益所必需。公司因前述第（3）（5）（6）项情形收购本公司股份的，可以依照公司章程的规定或者股东大会的授权，经2/3以上董事出席的董事会会议决议。'},
  {ch:0,q:'下列信息中，由企业选择是否向社会公示的是（）。',o:["资产总额、负债总额、对外提供保证担保信息", "企业投资设立企业、购买股权信息", "企业开业、歇业、清算等存续状态信息"],a:0,x:'本题考查企业信息公示。企业从业人数、资产总额、负债总额、对外提供保证担保、所有者权益合计、营业总收入、主营业务收入、利润总额、净利润、纳税总额信息，由企业选择是否向社会公示。选项BCD属于企业应当向社会公示的信息。'},
  {ch:31,q:'有限责任公司连续（）年不向股东分配利润，而公司该期间连续盈利，并且符合法定的分配利润条件，则对股东会作出不分配利润决议投反对票的股东可以请求公司按照合理的价格收购其股权。',o:["2", "3", "5"],a:2,x:'本题考查股东权利。有限责任公司连续5年不向股东分配利润，而公司该5年连续盈利，并且符合法定的分配利润条件，则对股东会作出不分配利润决议投反对票的股东可以请求公司按照合理的价格收购其股权。'},
  {ch:31,q:'股份有限公司的股东可以依法转让其股份，但是发起人持有的本公司股份，自公司成立之日起（）内不得转让。',o:["6个月", "1年", "2年"],a:1,x:'本题考查股份权利。发起人持有的本公司股份，自公司成立之日起1年内不得转让。'},
  {ch:0,type:'multi',q:'股份的发行，实行的原则包括（）。',o:["透明原则", "公正原则", "自愿原则", "公平原则"],a:[1, 3],x:'本题考查股份的发行与回购。股份的发行，实行公平、公正的原则。'},
  {ch:31,q:'根据我国《公司法》规定，下列选项中可以担任有限责任公司监事的是（）。',o:["公司的股东", "公司的经理", "公司的董事"],a:0,x:'本题考查股东权利。公司股东有权通过股东（大）会选举公司的董事和监事，也有权在符合法定资质的条件下被选举为公司的董事或监事。'},
  {ch:36,type:'multi',q:'股东权利按其内容可分为（）。',o:["管理权", "资产收益权", "资产支配权", "代位诉讼权"],a:[0, 1, 3],x:'本题考查股东权利。股东权利按其内容可分为管理权、资产收益权和代位诉讼权。正保会计网校中级经济师好课已就位，随报随学！其中，高效实验班入学测试、阶段测评、还赠送机考模拟系统，两科联报更划算！'},
  {ch:0,type:'multi',q:'下列关于最低限价的说法，正确的有（）。',o:["实施最低限价，往往出现供不应求现象，造成短缺", "它属于政府对价格的干预措施", "最低限价又称保护价格或支持价格", "最低限价低于均衡价格"],a:[0,1,3],x:'本题考查最低限价分析。实施最低限价，会刺激生产、限制消费，导致生产过剩。选项A说法有误。最低限价高于均衡价格，而最高限价才低于均衡价格，选项D说法有误。'},
  {ch:0,q:'决定供给弹性的首要因素是（）。',o:["资金有机构成", "时间", "产品价格"],a:1,x:'本题考查影响供给价格弹性的因素。决定供给弹性的首要因素是时间。'},
  {ch:31,type:'multi',q:'下列属于董事会职权的有（）。',o:["执行股东会的决议", "决定公司的经营计划和投资方案", "制定公司的基本管理制度", "制定公司的年度财务预算方案、决算方案"],a:[0, 1, 2, 3],x:'本题考查董事会。董事会对股东会负责，行使下列职权：①召集股东会会议，并向股东会报告工作；②执行股东会的决议；③决定公司的经营计划和投资方案；④制定公司的年度财务预算方案、决算方案；⑤制定公司的利润分配方案和弥补亏损方案；⑥制定公司增加或者减少注册资本以及发行公司债券的方案；⑦制定公司合并、分立、解散或者变更公司形式的方案；⑧决定公司内部管理机构的设置；⑨决定聘任或者解聘公司经理及其报酬事项，并根据经理的提名决定聘任或者解聘公司副经理、财务负责人及其报酬事项；⑩制定公司的基本管理制度；⑪公司章程规定的其他职权。选项E属于股东（大）会的职权。'},
  {ch:31,q:'关于有限责任公司设立的说法，错误的是（）。',o:["有限责任公司的注册资本为在公司登记机关登记的全体股东认缴的出资额", "股东可以用货币出资，也可以用劳务作价出资", "除国有独资公司外，自然人和法人都可以作为股东"],a:1,x:'本题考查公司设立的条件。股东可以用货币出资，也可以用实物、知识产权、土地使用权等可以用货币估价并可以依法转让的非货币财产作价出资；但是，法律、行政法规规定不得作为出资的财产除外。选项B说法错误。'},
  {ch:31,q:'有限责任公司的股东向股东以外的人转让股权，应当经其他股东（）同意。',o:["三分之一以上", "全体", "三分之二以上"],a:2,x:'本题考查股东权利。股东向股东以外的人转让股权的，应当经其他股东半数以上同意。'},
  {ch:31,q:'国有独资公司监事会成员不得少于（）人，其中职工代表的比例不得低于1/3，具体比例由公司章程规定。',o:["3", "5", "7"],a:1,x:'本题考查国有独资公司的特别规定。国有独资公司监事会成员不得少于5人，其中职工代表的比例不得低于1/3，具体比例由公司章程规定。'},
  {ch:31,q:'以募集设立方式设立股份有限公司的，发起人认购的股份不得少于公司股份总数的（）。',o:["25%", "35%", "45%"],a:1,x:'本题考查公司设立的条件。以募集设立方式设立股份有限公司的，发起人认购的股份不得少于公司股份总数的35%'},
  {ch:0,q:'恩格尔定律是指（）。',o:["在一个家庭或一个经济体中，食物支出在收入中所占的比例随着收入的增加而减少", "在一个家庭或一个经济体中，食物支出在收入中所占的比例随着支出的增加而减少", "在一个家庭或一个经济体中，食物支出在收入中所占的比例随着收入的减少而减少"],a:0,x:'本题考查恩格尔定律。恩格尔定律：在一个家庭或一个经济体中，食物支出在收入中所占的比例随着收入的增加而减少。'},
  {ch:11,type:'multi',q:'下列关于弹性系数的说法，正确的有（）。',o:["需求交叉弹性系数小于0的商品称为低档品", "需求收入弹性系数大于1的商品称为高档品", "需求交叉弹性系数大于0的商品称为正常品", "需求收入弹性系数大于0小于1的商品称为必需品"],a:[0,2,3],x:'本题考查需求收入弹性。需求收入弹性系数大于1的商品称为高档品，需求收入弹性系数大于0小于1的商品称为必需品，需求收入弹性系数小于0的商品称为低档品。需求交叉弹性系数为正数，表示两种商品是替代品。需求交叉弹性系数为负数，表示两种商品是互补品。'},
  {ch:0,type:'multi',q:'根据需求的基本含义，需求的构成要素包括（）。',o:["国家税收政策", "消费者购买的欲望", "生产者供应数量", "消费者的支付能力"],a:[1, 3],x:'本题考查需求的含义。需求的两个构成要素：购买的欲望、购买的能力。（2021年试题）'},
  {ch:2,q:'通常情况下，政府对某种消费品实行最高限价后，可能造成的结果是（）。',o:["同时刺激生产和消费", "同时限制生产和消费", "刺激生产、限制消费"],a:2,x:'本题考查最高限价分析。由于最高限价低于均衡价格，因此，会刺激消费，限制生产，导致供给减少和需求增加，结果就是市场供给短缺。'},
  {ch:2,type:'multi',q:'关于需求曲线的说法正确的有（）。',o:["需求曲线是一条向右上方倾斜的曲线", "需求曲线是一条向右下方倾斜的曲线", "一般情况下需求与价格的变动呈反方向变化", "一般情况下需求与价格的变动呈同方向变化"],a:[0,1,3],x:'本题考查需求曲线。一般情况下需求与价格的变动呈反方向变化。需求曲线是一条向右下方倾斜的曲线，供给曲线是一条向右上方倾斜的曲线。所以选项AD错误。'},
  {ch:0,q:'支配着消费者在使用价值相同或接近的替代品之间消费选择的因素是（）。',o:["消费者偏好", "生产成本", "消费者预期"],a:0,x:'本题考查影响需求的主要因素。消费者偏好支配着消费者在使用价值相同或接近的替代品之间的消费选择。'},
  {ch:0,q:'假定其他因素不变，价格上升，供给增长，价格下降，供给减少，这种变动表现为（）。',o:["供给曲线发生位移", "需求曲线发生位移", "供给沿供给曲线变动"],a:2,x:'本题考查供给曲线上点的移动。价格上升，供给增长，价格下降，供给减少，这种变动表现为供给沿供给曲线变动。'},
  {ch:0,q:'在一定时间内和一定价格条件下，消费者对某种商品或服务愿意而且能够购买的数量称为（）。',o:["供给", "需求", "弹性"],a:1,x:'本题考查需求的含义。需求就是指在一定时间内和一定价格条件下，消费者对某种商品或服务愿意而且能够购买的数量。'},
  {ch:0,type:'multi',q:'下列经济因素中，属于影响市场供给主要因素的有（）。',o:["商品价格", "生产成本", "消费者偏好", "生产技术水平"],a:[0, 1, 3],x:'本题考查影响供给的因素。影响供给的因素主要有：产品价格、生产成本、生产技术、预期、相关产品价格、生产要素的价格以及国家政策等。'},
  {ch:11,q:'两种商品为互补品，则交叉弹性系数为（）。',o:["负数", "正数", "零"],a:0,x:'本题考查需求交叉价格弹性的类型。两种商品为互补品，则需求交叉弹性系数为负数，即Eij＜0。'},
  {ch:2,type:'multi',q:'决定某种商品需求价格弹性大小的因素主要有（）。',o:["该种商品的替代品的数量和相近程度", "该种商品的生产周期长短", "该种商品的生产自然条件状况", "该种商品在生活消费中的重要性"],a:[0,3],x:'本题考查影响需求价格弹性的因素。影响需求价格弹性的因素包括：①替代品的数量和相近程度。②商品的重要性。③商品用途的多少。④时间与需求价格弹性的大小至关重要。选项BC属于影响供给价格弹性的因素。（2011年试题）'},
  {ch:0,q:'企业实行薄利多销策略的理论基础是（）。',o:["商品的需求价格弹性系数小于1时，降低价格使得销售收入增加", "商品的需求价格弹性系数大于1时，降低价格使得销售收入增加", "商品的需求价格弹性系数小于1时，提高价格使得销售收入减少"],a:1,x:'本题考查需求价格弹性和总销售收入的关系。需求价格弹性系数大于1时，商品富有弹性，降低价格可以使销售收入增加，选项B说法正确。'},
  {ch:2,q:'若需求价格弹性系数大于1，价格上升会使销售收入（）。',o:["增加", "减少", "不变"],a:1,x:'本题考查需求价格弹性和总销售收入的关系。若需求价格弹性系数大于1，价格上升会使销售收入减少，价格下降会使销售收入增加。正保会计网校中级经济师好课已就位，随报随学！其中，高效实验班入学测试、阶段测评、还赠送机考模拟系统，两科联报更划算！'},
  {ch:0,q:'表示能够给消费者带来相同满足程度的两种商品的所有组合的曲线称为（）。',o:["消费者需求曲线", "消费者预算线", "需求交叉弹性曲线"],a:2,x:'本题考查无差异曲线。我们可以用无差异曲线来描述消费者偏好。所谓无差异曲线，是一条表示能够给消费者带来相同满足程度的两种商品的所有组合的曲线，在这条曲线上的所有各点的两种商品的组合带给消费者的满足程度是完全相同的，消费者对这条曲线上各个点的偏好程度是无差异的。（2021年试题）'},
  {ch:25,q:'在名义收入不变时，因为该商品价格的变化，而导致消费者实际收入发生变化，进而导致消费者所购买的该商品数量的变化，称为（）。',o:["乘数效应", "弹性效应", "替代效应"],a:2,x:'本题考查收入效应的概念。收入效应是指在名义收入不变时，因为该商品价格的变化，而导致消费者实际收入发生变化，进而导致消费者所购买的该商品数量的变化。'},
  {ch:2,q:'在其他条件不变的情况下，如果某产品需求价格弹性系数等于1，则当该产品价格提高时（）。',o:["会使生产者的销售收入减少", "不会影响生产者的销售收入", "会使生产者的销售收入增加"],a:1,x:'本题考查需求价格弹性和总销售收入的关系。需求价格弹性系数等于1时，价格变动不会引起销售收入增加。'},
  {ch:11,q:'用以衡量需求变动对消费者收入变动的反应程度的弹性系数是（）。',o:["供给价格弹性系数", "需求收入弹性系数", "需求交叉弹性系数"],a:1,x:'本题考查需求收入弹性系数的概念。需求收入弹性是用以衡量需求变动对消费者收入变动的反应程度。'},
  {ch:0,q:'对某种商品而言，市场供给力量和需求力量相互抵消时所达到的价格水平称为（）。',o:["平均价格", "均衡价格", "成交价格"],a:1,x:'本题考查均衡价格。均衡价格就是市场供给力量和需求力量相互抵消时所达到的价格水平。'},
  {ch:0,type:'multi',q:'关于影响需求的主要因素，以下表述正确的有（）。',o:["一般情况下，价格和需求的变动呈反方向变化", "商品的自身价格是影响需求的最重要的因素", "如果预期价格将下跌，许多消费者将提前购买", "互补商品中，一种商品价格上升，会引起另一种商品需求随之降低"],a:[0,1,3],x:'本题考查影响需求的主要因素。如果消费者预期价格要上涨，就会刺激人们提前购买；如果预期价格将下跌，许多消费者就会推迟购买。所以，选项C错误。该题要求考生掌握每个因素对需求变动的具体影响。'},
  {ch:0,q:'政府为了保护农业生产者利益，在必要时对某些农产品可以采取的价格干预措施是（）。',o:["规定保护价格", "调整均衡价格", "规定最高限价"],a:0,x:'本题考查保护价格分析。所谓保护价格，也叫支持价格或最低限价，就是由政府规定一个具体的价格，市场交易只能在这一价格之上进行，其目的是保护生产者利益或支持某一产业的发展。（2016年试题）（2020年试题）正保会计网校中级经济师好课已就位，随报随学！其中，高效实验班入学测试、阶段测评、还赠送机考模拟系统，两科联报更划算！'},
  {ch:0,type:'multi',q:'以下关于边际效用理论的说法中，正确的有（）。',o:["边际效用是递减的", "总效用达到最大值时，边际效用为0", "一般来说，边际效用取决于消费数量的多少", "从数学的意义上看，边际效用就是总效用函数的斜率"],a:[0, 1, 3],x:'本题考查边际效用理论。一般来说，总效用（TU）取决于消费数量的大小，在一定范围内，消费量越大，则总效用就越大，选项CE说法有误。'},
  {ch:3,q:'关于无差异曲线的说法，错误的是（）。',o:["消费者对于同一无差异曲线上各个点的偏好程度是无差异的", "任意两条无差异曲线都可能相交", "离原点越远的无差异曲线，消费者的偏好程度越高"],a:1,x:'本题考查无差异曲线的特征。任意两条无差异曲线都不可能相交，选项B说法有误。（2013年试题）'},
  {ch:0,q:'下列理论假设中，不仅是分析消费者行为的前提，也是整个经济学的一个基础的是（）。',o:["社会人假设", "复杂人假设", "自我实现人假设"],a:2,x:'本题考查效用理论。经济人假设不仅是分析消费者行为的前提，也是整个经济学的一个基础。'},
  {ch:0,q:'消费者效用达到最大化时，满足效用最大化的商品组合必定位于（）。',o:["预算线与横轴的交点上", "预算线与纵轴的交点上", "预算线与无差异曲线相切的切点上"],a:2,x:'本题考查消费者均衡。满足效用最大化的商品组合必定位于预算线与无差异曲线相切的切点上。'},
  {ch:0,q:'基数效用理论和序数效用理论的主要区别在于（）。',o:["边际替代率是否递增", "边际替代率是否递减", "效用是否可以直接度量"],a:2,x:'本题考查效用理论。基数效用论认为效用是可以直接度量的，存在绝对的效用量的大小。而序数效用论则认为效用的数值无法知道，只能说出自己的偏好次序。所以二者的主要区别是效用是否可以直接度量。'},
  {ch:3,q:'在相对价格不变的情况下，如果消费者的收入减少，会使预算线（）。',o:["向右平移", "向左平移", "向上旋转"],a:1,x:'本题考查预算约束线。消费者的收入减少，会使预算线向左平移。（2012年试题）（2017年试题）'},
  {ch:0,type:'multi',q:'序数效用论是用（）来分析消费者行为的。',o:["无差异曲线", "预算约束线", "边际效用论", "成本曲线"],a:[0, 1],x:'本题考查效用理论。序数效用理论运用无差异曲线和预算约束线进行分析。正保会计网校中级经济师好课已就位，随报随学！其中，高效实验班入学测试、阶段测评、还赠送机考模拟系统，两科联报更划算！'},
  {ch:3,q:'按照美国经济学家科斯的观点，企业的本质或者显著特征是（）。',o:["企业是推动技术进步的平台", "企业是社会化大生产的产物", "企业是承担社会责任的机制"],a:2,x:'本题考查企业形成的理论。科斯认为企业是为了节约市场交易费用或交易成本而产生的，企业的本质或者显著特征是作为市场机制或价格机制的替代物。'},
  {ch:3,q:'边际产量递减规律发生作用的前提条件是（）。',o:["投入的生产要素价格不变", "各种生产要素投入比例不变", "全要素生产率有所下降"],a:2,x:'本题考查边际产量递减规律。边际产量递减规律也称为边际报酬递减规律，其基本含义是：在技术水平和其他投入保持不变的条件下，连续追加一种生产要素的投入量，总是存在着一个临界点，在临界点之前，边际产量递增，超过临界点之后，边际产量将出现递减的趋势，直到出现负值。'},
  {ch:3,q:'按照美国经济学家科斯的观点，企业存在的根本原因是（）。',o:["节约交易成本或交易费用", "社会生产力发展的要求", "有利于成本和劳动的有机结合"],a:0,x:'本题考查企业形成的理论。美国经济学家科斯认为企业是为了节约市场交易费用或交易成本而产生的，企业的本质或者显著特征是作为市场机制或价格机制的替代物。'},
  {ch:3,q:'在一种可变要素的生产函数及其曲线中，总产量曲线、平均产量曲线、边际产量曲线等曲线之间存在着一定的规律或关系，当总产量曲线下降时，（）。',o:["平均产量为0", "平均产量曲线与边际产量曲线相交", "边际产量为负数"],a:2,x:'本题考查产量曲线。当边际产量为0时，总产量达到最大。当边际产量小于0时，总产量开始下降。所以，总产量下降时，边际产量为负数。'},
  {ch:3,type:'multi',q:'关于规模报酬的说法，正确的有（）。',o:["规模报酬是企业的生产规模与所引起的产量之间的关系", "规模报酬可以分为两类", "规模报酬研究的是长期生产决策问题", "技术进步决定生产规模"],a:[0, 2],x:'本题考查规模报酬。规模报酬也称规模收益，是在其他条件不变的情况下，企业内部各种生产要素按照相同比例变化时所带来的产量的变化，也就是企业的生产规模变化与所引起的产量变化之间的关系，选项A正确，选项E错误。企业只有在长时期中才能改变全部生产要素的投入，进而影响生产规模，所以规模收益研究的是企业的长期生产决策问题，选项C正确，选项D错误。规模报酬可以分为三类，选项B错误。'},
  {ch:3,q:'在给定的预算线坐标图上，决定预算线变动的因素包括（）。',o:["价格弹性和商品的相对价格", "消费者收入和商品的相对价格", "消费者偏好和商品的相对价格"],a:1,x:'本题考查预算约束线。预算线表示在消费者的收入和商品的价格给定的条件下，消费者的全部收入所能购买到的两种商品的各种组合。所以决定预算线变动的因素就是商品的价格和消费者的收入。'},
  {ch:2,q:'需求曲线是通过（）推导出来的。',o:["价格一成本曲线", "价格一消费曲线", "价格弹性曲线"],a:1,x:'本题考查需求曲线。需求曲线是通过价格—消费曲线推导出来的。由于一种商品价格的变动，预算线的位置发生了变动，从而引起预算线与无差异曲线的切点即消费者均衡点的移动，把这些均衡点连接起来便可以得到一条价格—消费曲线。由价格一消费曲线可以看出，当商品的价格下降时，无差异曲线向外转，因而商品的需求量上升，所以消费者的需求曲线是向下倾斜的。（2018年试题）正保会计网校中级经济师好课已就位，随报随学！其中，高效实验班入学测试、阶段测评、还赠送机考模拟系统，两科联报更划算！'},
  {ch:2,q:'在完全竞争市场上，单个企业所面对的需求曲线也是其（）。',o:["平均收益曲线和边际成本曲线", "平均收益曲线和边际收益曲线", "平均收益曲线和总收益曲线"],a:1,x:'本题考查完全竞争市场中生产者的行为。完全竞争市场上，正因为价格、平均收益和边际收益都是相等的，所以，企业的平均收益、边际收益和需求曲线都是同一条线。（2021年试题）'},
  {ch:4,q:'垄断竞争企业为了实现利润最大化，遵循的决策原则是（）。',o:["边际收益等于平均收益", "按照价格弹性进行的价格歧视", "边际收益等于边际成本"],a:2,x:'本题考查垄断竞争市场上生产者的行为。因为垄断竞争企业面临向右下方倾斜的需求曲线，所以与完全垄断企业类似，垄断竞争企业也遵循着相同的利润最大化原则，它选择边际收益等于边际成本即MR＝MC的产量，然后用其需求曲线找出与这种产量相对应的价格。（2021年试题）'},
  {ch:4,type:'multi',q:'在完全竞争市场上，关于产品的价格的说法，正确的有（）。',o:["每个消费者可以自主定价", "生产者可以进行差别定价", "政府的价格控制是非常必要的", "每个生产者都是价格的接受者"],a:[2,3],x:'本题考查市场结构。在完全竞争市场上，市场上有很多生产者和消费者，或买者和卖者，而且这些生产者规模都很小，没有任何一个买者或卖者能够影响市场价格，每个生产者或消费者都只能是市场价格的接受者，而不是价格的决定者。也就是说，每一个生产者或消费者都只是被动地接受市场价格，对市场价格没有任何控制的力量。（2021年试题）'},
  {ch:4,q:'近似于完全竞争市场的行业是（）。',o:["卷烟", "自来水", "玉米"],a:2,x:'本题考查市场结构。实际上，在现实生活中，很难找到完全符合这些特征的完全竞争市场。某些农产品，如小麦、玉米等的市场属于近似的例子。'},
  {ch:2,q:'下列市场类型中最可能存在供给曲线的是（）。',o:["完全竞争市场", "垄断竞争市场", "完全垄断市场"],a:0,x:'本题考查完全竞争市场中生产者的行为。在完全竞争市场上，企业的短期供给曲线就是处于平均可变成本之上的边际成本曲线。而在完全垄断、垄断竞争、寡头垄断市场上，企业不存在供给曲线。'},
  {ch:2,q:'在完全竞争市场上，企业的短期供给曲线是（）。',o:["处于平均可变成本与平均固定成本之间的边际成本曲线", "平均总成本曲线", "处于平均可变成本之上的边际成本曲线"],a:2,x:'本题考查完全竞争市场中生产者的行为。完全竞争市场上，企业的短期供给曲线就是处于平均可变成本之上的边际成本曲线，它表示，企业在每一个价格水平的供给量都是能够为其带来最大的利润或最小的亏损的最优产量。'},
  {ch:4,type:'multi',q:'关于垄断竞争市场生产者行为和价格的说法，正确的有（）。',o:["垄断竞争市场存在供给曲线", "个别生产者的需求曲线是向右下方倾斜的", "垄断竞争企业面临两条不同的需求曲线", "在短期中，垄断竞争企业是一个垄断者"],a:[1, 2, 3],x:'本题考查垄断竞争市场中生产者的行为。垄断竞争市场上不存在供给曲线，选项A错误。垄断竞争市场上企业的需求曲线是向右下方倾斜的，选项B正确。垄断竞争企业面临的需求曲线有两种，分别称为主观需求曲线和实际需求曲线，选项C正确。在短期中，垄断竞争企业是一个垄断者，选项D正确。正保会计网校中级经济师好课已就位，随报随学！其中，高效实验班入学测试、阶段测评、还赠送机考模拟系统，两科联报更划算！'},
  {ch:0,q:'在要素市场上，生产者使用要素的原则是（）。',o:["边际要素成本等于边际物质产品", "边际要素成本等于边际收益产品", "边际要素成本等于平均要素成本"],a:1,x:'本题考查生产者使用生产要素的原则。生产者使用要素的原则就是在一定时间内，在一定条件下，根据企业内部的生产状况和市场情况，确定要素的使用量，以实现利润最大化，即边际要素成本等于边际收益产品。'},
  {ch:2,type:'multi',q:'关于各种不同的生产要素的供给曲线的说法，正确的有（）。',o:["土地的供给曲线是一条垂直线", "劳动的供给曲线是一条后弯曲线", "资本的供给曲线在短期内是一条后弯曲线", "各种要素的供给曲线具有同样的形状"],a:[0, 1],x:'本题考查劳动供给曲线和均衡工资的决定。劳动的供给曲线是后弯曲线。由于土地的数量一般不会变化，所以土地的供给曲线是一条垂直线。而资本的供给在短期内是垂直线，从长期来看也是一条后弯曲线。'},
  {ch:5,q:'在要素市场上，工资增加的收入效应是指（）。',o:["工作更长的时间可以获得更多的收入", "宁愿工作更长的时间，用劳动替代闲暇，增加劳动供给", "劳动者收入更高将会增加闲暇，减少劳动供给"],a:2,x:'本题考查工资增加的收入效应。工资增加的收入效应是指，由于工资上升，收入增加，消费者相对更加富有而追求闲暇，从而会减少劳动的供给。工资增加的替代效应是指，由于工资上升，收入增加，消费者用劳动替代闲暇，劳动供给增加。'},
  {ch:2,q:'关于生产要素的需求曲线的说法，正确的是（）。',o:["生产要素的需求曲线向右下方倾斜", "生产要素的需求曲线是一条水平线", "生产要素的需求曲线和边际要素成本曲线重合"],a:0,x:'本题考查完全竞争生产者的要素需求曲线。生产要素的需求曲线也即MRP＝VMP曲线，向右下方倾斜。'},
  {ch:2,q:'关于垄断竞争市场上供给曲线的说法，正确的是（）。',o:["垄断竞争市场上不存在供给曲线", "垄断竞争企业处于平均固定成本之上的边际成本曲线", "垄断竞争企业处于平均总成本之上的边际成本曲线"],a:0,x:'本题考查垄断竞争市场上生产者的行为。和完全垄断市场相同的是，垄断竞争市场上不存在供给曲线。'},
  {ch:4,type:'multi',q:'在现实世界中，近似于完全垄断市场的行业有（）。',o:["煤炭生产", "汽车生产", "电力", "农产品粗加工"],a:[1,3],x:'本题考查各种市场结构的特征。在实际生活中，公用事业如电力、固定电话业务近似于完全垄断市场。'},
  {ch:4,q:'按照市场结构的划分原则，如果一个行业的供给被少数几个企业控制，属于（）市场。',o:["寡头垄断", "完全竞争", "完全垄断"],a:0,x:'本题考查市场结构。寡头垄断市场是指少数几个企业控制一个行业的供给的市场结构。（2021年试题）正保会计网校中级经济师好课已就位，随报随学！其中，高效实验班入学测试、阶段测评、还赠送机考模拟系统，两科联报更划算！'},
  {ch:1,q:'资源配置实现最优的标准是（）。',o:["经济总量和财政收入持续增长", "不存在帕累托改进的资源配置状态", "劳动生产率持续提高"],a:1,x:'本题考查帕累托最优状态。资源实现最优配置的标准是：当一种资源的任何重新分配已经不可能实现在不使一个人福利减少的情况下使任何一个人的福利增加。换言之，社会已经达到这样一种状态，如果资源在某种配置下，不可能由重新组合生产和分配来使一个人或多个人的福利增加，而不使其他任何人的福利减少，那么社会就实现了资源的最优配置，这种状态称为“帕累托最优”状态；反之，如果既定的资源配置状态能够在其他人福利水平不降的情况下，通过重新配置资源，使得至少有一个人的福利水平有所提高，则这种资源重新配置称为“帕累托改进”。所以，帕累托最优状态是不存在帕累托改进的资源配置状态。'},
  {ch:6,type:'multi',q:'按照市场失灵的理论，导致市场失灵的原因包括（）。',o:["信息不对称", "市场监管不力", "市场竞争过度", "收入分配差距过大"],a:[0,3],x:'本题考查市场失灵的原因。导致市场失灵的原因主要有垄断、外部性、公共物品和信息不对称等。（2021年试题）'},
  {ch:6,q:'关于外部性的说法，正确的是（）。',o:["外部性问题只有在垄断竞争市场条件下存在", "外部性的存在使得资源配置难以达到帕累托最优状态", "外部性问题只有在生产过程中存在"],a:1,x:'本题考查外部性。外部性可以分为外部经济与外部不经济两种（选项D错误）。根据经济活动的主体是生产者还是消费者，外部性可以分为生产的外部性和消费的外部性（选项C错误）。由于外部性或外部影响的存在，市场机制就不能有效地进行资源配置。即使是在完全竞争条件下，由于存在外部性的影响，整个经济的资源配置也不可能达到帕累托最优状态（选项A错误，选项B正确）。'},
  {ch:3,type:'multi',q:'美国经济学家科斯关于产权和外部性理论的主要观点和结论包括（）。',o:["很多外部性的产生都是由于产权不清晰导致的", "只要产权是明确的，并且交易成本为零或者很小，市场均衡的最终结果都是有效率的", "即使产权不明确，只要交易成本为零或者很小，市场均衡的最终结果都是有效率的", "不同的产权制度会导致相同的资源配置效率"],a:[0,1,3],x:'本题考查科斯理论。只要财产权是明确的，并且交易成本是零或者很小，那么无论在开始时将财产权赋予谁，市场均衡的最终结果都是有效率的，实现资源配置的帕累托最优。一旦考虑到交易成本，不同产权制度，会导致不同的资源配置效率。选项CD说法错误。'},
  {ch:5,q:'反映生产要素市场和产品市场之间联系的是（）。',o:["引致需求", "联合需求", "复合需求"],a:0,x:'本题考查引致需求。生产者对生产要素的需求称为引致需求或派生需求，引致需求的概念反映了生产要素市场和产品市场之间的联系。生产者对生产要素的需求量在很大程度上取决于消费者对产品的需求量。（2018年试题）'},
  {ch:5,q:'从短期看，在要素市场上，供给曲线具有后弯特征的生产要素是（）。',o:["数据", "土地", "资本"],a:2,x:'本题考查劳动的供给曲线。劳动的供给曲线向后弯曲。土地的供给曲线是一条垂直线。而资本的供给在短期内是垂直线，从长期来看才是一条后弯曲线。'},
  {ch:5,q:'在要素市场上，工资增加的替代效应是指（）。',o:["工作较短的时间可以获得同样的收入，劳动供给减少", "劳动者收入增加而追求闲暇，减少劳动供给", "宁愿工作更长的时间用劳动替代闲暇，增加劳动供给"],a:2,x:'本题考查劳动的供给曲线。工资增加的替代效应是指，由于工资上升，收入增加，消费者用劳动替代闲暇，劳动供给增加。工资增加的收入效应是指，由于工资上升，收入增加，消费者相对更加富有而追求闲暇，从而会减少劳动的供给。正保会计网校中级经济师好课已就位，随报随学！其中，高效实验班入学测试、阶段测评、还赠送机考模拟系统，两科联报更划算！'},
  {ch:7,type:'multi',q:'下列经济因素中，对长期总供给有决定性影响的有（）。',o:["价格总水平", "消费水平", "劳动", "资本"],a:[2, 3],x:'本题考查总供给。从长期来看，总供给变动与价格总水平无关，不论价格总水平如何变化，总产出不变。这就意味着，长期总供给只取决于劳动、资本与技术，以及经济体制等因素。（2021年试题）'},
  {ch:7,q:'按照国民收入核算理论，下列项目中，不属于按支出法计算国内生产总值（GDP）范围的是（）。',o:["劳动者报酬", "政府消费", "存货变动"],a:0,x:'本题考查国内生产总值的计算方法。国内生产总值支出法国内生产总值＝最终消费＋资本形成总额＋净出口。最终消费包括居民消费和政府消费，资本形成总额包括固定资本形成总额和存货变动。选项A属于收入法国内生产总值包括的内容。'},
  {ch:7,q:'按照国民收入核算理论，下列项目中，不属于按收入法计算国内生产总值（GDP）范围的是（）。',o:["存货变动", "固定资产折旧", "生产税净额"],a:0,x:'本题考查国内生产总值的计算方法。收入法增加值＝劳动者报酬＋固定资产折旧＋生产税净额＋营业盈余收入法国内生产总值＝所有常住单位收入法增加值之和'},
  {ch:1,q:'下列关于外部性或外部影响与资源配置效率的说法，正确的是（）。',o:["产生外部经济的生产者的产出水平低于社会最优产出水平", "产生外部经济的生产者的产出水平高于社会最优产出水平", "产生外部不经济的生产者的产出水平等于社会最优产出水平"],a:0,x:'本题考查外部性和市场失灵。对于产生外部经济的生产者来说，由于其私人收益小于社会收益（因为社会收益等于私人收益与外部收益之和，而外部收益却不能为生产者通过市场价格获得），因而缺乏生产积极性，其产出水平就会低于社会最优产出水平。'},
  {ch:6,q:'关于外部性或外部影响的说法，错误的是（）。',o:["鼓励外部经济的主要手段是财政补贴", "很多外部性的产生都是由于产权不清晰导致的", "增税是解决外部不经济的主要措施"],a:2,x:'本题考查外部性和政府的干预。依靠市场机制矫正外部性是有一定困难的。但是，科斯定理毕竟提供了一种通过市场机制解决外部性问题的新的思路和方法。'},
  {ch:6,type:'multi',q:'信息不对称导致的问题有（）。',o:["逆向选择", "搭便车", "道德风险", "财政幻觉"],a:[0, 2],x:'本题考查信息不对称。逆向选择和道德风险是由于信息不对称导致的。'},
  {ch:3,q:'关于科斯提出的产权理论的说法，正确的是（）。',o:["只要产权明晰，交易成本大小不会影响资源最优配置的效率", "交易成本大小是影响资源最优配置的根本因素", "产权制度不同不会影响资源配置效率"],a:2,x:'本题考查政府对市场的干预。只要财产权是明确的，并且交易成本为零或者很小，那么，无论在开始时将财产权赋予谁，市场均衡的最终结果都是有效率的，进而实现资源配置的帕累托最优。进一步看，还可以认为，一旦考虑到交易成本，产权的初始界定对于经济运行的效率就会产生十分重要的作用，从而可以引申出一个重要结论：不同的产权制度，会导致不同的资源配置效率。正保会计网校中级经济师好课已就位，随报随学！其中，高效实验班入学测试、阶段测评、还赠送机考模拟系统，两科联报更划算！'},
  {ch:2,q:'下列关于总需求和总需求曲线的描述，错误的是（）。',o:["总需求是在其他条件不变的情况下，在某一给定的价格水平上，一个国家或地区各种经济主体愿意购买的产品总量", "在其他条件不变的情况下，利率下降会导致企业投资和居民购买住宅及耐用消费品的数量减少，从而使总需求减少", "总需求曲线只分析价格总水平与总需求的关系，假定其他条件不变"],a:1,x:'本题考查总需求。利率下降则会导致企业投资和居民购买住宅及耐用消费品的数量增加，从而使总需求增加，选项B说法错误。'},
  {ch:2,type:'multi',q:'总需求曲线向右下方倾斜，可以通过分析价格总水平对总需求的各个组成的影响来说明，包括（）。',o:["价格总水平对消费需求的影响", "价格总水平对出口需求的影响", "价格总水平对进口需求的影响", "价格总水平对投资需求的影响"],a:[0, 1, 3],x:'本题考查总需求。总需求曲线具有向右下方倾斜的特征，可以通过分析价格总水平对总需求的各个组成部分的影响，即价格总水平对消费、投资和出口的需求的影响来说明总需求曲线向右下方倾斜的原因。'},
  {ch:2,type:'multi',q:'关于总供给和总供给曲线的说法，正确的有（）。',o:["总供给的变动主要取决于企业的利润水平", "长期总供给曲线是一条向右上方倾斜的曲线", "从长期来看，总供给变动与价格总水平无关", "总供给曲线反映的是在其他因素不变的条件下，总供给与价格总水平变动的关系"],a:[0,2,3],x:'本题考查总供给。选项B错误，长期总供给曲线是一条与横轴相交的垂直线。'},
  {ch:0,q:'从经济学角度看，下列经济行为中，不应算作投资的是（）。',o:["建造厂房", "金融投资", "购置设备"],a:1,x:'本题考查投资函数。投资是购置物质资本（如厂房、设备和存货，以及住房建筑物）的活动，即形成固定资产的活动，一般不包括金融投资在内。'},
  {ch:7,type:'multi',q:'影响总需求变动的因素主要有（）。',o:["货币供给量", "政府购买", "市场竞争程度", "技术进步"],a:[0,1,3],x:'本题考查总需求。影响总需求的因素主要有：（1）利率。（2）货币供给量。（3）政府购买。（4）税收。（5）预期。（6）价格总水平。'},
  {ch:7,q:'如果用C代表居民消费，I代表投资，G代表政府购买，（X－M）代表净出口，则支出法国内生产总值为（）。',o:["GDP＝C＋I＋G＋（X－M）", "GDP＝C＋I＋G", "GDP＝C＋I"],a:0,x:'本题考查国内生产总值的计算方法。支出法国内生产总值＝最终消费＋资本形成总额＋净出口。如果用字母C表示居民消费，用I表示投资，用G表示政府购买，用（X－M）表示净出口，则支出法国内生产总值的公式可以表示为：GDP＝C＋I＋G＋（X－M）。（2021年试题）'},
  {ch:7,q:'按照乘数理论，投资乘数的大小主要取决于（）。',o:["投资函数", "实际利率", "平均消费倾向"],a:2,x:'本题考查投资乘数。投资乘数k＝1/（1﹣β）。β为边际消费倾向，故选D。（2021年试题）正保会计网校中级经济师好课已就位，随报随学！其中，高效实验班入学测试、阶段测评、还赠送机考模拟系统，两科联报更划算！'},
  {ch:2,q:'在其他因素不变的条件下，总供给曲线反映的是总供给和（）变动的关系。',o:["企业利润水平", "工资水平", "价格总水平"],a:2,x:'本题考查总供给。总供给曲线反映的是在其他因素不变的条件下，总供给与价格总水平变动的关系。'},
  {ch:7,type:'multi',q:'影响长期总供给的因素主要有（）。',o:["劳动", "资本", "通货膨胀", "税收"],a:[0,1,3],x:'本题考查总供给。长期总供给只取决于劳动、资本与技术，以及经济体制等因素。'},
  {ch:7,q:'在国民收入核算过程中，从生产过程中创造原始收入的角度来计算国内生产总值的计算方法是（）。',o:["支出法", "收入法", "价值法"],a:1,x:'本题考查国内生产总值的计算方法。收入法是从生产过程中创造原始收入的角度计算国内生产总值的。'},
  {ch:7,q:'关于国内生产总值的说法，错误的是（）。',o:["国内生产总值的计算方法有三种，即生产法、收入法和支出法", "国内生产总值是一个收入概念", "国内生产总值是目前世界各国(或地区)普遍使用的衡量经济活动总量的基本指标"],a:1,x:'本题考查国内生产总值。国民总收入（GNI）是一个收入概念，而国内生产总值是一个生产概念。'},
  {ch:7,type:'multi',q:'关于消费理论和消费函数的说法，正确的有（）。',o:["凯恩斯的消费函数表示为C＝α＋βY", "凯恩斯的消费理论认为消费支出由自发消费和引致消费构成", "莫迪利安尼提出的消费理论强调了消费与个人生命周期阶段之间的关系", "莫迪利安尼的消费函数表示为C＝α·WR＋c·YL"],a:[0, 1, 2, 3],x:'本题考查消费理论。弗里德曼提出的持久收入理论认为消费者的消费支出不是根据他的当前收入决定的，而是根据他的持久收入决定的，选项E错误。'},
  {ch:7,type:'multi',q:'关于消费函数和储蓄函数，下列说法正确的有（）。',o:["消费函数和储蓄函数互为倒数", "消费函数和储蓄函数互为补数", "消费函数和储蓄函数之和总是等于收入", "消费函数和储蓄函数之和总是等于1"],a:[0,1,3],x:'本题考查储蓄函数。消费函数和储蓄函数的关系是：消费函数和储蓄函数互为补数，两者之和总是等于收入，这就是说，消费函数和储蓄函数中的一个确定，另一个也随之确定。'},
  {ch:2,q:'在宏观经济学中，假定其他因素不变的情况下，总需求曲线AD指的是（）。',o:["利率与总需求的关系", "税收水平与总需求的关系", "货币供给量与总需求的关系"],a:2,x:'本题考查总需求。在宏观经济学中，为了说明价格总水平的变化，假定其他因素不变，只分析价格总水平与总需求的关系，就形成了总需求曲线AD。正保会计网校中级经济师好课已就位，随报随学！其中，高效实验班入学测试、阶段测评、还赠送机考模拟系统，两科联报更划算！'},
  {ch:8,q:'下列分析和预测经济运行及其波动的统计指标中，属于同步指标的是（）。',o:["库存", "股票价格指数", "固定资产投资额"],a:2,x:'本题考查分析和预测经济运行及其波动的统计指标。在我国，一般把工业总产值、固定资产投资额和社会消费品零售总额等视为一致指标。选项AD属于滞后指标，选项B属于领先指标。'},
  {ch:8,type:'multi',q:'根据经济周期理论，导致经济波动的因素有（）。',o:["通货膨胀率", "技术进步状况", "预期变化", "经济体制的变动"],a:[0,1,2,3],x:'本题考查导致经济波动的主要因素。导致经济运行出现周期性波动的因素有很多，主要包括：（1）投资率的变动；（2）消费需求的波动；（3）技术进步的状况；（4）预期的变化；（5）经济体制的变动；（6）国际经济因素的冲击；（7）大规模疫情等因素的冲击。',flag:'答案存疑：解析所列波动因素不含“通货膨胀率”，疑为BCD，建议对照教材核实'},
  {ch:8,q:'经济低谷时期，增长率为负，此时所处的经济周期属于（）。',o:["长周期", "古典型周期", "增长型周期"],a:1,x:'本题考查经济周期的类型。古典型周期经济运行处在低谷时的经济增长为负增长，经济总量GDP绝对减少。'},
  {ch:8,type:'multi',q:'下列分析和预测经济运行及其波动的统计指标中，属于滞后指标的有（）。',o:["股票价格指数", "固定资产投资额", "居民消费价格指数", "制造业订货单"],a:[1,3],x:'本题考查分析和预测经济运行及其波动的统计指标。滞后指标是对总体经济运行中已经出现的峰顶和谷底的确认，如库存、居民消费价格指数等。股票价格指数、制造业订货单属于先行指标，固定资产投资额属于一致指标。'},
  {ch:7,q:'由价格总水平变动引起利率变化并进而与投资、消费及总需求的这种反方向变化的现象称为（）。',o:["价格效应", "利率效应", "预期效应"],a:1,x:'本题考查价格总水平的利率效应。由价格总水平变动引起利率变化并进而与投资、消费及总需求的这种反方向变化的现象称为利率效应。'},
  {ch:7,q:'下列因素中，不会影响总需求变动的是（）。',o:["利率", "生产成本", "货币供给量"],a:1,x:'本题考查影响总需求的因素。选项B是影响总供给变动的因素。'},
  {ch:0,q:'在宏观经济均衡的基本模型中，具有基础性作用的公式是（）。',o:["投资—消费—净出口恒等式", "消费—储蓄恒等式", "储蓄—投资恒等式"],a:2,x:'本题考查宏观经济均衡的基本模型。储蓄—投资恒等式具有基础性作用'},
  {ch:16,q:'下列分析和预测经济运行及其波动的统计指标中，属于一致性指标的是（）。',o:["社会消费品零售总额", "制造业订货单", "房地产价格指数"],a:0,x:'本题考查分析和预测经济波动的指标体系。在我国，一般把工业总产值、固定资产投资额和社会消费品零售总额等视为一致指标。（2017年试题）'},
  {ch:8,q:'一国经济运行处于低谷，经济增长率保持正值但增长幅度比过去有所下降，这种经济周期称为（）。',o:["古典型周期", "增长型周期", "长周期"],a:1,x:'本题考查增长型周期的概念。按照经济总量绝对下降或相对下降的不同情况，经济周期可分为古典型周期和增长型周期。如果处在低谷时的经济增长率为正值，即经济总量GDP只是相对减少而非绝对减少，则为增长型周期。'},
  {ch:8,type:'multi',q:'下列可用于经济波动状况分析的经济指标中，属于一致指标的有（）。',o:["股票价格指数", "商品库存", "固定资产投资额", "居民消费价格指数"],a:[1,3],x:'本题考查分析和预测经济波动的指标体系。在我国，一般把工业总产值、固定资产投资额和社会消费品零售总额等视为一致指标。制造业订货单、股票价格指数和广义货币M2等属于先行指标。库存、居民消费价格指数等属于滞后指标。'},
  {ch:8,q:'总体经济活动沿着经济增长的总体趋势而出现的有规律的扩张和收缩称为（）。',o:["经济周期", "经济波动", "经济发展"],a:0,x:'本题考查经济周期的概念。经济周期又称商业循环，是指总体经济活动沿着经济增长的总体趋势而出现的有规律的扩张和收缩。'},
  {ch:0,q:'在分析和预测经济形势时，下列经济指标中，属于滞后性指标的是（）。',o:["制造业订单", "居民消费价格指数", "固定资产投资额"],a:1,x:'本题考查分析和预测经济波动的指标体系。制造业订货单属于领先指标。工业增加值、固定资产投资额属于一致指标。'},
  {ch:0,type:'multi',q:'导致经济运行出现周期性波动的因素有很多，主要包括（）。',o:["预期的变化", "汇率的变动", "经济体制的变动", "消费需求的波动"],a:[0,2,3],x:'本题考查导致经济波动的主要因素。导致经济运行出现周期性波动的因素有很多，主要包括：（1）投资率的变动；（2）消费需求的波动；（3）技术进步的状况；（4）预期的变化；（5）经济体制的变动；（6）国际经济因素的冲击；（7）大规模疫情等因素的冲击。'},
  {ch:0,q:'根据《中华人民共和国国民经济和社会发展第十四个五年规划和2035年远景目标纲要》，我国在“十四五”时期的发展目标是（）。',o:["国内生产总值（GDP）年均增长保持在合理区间，不低于6％", "国内生产总值（GDP）年均增长保持在合理区间，不低于“十三五”期间平均增速", "国内生产总值（GDP）年均增长保持在6％左右"],a:2,x:'本题考查《十四五规划纲要》的主要目标、任务和战略措施。国内生产总值年均增长保持在合理区间、各年度视情提出，全员劳动生产率增长高于国内生产总值增长'},
  {ch:9,type:'multi',q:'下列关于我国的经济结构及就业失业问题的说法，正确的有（）。',o:["我国还处于从二元经济结构向现代化经济转型的进程中", "我国保持经济的长期稳定增长，不存在就业矛盾", "我国在经济和社会发展过程中，还将有一定数量的农村劳动力向城镇转移", "我国将继续实施就业优先政策，缓解结构性就业矛盾"],a:[0,2,3],x:'本题考查我国的就业与失业问题。我国还处于从二元经济结构向现代化经济转型的进程中，城镇化程度还有待进一步提高，农村富余劳动力还有一定规模。在经济和社会发展过程中，还将有一定数量的农村劳动力向城镇转移。努力扩大就业，降低失业率，使劳动力资源得到更加充分的利用，是提高人民生活水平的重要途径。国家将继续实施就业优先政策，健全有利于更充分更高质量就业的促进机制，扩大就业容量，提升就业质量，缓解结构性就业矛盾。只有选项B说法错误。'},
  {ch:9,type:'multi',q:'按照古典经济学观点，属于自愿失业的有（）。',o:["结构性失业", "体制性失业", "周期性失业", "二元经济结构失业"],a:[0,3],x:'本题考查失业的类型。自愿失业包括摩擦性失业和结构性失业两种形式。'},
  {ch:9,q:'美国经济学家提出的奥肯定律描述的是（）之间的数量相关关系。',o:["失业与产出", "实际产出和价格波动", "实际工资和名义工资"],a:0,x:'本题考查奥肯定律。美国经济学家阿瑟•奥肯在20世纪60年代初提出了美国的产出与失业之间的一个数量相关关系，即奥肯定律或奥肯法则。（2021年试题）'},
  {ch:9,type:'multi',q:'关于菲利普斯曲线的含义和作用，下列说法中正确的有（）。',o:["菲利普斯曲线是一条描述通货膨胀与失业或经济增长之间相互关系的曲线", "菲利普斯曲线是一条描述经济增长与就业或失业之间相互关系的曲线", "根据菲利普斯曲线，可以通过促进经济增长来增加就业或减少失业", "菲利普斯曲线是一条描述税收收入与税率之间相互关系的曲线"],a:[0,3],x:'本题考查菲利普斯曲线。菲利普斯曲线是以英国经济学家菲利普斯名字命名的一条描述通货膨胀与失业或经济增长之间相互关系的曲线，也是分析宏观经济问题的重要工具（选项A正确，BD错误）。根据奥肯定律，政府可以通过促进经济增长来增加就业或减少失业（选项C错误）。美国经济学家弗里德曼认为，工人和企业感兴趣的是实际工资而不是名义工资（货币工资），在劳资双方进行工资谈判时，工人会把通货膨胀预期考虑进去。这就意味着，对某一个水平的失业率，可以对应多个水平的通货膨胀率。按照这种观点，通货膨胀和失业之间的所谓替代关系只在短期内才是可能的，而在长期内则是不存在的（选项E正确）。（2021年试题）'},
  {ch:9,type:'multi',q:'关于菲利普斯曲线的说法，正确的有（）。',o:["从长期看，菲利普斯曲线是一条和横轴平行的直线", "菲利普斯曲线适用于任何国家，都具有相同数量关系", "简单的菲利普斯曲线是一条描述通货膨胀率与失业率之间关系的曲线", "弗里德曼认为长期来看，菲利普斯曲线是不存在的"],a:[2, 3],x:'本题考查菲利普斯曲线。从长期看，菲利普斯曲线是一条和横轴垂直的直线，选项A错误。菲利普斯曲线没有涉及数量关系，选项B错误。简单的菲利普斯曲线是一条表示通货膨胀率与失业率之间相互关系的曲线，选项C正确。按照经济学家弗里德曼的观点，通货膨胀和失业之间的所谓替代关系只在短期内才是可能的，而在长期内则是不存在的，选项D正确。菲利普斯曲线是以英国经济学家菲利普斯名字命名的一条描述通货膨胀与失业或经济增长之间相互关系的曲线，选项E错误。'},
  {ch:9,q:'以英国经济学家菲利普斯名字命名的菲利普斯曲线描述的是（）的数量关系。',o:["通货膨胀与失业", "实际产出和名义产出", "失业和产出"],a:0,x:'本题考查菲利普斯曲线。菲利普斯曲线是以英国经济学家菲利普斯名字命名的一条描述通货膨胀与失业或经济增长之间相互关系的曲线。'},
  {ch:9,type:'multi',q:'关于奥肯定律的含义和作用的说法，正确的有（）。',o:["奥肯定律的政策含义是政府应当把促进经济增长作为增加就业或降低失业的主要途径", "奥肯定律揭示了经济增长和财政收入之间的关系", "奥肯定律揭示了通货膨胀和失业之间的关系", "奥肯定律揭示了经济增长和失业之间的关系"],a:[0, 3],x:'本题考查奥肯定律。奥肯定律的政策含义是：相对于潜在的GDP，GDP每下降2个百分点，失业率就会上升1个百分点。在经济增长和就业之间存在一定的正相关关系。因此，政府应当把促进经济增长作为降低失业率的主要途径，选项BE错误。菲利普斯曲线揭示了通货膨胀和失业之间的关系，选项C错误'},
  {ch:9,q:'关于失业的说法，错误的是（）。',o:["失业率是反映一个国家或地区劳动力资源利用状况的最重要的指标", "如何减少失业是宏观经济调控的重要任务之一", "失业是指有劳动能力的人目前没有从事有报酬或收入的工作的现象"],a:2,x:'本题考查就业与失业。失业是指有劳动能力并愿意就业但目前没有从事有报酬或收入的工作的现象。选项C忽略了“愿意就业”。'},
  {ch:9,q:'关于价格总水平影响因素的说法，错误的是（）。',o:["价格总水平与货币流通速度的变化呈正方向变动", "价格总水平取决于总需求和总供给的比例关系", "从长期来看，总供给变动与价格总水平无关"],a:2,x:'本题考查价格总水平。价格总水平与货币供给量、货币流通速度的变化呈正方向变动，而与总产出的变化呈反方向变动。'},
  {ch:9,q:'我国关于城镇登记失业人员劳动年龄的规定是（）。',o:["18周岁至退休年龄", "20周岁至退休年龄", "16周岁至退休年龄"],a:2,x:'本题考查我国的就业与失业的含义和统计口径。调查失业人员统计范围是16周岁及以上常住人口，不考虑其户籍所在地和类型；而登记失业人员统计范围是劳动年龄内（16周岁至退休年龄）的城镇常住人口。'},
  {ch:9,type:'multi',q:'关于奥肯定律的内容和政策含义的说法，正确的有（）。',o:["经济增长与通货膨胀之间的具体数量相关关系会随着时代的变化而有所不同", "经济增长与失业之间的具体数量相关关系在不同的国家或地区可能差别更大", "政府应当把促进经济增长作为增加就业和降低失业的主要途径", "奥肯定律反映了货币工资率与失业率之间的变化关系"],a:[0,1,3],x:'本题考查奥肯定律。奥肯定律所提出的经济增长和失业之间的具体数量相关关系可能会随着时代的变化而有所不同，在不同的国家或地区可能差别更大。但是，这一定律具有重要的政策含义，表明了在经济增长和就业之间存在一定的正相关关系。其政策含义就是，政府应当把促进经济增长作为增加就业或降低失业的主要途径。'},
  {ch:9,type:'multi',q:'关于失业与经济增长及价格总水平的相互关系的说法，正确的有（）。',o:["菲利普斯曲线是一条描述通货膨胀与失业或者经济增长之间相互关系的曲线", "奥肯定律所提出的经济增长和失业之间的具体数量相关关系可能会随着时代的变化而有所不同", "按照美国经济学家萨缪尔森的观点，从短期看，菲利普斯曲线是一条和横轴垂直的线", "菲利普斯曲线反映的是失业率与税率及财政收入之间的关系"],a:[0,1,3],x:'本题考查失业与经济增长及价格总水平的相互关系。弗里德曼认为，从长期看，菲利普斯曲线是一条和横轴垂直的直线。菲利普斯曲线反映的是通货膨胀与失业或经济增长之间的相互关系。选项CD说法错误。'},
  {ch:7,q:'根据失业的分类，因总需求不足而减少劳动力派生需求所导致的失业是（）。',o:["周期性失业", "自愿失业", "摩擦性失业"],a:0,x:'本题考查失业的类型。需求不足型失业也叫非自愿失业，或者叫周期性失业，是指劳动者在现行工资水平下找不到工作的状况，或是指总需求相对不足减少劳动力派生需求所导致的失业'},
  {ch:0,type:'multi',q:'关于要素禀赋理论，下列说法正确的有（）。',o:["该理论也称为H-O模型", "该理论属于当代贸易理论", "该理论由瑞典经济学家赫克歇尔和俄林提出", "该理论假设规模报酬不变"],a:[0,2,3],x:'本题考查要素禀赋理论。要素禀赋理论，也叫H-O模型，由瑞典经济学家赫克歇尔和俄林提出。要素禀赋理论属于传统的贸易理论。传统的贸易理论，一般不考虑生产规模的变化，或假设规模报酬不变。假设各国生产的产品都是同质的，国际市场是完全竞争的。只有选项B说法错误。'},
  {ch:10,type:'multi',q:'关于赫克歇尔—俄林理论，下列说法正确的有（）。',o:["该理论也称为要素禀赋理论", "该理论属于传统贸易理论", "该理论认为决定国际贸易的因素是两个国家产品的生产成本差异", "该理论解释了相似资源储备国家之间和同类工业品之间的双向贸易现象"],a:[0,1,3],x:'本题考查要素禀赋理论。赫克歇尔—俄林理论，也就是要素禀赋理论，它属于传统贸易理论。根据赫克歇尔-俄林理论，各国应该集中生产并出口那些能够充分利用本国充裕要素的产品，进口那些需要密集使用本国稀缺要素的产品。国际贸易的基础是生产资源配置或要素储备比例上的差别。选项CD说法错误。'},
  {ch:10,q:'依据赫克歇尔一俄林的理论可以得出的结论是（）。',o:["各个经济体利用自然资源优势生产有限类别的产品", "所有的经济体都应集中生产并出口其具有绝对优势的产品", "具有相似资源储备的国家之间的贸易和双向贸易是当代国际贸易的基础"],a:2,x:'本题考查国际贸易理论的演变。根据赫克歇尔一俄林理论，各国应该集中生产并出口那些能够充分利用本国相对丰裕要素的产品，进口那些需要密集使用本国相对稀缺要素的产品。国际贸易的基础是生产资源配置或要素储备比例上的差别。通过国际贸易，往往会使各个国家之间的要素报酬（如工资、利息、地租等）差异趋于缩小，出现要素价格均等化趋势。'},
  {ch:10,type:'multi',q:'政府对国际贸易进行干预的手段主要有（）。',o:["实行利率管制", "实行出口信贷", "出口退税", "调整汇率"],a:[1, 2],x:'本题考查政府对国际贸易干预的目的。政府对国际贸易的干预包括对进口贸易的干预和对出口贸易的干预两个方面。政府对进口贸易的干预主要采取关税限制和非关税限制两种方式，即关税壁垒和非关税壁垒。政府除利用关税和非关税措施限制和调节进口贸易外，还常常采取各种鼓励出口的措施对出口贸易进行干预。政府干预出口贸易以刺激出口增加的主要措施是出口补贴。出口补贴分为直接补贴和间接补贴两种。直接补贴是政府直接以现金形式弥补出口企业国际市场价格与本国国内市场价格的差价；间接补贴是对出口企业在出口商品时给予财政上的优惠待遇，如出口退税、出口信贷等。'},
  {ch:0,q:'影响一个国家或地区进口贸易的主要因素是（）。',o:["该国家或地区的技术水平高低", "该国家或地区的自然资源优势", "该国家或地区的总产出水平"],a:2,x:'本题考查影响国际贸易的因素。影响一国进口贸易的因素主要有：一国的经济总量或总产出水平；汇率水平；国际市场商品的供给情况和价格水平的高低。（2021年试题）'},
  {ch:10,q:'关于反倾销税的说法，正确的是（）。',o:["反倾销税水平和裁定的倾销幅度无关", "征收反倾销税有利于扩大出口", "反倾销税属于贸易救济措施"],a:2,x:'本题考查反倾销措施分析。反倾销措施属于贸易救济措施，是指进口国针对价格倾销这种不公平的贸易行为而采取征收反倾销税等措施来抵消不利影响的行为。反倾销税是在正常海关税费之外，进口国主管机关对确认的倾销产品征收的一种附加税。反倾销税的税额不得超过所裁定的倾销幅度，反倾销税的纳税义务人是倾销产品的进口商，出口商不得直接或间接替进口商承担反倾销税。'},
  {ch:10,q:'在国际贸易中，确定出口国企业是否存在低价倾销行为的关键是（）。',o:["对产品性价比的认定", "对产品正常价值的认定", "是否干预汇率"],a:1,x:'本题考查倾销的界定。倾销是指出口商以低于正常价值的价格向进口国销售产品，并因此给进口国产业造成损害的行为。确认出口国企业低价销售行为是否为倾销行为的关键在于对产品正常价值的认定'},
  {ch:10,q:'下列政府对进出口贸易的干预措施中，属于非关税壁垒的是（）。',o:["反倾销税", "出口信贷", "卫生检疫标准"],a:2,x:'本题考查政府对进出口贸易的干预措施。非关税壁垒是指采用关税以外的手段对外国商品进口设置障碍的各种措施，如进口配额制、自愿出口限制、歧视性公共采购、技术标准和卫生检疫标准等。所以，本题选C。'},
  {ch:0,q:'政府鼓励增加出口的主要措施是（）。',o:["提高外贸企业职工工资", "增加出口补贴", "反倾销"],a:1,x:'本题考查政府对国际贸易干预的目的。政府干预出口贸易以刺激出口增加的主要措施是出口补贴。(2016年试题）'},
  {ch:0,type:'multi',q:'政府对进口贸易进行干预而采取的主要措施有（）。',o:["进口配额制", "关税壁垒", "自愿出口限制", "出口补贴"],a:[0, 1, 2],x:'本题考查政府对进出口贸易的干预措施。政府对进口贸易的干预措施包括关税壁垒和非关税壁垒。非关税壁垒包括进口配额制、自愿出口限制、歧视性公共采购、技术标准和卫生检疫标准等。（2019年试题）'},
  {ch:0,q:'为了促进出口，政府一般采取的干预措施是（）。',o:["技术标准和卫生检疫标准", "歧视性公共采购", "出口配额制"],a:2,x:'本题考查政府对进出口贸易的干预。政府干预出口贸易以刺激出口增加的主要措施是出口补贴。'},
  {ch:0,type:'multi',q:'影响一国进口贸易的因素主要有（）。',o:["自然资源的丰裕程度", "汇率水平", "生产能力和技术水平的高低", "国际市场商品的供给"],a:[0,2,3],x:'本题考查影响国际贸易的因素。影响一国进口贸易的因素包括：一国的经济总量或总产出水平，汇率水平，国际市场商品的供给情况和价格水平的高低。'},
  {ch:0,q:'提出当代贸易理论的经济学家是（）。',o:["亚当·斯密", "克鲁格曼", "大卫·李嘉图"],a:1,x:'本题考查国际贸易理论的演变。美国经济学家克鲁格曼等提出了规模经济的贸易学说，来解释相似资源储备国家之间和同类工业品之间的双向贸易现象，并形成了当代贸易理论。'},
  {ch:1,q:'下列理论中，把生产资源配置或要素储备比例上的差别视为国际贸易基础的是（）。',o:["比较优势理论", "绝对优势理论", "要素禀赋理论"],a:2,x:'本题考查赫克歇尔—俄林的要素禀赋理论。赫克歇尔—俄林的要素禀赋理论认为，国际贸易的基础是生产资源配置或要素储备比例上的差别'},
  {ch:12,type:'multi',q:'关于财政收入分配职能的说法，正确的有（）。',o:["财政收入分配职能是政府调整国民收入再分配结果的职能", "财政收入分配职能是政府运用财政手段进行的", "财政收入分配职能可以通过转移支付对收入进行初次分配改变社会分配不公", "财政收入分配职能旨在实现公平收入分配的目标"],a:[0,2,3],x:'本题考查财政的基本职能。财政收入分配职能是指政府运用财政手段调整国民收入初次分配结果的职能，旨在实现公平收入分配的目标，故选项A错误。通过财政转移支付对收入进行的是再分配，故选项C错误。'},
  {ch:1,type:'multi',q:'社会主义市场经济条件下，属于财政资源配置范围的有（）。',o:["提供准公共物品和服务", "调节收入分配", "维护市场竞争", "矫正外部效应"],a:[0,2,3],x:'本题考查财政的基本职能。根据政府职能的范围，财政资源配置范围应当是市场失灵而又为社会公共需要的公共物品和服务。包括：（1）满足政府行使职能的需要，包括政府机关的正常运转和行使社会公共服务的领域，如国家安全支出、一般公共服务支出；（2）市场不能有效提供而社会又需要的准公共物品和服务的开支，如公共卫生、科技、公共工程；（3）对社会资源配置的引导支出，如矫正外部效应，维护市场竞争。'},
  {ch:6,q:'关于公共物品生产的说法，正确的是（）。',o:["政府生产和合同外包是两种典型的公共物品生产方式", "合同外包中，私人签约者一定是营利性机构", "特许经营不属于公共物品的生产方式"],a:0,x:'本题考查公共物品的融资和生产。在合同外包中，私人签约者可能是营利性机构，也可能是非营利性机构，不论其性质如何，合同外包都是公共服务提供私有化的表现（选项B错误）。其他介于政府生产和合同外包之间的公共物品供给方式还包括特许经营、合同委托等（选项C错误）。服务供给主体也不仅限于政府和私人企业，还包括社会组织、慈善机构、事业单位等（选项D错误）。'},
  {ch:0,type:'multi',q:'市场并不总是有效率的，政府经济活动范围主要集中在（）。',o:["保证绝对公平", "调节收入分配", "维持有效竞争", "矫正外部性"],a:[0,1,2,3],x:'本题考查政府经济活动范围。政府经济活动范围应主要集中在以下几个方面：提供公共物品或服务、矫正外部性、维持有效竞争、调节收入分配、稳定经济。',flag:'答案存疑：政府经济活动范围不含“保证绝对公平”，疑为BCD，建议对照教材核实'},
  {ch:10,type:'multi',q:'下列由政府实行的进出口贸易干预措施中，不属于非关税壁垒的有（）。',o:["出口信贷", "反倾销税", "歧视性公共采购", "出口补贴"],a:[0, 1, 3],x:'本题考查政府对国际贸易干预的目的。非关税壁垒是指采用关税以外的手段对外国商品进口设置障碍的各种措施。如进口配额制、自愿出口限制、歧视性公共采购、技术标准和卫生检疫标准等。（2012年试题）(2018年试题）'},
  {ch:10,type:'multi',q:'下列政府对进口贸易的干预措施中，属于非关税壁垒的有（）。',o:["出口配额", "直接补贴", "自愿出口限制", "歧视性公共采购"],a:[1,2,3],x:'本题考查非关税壁垒。非关税壁垒措施包括进口配额制、自愿出口限制、歧视性公共采购、技术标准和公共卫生检疫标准等。（2011年试题）'},
  {ch:0,type:'multi',q:'政府对出口贸易进行干预的主要措施包括（）。',o:["直接补贴", "出口退税", "技术标准", "出口信贷"],a:[0, 1, 3],x:'本题考查政府对进出口贸易的干预措施。政府干预出口贸易刺激出口增加的主要措施是出口补贴。出口补贴分为直接补贴和间接补贴。直接补贴是政府直接以现金形式弥补出口企业国际市场价格与本国国内市场价格的差价。间接补贴是对出口企业在出口商品时给予财政上的优惠待遇，如出口退税和出口信贷等。C、E项属于政府对进口贸易进行干预的主要措施'},
  {ch:0,q:'关于财政行使经济稳定和发展职能的说法，正确的是（）。',o:["财政行使经济稳定与发展职能，等于财政要直接操纵经济运行", "财政行使经济稳定和发展职能的目标中包括汇率稳定", "财政行使经济稳定和发展职能，重点是对社会资源在私人部门和政府部门之间进行配置"],a:2,x:'本题考查财政的基本职能。财政行使经济发展职能的意义，不仅仅是要促进经济增长，还要在促进经济增长的同时带来经济结构的改善、经济增长质量的提高和社会事业的进步。经济稳定和经济增长是相互统一的概念，经济发展要建立在经济稳定的基础上，经济稳定要以经济发展为前提。（2021年试题）'},
  {ch:6,q:'公共物品的融资包括政府融资、私人融资和联合融资，政府融资的缺点是难以满足社会成员对公共物品的（）。',o:["排他性需求", "规模化需求", "竞争性需求"],a:2,x:'本题考查公共物品的融资和生产。由于公共物品存在消费上的非排他性，理性的个人倾向于由他人付费，而自己坐享其成，这就是“免费搭车”。“免费搭车”问题使公共物品市场融资机制失灵，因此由传统的公共物品理论引申出来的结论是，政府应作为公共物品供给的资金提供者，以强制税收的形式为公共物品融资。政府融资的缺点是难以满足社会成员对公共物品的多样化需求。故选D选项。（2021年试题）'},
  {ch:6,q:'某种公共物品一旦被提供，增加一个人消费的边际供给成本为零，这说明该公共物品具有（）的特征。',o:["非排他性", "经济性", "公平性"],a:2,x:'本题考查公共物品的特征。非竞争性是指某种公共物品一旦被提供，增加一个人的消费并不增加任何额外成本，也就是增加一个人消费的边际供给成本为零。'},
  {ch:0,q:'市场经济条件下进行初次分配时，其实现的条件是（）。',o:["生产者的垄断情况和公平的政府定价", "生产者的垄断情况和公平的市场定价", "生产要素所有者的禀赋条件和公平的政府定价"],a:2,x:'本题考查财政的收入分配职能。在市场经济条件下，初次分配是按要素所有者的禀赋条件和公平的市场定价实现的。'},
  {ch:0,type:'multi',q:'现实生活中的决策机制往往介于独裁和一致同意之间，称之为“多数决策规则”。常见的多数决策规则有（）。',o:["二轮决选制", "逆向排除法", "孔多塞规则", "博尔达计分法"],a:[0, 1, 2, 3],x:'本题考查公共物品的需求显示。常见的多数决策规则有：相对多数决策、二轮决选制、逆向排除法、博尔达计分法、孔多塞规则、赞同投票等。'},
  {ch:6,q:'关于公共物品及其特征的说法，正确的是（）。',o:["公共物品的定义由英国经济学家萨缪尔森首次提出", "非排他性是公共物品的主要特征", "非竞争性特征强调了集体提供公共物品的潜在收益"],a:2,x:'本题考查公共物品的特征。萨缪尔森是美国经济学家，选项A错误。非竞争性是公共物品的主要特征，非排他性是公共物品的派生特征，选项B错误。由于公共物品具有消费上的非竞争性，若是个人没有付费而阻止其消费，则违反了社会资源有效利用的帕累托准则，选项D错误。'},
  {ch:6,q:'某种公共物品一旦被提供，增加一个人的消费并不增加任何额外成本，也就是增加一个人消费的边际供给成本为零，这是由于公共物品具有（）。',o:["排他性", "竞争性", "非竞争性"],a:2,x:'本题考查公共物品的特征。非竞争性指的是某种公共物品一旦被提供,增加一个人的消费并不增加任何额外成本，也就是增加一个人消费的边际供给成本为零'},
  {ch:0,q:'评价行政支出项目的财政效益时，适用的分析方法是（）。',o:["最低费用选择法", "成本－效益分析法", "公共劳务收费法"],a:0,x:'本题考查财政支出效益分析的方法。最低费用选择法适用于军事、行政、文化、卫生等支出项目的经济分析。'},
  {ch:0,q:'根据公共劳务收费法，对繁华地段的机动车停车收费应采取的政策是（）。',o:["免费政策", "平价政策", "高价政策"],a:2,x:'本题考查财政支出效益分析的方法。根据公共劳务收费法，对繁华地段的机动车停车收费应采取的政策是高价政策。'},
  {ch:11,q:'下列支出项目属于政府转移性支出的是（）。',o:["社会保障支出", "国防支出", "教育支出"],a:0,x:'本题考查转移性支出。选项BCD属于购买性支出。'},
  {ch:0,type:'multi',q:'市场系统是由相互独立的（）组成的。',o:["居民", "企业", "政府", "外商"],a:[0, 1, 2],x:'本题考查市场系统。市场系统是由居民、企业和政府三个相对独立的主体组成的。'},
  {ch:0,q:'下列经济活动中不属于政府经济活动范围的是（）。',o:["生产私人物品", "调节收入分配", "矫正外部性"],a:0,x:'本题考查政府经济活动范围。政府经济活动范围应主要集中于以下几个方面：提供公共物品或服务；矫正外部性；维持有效竞争；调节收入分配；稳定经济。（2015年试题）'},
  {ch:3,q:'由政府部门采取措施来排除私人边际成本和社会边际成本以及私人边际效益和社会边际效益之间的非一致性，指的是政府经济活动范围中的（）。',o:["矫正外部性", "维持有效竞争", "调节收入分配"],a:0,x:'本题考查政府经济活动范围。政府经济活动范围应主要集中于以下几个方面：提供公共物品或服务；矫正外部性、维持有效竞争、调节收入分配、稳定经济。其中矫正外部性是指由政府部门采取措施来排除私人边际成本和社会边际成本以及私人边际效益和社会边际效益之间的非一致性。'},
  {ch:0,type:'multi',q:'政府经济活动的范围主要包括（）。',o:["提供公共物品和服务", "矫正外部性", "调节收入分配", "稳定经济"],a:[0, 1, 2, 3],x:'本题考查政府经济活动范围。政府经济活动的范围主要集中在：提供公共物品和服务、矫正外部性、维持有效竞争、调节收入分配、稳定经济'},
  {ch:11,type:'multi',q:'关于财政支出规模变化的指标，下列说法中正确的有（）。',o:["财政支出增长率反映了财政支出的增长趋势", "财政支出增长的弹性系数表明财政支出增长额与国内生产总值增长额之间的关系", "财政支出增长率表示当年财政支出比上年同期财政支出增长的百分比", "财政支出增长的边际倾向是指财政支出增长率与国内生产总值增长率之比"],a:[0,2,3],x:'本题考查财政支出规模变化的指标。财政支出增长的边际倾向表明财政支出增长额与国内生产总值增长额之间的关系，选项B说法错误。财政支出增长的弹性系数是指财政支出增长率与国内生产总值增长率之比，选项D说法错误。'},
  {ch:11,q:'2020年，我国一般公共预算收入182895亿元，同比下降3.9％；一般公共预算支出245588亿元，同比增加2.8％；全国国内生产总值达1015986亿元，同比增长2.3%。2020年我国财政支出增长的弹性系数是（）。',o:["﹣1.393", "1.217", "0.821"],a:1,x:'本题考查衡量财政支出规模变化的指标。财政支出增长的弹性系数是指财政支出增长率与国内生产总值增长率之比，用Eg表示。其计算公式为：Eg＝ΔG（％）/ΔGDP（％），根据题干，财政支出增长率ΔG（％）＝2.8％，国内生产总值增长率ΔGDP（％）＝2.3％，Eg＝2.8％/2.3％＝1.217。'},
  {ch:11,q:'购买性支出是政府为了履行其职能从（）部门购买物品与劳务而发生的费用。',o:["私人", "事业单位", "政府"],a:0,x:'本题考查财政支出及其分类。购买性支出是指政府为了履行其职能，从私人部门购买物品与劳务而发生的费用。这些物品与劳务或者被用于政府自身的消费（称为政府消费性支出），或者形成投资（称为政府投资性支出）。'},
  {ch:11,q:'财政支出规模是指财政支出总额占（）的比重。',o:["国内生产总值", "税收收入总额", "国民生产总值"],a:0,x:'本题考查财政支出及其分类。财政支出规模是指财政支出总额占国内生产总值（GDP)的比重。'},
  {ch:11,q:'2019年1～6月我国财政支出为123538亿元，2020年1～6月我国财政支出为116411亿元。则2020年1～6月我国财政支出增长率为（）。',o:["－5.77%", "－6.12%", "6.12%"],a:0,x:'本题考查衡量财政支出规模变化的指标。2020年1～6月我国财政支出增长率＝（116411－123538）/123538＝－5.77%。'},
  {ch:11,q:'按照“梯度渐进增长理论”，属于公共支出内在原因的是（）。',o:["公众可容忍税收水平的提高", "社会经历战争", "社会发生某种危机"],a:0,x:'本题考查财政支出规模增长的理论解释。公众可容忍税收水平的提高，是公共支出增长的内在原因。'},
  {ch:11,q:'下列财政支出项目中适用负荷定价的是（）。',o:["免疫防疫", "电力供应", "医疗服务"],a:1,x:'本题考查财政支出效益分析的方法。负荷定价法是指按不同时间段或时期的需求制定不同的价格，在电力、燃气、自来水、电信等行业，按需求的季节、月份、时区的高峰和非高峰的不同，系统地制定不同的价格，以平衡需求状况。公路运输、医疗服务适用平价政策，免疫防疫适用免费和低价政策'},
  {ch:0,type:'multi',q:'关于价值规律作用的说法，正确的有（）。',o:["价值规律对社会经济活动的调节能够实现社会生产和社会需要的大体平衡", "价值规律对社会经济活动的调节是一种事前调节", "价值规律作用的发挥能够促进劳动生产率的提高", "价值规律作用的发挥不会产生公平和效率的矛盾"],a:[0,2,3],x:'本题考查价值规律的作用。选项B错误，价值规律调节资源配置和经济活动，是一种事后调节。选项D错误，价值规律也不可避免地会产生公平和效率的矛盾。'},
  {ch:0,type:'multi',q:'关于价值规律的说法，正确的有（）。',o:["价值规律对生产的支配作用是通过交换表现出来的", "价值规律是商品经济的基本规律", "商品的价值量由生产商品的社会必要劳动时间来决定", "商品交换以价值量为基础"],a:[0,1,2,3],x:'本题考查价值规律及其作用。在现实生活中，价值规律对生产和交换活动的支配作用是通过价格运动表现出来的。'},
  {ch:1,q:'通常情况下，价值规律通过价格涨落对社会经济活动和资源配置的调节属于（）。',o:["事前调节", "事后调节", "阶段性调节"],a:1,x:'本题考查价值规律的作用。价值规律调节资源配置和经济活动的作用有一定的局限性，这是因为商品价格的涨落是在市场已经形成了商品供求失衡的状况下发生的，因而价值规律通过价格涨落来调节资源配置和经济活动，只能是一种事后调节，往往会伴随着资源的浪费。'},
  {ch:0,q:'商品经济的基本规律是（）。',o:["按劳分配规律", "价值规律", "供求规律"],a:1,x:'本题考查价值规律的内容和表现形式。价值规律是商品经济的基本规律。'},
  {ch:0,type:'multi',q:'价值规律的基本内容包括（）。',o:["商品交换实行等价交换", "商品交换以价值量为基础", "现实中商品交换实行不等价交换", "商品的价值量由生产商品的个别劳动时间决定"],a:[0,1,3],x:'本题考查价值规律的基本内容。价值规律的基本内容包括：商品的价值量由生产商品的社会必要劳动时间来决定；商品交换以价值量为基础，实行等价交换。'},
  {ch:9,q:'弥补财政赤字的方式中，相较而言副作用较小，不会招致无度通货膨胀的是（）。',o:["发行国债", "增加税收", "增加政府收费"],a:0,x:'本题考查政府债务的经济影响。增加税收客观上要受到经济发展的制约，而且税制变化要受立法程序约束，也会受纳税人反对，无法迅速筹集大量资金；财政向银行透支弥补赤字会引起流通中货币量增加，导致通货膨胀；比较而言，用债务形式弥补财政赤字的副作用比较小。'},
  {ch:12,q:'国债依存度是指（）。',o:["当年国债发行规模与当年财政支出的比率", "当年到期还本付息的国债总额与当年财政收入的比率", "当年国债发行规模与当年财政收入的比率"],a:0,x:'本题考查国债依存度的定义。国债依存度是指国债发行规模与当年财政支出的比率关系，即当年财政支出中有多大份额是依靠发行国债来满足的。相关推荐：2022初级经济师《经济基础知识》练习题精选汇总2022初级经济师《人力资源管理》练习题精选汇总2022初级经济师《工商管理》练习题精选汇总2022初级经济师《金融》练习题精选汇总2022初级经济师《财政税收》练习题精选汇总'},
  {ch:12,type:'multi',q:'关于地方政府债务的说法，正确的有（）。',o:["地方政府举债采取政府债券方式", "地方政府举借债务的规模由省级人民代表大会批准", "地方政府债务可以通过企事业单位举借", "各省政府可以自行决定举借债务，无须国务院批准"],a:[0,3],x:'本题考查加强政府性债务管理。经国务院批准，省、自治区、直辖市政府可以适度举借债务，选项D错误；市县级政府确需举借债务的，由省、自治区、直辖市政府代为举借，选项E正确。政府债务只能通过政府及其部门举借，不得通过企事业单位等举借，选项C错误。地方政府举债采取政府债券方式，选项A正确。地方政府举借债务的规模，由国务院报全国人民代表大会或其常务委员会批准，选项B错误。'},
  {ch:12,q:'关于税收基本特征的说法，正确的是（）。',o:["强制性、无偿性和固定性是税收的绝对特征", "税收的固定性表明只有征收机关可以随意变更征纳标准", "税收的无偿性反映的是一种社会产品的所有权与支配权之间的等价交换关系"],a:2,x:'本题考查税收的基本特征。强制性、无偿性和固定性是税收的基本特征，选项A错误；税收征纳双方必须按税法规定征税和纳税，双方都无权随意变更征纳标准，选项B错误；税收的无偿性是税收本质的体现，它反映的是一种社会产品所有权、支配权的单方面转移关系，而不是等价交换关系，选项C错误。',flag:'答案存疑：该题解析与备选项相互矛盾（三项均被指错），源站答案可能有误，建议核实'},
  {ch:12,q:'关于地方债务的说法，正确的是（）。',o:["地方政府举债可以用于经常性支出", "地方政府债务规模实行限额管理", "地方专项债务纳入一般公共预算管理"],a:1,x:'本题考查加强政府性债务管理。地方政府举债，只能用于公益性资本支出和适度归还存量债务，不得用于经常性支出，选项A错误。一般债务通过发行一般债券融资，纳入一般公共预算管理。专项债务通过发行专项债券融资，纳入政府性基金预算管理，选项CD错误。'},
  {ch:12,type:'multi',q:'关于税收的内涵的说法，正确的有（）。',o:["税收的征收主体是国家", "征税的过程是私人部门与国家之间的物质财富的双向转移", "国家通过税收方式取得了财政收入", "税收征收的依据是法律，凭借的是财产权力"],a:[0,2,3],x:'本题考查税收的内涵。征税的过程是物质财富从私人部门单向地、无偿地转移给国家的过程，选项B错误。税收征收的依据是法律，凭借的是政治权力，而不同财产权力，选项D错误。'},
  {ch:11,q:'关于赠与收入的说法，错误的是（）。',o:["赠与收入是政府从私人部门获得的强制性资金转移", "赠与收入可以是现金的形式", "赠与收入是对一国政府自有财政收入的补充"],a:0,x:'本题考查财政收入及其分类。赠与收入是从其他政府或国际组织那里得到的非强制性的转移。它们是对一国政府自有财政收入的补充，可以是现金或实物的形式。'},
  {ch:8,q:'拉弗曲线的基本含义提示各国政府，促进经济增长的一个重要条件是保持适度的（）。',o:["税率", "宏观税负水平", "通货膨胀"],a:1,x:'本题考查拉弗曲线。拉弗曲线的基本含义是：保持适度的宏观税负水平是促进经济增长的一个重要条件。'},
  {ch:12,type:'multi',q:'关于当前我国的宏观税负水平及其合理性评估的说法，正确的有（）。',o:["宏观税负是指国家通过各种形式，从国民经济收支环流中截取并运用的资金占国民经济总量的比重", "宏观税负也就是财政集中度", "根据预算管理模式和收入的性质，全部政府收入只包括一般预算收入、政府性基金收入、国有资本经营预算收入", "与发达国家相比，我国税收收入占GDP的比重并不低"],a:[0, 1],x:'本题考查财政集中度与宏观税负。财政集中度通俗地称为宏观税负，是指国家通过各种形式，从国民经济收支环流中截取并运用的资金占国民经济总量的比重。所以，选项AB说法正确。就我国而言，根据预算管理模式和收入的性质，全部政府收入包括财政收入（一般预算收入)、政府性基金收入、国有资本经营预算收入和社会保障预算收入。所以，选项C错误。与发达国家相比，我国税收收入占GDP的比重并不高。所以，选项D错误。但若将构成政府财政收入的非税收入、政府性基金预算收入、国有资本经营预算收入等加总计算，我国政府财政收入占GDP的比重将超过28%，并不算低。所以，选项E错误'},
  {ch:0,q:'依据房产余值计征房产税的，房产税税率为（）。',o:["1.2%", "4%", "12%"],a:0,x:'本题考查房产税的税率。从价计征的，税率为1.2%。'},
  {ch:12,q:'一直作为地方政府财政收入主要来源的税种是（）。',o:["所得税", "财产税", "消费税"],a:1,x:'本题考查财产税。在各国税收体系中，财产税一直是地方政府财政收入的主要来源。'},
  {ch:12,type:'multi',q:'下列商品中，属于消费税税目的有（）。',o:["小汽车", "高档手表", "服装", "实木地板"],a:[0,1,3],x:'本题考查消费税。消费税采取按产品列举税目的办法。我国征收消费税的消费品有烟、酒、高档化妆品、贵重首饰及珠宝玉石、鞭炮焰火、成品油、摩托车、小汽车、高尔夫球及球具、高档手表、游艇、木制一次性筷子、实木地板、电池、涂料共15类消费品。'},
  {ch:13,type:'multi',q:'我国《2022年政府收支分类科目》将政府一般公共预算收入科目分为（）。',o:["税收收入", "其他收入", "转移性收入", "非税收收入"],a:[0,2,3],x:'本题考查财政收入及其分类。我国《2022年政府收支分类科目》将政府一般公共预算收入科目分为税收收入、非税收入、债务收入和转移性收入四类。其中非税收入包括专项收入、行政事业性收费收入，罚没收入，国有资本经营收入、国有资源（资产）有偿使用收入、捐赠收入，政府住房基金收入和其他收入八款。'},
  {ch:12,q:'根据我国《2022年政府收支分类科目》，下列收入中，不属于非税收入科目的是（）。',o:["罚没收入", "政府住房基金收入", "债务收入"],a:2,x:'本题考查财政收入及其分类。我国《2022年政府收支分类科目》将政府一般公共预算收入科目分为税收收入、非税收入、债务收入和转移性收入四类。其中非税收入包括专项收入、行政事业性收费收入、罚没收入、国有资本经营收入、国有资源（资产）有偿使用收入、捐赠收入、政府住房基金收入和其他收入八款。（2021年试题）'},
  {ch:12,type:'multi',q:'国债的政策功能包括（）。',o:["弥补财政赤字", "调节货币供应量和利率", "扩大就业", "保证国际收支平衡"],a:[0,1,3],x:'本题考查国债的政策功能。国债的政策功能：弥补财政赤字、筹集建设资金、调节货币供应量和利率、调控宏观经济。（2021年试题）'},
  {ch:7,q:'假设某国2020年国债累计余额为2万亿，当年发行的国债为1.5万亿，该国2020年的GDP为30万亿，则国债负担率是（）。',o:["5%", "6.7%", "7.5%"],a:1,x:'本题考查国债负担率。国债负担率又称国民经济承受能力，是指国债累计余额占国内生产总值（GDP）的比重，即：2/30＝6.7%'},
  {ch:12,type:'multi',q:'按征税对象的不同，税收收入可以分为（）。',o:["货物和劳务税", "从价税", "从量税", "所得税"],a:[0,3],x:'本题考查税收的分类。税收收入按征税对象的不同分为货物和劳务税、所得税、财产税、资源税和行为目的税。'},
  {ch:0,type:'multi',q:'下列属于财产税类的有（）。',o:["关税", "车船税", "消费税", "房产税"],a:[0,2,3],x:'本题考查税收的分类。财产税类包括房产税、契税、车船税。选项AC属于货物和劳务税。'},
  {ch:12,q:'增值税纳税人包括在中华人民共和国境内销售货物或者提供劳务加工，修理修配劳务，销售服务，无形资产或者不动产，以及（）。',o:["进口货物和服务的单位和个人", "进口货物的单位", "进口货物的单位和个人"],a:2,x:'本题考查增值税纳税人。凡在中华人民共和国境内销售货物或者提供加工、修理修配劳务，销售服务、无形资产或者不动产，以及进口货物的单位和个人，为增值税的纳税人。（2017年试题）'},
  {ch:12,type:'multi',q:'增值税的优点有（）。',o:["能够平衡税负，促进公平竞争", "便于对出口商品退税", "税负不易转嫁", "在组织财政收入上具有稳定性和及时性"],a:[0,1,3],x:'本题考查增值税。增值税的优点包括：能够平衡税负，促进公平竞争；既便于对出口商品退税，又可避免对进口商品征税不足；在组织财政收入上具有稳定性和及时性；在税收征管上可以互相制约，交叉审计。（2017年试题）'},
  {ch:12,q:'在增值税的类型中，（）增值税是一种体现鼓励投资政策的增值税。',o:["“收入型”", "“生产型”", "“消费型”"],a:2,x:'本题考查增值税的分类。“消费型”增值税是一种体现鼓励投资政策的增值税。'},
  {ch:12,q:'我国现行增值税的基本税率是（）。',o:["4%", "6%", "9%"],a:2,x:'本题考查增值税。我国现行增值税的基本税率是13%。'},
  {ch:0,q:'从价计征房产税的计税依据是（）。',o:["房产原值", "租金价值", "市场价格"],a:2,x:'本题考查房产税的计税依据。从价计征的房产税，是以房产余值为计税依据'},
  {ch:12,q:'下列说法中，符合契税纳税义务发生时间规定的是（）。',o:["纳税人接收土地、房屋的当日", "纳税人支付土地、房屋款项的当日", "纳税人办理土地、房屋权属证书的当日"],a:2,x:'本题考查契税的征收管理。契税的纳税义务发生时间，为纳税人签订土地、房屋权属转移合同的当日，或者纳税人取得其他具有土地、房屋权属转移合同性质凭证的当日。'},
  {ch:0,q:'关于扣缴义务人的说法，正确的是（）。',o:["自然人不能成为扣缴义务人", "各种类型的企业都可以成为扣缴义务人", "扣缴义务人的扣缴义务属于非法定义务"],a:1,x:'本题考查税制要素。扣缴义务人是指法律、行政法规规定负有代扣代缴、代收代缴税款义务的单位和个人。扣缴义务人既可以是各种类型的企业，也可以是机关、社会团体、民办非企业单位、部队、学校和其他单位，或者是个体工商户、个人合伙经营者和其他自然人。扣缴义务人既非纯粹意义上的纳税人，又非实际负担税款的负税人，只是负有代为扣税并缴纳税款法定职责的义务人。它的义务由法律基于行政便宜主义而设定，为法定义务。（2017年试题）'},
  {ch:0,q:'下列税制要素中，用于区分不同税种的主要标志是（）。',o:["税率", "税目", "税源"],a:2,x:'本题考查税制要素。课税对象也称作“征税客体”，即税法规定的征税目的物，它是不同税种相互区别的主要标志。'},
  {ch:0,q:'税法规定的征税的目的物即（）。',o:["税率", "纳税主体", "课税对象"],a:2,x:'本题考查税制要素。课税对象，即征税客体，是指税法规定的征税的目的物。'},
  {ch:12,q:'国家对销售自行开发、取得、自建的不动产以及不动产经营租赁服务，按照（）的征收率计征增值税。',o:["5%", "3%", "13%"],a:0,x:'本题考查增值税的征收率。对销售自行开发、取得、自建的不动产以及不动产经营租赁服务，按照5%的征收率计征增值税。'},
  {ch:12,q:'税收按计量课税对象的标准不同，分为（）。',o:["价内税和价外税", "直接税和间接税", "从价税和从量税"],a:2,x:'本题考查税收的分类。税收按计量课税对象的标准不同，分为从价税和从量税。'},
  {ch:0,q:'下列税种中，属于货物和劳务税的是（）。',o:["契税", "关税", "房产税"],a:1,x:'本题考查税收的分类。货物和劳务税包括增值税、消费税、关税等。选项AC属于财产税'},
  {ch:13,type:'multi',q:'我国政府预算体系包括（）。',o:["税收支出预算", "社会保险基金预算", "一般公共预算", "政府性基金预算"],a:[1,2,3],x:'本题考查我国的政府预算体系。我国完整的政府预算体系包括一般公共预算、政府性基金预算、国有资本经营预算和社会保险基金预算。',flag:'源站答案疑似错误：我国政府预算体系不含“税收支出预算”；正确为BCD'},

  {ch:0,q:'为了弥补财政实力薄弱地区的财力缺口，均衡地区间财力差距，实现地区间基本公共服务能力的均等化，中央财政安排给地方财政的补助支出由地方统筹安排属于（）。',o:["横向转移支付", "专项转移支付", "其他转移支付"],a:2,x:'本题考查我国现行的财政转移支付制度。一般性转移支付是指为弥补财政实力薄弱地区的财力缺口，均衡地区间财力差距，实现地区间基本公共服务能力的均等化，中央财政安排给地方财政的补助支出，由地方统筹安排。'},
  {ch:25,q:'将一些流动性较强的收入，作为中央政府收入，划分的原则是（）。',o:["效率原则", "集权原则", "收益与负担对等原则"],a:0,x:'本题考查财政管理体制的内容。效率原则：将一些流动性较强的收入，作为中央政府收入；将一些流动性不强的收入（如以土地为课税对象的收入）、地方政府比较了解税基等基本信息的相对稳定的收入，划归地方政府，既易于操作，征税效率也比较高。'},
