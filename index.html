  {ch:3,type:'single',q:'无效宣告程序中，对专利文件的修改说法正确的()',o:["实用新型可以修改说明书", "发明专利仅可以修改权利要求书，可以补入仅在说明书中记载但未在权利要求中记载的技术特征", "发明专利仅可以修改权利要求书，不得改变原权利要求的主题名称", "外观设计可以修改图片或照片"],a:2,x:'无效宣告请求程序中专利文件的修改规则主要体现在以下两个方面。(1)发明或者实用新型专利文件的修改仅限于权利要求书， 且应当针对无效宣告理由或者合议组指出的缺陷进行修改。 外观设计专利文件不得修改。(2)权利要求的修改有四个“不得” ： ①不得改变原权利要求的主题名称; ②与授权的权利要求相比， 不得扩大原权利要求的保护范围; ③一般不得增加未包含在授权的权利要求书中的技术特征; ④不得超出原说明书和权利要求书记载的范围。 第四个“不得” 是在所有程序中修改专利申请或者专利文件的限制要求， 即同样适用于无效宣告请求程序。'},
  {ch:3,type:'multi',q:'下列关于无效宣告请求程序中专利文件修改规则的说法正确的有（）。',o:["发明或者实用新型专利在无效宣告请求程序中，可以对说明书进行修改", "在面临无效宣告请求时，不允许对外观设计专利文件进行任何修改", "在无效宣告请求程序中修改权利要求时，可以改变原权利要求的主题名称，以便更清晰地描述技术方案", "在无效宣告请求程序中修改权利要求时，添加的技术特征必须已经在原始的权利要求书中有所记载", "为增强专利的商业价值，在无效宣告请求程序中修改权利要求时可以适当扩大其保护范围"],a:[1, 3],x:'无效宣告请求程序中专利文件的修改规则主要体现在以下两个方面。 (1)发明或者实用新型专利文件的修改仅限于权利要求书，且应当针对无效宣告理由或者合议组指出的缺陷进行修改。外观设计专利文件不得修改（B选项正确）。 (2)权利要求的修改不得改变原权利要求的主题名称、不得扩大原权利要求的保护范围、一般不得增加未包含在授权的权利要求书中的技术特征（D选项正确）、不得超出原说明书和权利要求书记载的范围。 A选项错误：发明或者实用新型专利在无效宣告请求程序中，只能对权利要求书进行修改，不能修改说明书。 C选项错误：在无效宣告请求程序中修改权利要求时，不得改变原权利要求的主题名称。 E选项错误：在无效宣告请求程序中修改权利要求时，不得扩大原权利要求的保护范围。 BD选项正确。'},
  {ch:3,type:'multi',q:'张三针对李四的某项实用新型专利权向专利局复审和无效审理部提出无效宣告请求。李四对其专利文件进行修改，以下关于无效宣告请求程序中专利文件的修改规则，表述正确的是(  )。',o:["李四对专利文件的修改仅限于说明书的内容", "李四不得改变原权利要求的主题名称", "李四的专利文件修改与授权的权利要求相比，不得扩大原专利的保护范围", "李四的专利文件修改不得超出原说明书和权利要求书记载的范围", "李四的专利文件修改一般不得增加未包含在授权的权利要求书中的技术特征"],a:[1, 2, 3, 4],x:'发明或者实用新型专利文件的修改仅限于权利要求书（A选项错误）。其中关于权利要求的修改有四个“不得”：①不得改变原权利要求的主题名称（B选项正确）；②与授权的权利要求相比，不得扩大原专利的保护范围（C选项正确）；③一般不得增加未包含在授权的权利要求书中的技术特征（E选项正确）；④修改不得超出原说明书和权利要求书记载的范围（D选项正确）。这是在所有程序中修改专利申请或者专利文件时的限制要求，对无效宣告请求程序也不例外。故选BCDE。'},
  {ch:3,type:'multi',q:'下列情形中，属于无效宣告请求程序中可依职权审查的有（）。',o:["专利权的取得明显违背诚实信用原则的", "无效请求人未提及的独立权利要求的创造性问题", "独立权利要求明显不属于专利保护客体", "权利要求中的某技术手段属于公知常识", "两项独立权利要求不具备单一性"],a:[0, 1, 2, 3],x:'(1)为提高专利审查质量与效率，必要时，在无效宣告请求审查程序中可以依职权对请求人未提出的理由主动进行审查，包括但不限于：①专利权的取得明显违背诚实信用原则的，相关案件合议组可以引入《专利法实施细则》第十一条的无效宣告理由进行审查；②专利权存在请求人未提及的明显不属于专利保护客体缺陷的，相关案件合议组可以引入相关的无效宣告请求的理由进行审查；③专利权存在请求人未提及的缺陷而导致无法针对请求人提出的无效宣告请求的理由进行审查的，相关案件合议组可以依职权针对专利权的上述缺陷引入相关无效宣告请求的理由并进行审查；④无效宣告请求审查中合议组可以依职权认定技术手段是否为公知常识，并可以引入技术词典、技术手册和教科书等所属技术领域中的公知常识性证据。(2)不具备单一性可以作为发明专利申请实质审查的驳回理由或实用新型、外观设计初步审查的驳回理由，但不是法定的宣告专利权无效的理由。 中级经济师'},
  {ch:12,type:'single',q:'外观设计国际申请的注册机构是（）。',o:["受理局", "国际局", "缔约方相关机构", "审查机构"],a:1,x:'根据《海牙协定》,外观设计国际申请只能向国际局提交，提交的方式可以是直接提交给国际局，也可以是通过申请人的缔约方相关机构，如我国国家知识产权局提交给国际局。需要注意的是，缔约方相关机构仅仅行使转送职能而不行使注册审查职能。故B选项正确。ACD为干扰选项。'},
  {ch:12,type:'single',q:'关于外观设计国际申请，下列说法正确的是：',o:["在PCT中有所规定", "只能向国际局提交申请", "申请人的缔约方相关机构对该申请进行注册审查", "与外观设计本国优先权一样，公布于授权之后"],a:1,x:'A选项错误，由于外观设计在许多国家并未纳入专利保护体系，因此PCT所规定的类别中没有包括工业品外观设计，外观设计国际申请便作为一个独立的类别被规定了《海牙协定》中。 B选项正确，C选项错误，根据《海牙协定》,外观设计国际申请只能向国际局提交，提交的方式可以是直接提交给国际局，也可以是通过申请人的缔约方相关机构，如我国国家知识产权局提交给国际局。需要注意的是，缔约方相关机构仅仅行使转送职能而不行使注册审查职能。 D选项错误，注册后，国际局将公布国际注册。这意味着外观设计国际申请可能公布于授权之前，而我国外观设计专利均公布于授权后。这是外观设计国际申请与本国申请在公布程序上的差别。'},
  {ch:12,type:'single',q:'外观设计国际申请是依据（）进行注册的。',o:["《专利合作条约》", "《海牙协定》", "《TRIPs协定》", "《马德里协定》"],a:1,x:'外观设计国际申请是指按照《海牙协定》注册，并指定中国的外观设计国际申请。由于外观设计在许多国家并未被纳入专利保护体系，因此《专利合作条约》所规定的保护类别中没有包括工业品外观设计，外观设计国际申请便作为一个独立的类别被规定在《海牙协定》中。'},
  {ch:12,type:'multi',q:'下列关于国际申请的检索说法正确的有（）。',o:["国际检索是国际申请必经的程序", "国家知识产权局的专利审查机构不属于指定的国际检索单位之一", "说明书不清楚，无法确定申请的主题，国际检索单位可以不进行检索", "国际检索单位根据检索结果制作国际检索报告，并同时对专利国际申请是否具有新颖性、创造性和实用性等问题给出书面意见", "有检索报告的，公布国际检索报告；根据规定未进行检索的，也会公布不进行检索的书面意见"],a:[0, 2, 3, 4],x:'国际检索单位是由世界知识产权组织指定并签订有关履行检索职责的国家局或地区局。我国国家知识产权局的专利审查机构也是上述指定的国际检索单位之一。'},
  {ch:12,type:'multi',q:'下列关于国际申请的受理程序说法正确的有（）。',o:["申请人向世界知识产权组织国际局提交符合规定格式的申请文件及相关文件需要指定要求获得专利保护的国家", "申请人向世界知识产权组织国际局提交符合规定格式的申请文件及相关文件需要明确在哪些国家要求优先权", "国际受理局对申请进行实质审查", "受理通过后，将形成三份国际申请文本：其中“受理本”由国际受理局保存、“登记本”需提交国际局", "“受理本”被视为国际申请的正本，国际局据此在申请日之后十二个月后迅速公布专利国际申请"],a:[0, 1, 3],x:'(1)提交申请文件。申请人向国际受理局或国际局(世界知识产权组织国际局)提交符合规定格式的申请文件及相关文件，并按照规定缴纳申请费。与在国家局提交申请要求的最大不同是：①需要指定要求获得专利保护的国家(指定国);②需要明确在哪些国家要求优先权。其他要求则与国内申请受理要求大致相同。(2)国际受理局对申请进行形式上的审查。审查规则与国内申请受理审查原则大致相同。(3)形成国际申请文本。受理通过后，将形成三份国际申请文本：一份为“受理本”,由国际受理局保存；一份为“登记本”,需提交国际局；还有一份为“检索本”,需送交国际检索单位。其中，“登记本”被视为国际申请的正本，国际局据此在申请日之后十八个月后迅速公布专利国际申请。'},
  {ch:12,type:'multi',q:'国际专利申请为申请人提供的最大优惠体现在受理程序中的五个“一”,其包括（）。',o:["一个受理局", "一种语言", "一份申请文件", "一笔申请费", "一家专利代理机构"],a:[0, 1, 2, 3],x:'《专利合作条约》为申请人提供的最大优惠体现在国际申请的受理程序上，具体可概括为五个“一”:第一个“一”是一个受理局；第二个“一”是一种语言；第三个“一”是一份申请文件；第四个“一”是一笔申请费；第五个“一”是一个国际申请日。 中级经济师'},
  {ch:4,type:'single',q:'关于专利权保护范围确定的原则，以下说法正确的是（）',o:["中心限定原则是严格以权利要求书的文字记载为依据，不允许对权利要求作任何其他扩展", "周边限定原则是并不拘泥于权利要求书的文字记载", "国家知识产权局在确定保护范围的时候，可以适用折衷原则或中心限定原则或周边限定原则", "折衷原则是既要以权利要求为依据，但又不完全局限于权利要求书的文字记载，而是根据说明书及附图对现有技术所做的贡献合理确定保护范围"],a:3,x:'A. 中心限定原则并不严格以权利要求书的文字记载为依据，而是将权利要求书作为保护范围的中心，全面考虑发明创造的目的、性质以及说明书和附图，把中心周围一定范围内的技术特征或技术方案都纳入专利权的保护范围。因此，A选项是错误的。 B. 周边限定原则是指在确定专利权的保护范围时，严格以权利要求书的文字记载为依据，不允许对权利要求作任何其他扩展解释。因此，B选项是错误的。 C. 目前，全球主要国家（包括中国）都采用折衷原则来确定专利权的保护范围。实践中，我国管理专利工作的部门和人民法院都将折衷原则列为确定专利权保护范围的解释原则之一。因此，C选项是错误的。 D. 折衷原则确实是在确定专利权的保护范围时，既以权利要求书为依据，但又不完全局限于权利要求书的文字记载，而是根据说明书及附图、现有技术、专利对现有技术所作的贡献等因素合理确定专利权的保护范围。因此，D选项是正确的。'},
  {ch:4,type:'single',q:'下列选项中属于确定专利保护范围折衷原则内容的是(  )。',o:["不拘泥于权利要求书中的文字记载，而是将权利要求书作为保护范围的中心", "全面考虑发明的目的、性质以及说明书和附图，把中心周围一定范围内的技术特征或技术方案都纳入专利权的保护范围", "根据说明书及附图、现有技术、专利对现有技术所做的贡献等因素合理确定专利权的保护范围", "严格以权利要求书的文字记载为唯一依据，不允许对权利要求作任何其他扩展解释"],a:2,x:'折衷原则是指在确定专利权的保护范围时，既以权利要求书为依据，但又不完全局限于权利要求书的文字记载，而是根据说明书及附图、现有技术、专利对现有技术所做的贡献等因素合理确定专利权的保护范围（C选项正确）。 A、B选项属于中心限定原则的内容，D选项属于周边限定原则的内容。故选C选项。'},
  {ch:4,type:'single',q:'某公司拥有一款 “折叠式自行车” 的外观设计专利，简要说明中记载该自行车用途为 “城市通勤”，产品名称为 “便捷城市通勤折叠自行车”。丙公司生产了一款外观相似的折叠自行车，但其宣传用途为 “山地骑行”。在判断丙公司是否侵犯该公司外观设计专利权时，首先应确定（  ）',o:["两款自行车外观是否完全一致", "丙公司自行车的销售价格", "两款自行车是否属于同类产品", "丙公司是否存在主观故意"],a:2,x:'外观设计专利权所保护的 “表示在图片或者照片中的该产品的外观设计” 的范围，应当是同类产品外观设计的范围。简要说明中记载的产品名称和产品用途是确定外观设计产品种类的依据。本题中，首先应依据产品用途等确定两款自行车是否属于同类产品，若不属于同类产品，即使外观设计相同，也不能认为丙公司侵犯了专利权。所以 C 选项正确。ABD为干扰选项。'},
  {ch:4,type:'multi',q:'下列关于我国专利权期限补偿制度的说法，正确的有（ ）。',o:["我国的专利权期限补偿制度，适用的情形包括补偿发明专利在授权过程中的不合理延迟", "我国的专利权期限补偿制度，适用的情形包括补偿新药上市审评审批占用的时间", "补偿期限按照发明专利在授权过程中不合理延迟的实际天数计算", "发明专利在授权过程中不合理延迟的实际天数，是指自发明专利申请日起满四年且自实质审查请求之日起满三年之日至公告授予专利权之日的间隔天数，减去合理延迟的天数和由申请人引起的不合理延迟的天数", "某新药同时存在多项专利的，专利权人可以请求对各专利给予专利权期限补偿；一项专利同时涉及多个新药的，可以对多个新药就该专利提出专利权期限补偿请求"],a:[0, 1, 2, 3],x:'2020年，《专利法》第四次修正后也增加了专利权期限补偿制度。我国的专利权期限补偿制度，适用的情形为两种：①补偿发明专利在授权过程中的不合理延迟（A选项正确）；②补偿新药上市审评审批占用的时间（B选项正确）。 2023年，新修改的《专利法实施细则》增加了专利权期限补偿专章。依据《专利法》相关规定，明确提出专利权期限补偿请求的条件和时间要求、补偿期限计算方式以及补偿范围等。专利权人应当自公告授予专利权之日起三个月内向国家知识产权局提出。补偿期限按照发明专利在授权过程中不合理延迟的实际天数计算（C选项正确）。发明专利在授权过程中不合理延迟的实际天数，是指自发明专利申请日起满四年且自实质审查请求之日起满三年之日至公告授予专利权之日的间隔天数，减去合理延迟的天数和由申请人引起的不合理延迟的天数（D选项正确）。 E选项错误，如该新药同时存在多项专利的，专利权人只能请求对其中一项专利给予专利权期限补偿；一项专利同时涉及多个新药的，只能对一个新药就该专利提出专利权期限补偿请求。 故选ABCD。'},
  {ch:4,type:'multi',q:'确定专利权的保护范围，是进行专利侵权判定的前提，如何确定专利权的保护范围至关重要。确定专利权保护范围的原则有（    ）。',o:["中心限定原则", "合理限定原则", "周边限定原则", "折衷原则", "综合限定原则"],a:[0, 2, 3],x:'长期以来，在确定专利权的保护范围方面形成了三种代表性的原则，分别是中心限定原则、周边限定原则和折衷原则。故ACD选项正确，BE为干扰选项。'},
  {ch:4,type:'multi',q:'《专利法》第六十四条规定，发明或者实用新型专利权的保护范围以其权利要求的内容为准。下列属于“以权利要求的内容为准”内容的有（    ）。',o:["以国家知识产权局公告授权的专利文本或者已经发生法律效力的无效宣告请求审查决定及相关的确权行政判决所确定的权利要求为准", "根据权利要求的内容来确定，而不能背离权利要求的内容", "只要在说明书或者附图中描述到的技术方案，均纳入发明或者实用新型专利权的保护范围", "发明或者实用新型专利权的保护范围仅仅包括权利要求记载的技术特征所确定的内容", "如果权利要求与专利说明书出现不一致或者相互矛盾，在专利权未被无效宣告请求程序宣告无效的情况下，应当按照专利权有效原则，以权利要求的字面含义所确定的保护范围为准"],a:[0, 1, 4],x:'以权利要求的内容为准包含以下五层含义。 (1)确定发明或者实用新型专利权的保护范围时，应当以国家知识产权局公告授权的专利文本或者已经发生法律效力的无效宣告请求审查决定及相关的确权行政判决所确定的权利要求为准（A选项正确）。权利要求存在多个文本的，以最终有效的文本为准。 (2)发明或者实用新型专利权的保护范围应当根据权利要求的内容来确定，而不能背离权利要求的内容（B选项正确）。既不能将专利权的保护范围严格限定为权利要求的字面含义，只将说明书及附图用于解释权利要求中含糊不清之处；也不能认为权利要求只是确定了一个总的发明构思，其仅具有指导作用，而将专利权的保护范围扩展到所属领域的技术人员在专利申请日前通过阅读说明书及附图所能理解的更大范围上。 (3)仅在说明书或者附图中描述而未被概括到权利要求中的技术方案，视为专利权人放弃了对该技术方案的保护，不应纳入发明或者实用新型专利权的保护范围（C选项错误）。 (4)发明或者实用新型专利权的保护范围既包括权利要求记载的技术特征所确定的内容，也包括与权利要求记载的技术特征等同的技术特征所确定的内容（D选项错误）。 (5)如果权利要求与专利说明书不一致或者'},
  {ch:4,type:'single',q:'下列关于专利仲裁的说法错误的是（）。',o:["专利仲裁是一种社会救济途径", "专利仲裁是一种私力救济途径", "如果争议发生时双方当事人未形成仲裁协议，则当事人不得再选择专利仲裁方式解决纷争", "专利仲裁结果不具有可诉性"],a:2,x:'仲裁是指争议双方在争议发生前或争议发生后达成协议，自愿将争议交给第三者作出裁决，双方有义务执行的一种解决争议的方法。仲裁是一种最主要的社会救济途径。公力救济途径包括行政保护或司法诉讼；私力救济途径包括和解、调解以及仲裁等。仲裁的本意是指在双方争执不决时，由第三者进行居中调解，作出裁决，仲裁协议可以在纠纷发生之后订立。专利仲裁实行一裁终局制，不像专利诉讼实行两审终审制。'},
  {ch:4,type:'single',q:'专利仲裁是专利纠纷多元解决机制的重要一环，下列关于专利仲裁说法不正确的是  （    ）。',o:["专利仲裁是一种最主要的社会救济途径", "专利仲裁是一种私力救济途径", "如果争议发生时当事人双方未形成仲裁协议，则当事人再也不能选择专利仲裁方式解决纷争", "我国专利仲裁的受案范围日益扩大，社会影响力逐渐增强"],a:2,x:'仲裁是指争议双方在争议发生前或争议发生后达成协议，自愿将争议交给第三者作出裁决的一种纠纷解决方式。仲裁是一种最主要的社会救济途径，属于私力救济范畴。我国的仲裁制度经历了从无到有，受案范围逐渐扩大，社会影响力逐渐增强的过程。'},
  {ch:4,type:'multi',q:'下列关于专利侵权纠纷可以适用仲裁的原因说法正确的有（）。',o:["由于专利侵权纠纷属于平等主体之间的财产权益纠纷，因此专利侵权纠纷属于可仲裁的范围", "由于专利侵权纠纷作为民事侵权纠纷的一种类型也具备了民事侵权纠纷的一般性特点，因此属于可仲裁的范围", "由于专利侵权责任属于民法意义上“债”的纠纷解决范畴，因此关于“债”的纠纷本质上也可以通过仲裁解决", "由于专利侵权纠纷处理难度较大，因此可以通过仲裁解决", "专利侵权纠纷需要通过仲裁裁决后才能进行司法审查"],a:[0, 1, 2],x:'仲裁法并不排除专利侵权纠纷可以适用仲裁，其主要原因为：①专利权属于当事人可以行使处分权的权利，而平等主体间可以自由处分的权益一直属于可仲裁的范围，由于专利侵权纠纷属于平等主体之间的财产权益纠纷，因此专利侵权纠纷属于仲裁法规定的可仲裁的范围；②我国的民事侵权纠纷属于可仲裁的范围，在专业性强的领域往往更多地依靠仲裁来解决纠纷，由于专利侵权纠纷作为民事侵权纠纷的一种类型也具备了民事侵权纠纷的一般性特点，因此也属于可仲裁的范围；③专利侵权责任包括停止侵权、赔偿损失、消除影响等，这些责任属于民法意义上“债”的纠纷解决范畴，关于“债”的纠纷本质上也可以通过仲裁解决。'},
  {ch:4,type:'multi',q:'在专利诉讼中，以下关于收集证据的做法正确的有（）。',o:["原告因避免直接到生产厂家购买涉嫌侵权的产品", "原告可以请求法院采取证据保全措施以获得对方生产销售数额的证据", "由于销售发票并没有对产品的形状或技术特征进行具体描述，对宣告他人专利无效没有作用", "被告应找到自己在先使用的有效证据", "对于被告来说，应收集可以认定原告专利无效的证据"],a:[1, 3, 4],x:'收集证据的要点：(1)对于原告来说，最重要的是收集侵权的证据。在收集侵权证据时，购买到侵权产品固然重要，但由于有些侵权产品本身就是假冒他人的产品，产品上所标明的生产厂家并不一定是真正的侵权厂家，因此最好直接到生产厂家去购买涉嫌侵权的产品，必要时可以采取公证取证。原告在取证工作中最难的是获知对方生产销售的数额，此时，可以请求人民法院采取证据保全措施，以获得这方面的证据。获得侵权产品与侵权数额的证据是原告胜诉的关键。(2)对于被告来说，关键是收集一切可以认定原告专利无效的证据，这些证据包括专利文献、销售发票、产品广告、公开使用证明等。虽然销售发票可以作为宣告他人专利无效的证据，但由于发票并没有对产品的形状或技术特征进行具体描述，因此仅凭发票不足以对原告专利构成威胁。找到足以对原告专利构成威胁的证据是被告胜诉的关键点之一。此外，被告若能找到证明自己在先使用的有效证据或使用的是自由公知技术的证据，都有可能在诉讼中占据主动地位。'},
  {ch:4,type:'multi',q:'关于专利侵权损害赔偿评估，下列说法正确的是：',o:["评估系针对侵权期间内侵权行为所造成的价值影响", "评估只能由人民法院进行委托", "评估结论可作为证据使用", "评估依据、资料、数据的取得按照法定程序获取", "评估方法包括成本法、收益法"],a:[2, 3, 4],x:'专利侵权损害赔偿评估的对象是针对侵权期间及侵权后一定时期内侵权行为所造成的，对专利权实际创造或者能够创造价值的影响（A选项错误）。从内涵上来讲，专利侵权损害赔偿价值的评估是专门针对知识产权整体价值中因受损害而减少或分割的价值的评估，具有较强的法律特征。一般情况下，由人民法院或者管理专利工作的部门来进行委托（B选项错误），评估依据、资料、数据的取得按照法定程序获取（D选项正确）。专利侵权损害赔偿评估的范围或形式以人民法院或管理专利工作的部门的判决或裁决为依据，其结论具有证据效力（C选项正确）。 专利侵权损害赔偿评估方法既包括成本法、收益法和市场法等基本方法（E选项正确），也包括直接损失法、期权损失法、许可费用倍数法、完全损失法和惩罚法等专门性评估方法。 故选CDE。 中级经济师'},
  {ch:5,type:'single',q:'“为天才之火添加利益之油”的格言表明（  ）。',o:["发明创造与天才的密切关系", "很多天才申请了专利保护", "财产权对激励发明创造的作用不确定", "专利制度对激励发明创造具有积极作用"],a:3,x:'专利制度作为一种有效的制度安排，能够激励创新，从而促进经济增长。拥有创新技术、获得专利并不是目的，只有借助有效的专利运用才能形成市场竞争优势，才能发挥专利制度的创新激励作用。因此，专利运用是专利创造价值、实现价值的必由之路。题目中这句格言表明专利制度对激励发明创造具有积极作用，通过提供法律保护和经济利益来鼓励创新。故选D选项。ABC为干扰选项。'},
  {ch:5,type:'single',q:'关于专利产业化，下列说法不正确的是（）。',o:["专利产业化包括专利的自行实施", "专利产业化包括专利许可", "专利产业化包括专利交易", "专利产业化不包括转让后的他人实施"],a:3,x:'专利产业化是指将专利技术方案应用于产业实际，转化为现实形态的生产力的行为。专利的产业化既包括专利的自行实施，也包括许可、交易、转让后的他人实施。'},
  {ch:5,type:'multi',q:'专利竞争性利用的表现形式不包括（）。',o:["专利诉讼", "专利股权化", "专利证券化", "专利无效", "专利标准化"],a:[1, 2],x:'专利金融化的表现形式包括专利质押融资、专利股权化、专利证券化等。故BC选项错误，应选BC选项。 专利竞争性利用的表现形式包括专利诉讼（A选项）、专利无效（D选项）、专利联盟、专利标准化（E选项）等，其所实现的间接收益主要体现为改善行为主体的专利竞争地位，帮助其强化竞争优势、弥补竞争劣势等。'},
  {ch:5,type:'multi',q:'下列行为中，不属于专利转化运用表现形式的是（）。',o:["专利商品化", "专利竞争性利用", "专利检索", "专利分析", "专利产业化"],a:[2, 3],x:'专利转化运用包括专利产业化、专利商品化、专利金融化和专利竞争性利用等内容；专利信息利用的内容主要包括专利检索、专利分析、专利预警和专利导航等内容。'},
  {ch:5,type:'multi',q:'以下属于专利运用内容的是(  )。',o:["专利产业化", "专利商品化", "专利金融化", "专利竞争性利用", "专利申请文件撰写"],a:[0, 1, 2, 3],x:'专利运用通常有狭义和广义之分。 狭义的专利运用是指能够为行为主体实现直接收益的专利活动，其表现形式包括专利产业化、专利商品化、专利金融化等。 广义的专利运用是指能够为行为主体实现直接收益或间接收益的专利活动。 中级经济师'},
  {ch:5,type:'single',q:'下列关于专利导航的说法错误的是（  ）。',o:["区域规划类专利导航以各级地方行政区域，产业园区等经济区域内的有关部门为服务对象", "产业规划类专利导航以产业主管部门或行业机构为服务对象", "产业规划类专利导航一般需要对产业技术创新状况及面临的竞争形势进行全面分析", "创新主体类专利导航以产业集聚区内的有关部门为服务对象"],a:3,x:'创新主体类专利导航以企业和科研院所等为服务对象。'},
  {ch:5,type:'single',q:'以下关于专利导航的步骤，正确的一项是(　　)。',o:["全景分析—方向识别—定位研究—风险预判—路线图绘制", "全景分析—定位研究—方向识别—风险预判—路线图绘制", "全景分析—方向识别—风险预判—定位研究—路线图绘制", "全景分析—风险预判—定位研究—方向识别—路线图绘制"],a:0,x:'专利导航的研究方法是以专利大数据分析为依托，综合运用专利情报分析、产业竞争分析、市场价值分析手段，结合产业、技术、市场以及龙头企业知识产权战略等多维度情报研究分析，按照全景分析一方向识别一定位研究一风险预判一路线图绘制的基本思路，结合服务对象需求，全面、深入而有针对性地进行的综合性情报研究和挖掘分析的方法。'},
  {ch:5,type:'single',q:'以下关于专利布局定位分析的说法，不正确的是（    ）。',o:["常见的专利布局定位有保护式、对抗式和储备式三种", "保护式定位主要是用来防御", "对抗式定位主要是为了在海外产品布局的需求", "储备式定位着眼于未来"],a:2,x:'专利布局定位分析。由于专利布局的定位决定了专利布局的基本策略走向，是进行专利布局的基本出发点，因此专利布局需要围绕所在主体目前及未来产品、技术和专利竞争局面来进行综合判断，以确定专利布局的具体定位。专利布局定位分析的重点在于明确布局主体专利技术的对标对象、目标和方向。一般而言，常见的专利布局定位有保护式、对抗式和储备式三种（A选项正确，不选）。保护式定位主要是用于防御（B选项正确，不选），对抗式定位主要是用于应对市场竞争（C选项错误），储备式定位则着眼于未来（D选项正确，不选），题目问的是的。故选C选项。'},
  {ch:5,type:'multi',q:'下列关于专利检索策略的说法正确的有（）。',o:["块检索策略是一种基于“检全”思路的检索策略", "渐进式检索策略是一种基于“检全”思路的检索策略", "块检索策略中不同的表达方式间的关系是“与”的关系", "块检索的最大优点是表达式间的逻辑运算关系很清晰", "使用渐进式检索策略时，需要先对基本检索要素使用的先后顺序进行排序"],a:[0, 3, 4],x:'块检索策略是基于“检全”思路的检索策略。渐进式检索策略是基于“检准”思路的检索策略。对于一个检索要素，完整的块构造模式为“关键词OR分类号OR其他表达方式”:先将检索要素进行较为全面的表达，其中不同的表达方式间使用“或”运算，形成一个检索“块”;再在块与块之间使用“与”运算，获得最终的检索结果。块检索策略的最大优点是构建检索式时，同一检索要素的不同表达式之间、不同检索要素的表达式之间的逻辑运算关系都很清晰。使用渐进式检索策略时，检索者需要根据权利要求的技术方案特点对基本检索要素使用的先后顺序进行排序，然后依据这个顺序以逐层限制的方式执行每个块检索，直到将结果限制到合适的数量位置。'},
  {ch:5,type:'multi',q:'根据研究对象的不同，专利导航的主要类型可以分为（）。',o:["区域规划类专利导航", "科技政策类专利导航", "创新主体类专利导航", "产业规划类专利导航", "发展规划类专利导航"],a:[0, 2, 3],x:'根据研究对象的不同，专利导航可以分为三类，即面向区域层面开展的区域规划类专利导航、面向特定产业层面开展的产业规划类专利导航，以及面向企业和科研院所等特定创新主体开展的创新主体类专利导航。'},
  {ch:5,type:'multi',q:'下列属于专利风险应对策略的有（    ）。',o:["风险避免", "风险转移", "风险降低", "风险接受", "风险隔离"],a:[0, 2, 3],x:'总体上，专利风险应对的策略可以分为以下三种：①风险避免；②风险降低；③风险接受。故选ACD。 BE为干扰选项。 中级经济师'},
  {ch:5,type:'single',q:'许可人在允许被许可人使用或实施其知识产权的同时，仍然保留在约定的地域内使用或实施其知识产权的权利，同时许可人也可以在未经被许可人同意的情况下将其知识产权的使用权再授予被许可人之外的第三人，称为（  ）。',o:["普通许可", "强制许可", "排他许可", "指定许可"],a:0,x:'A选项正确，知识产权普通许可也称知识产权非独占性许可，是最常见的知识产权许可方式。知识产权普通许可是指通过签订知识产权普通许可合同的方式，许可人在允许被许可人使用或实施其知识产权的同时，仍然保留在约定的地域内使用或实施其知识产权的权利，同时许可人也可以在未经被许可人同意的情况下将其知识产权的使用权再授予被许可人之外的第三人。 C选项错误，知识产权排他许可是指通过签订知识产权排他许可合同的方式，许可人许可被许可人在一定条件下，并且在合同约定的时间和地域范围内，排他使用或实施其知识产权。许可人不得将其知识产权的使用权再授予被许可人之外的第三人，但是许可人本人可以自行使用或实施其知识产权。 B选项错误，强制许可，又称非自愿许可，是指国家知识产权局依据法定条件和程序，不经发明专利权人、实用新型专利权人的同意，向特定对象颁发实施其专利的许可，同时由被许可人向专利权人支付许可费的制度。 D选项错误，指定许可是指国有企业事业单位的发明专利，对国家利益或者公共利益具有重大意义的，国务院有关主管部门和省、自治区、直辖市人民政府报经国务院批准，可以决定在批准的范围内推广应用，允许指定的单位实施，由实施单位'},
  {ch:5,type:'single',q:'下列属于开放许可声明人的是()',o:["国家知识产权", "省级行政管理部门", "自然人", "专利申请人"],a:2,x:'自然人作为专利权人可以进行开放许可声明。此外，法人或其他组织也可以作为专利权人进行开放许可声明。故C选项正确。 D选项，专利申请人：只有在成为专利权人后才能进行开放许可声明，因此这个选项不完全正确。 A选项国家知识产权局是专利行政主管部门，负责专利的审查、授权、登记等行政工作，不直接享有专利权，无权作出开放许可声明（仅负责对声明进行登记和公告）。 B选项省级知识产权行政管理部门（如省知识产权局）仅负责区域内专利行政服务、执法等工作，同样不享有专利权，不属于开放许可声明主体。'},
  {ch:5,type:'single',q:'专利开放许可的声明人是谁？',o:["国家知识产权局", "专利权人", "许可人", "被许可人"],a:1,x:'专利开放许可的声明人是专利权人。根据《专利法》及其实施细则的规定，专利权人可以自愿以书面方式向国家知识产权局声明愿意许可任何单位或者个人实施其专利，并明确许可使用费支付方式和标准，从而实行开放许可。故选BXX . ACD为干扰选项。 中级经济师'},
  {ch:6,type:'single',q:'下列关于商标显著性的说法正确的是（）。',o:["商标的设计越复杂，其显著性越强", "不便于识别的商标同样具有显著性", "商标的显著性越强，其区别能力就越强", "用几何图形表述的商标更具有显著性"],a:2,x:'商标的显著性是指商标对于商品或服务来源的区别能力应当突出醒目，便于识别和记忆。区别能力强即显著性强，区别能力弱即显著性弱，完全没有区别能力则不具有显著性。故C选项正确。ABD为干扰选项。'},
  {ch:6,type:'single',q:'下列关于商标注册申请方式的说法正确的是（）。',o:["通过一份申请只能就一个类别申请注册一件商标", "通过一份申请可以就一个类别申请注册多件商标", "通过一份申请可以就多个类别申请注册一件商标", "通过一份申请可以就多个类别申请注册多件商标"],a:2,x:'《商标法》第二十二条第二款规定，商标注册申请人可以通过一份申请就多个类别的商品申请注册同一商标。故C选项正确。 ABD为干扰选项。'},
  {ch:6,type:'single',q:'下列行为中，属于“反向假冒”行为的是（    ）。',o:["销售侵犯注册商标专用权的商品的", "未经商标注册人的许可，在同一种商品上使用与其注册商标相同的商标的", "未经商标注册人的许可，在类似商品上使用与其注册商标近似的商标，容易导致混淆的", "未经商标注册人同意，更换其注册商标并将该更换商标的商品又投入市场的"],a:3,x:'“反向假冒”行为，主要是指在商品销售活动中，擅自将他人在商品上合法贴附的商标更换或者覆盖，变换为自己的商标商品予以展示或者销售的行为。'},
  {ch:6,type:'multi',q:'下列属于在核准使用的商品上正确使用注册商标的方式的有（）。',o:["采取直接贴附的方式将商标附着在商品容器上", "商标使用在与商品销售有联系的交易文书上，包括使用在商品销售合同上", "商标使用在广播、电视等媒体上，为使用商标的服务进行广告宣传", "商标直接使用于工作人员服饰上", "商标使用于服务场所的办公文具上"],a:[0, 1],x:'商标使用在指定商品上的具体表现形式有：①采取直接贴附、刻印、烙印或者编织等方式将商标附着在商品、商品包装、容器、标签等上，或者使用在商品附加标牌、产品说明书、介绍手册、价目表等上；②商标使用在与商品销售有联系的交易文书上，包括使用在商品销售合同、发票、票据、收据、商品进出口检验检疫证明、报关单据等上；③商标使用在广播、电视等媒体上，或者在公开发行的出版物中发布，以及以广告牌、邮寄广告或者其他广告方式为商标或者使用商标的商品进行的广告宣传；④商标在展览会、博览会上使用，包括在展览会、博览会上提供的使用该商标的印刷品以及其他资料；⑤其他符合法律规定的商标使用形式。商标直接使用于工作人员服饰上等属于商标使用在指定服务上的具体表现形式之一。'},
  {ch:6,type:'multi',q:'绿十字是某医药商业协会注册的集体商标。下列关于该绿十字标志使用的说法，正确的有（）。',o:["该医药商业协会的会员可以使用该集体商标", "非该医药商业协会的会员也可以使用该集体商标，但须持有药品经营许可证", "该医药商业协会的会员使用该集体商标，应经该医药商业协会的授权", "该医药商业协会可以许可非会员使用该集体商标", "使用该集体商标是为了表明使用者所提供的服务与该医药商业协会提供的服务具有相同的质量"],a:[0, 2, 4],x:'集体商标是指以团体、协会或者其他组织名义注册，供该组织成员在商事活动中使用，以表明使用者在该组织中的成员资格的标志。使用集体商标的意义在于向消费者表明其成员所生产或提供的同一商品或服务具有相同的质量和规格。集体商标不得许可非集体成员使用。 中级经济师'},
  {ch:6,type:'multi',q:'关于提出商标异议的异议人资格，正确的有(　　)。',o:["绝对理由的异议主体是任何人", "相对理由的异议主体可以是在先权利人", "异议人没有主体资格限制", "相对理由的异议主体可以是任何人", "相对理由的异议主体可以是利害关系人"],a:[0, 1, 4],x:'根据《商标法》对异议主体资格的规定，异议人因异议理由的不同可以分为两类：①绝对理由的异议主体为任何人；②相对理由的异议主体为在先权利人和利害关系人。'},
  {ch:6,type:'multi',q:'下列属于商标注册申请实质审查中禁止性条款审查的事项有（    ）。',o:["是否属于不以使用为目的的恶意商标注册申请", "申请注册的三维标志是否属于仅由商品自身的性质产生的形状", "是否属于代表人未经授权，以自己的名义申请注册被代表人的商标", "是否属于申请注册他人在先使用并有一定影响的标志", "申请注册的商标是否属于县级以上行政区划的地名"],a:[0, 1, 4],x:'商标注册申请实质审查包括禁止性条款审查、与他人在先商标相同或近似的审查。禁止性规定的审查，是审查注册申请是否违反《商标法》禁止注册或使用的规定。法律依据主要包括：《商标法》第4条(不以使用为目的的恶意商标注册申请)；第10条(不得作为商标使用的标志)；第11条(缺乏显著性的标志)；第12条(缺乏显著特征的三维标志)；第19条第四款(商标代理机构不得申请注册的商标)。与他人在先商标相同或近似的审查，是指在同一种或者类似商品（服务）上，对商标注册申请是否与已经注册的、初步审定并予以公告的或者在先申请的商标相同或者近似的审查。'},
  {ch:3,type:'single',q:'审理程序是整个商标评审程序的核心。根据《商标评审规则》,下列属于商标评审案件审理方式的是（）。',o:["独任审理", "多数裁定", "合议制度", "一审终审"],a:2,x:'根据《商标评审规则》,商标评审案件应当组成合议组进行审理。合议组由三人以上单数的商标评审人员组成。合议组审理案件，实行少数服从多数的原则。'},
  {ch:3,type:'single',q:'关于注册商标无效宣告，下列说法正确的是（    ）。',o:["注册商标是以欺骗手段取得注册的，只有利害关系人可以请求宣告无效", "注册商标是以不正当手段取得注册的，仅在先权利人或利害关系人可以请求宣告无效", "商标注册人与他人具有业务关系而明知他人商标存在，商标注册人就同一种商品或者类似商品注册的商标与该他人在先使用的未注册商标相同或者近似的，在先使用人可以请求宣告该注册商标无效", "商标注册人的注册商标与在先注册商标构成在相同或类似商品上注册相同或近似商标的，在先注册人请求宣告在后注册商标无效不受时间限制"],a:2,x:'注册商标是以欺骗手段或其他不正当手段取得注册的，任何人可以请求宣告该注册商标无效。已经注册的商标，违反《商标法》第15条(就同一种商品或者类似商品申请注册的商标与他人在先使用的未注册商标相同或者近似，申请人与该他人具有前款规定以外的合同、业务往来关系或者其他关系而明知该他人商标存在，该他人提出异议的，不予注册)的，在先权利人可请求宣告该注册商标无效。自商标注册之日起5年内，在先权利人或者利害关系人可以请求宣告该注册商标无效。'},
  {ch:3,type:'single',q:'下列不属于商标评审案件的是(  )。',o:["商标驳回复审", "不予注册复审", "无效宣告请求", "请求撤销注册商标"],a:3,x:'根据《商标法》第49条的规定，注册商标成为其核定使用的商品的通用名称或者没有正当理由连续3年不使用的，任何单位或者个人可以向商标局申请撤销该注册商标。第54条的规定，对商标局撤销或者不予撤销注册商标的决定，当事人不服的，可以自收到通知之日起15日内向商标评审委员会申请复审。因此，请求撤销注册商标的，不属于商标评审案件。'},
  {ch:3,type:'multi',q:'下列关于商标执法案件的行政复议受案范围说法正确的有（）。',o:["对商标管理部门作出的罚款决定不服，属于商标执法案件的行政复议受案范围", "对商标管理部门作出的责令限期改正的决定不服，属于商标执法案件的行政复议受案范围", "对商标管理部门作出的销毁侵权商品的决定不服，属于商标执法案件的行政复议受案范围", "对商标管理部门作出的异议不成立决定不服，属于商标执法案件的行政复议受案范围", "对商标管理部门采取的行政强制措施，如封存商标标识等不服，属于商标执法案件的行政复议受案范围"],a:[0, 1, 2, 4],x:'商标执法案件的行政复议受案范围，主要包括：对管理商标工作的部门作出的罚款，责令限期改正，销毁商品，禁止广告宣传，禁止商品销售，收缴商标标识，销毁侵权商标标识，消除现存商品上的侵权商标，收缴主要用于商标侵权的模具、印版和其他作案工具等行政处罚不服；对管理商标工作的部门采取的封存商标标识和责令封存与侵权活动有关的物品等行政强制措施不服。行政复议机关为作出行政裁决的同级人民政府或者行政裁决机关的上级机关。'},
  {ch:3,type:'multi',q:'请求宣告注册商标无效的事由，包括违反相对理由(事由)。相对理由(事由)即损害他人的在先权利或者合法利益，包括(  )。',o:["侵害他人驰名商标", "代理人抢注被代理人商标", "违反地理标志保护的规定", "在类似商品上与他人在先商标相同或者近似", "商标缺乏显著性"],a:[0, 1, 2, 3],x:'请求宣告注册商标无效的事由，包括违反绝对理由和违反相对理由。相对理由(事由)即损害他人的在先权利或者合法利益，包括可能违反了以下法律条款的规定：《商标法》第13条第二款和第三款(驰名商标保护)、第15条(防止因代理关系、代表关系或其他合同、业务关系导致商标被抢注)、第16条第一款(地理标志保护)、第30条（在同一种或者类似商品(服务)上，与已经注册或者初步审定的商标相同或者近似），第31条（在同一种或者类似商品(服务)上，与在先申请的商标相同或者近似），第32条(损害他人现有的在先权利或以不正当手段抢先注册他人已使用并有一定影响的商标)。 中级经济师'},
  {ch:6,type:'single',q:'某有限公司于2008年9月获得商标国际注册，该注册中指定了缔约方甲。2010年，该注册人希望同一商标在缔约方乙和缔约方丙也得到保护。在这种情况下，该注册人可以已获得的国际注册为基础提出（）。',o:["补充删减", "后期指定", "后期变更", "转让"],a:1,x:'B选项正确，后期指定：一个商标在国际局注册以后，想在原来的基础上增加新的指定缔约方，可以向原属局提出后期指定申请。新的指定和原国际注册共用一个国际注册号，专用期相同，方便管理。 ACD为干扰选项。'},
  {ch:6,type:'single',q:'关于马德里商标国际注册后续业务，下列说法错误的是（）。',o:["后期指定的申请人资格与商标国际注册申请相同", "后期指定的商品和服务不得超出后期指定所依据的国际注册的范围", "转让国际注册商标的应全部转让，不允许部分转让", "申请人可以选择仅在部分被指定缔约方进行续展"],a:2,x:'后期指定的申请人资格与商标国际注册申请相同，其商品和服务不得超出后期指定所依据的国际注册的范围。国际注册商标可以全部转让，也可以部分转让。申请人可以选择仅在部分被指定缔约方进行续展。'},
  {ch:6,type:'multi',q:'关于马德里体系的特点，下列描述正确的有（）。',o:["马德里体系是一个封闭体系，只在马德里联盟内部适用", "商标在马德里体系下的实质审查，适用的是马德里联盟的统一标准", "通过马德里体系，商标权利人可以直接向其本国或所属地区知识产权局递交国际注册申请书", "在马德里体系下，商标在多个国家和地区申请保护需要经过复杂的行政程序", "马德里体系下，后续管理如转让、变更、续展等比较复杂"],a:[0, 2],x:'马德里体系有以下三个特点：①只在马德里联盟内部适用；②商标保护的实质性审查仍适用被指定缔约方的国内法；③商标权利人直接向其本国或所属地区知识产权局递交一份国际注册申请书，便能够使其商标在马德里联盟内的多个国家和地区得以申请，并在通过审查后获得保护。'},
  {ch:6,type:'multi',q:'申请人通过国家知识产权局商标局提交商标国际注册申请的，应当符合《马德里协定》和《马德里议定书》关于申请人资格的规定，下列具备申请人资格的有（）。',o:["申请人须为外国企业", "申请人须为外国人", "申请人在中国设有住所", "申请人具有中国国籍", "申请人具有中国国籍，但没有工商营业场所"],a:[2, 3, 4],x:'申请人通过国家知识产权局商标局提交商标国际注册申请的，应当符合《马德里协定》和《马德里议定书》关于申请人资格的规定，即申请人在中国设有真实有效的工商营业场所，或者申请人在中国设有住所，或者申请人具有中国国籍。'},
  {ch:6,type:'multi',q:'申请人通过中国的国家知识产权局商标局提交商标国际注册申请的，应当符合《马德里协定》和《马德里议定书》关于申请人资格的规定，以下有申请人资格的有(  )。',o:["申请人须为外国企业", "申请人须为外国人", "申请人在中国设有住所", "申请人具有中国国籍", "申请人具有中国国籍，但没有工商营业场所"],a:[2, 3, 4],x:'申请人通过中国的国家知识产权局商标局提交商标国际注册申请的，应当符合《马德里协定》和《马德里议定书》关于申请人资格的规定，即申请人在中国设有真实有效的工商营业场所，或者申请人在中国设有住所，或者申请人具有中国国籍。 中级经济师'},
  {ch:6,type:'single',q:'对于下列决定，利害关系人不可按照《行政复议法》申请复议的是（    ）。',o:["不予核准被异议商标注册决定", "不予受理商标注册申请决定", "不予续展注册决定", "停止受理商标代理机构办理商标代理业务的决定"],a:0,x:'本题考查商标行政复议案件的受理。商标授权确权案件行政复议受案范围，主要包括对国家知识产权局商标局在商标注册、变更、转让、续展、补发注册证、注销、撤销、异议、复审、无效等程序中作出的具体行政行为不服的；对国家知识产权局作出的停止受理商标代理机构办理商标代理义务等行政决定不服的。BCD正确。对于商标异议，异议成立，国家知识产权局作出不予核准被异议商标注册决定，被异议人不服的，可以自收到通知之日起15日内申请不予注册复审。故A项错误。'},
  {ch:6,type:'single',q:'对于国家知识产权局作出的不予受理商标注册申请的决定不服的，申请人可自收到通知之日起（）日 内向国家知识产权局申请行政复议。',o:["10", "15", "30", "60"],a:3,x:'根据《行政复议法》第九条，公民、法人或 者其他组织认为具体行政行为侵犯其合法权益的，可以 自知道该具体行政行为之日起60 日内提出行政复议申 请，但是法律规定的申请期限超过60日的除外。'},
  {ch:6,type:'single',q:'下列不能成为商标行政复议申请人的是（）。',o:["被控侵权人", "有行政复议申请权的公民的近亲属", "商标被许可人", "商标注册人"],a:1,x:'商标行政复议申请人应当是利害关系人，在商标授权、确权案件中主要是商标注册申请人等，在商标执法案件中主要是商标注册人、被控侵权人等。 注意，题目问的是成为的，故选B选项，ACD不符合题意。 中级经济师'},
  {ch:8,type:'single',q:'(  )是指商标注册人自己或许可他人将使用注册商标的商品投放市场后，他人无须商标注册人允许便可再次转让或者以其他方式向公众提供，包括为此目的在广告宣传中使用，均不构成侵犯注册商标专用权。',o:["平行进口", "权利用尽", "描述性使用", "在先使用"],a:1,x:'商标权用尽，又称商标权穷竭，是指商标注册人自己或许可他人将使用注册商标的商品投放市场后，他人无须商标注册人允许便可再次转让或者以其他方式向公众提供，包括为此目的在广告宣传中使用，均不构成侵犯注册商标专用权。'},
  {ch:8,type:'single',q:'下列不属于注册商标专用权的排他权范围的是(  )。',o:["禁止他人在与注册商标核定商品相同的商品上使用与注册商标相同的标志", "禁止他人在与注册商标核定商品类似的商品上使用与注册商标相同的标志", "禁止他人在与注册商标核定商品类似的商品上使用与注册商标近似的标志", "禁止他人在与注册商标核定商品不相类似的商品上使用与注册商标近似的标志"],a:3,x:'注册商标专用权人有权禁止他人擅自在相同的商品上使用与自己注册商标相同的商标，同时还包括了注册商标专用权人有权禁止他人擅自在相同的商品上使用与自己注册商标相近似的商标，有权禁止他人在与自己核定的商品相类似的商品上使用与自己注册商标相同或者近似的商标。'},
  {ch:8,type:'single',q:'下列行为不属于注册商标专用权的行使限制的是（）。',o:["未经商标注册人许可，行为人对注册商标的描述性使用", "未经商标注册人许可，行为人对注册商标的指示性使用", "未经商标注册人许可，行为人使用注册商标的产品经商标注册人自己或许可他人售出后的再次销售", "未经商标注册人许可，行为人购入产品后，去掉该产品上原有的注册商标，换上自己商标进行的再次销售"],a:3,x:'对注册商标的描述性使用、指示性使用，商标 权用尽，均属于注册商标专用权的行使限制。 未经商标注册人许可，行为人购入产品后，去掉该 产品上原有的注册商标，换上自己商标进行再次销售 的，属于“反向假冒”行为，不属于注册商标专用权的 行使限制。'},
  {ch:8,type:'multi',q:'下列属于注册商标专用权权利滥用的有（    ）。',o:["自行改变注册商标", "自行改变注册人名义", "禁止他人对商标的描述性使用", "禁止他人在类似的商品上使用近似的商标", "禁止他人对商标的说明性使用"],a:[0, 1, 2, 4],x:'注册商标专用权为商标所有人所专有，而且这种垄断的专有权利是受法律保护的。但是，商标所有人使用这种权利时，也必须符合法律的有关规定，不得乱用或滥用。例如，未经商标主管机关批准，商标所有人不得自行改变注册商标、注册人名义、地址或者其他注册事项，不得自行将商标转让给他人，特别是不能因自己商标的注册而阻止他人正当使用注册商标中含社会公知公用的内容，不能利用自己从未使用的注册商标，打击他人的善意使用或者正当使用，包括恶意诉讼等。'},
  {ch:8,type:'multi',q:'甲公司是某注册商标的专用权人。在甲公司申请该商标注册前，乙公司已经在同一种商品上先于甲公司使用与该注册商标相同并有一定影响的商标。根据商标法及相关规定，下列说法正确的是(  )。',o:["乙公司可以在原使用范围内继续使用该商标", "甲公司有权禁止乙公司继续使用该商标，但无权要求其赔偿损失", "甲公司无权禁止乙公司在原使用范围内继续使用该商标，但可以要求其支付一定的使用费", "甲公司无权禁止乙公司在原使用范围内继续使用该商标，但可以要求其附加适当区别标识", "乙公司可以自行超出原使用范围继续使用该商标，但应向甲公司支付补偿费"],a:[0, 3],x:'《商标法》第59条第三款规定，商标注册人申请商标注册前，他人已经在同一种商品或者类似商品上先于商标注册人使用与注册商标相同或者近似并有一定影响的商标的，注册商标专用权人无权禁止该使用人在原使用范围内继续使用该商标，但可以要求其附加适当区别标识。'},
  {ch:8,type:'multi',q:'甲公司在餐馆项目上注册了“江城子”商标，下列说法正确的（    ）。',o:["甲公司有权禁止他人在快餐馆上使用“江城子”商标", "甲公司有权禁止他人在旅馆上使用“江城子”商标", "甲公司有权禁止他人在方便面上使用“江城子”商标", "甲公司有权禁止他人在饭店上使用“江城了”商标", "甲公司有权禁止华丰市江城子公园使用“江城子”名称"],a:[0, 1, 3],x:'注册商标专用权的保护范围不仅包括了注册商标专用权人有权禁止他人擅自在相同的商品上使用与自己注册商标相同的商标，同时还包括了注册商标专用权人有权禁止他人擅自在相同的商品上使用与自己注册商标相近似的商标，有权禁止他人在与自己核定的商品相类似的商品上使用与自己注册商标相同或者近似的商标，有权禁止他人以法律规定的其他形式侵害自己注册商标专用权的行为。餐馆与快餐馆、旅馆、饭店属于类似服务，方便面、公园与餐馆不属于类似的商品或服务，“江城子”与“江城了”属于近似商标。 中级经济师'},
  {ch:8,type:'single',q:'在侵犯商标专用权应承担的民事责任中，确定赔偿数额时计算基数的适用顺序是（  ）。',o:["侵权所获利益、被侵权实际损失、商标许可使用费倍数、法定赔偿额", "被侵权实际损失、侵权所获利益、商标许可使用费倍数、法定赔偿额", "法定赔偿额、被侵权实际损失、侵权所获利益、商标许可使用费倍数", "商标许可使用费倍数、被侵权实际损失、侵权所获利益、法定赔偿额"],a:1,x:'侵犯商标专用权的赔偿数额，按照权利人因被侵权所受到的实际损失确定；实际损失难以确定的，可以按照侵权人因侵权所获得的利益确定；权利人的损失或者侵权人获得的利益难以确定的，参照该商标许可使用费的倍数合理确定。对恶意侵犯商标专用权，情节严重的，可以在按照上述方法确定数额的1倍以上5倍以下确定赔偿数额。赔偿数额应当包括权利人为制止侵权行为所支付的合理开支。权利人因被侵权所受到的实际损失、侵权人因侵权所获得的利益、注册商标许可使用费难以确定的，由人民法院根据侵权行为的情节判决给予500万元以下的赔偿。'},
  {ch:8,type:'single',q:'侵犯注册商标专用权的侵权人应承担的民事责任不包括(　　)。',o:["停止侵害", "恢复原状", "赔偿损失", "消除影响"],a:1,x:'《民法典》第一百七十九条规定，承担侵权责任的方式包括停止侵害、返还财产、恢复原状、赔偿损失、消除影响等。其中恢复原状一般适用于侵害物权的行为，不适用于侵犯商标权的行为。'},
  {ch:8,type:'single',q:'在判定商标侵权中执行尊重当事人合法权益原则时，不应考虑（    ）。',o:["尊重当事人自主选择的意愿", "充分考虑在先使用人的利益", "充分发挥商标主管机关的能动性", "尊重在先权利"],a:2,x:'在判定商标侵权时，应贯彻尊重当事人合法权益原则。这一原则体现在：①尊重商标当事人自主选择的意愿，其可以就商标纠纷自行协商或选择其他纠纷处理途径；②充分考虑在先使用人的利益，合理界定正当使用行为；③要尊重在先权利，如著作权、企业名称权、外观设计专利等；④要为行政相对人在行政处罚程序所拥有的权利的行使提供必要条件，如陈述权、申辩权、请求回避权、质证权、请求听证权等。在司法审判中亦是如此，应充分尊重当事人意愿，支持庭外和解和调解，允许撤诉。充分发挥商标主管机关的能动性，不属于尊重当事人合法权益原则的考虑因素。'},
  {ch:8,type:'multi',q:'七桥镇的甲公司注册了“七桥”商标，核定商品为“米”。下列说法正确的有(  )。',o:["甲公司有权禁止他人在面粉上使用“七桥”商标", "甲公司有权禁止乙公司在店铺上使用说明文字“七桥镇正宗烧饼，3元／个”", "甲公司无权禁止西联超市使用“本店销售七桥镇优质大米”", "甲公司有权禁止七桥镇农民王五在自家承包地出产的大米上标注“七桥出产”", "甲公司有权禁止七桥镇农民何能在自家承包地出产的大米上标注“七桥”牌大米"],a:[2, 4],x:'A选项错误，商标权的保护范围通常限于其核定使用的商品或服务类别。甲公司的“七桥”商标核定商品为“米”，而面粉属于不同的商品类别。因此，甲公司无权禁止他人在面粉上使用“七桥”商标。这个选项是错误的。 B选项错误，根据《商标法》的规定，如果他人的使用行为是出于描述商品或服务的特征、产地等目的，并且不会导致消费者混淆，则属于正当使用。乙公司在店铺上使用“七桥镇正宗烧饼，3元／个”是为了描述烧饼的产地，这种使用属于正当使用，甲公司无权禁止。这个选项是错误的。 C选项正确，西联超市使用“本店销售七桥镇优质大米”是为了说明其销售的大米的产地，这种使用也属于正当使用，甲公司无权禁止。这个选项是正确的。 D选项错误，王五在自家承包地出产的大米上标注“七桥出产”是为了说明大米的产地，这种使用属于正当使用，甲公司无权禁止。这个选项是错误的。 E选项正确，何能在自家承包地出产的大米上标注“七桥”牌大米，这种使用与甲公司的注册商标完全相同，且用于相同商品（大米），容易导致消费者混淆，侵犯了甲公司的商标专用权。因此，甲公司有权禁止这种使用。这个选项是正确的。 故选CE。'},
  {ch:8,type:'multi',q:'根据《商标法实施条例》，行政机关在查处侵犯注册商标专用权行为的过程中，计算违法经营数额时可以考虑的因素包括下列（）。',o:["侵权商品的销售价格", "被侵权商品的市场中间价格", "被侵权商品的销售数量", "未销售侵权商品的标价", "侵权人因侵权所产生的营业收入"],a:[0, 1, 3, 4],x:'根据《商标法实施条例》第七十八条，计算违法经营数额时，可以考虑的因素主要有：①侵权商品的销售价格；②未销售侵权商品的标价；③已查清侵权商品实际销售的平均价格；④被侵权商品的市场中间价格；⑤侵权人因侵权所产生的营业收入；⑥其他能够合理计算侵权商品价值的因素。被侵权商品的销售数量不在考虑因素之列。'},
  {ch:8,type:'multi',q:'下列关于计算商标侵权赔偿数额的说法正确的有（）。',o:["赔偿数额按照权利人被侵权所受到的实际损失确定", "权利人的损失或者侵权人获得的利益难以确定的，参照该商标许可使用费的倍数合理确定赔偿数额", "权利人的实际损失难以确定侵权人又无法反驳的，参照权利人的主张确定赔偿数额", "赔偿数额应当包括权利人为制止侵权行为所支付的合理开支", "赔偿数额按照经协商后侵权人认可的金额确定"],a:[0, 1, 3],x:'根据《商标法》第六十三条，侵犯商标专用权的赔偿数额以补偿性赔偿为基础，以惩罚性赔偿为补充。首先，赔偿数额应按照权利人因被侵权所受到的实际损失确定，实际损失难以确定的，可以按照侵权人因侵权所获得的利益确定，权利人的损失或者侵权人获得的利益难以确定的，参照该商标许可使用费的倍数合理确定。其次，对恶意侵犯商标专用权，情节严重的，可以在按照上述方法确定数额的1倍以上5倍以下确定赔偿数额。赔偿数额应当包括权利人为制止侵权行为所支付的合理开支。 中级经济师'},
  {ch:8,type:'single',q:'将他人驰名商标作为企业名称中的字号使用，误导公众的，应当依照（  ）有关规定处理。',o:["《商标法》", "《企业名称登记管理规定》", "《民法通则》", "《反不正当竞争法》"],a:3,x:'《商标法》第五十八条规定，将他人注册商标、未注册的驰名商标作为企业名称中的字号使用，误导公众，构成不正当竞争行为的，依照《反不正当竞争法》处理。故D选项正确，ABC不符合题意。'},
  {ch:8,type:'single',q:'根据《商标法》第十三条第二款，未在中国注册的驰名商标的保护要件不包括（  ）。',o:["他人商标在系争商标申请日前已经驰名但尚未在中国注册", "系争商标所使用的商品或服务与他人驰名商标所使用的商品或服务必须为同一种", "系争商标构成对他人驰名商标的复制、摹仿或者翻译", "系争商标的注册或者使用，容易导致混淆"],a:1,x:'对于尚未在中国注册的驰名商标，保护范围及于相同或者类似的商品或服务。 《商标法》第十三条第二款规定，就相同或者类似商品申请注册的商标是复制、摹仿或者翻译他人未在中国注册的驰名商标，容易导致混淆的，不予注册并禁止使用。这一条款包括四个要件：①他人商标在系争商标申请日前已经驰名但尚未在中国注册（A选项）；②系争商标构成对他人驰名商标的复制、摹仿或者翻译（C选项）；③系争商标所使用的商品或服务与他人驰名商标所使用的商品或服务相同或者类似（B选项错误）；④系争商标的注册或者使用，容易导致混淆（D选项）。 注意：题目问的是不包括的，故选B选项。'},
  {ch:8,type:'single',q:'下列关于我国对驰名商标的认定和保护原则的描述正确的是（  ）。',o:["主动保护、全面认定、随意需求", "个案认定、主动保护、固定认定", "全面认定、主动保护、按需认定", "个案认定、被动保护、按需认定"],a:3,x:'我国对驰名商标遵循个案认定、被动保护及按需认定的原则。故D选项正确。ABC为干扰选项。'},
  {ch:8,type:'multi',q:'关于驰名商标的保护方式，下列说法正确的有（）。',o:["侵犯驰名商标专用权的商标不得注册，但可以使用", "已在中国注册的驰名商标，保护范围及于不相同或不相类似的商品或服务", "对于尚未在中国注册的驰名商标，保护范围及于相同或类似的商品或服务", "将他人未注册的驰名商标作为企业名称中的字号使用，误导公众，构成不正当竞争行为的，依照《反不正当竞争法》处理", "商标注册人不得将“驰名商标”字样用于广告宣传"],a:[1, 2, 3, 4],x:'根据《商标法》第十三条第二款，就相同或者类似商品申请注册 的商标是复制、摹仿或者翻译他人未在中国注册的驰名商标，容易导致混 淆的，不予注册并禁止使用。 第三款规定，就不相同或者不相类似商品申请注册的商标是复制、摹 仿或者翻译他人已经在中国注册的驰名商标，误导公众，致使该驰名商标 注册人的利益可能受到损害的，不予注册并禁止使用。 第十四条规定，生产、经营者不得将“驰名商标”字样用于广告宣 传。第五十八条规定，将他人未注册的驰名商标作为企业名称中的字号使 用，误导公众，构成不正当竞争行为的，依照《反不正当竞争法》处理。'},
  {ch:8,type:'multi',q:'根据《商标法》的规定，认定驰名商标应考虑的因素包括(  )。',o:["相关公众对该商标的知晓程度", "使用该商标的商品的平均利润率", "该商标使用的持续时间", "商标注册人为外国企业的，该商标在国外的知晓程度", "该商标作为驰名商标受保护的记录"],a:[0, 2, 4],x:'根据《商标法》第十四条的规定，认定驰名商标应当考虑的因素主要有5个：相关公众对该商标的知晓程度；该商标使用的持续时间；该商标的任何宣传工作的持续时间、程度和地理范围；该商标作为驰名商标受保护的记录；该商标驰名的其他因素。'},
  {ch:7,type:'single',q:'甲公司在办公家具、手推车、摇椅上注册了“永流”商标。2021年9月11日，甲公司向国家知识产权局商标局提交注销申请书，申请注销“永流”商标在手推车上的注册。同日，国家知识产权局商标局收到甲公司的申请。2021年10月9日，国家知识核产权局商标局准注销甲公司商标在手推车上的注册。2021年10月20日，甲公司收到国家知识产权局商标局重新核发的《注册商标证》。2021年11月1日，《商标公告》刊载了甲公司的商标注销公告。甲公司在手推车上的商标专用权终止于（    ）。',o:["2021年9月11日", "2021年10月9日", "2021年10月20日", "2021年11月1日"],a:0,x:'商标注册人申请注销其注册商标或者注销其商标在部分指定商品上的注册，经国家知识产权局商标局核准注销的，该注册商标专用权或者该注册商标专用权在该部分指定商品上的效力自国家知识产权局商标局收到其注销申请之日起终止。'},
  {ch:7,type:'single',q:'关于注册商标的变更，下列说法错误的是(  )。',o:["变更商标注册人名义的，应当提交有关登记机关出具的变更证明文件", "变更商标注册人名义的，商标注册人应当将其全部注册商标一并变更", "申请人名称、地址发生过多次变更的，应当逐次办理", "办理共有商标变更代理人或者文件接收人申请时，申请人应当取得全体共有成员书面同意文件"],a:2,x:'变更商标注册人名义的，应当提交有关登记机关出具的变更证明文件。变更商标注册人名义的，商标注册人应当将其全部注册商标一并变更，未一并变更的，由国家知识产权局通知其限期改正，期满未改正的，视为放弃变更申请，国家知识产权局应当书面通知申请人。申请人名称、地址发生过多次变更的，无须逐次办理，可以直接变更至现使用名称或地址。办理共有商标变更代理人或者文件接收入申请时，申请人应当取得全体共有成员书面同意文件。'},
  {ch:7,type:'multi',q:'关于商标注销，下列说法正确的有(  )。',o:["商标注册人可以申请注销其注册商标", "商标注册人可以申请注销在部分指定商品或服务上的注册", "商标注册人连续3年未使用其注册商标的，国家知识产权局商标局有权注销其注册商标", "商标注册人在续展注册宽展期未申请续展的，由国家知识产权局商标局注销其注册商标", "商标注册人注销在部分指定商品上的注册的，该注册商标专用权在该部分指定商品上的效力自商标注销公告之日起终止"],a:[0, 1, 3],x:'商标注册人申请注销其注册商标或者注销其商标在部分指定商品上的注册，经国家知识产权局商标局核准注销的，该注册商标专用权或者该注册商标专用权在该部分指定商品上的效力自国家知识产权局商标局收到其注销申请之日起终止（E选项错误，公告只是一个对外告知的程序，并不改变商标权效力终止的时间点）。当注册商标有效期满后，在法律规定的宽展期内注册人仍未提出续展申请的，国家知识产权局商标局注销该注册商标，该商标专用权自有效期满次日起终止。 C选项错误，商标注册人连续3年未使用其注册商标的，国家知识产权局商标局有权撤销其商标注册。'},
  {ch:7,type:'multi',q:'商标注册人需要变更下列注册事项的，可以提出变更申请的有（    ）。',o:["商标注册人名义", "商标图样", "商品或服务项目的增减", "证明商标使用管理规则", "集体商标集体成员名单"],a:[0, 3, 4],x:'商标注册人可以申请变更注册人名义、地址，集体商标、证明商标的管理规则或集体成员名单；不能申请变更商标图样；可以申请删减商品或服务项目，但不能申请增加。 中级经济师'},
  {ch:8,type:'single',q:'关于注册商标的转让，下列说法正确的是（）。',o:["受让人自转让商标协议生效之日起享有商标专用权", "受让人自国家知识产权局受理转让商标申请之日起享有商标专用权", "受让人自国家知识产权局核准转让商标申请之日起享有商标专用权", "受让人自商标转让公告之日起享有商标专用权"],a:3,x:'根据《商标法》第四十二条第四款，转让注册商标经核准后，予以公告。受让人自公告之日起享有商标专用权。'},
  {ch:7,type:'single',q:'上海甲公司在餐馆项目上注册了“桃林”商标。2021年2月10日，甲公司与西安乙公司签订《商标使用许可合同》，约定乙公司在西安市范围内开设的餐馆可使用甲公司的“桃林”商标，且甲公司不得在西安市开设“桃林”餐馆，也不得授权任何第三人在西安市开设“桃林”餐馆；合同有效期为10年。甲乙公司之间商标使用许可的性质属于(  )。',o:["独家许可", "独占许可", "普通许可", "分割许可"],a:1,x:'独占许可，是指商标注册人将注册商标仅许可一个被许可人在约定的期间、地域内以约定的方式使用，而许可人在上述约定范围内不得使用该商标。因此，甲乙公司签订的是独占许可合同。'},
  {ch:8,type:'single',q:'下列关于注册商标质押的说法正确的是（）。',o:["出质人与质权人签订书面质权合同后无须向国家知识产权局提出质权登记申请", "注册商标质押后，出质人一般不得许可他人使用", "注册商标专用权质权登记申请应由质权人办理", "注册商标专用权质权登记申请应由出质人办理"],a:1,x:'知识产权中的财产权出质后，出质人不得转让或者许可他人使用，但是出质人与质权人协商同意的除外。注册商标专用权质权登记申请应由质权人和出质人共同提出、共同办理。'},
  {ch:8,type:'multi',q:'需要办理注册商标专用权移转手续的类型主要包括（）。',o:["企业解散，自主清算", "企业合并、分立", "继承", "公司部门职能调整", "执行司法判决"],a:[0, 1, 2, 4],x:'《商标法》还规定了注册商标移转制度。注册商标移转特指注册商标专用权因继承、法人解散、破产、强制执行等转让以外的其他事由而发生的商标权利主体的更替。故选ABCE。D选项为干扰选项。'},
  {ch:6,type:'multi',q:'下列关于注册商标转让的说法正确的有（）。',o:["转让注册商标的，转让人和受让人应当签订转让协议，并由转让人向国家知识产权局提出申请", "转让注册商标经核准后予以公告，受让人自公告之日起享有商标专用权", "受让人应当保证使用该注册商标的商品质量", "对容易导致混淆或者有其他不良影响的转让，国家知识产权局不予核准", "转让注册商标的，商标注册人对其在同一种商品上注册的近似的商标，或者在类似商品上注册的相同或者近似的商标，应当一并转让"],a:[1, 2, 3, 4],x:'转让注册商标的，转让人和受让人应当签订转让协议，并共同向国家知识产权局提出申请（A选项错误）。受让人应当保证使用该注册商标的商品质量（C选项正确）。转让注册商标的，商标注册人对其在同一种商品上注册的近似的商标，或者在类似商品上注册的相同或者近似的商标，应当一并转让（E选项正确）。对容易导致混淆或者有其他不良影响的转让，国家知识产权局不予核准（D选项正确），书面通知申请人并说明理由。转让注册商标经核准后，予以公告。受让人自公告之日起享有商标专用权（B选项正确）。故选BCDE。'},
  {ch:7,type:'single',q:'甲公司是一家生产手机壳的工厂，其在自己生产的手机壳上使用“雅量”未注册商标。为提高可信度，甲公司在“雅量”上加注⑩，共计生产销售手机壳1000个，每个售价为10元。管理商标工作的部门可对甲公司的行为处以（）元以下罚款。',o:["1000", "5000", "1万", "5万"],a:2,x:'根据《商标法》第五十二条，将未注册商标冒充注册商标使用的，由地方工商行政管理部门予以制止，限期改正，并可以予以通报。违法经营额5万元以上的，可以处违法经营额20％以下的罚款，没有违法经营额或者违法经营额不足5万元的，可以处1万元以下的罚款。'},
  {ch:7,type:'single',q:'下列行为中，不属于以未注册商标冒充注册商标的是(　　)。',o:["商标使用人在未注册的商标上加注TM", "商标使用人在未注册的商标上使用“注册商标”字样", "商标注册人的注册商标已被宣告无效，仍继续使用并加注“注册商标”字样", "商标注册人将两个或者两个以上注册商标组合使用时仅使用一个注册标记，使他人误认为是一个注册商标的"],a:0,x:'由于“TM”不属于我国注册商标的标注方式(“注册商标”或者注册标记)，因此不属于以未注册商标冒充注册商标。'},
  {ch:7,type:'single',q:'注册人怠于行使权利导致集体商标、证明商标成为核定使用的商品的通用名称或者没有正当理由连续（ ）年不使用的，任何人可以根据《商标法》第四十九条申请撤销该注册商标。',o:["1", "2", "3", "4"],a:2,x:'注册人怠于行使权利导致集体商标、证明商标成为核定使用的商品的通用名称或者没有正当理由连续3年不使用的，任何人可以根据《商标法》第四十九条申请撤销该注册商标。'},
  {ch:7,type:'multi',q:'依据《商标法》及相关规定，商标注册人在使用注册商标的过程中，有下列(  )行为的，由地方市场监管综合执法队伍责令限期改正；期满不改正的，由国家知识产权局商标局撤销其注册商标。',o:["将注册的文字图形组合商标分开使用，并标明注册标记的", "将注册商标使用在核定商品之外的商品上", "商标注册人名义发生变化后，未依法向国家知识产权局商标局提出变更申请", "商标注册人地址发生变化后，未依法向国家知识产权局商标局提出变更申请", "商标注册人实际地址与《商标注册簿》上记载的地址不一致"],a:[0, 2, 3, 4],x:'根据《商标法》第四十九条第一款，对于商标注册人自行改变注册商标、注册人名义、地址或者其他注册事项的，由地方市场监管综合执法队伍责令限期改正，期满不改正的，由商标局撤销其注册商标。 注册的组合商标分开使用且标明注册标记的，属于自行改变注册商标的行为。商标注册人名义发生变化后，未依法向国家知识产权局商标局提出变更申请的；商标注册人地址发生变化后，未依法向国家知识产权局商标局提出变更申请的；商标注册人实际地址与《商标注册簿》上记载的地址不一致的，属于自行改变注册人名义、地址的行为。 B项“将注册商标使用在核定商品之外的商品上”并不是一种需要限期改正的行为。根据《商标法》第二十三条和第二十四条的规定，如果商标注册人需要在核定使用范围之外的商品上取得注册商标专用权，应当另行提出注册申请。这并不意味着该行为会导致现有注册商标被撤销。因此，B项不符合题干所描述的情形。'},
  {ch:7,type:'multi',q:'下列行为属于“以未注册商标冒充注册商标”的有（）。',o:["商标使用人在未注册的商标上加注注册标记®", "商标使用人在未注册的商标上加注TM”字样", "商标使用人在未注册的商标上加注“注册商标”字样", "商标注册人超出了国家知识产权局核准注册商标核定使用商品的范围使用注册商标，并加注注册标记", "商标注册人将两个或者两个以上注册商标组合使用时仅使用一个注册标记，使他人误认为是一个注册商标"],a:[0, 2, 3, 4],x:'商标使用人在未注册的商标上加注“注册商 标”字样或注册标记或者®的，或者超出国家知识产权 局核准注册商标核定使用商品的范围使用注册商标并加 注注册标记或®的，或者将两个或两个以上注册商标组 合使用时仅使用一个注册标记，使他人误认为是一个注 册商标的，属于“以未注册商标冒充注册商标”。 “ TM”字样不属于我国注册商标的标注方式 （“注册商标”字样或者注册标记注或®），因此使用 其的行为不属于“以未注册商标冒充注册商标”。'},
  {ch:7,type:'single',q:'下列关于违法印制商标的法律责任说法错误的是（）。',o:["商标印制委托人和商标印制单位的违法商标印制行为构成犯罪的，所在地或者行为地市场监督管理部门应及时将案件移送司法机关追究刑事责任", "商标印制单位故意为侵犯他人商标专用权行为提供便利条件，帮助他人实施侵犯商标专用权行为的，由所在地或者行为地市场监督管理部门按照有关规定予以处理", "对未取得“印刷经营许可证”,或者虽然取得“印刷经营许可证”,但未经相关部门登记注册而擅自从事商标标识印刷经营活动的，由公安部门依法取缔", "出版行政部门、市场监督管理部门、公安部门均对商标印制行为负有监管职责"],a:2,x:'C选项错误，对于未取得印刷经营许可证，或者虽然取得印刷经营许可证但未经市场监督管理部门登记而擅自从事商标标识印刷经营活动的行为主体，出版行政部门、市场监督管理部门有权依照《印刷业管理条例》第三十六条第一款的规定予以取缔，没收印刷品和违法所得以及进行违法活动的专用工具、设备，违法所得五万元以上的，并处违法所得五倍以上十倍以下的罚款，没有违法所得或者违法所得不足五万元的，并处二十五万元以下的罚款；构成犯罪的，依法追究刑事责任。 注意，题目问的是的，故选C选项。 ABD均为正确描述。'},
  {ch:7,type:'single',q:'个体工商户张某打算印制带有 “果香” 未注册商标的水果包装盒，委托某印刷厂印制。根据《商标印制管理办法》，张某作为商标印制委托人，应向印刷厂出示的文件是？',o:["商标注册证及复印件", "营业执照副本或合法营业证明、身份证明", "商标使用许可合同文本及复印件", "无需出示任何文件"],a:1,x:'根据《商标印制管理办法》，商标印制委托人需向印制单位出示营业执照副本、合法营业证明或身份证明。题干中张某印制的是未注册商标，无需提供商标注册证（A 错误）；其并非商标使用被许可人，无需提供许可合同（C 错误）；“无需出示文件” 不符合规定（D 错误）。因此，张某应出示的是 B 选项中的文件。'},
  {ch:7,type:'single',q:'某印刷厂接受客户委托，以冲压方式制作带有 “美乐” 商标的金属标牌，该标牌将用于与某品牌饮料配套销售。根据《商标印制管理办法》，该印刷厂的行为属于？',o:["商标使用行为", "商标印制行为", "商标标识设计行为", "与商标无关的加工行为"],a:1,x:'根据《商标印制管理办法》第二条，以印刷、印染、制版、刻字、织字、晒蚀、印铁、铸模、冲压、烫印、贴花等方式制作商标标识的行为，均属于商标印制行为。同时，题干中 “带有‘美乐’商标的金属标牌” 是与饮料配套进入流通领域的有形载体，属于 “商标标识”。因此，该印刷厂以冲压方式制作商标标识的行为，符合商标印制行为的定义。故选B选项。 ACD均为干扰选项。 中级经济师'},
  {ch:7,type:'single',q:'化妆品品牌“兰蔻”商标名称的构想源于位于法国中部的兰蔻城堡。该城堡的四周栽满了玫瑰花，兰蔻品牌创始人觉得玫瑰优雅高贵、美丽芬芳，于是用该城堡名称来命名产品。这种定位策略属于（）。',o:["商标品牌定位策略", "商标品牌识别策略", "商标品牌传播策略", "商标品牌价值策略"],a:1,x:'与品牌定位相比，品牌识别含义更丰富，更具有潜在价值，需要从多个角度增强其识别力。这也是商标品牌策略的核心。通常可以从品牌个性、品牌文化、品牌与消费者的结合点三个角度进行品牌识别。'},
  {ch:7,type:'single',q:'下列策略不属于产品定位策略的是（）。',o:["产品功能定位策略", "产品价格定位策略", "生活方式定位策略", "产品外观定位策略"],a:2,x:'品牌定位策略是从经营者角度挖掘品牌产品特色、进行品牌定位点开发的策略。品牌定位点的开发不局限于产品本身，其虽源于产品，但可超越产品。产品定位策略即围绕产品本身特征制定的策略，包括产品功能定位策略、产品外观定位策略、产品价格定位策略。'},
  {ch:7,type:'single',q:'下列关于我国商标战略的说法，错误的是（）。',o:["我国商标战略的形成需要国家战略的引领", "我国商标战略的组织实施具有企业战略总体推动的特点", "我国商标品牌定位和传播策略是商标战略实施的重要策略", "我国商标品牌战略对于发展品牌经济、提升商标品牌在经济社会中的作用具有重要意义"],a:1,x:'我国商标战略的形成需要国家战略的引领。我国商标战略的组织实施具有国家战略总体推动的特点。我国商标品牌定位和传播策略是商标战略实施的重要策略。我国商标品牌战略对于发展品牌经济、提升商标品牌在经济社会中的作用具有重要意义。'},
  {ch:7,type:'multi',q:'商标品牌定位策略包括(　　)。',o:["产品定位策略", "市场定位策略", "竞争者定位策略", "商标防护策略", "品牌识别策略"],a:[0, 1, 2],x:'品牌定位策略是从经营者角度挖掘品牌产品特色进行品牌定位点开发的策略。包括：产品定位策略，即围绕产品本身特征制定策略；市场定位策略，即围绕市场不同消费者和消费方式需求制定策略；竞争者定位策略，即把竞争者作为定位的坐标或基准点，确定本品牌的定位点。'},
  {ch:7,type:'multi',q:'下列关于我国商标品牌战略的说法正确的有（）。',o:["我国商标品牌战略的形成需要国家战略的引领", "我国商标品牌战略的实施具有国家战略总体推动的特点", "我国商标品牌定位和传播策略是商标品牌战略实施的重要策略", "我国商标品牌战略对于构建品牌经济、提升商标品牌在经济社会中的作用具有重要意义", "我国商标品牌战略是独立于国家知识产权整体战略"],a:[0, 1, 2, 3],x:'《商标品牌战略意见》将品牌与商标紧密结合，深化了对国家知识产权战略商标专项任务的认识。 中级经济师'},
  {ch:9,type:'single',q:'下列对“作品”的描述错误的是(  )。',o:["篇幅达到一定规模", "属于文学、艺术和科学领域内的智力成果", "能以某种有形形式复制", "具有独创性"],a:0,x:'“作品”，是指文学、艺术和科学领域内具有独创性并能以某种有形形式复制的智力成果。构成著作权法意义上的“作品”应当满足三个条件：①作品应当是人类智力创作成果的体现，纯粹自然的产物不能构成作品；②作品应当具有独创性，独创性强调独立创作完成、体现作者的选择和判断以及达到一定的创作高度，其中的智力成分不能过于微不足道；③作品应当可被复制，复制的前提是作品需要以一定的外在形式固定下来，并能被外界所感知。'},
  {ch:9,type:'single',q:'中国历史上第一部专门保护著作权的法律是(  )。',o:["《大清著作权律》", "《关于书籍稿酬的暂行规定》", "《关于图书、期刊著作权保护试行条例》", "《保障出版物著作权暂行规定》"],a:0,x:'我国第一部具有现代著作权法特征的法律是清末时期颁布的《大清著作权律》。'},
  {ch:9,type:'single',q:'世界上第一部规定作者对其作品享有人身权的法律是（）。',o:["《安娜女王法》", "《作者权法》", "《垄断法规》", "《美墨加贸易协定》"],a:1,x:'英国l709年的《安娜女王法》第一次确认了作者对其作品享有财产权，同时也被认为是世界上第一部真正意义上的著作权法。l793年法国《作者权法》确认作者对其作品享有人身权。'},
  {ch:9,type:'multi',q:'下列选项中，属于中国版权保护中心作品登记的范围是(  )。',o:["深圳市民申请的一项专利", "广州市民编写的计算机软件", "苏州市民拍摄的摄影作品", "杭州市民的美术作品质权合同登记", "武汉市民进行的专利许可登记"],a:[1, 2, 3],x:'中国版权保护中心为国家著作权主管认定的登记机构，承担作品、计算机软件的著作权登记工作，以及与著作权有关的权利事项登记、专有权登记等工作。'},
  {ch:9,type:'multi',q:'下列不适用我国《著作权法》的规定的是（    ）。',o:["五岁的小明绘制的抗击新冠疫情图片《我的护士妈妈》", "某电视台拍摄的抗击新冠疫情新闻人物专访《见证》", "高德电子地图", "农历", "爱因斯坦的发现：E=mc2"],a:[3, 4],x:'历法和公式不受著作权法保护。《著作权法》第5条规定的著作权法中的排除对象主要包括：①法律、法规，国家机关的决议、决定、命令和其他具有立法、行政、司法性质的文件，及其官方正式译文；②单纯事实消息；③历法、通用数表、通用表格和公式。'},
  {ch:9,type:'multi',q:'根据我国对民间文学艺术作品的界定，“民间文学艺术作品”包括的类型有（）。',o:["民间故事和传说", "民间歌曲和器乐", "民间戏曲和曲艺", "民间建筑和雕塑", "现代小说和散文"],a:[0, 1, 2, 3],x:'我国对“民间文学艺术作品”列举的类型：①民间故事、传说、诗歌、歌谣、谚语等以言语或者文字形式表达的作品；②民间歌曲、器乐等以音乐形式表达的作品；③民间舞蹈、歌舞、戏曲、曲艺等以动作、姿势、表情等形式表达的作品；④民间绘画、图案、雕塑、造型、建筑等以平面或者立体形式表达的作品。 中级经济师'},
  {ch:9,type:'single',q:'下列选项中，对于著作权资本市场与证券化的描述错误的是（）。',o:["著作权证券化以支撑该证券发行的著作权本身的信用为支撑", "著作权资本市场以能产生可预期现金流收入的著作权未来收益为依托，为企业提供资金融通", "著作权证券市场以著作权债权化为前提", "国家鼓励开发著作权保险"],a:2,x:'著作权资本市场是以能产生可预期现金流收入的著作权未来收益为依托，为企业提供资金融通的渠道。著作权证券市场以著作权证券化为前提。国家知识产权局《关于深化知识产权领域“放管服”改革营造良好营商环境的实施意见》指出，鼓励开发知识产权综合险种。'},
  {ch:9,type:'single',q:'下列关于著作权质权的说法错误的是（）。',o:["设定著作权质权是利用著作权进行融资的一种重要形式", "根据《著作权质权登记办法》,申请著作权质权登记的必须委托代理人办理", "债务人履行债务的期限超过著作权保护期的，登记机构不予著作权质权登记", "著作权质权合同无效或者被撤销的，登记机构应当撤销质权登记"],a:1,x:'根据《著作权质权登记办法》,申请著作权质权登记，委托代理人办理的，应提交委托书和受托人的身份证明。'},
  {ch:9,type:'single',q:'关于著作权质押下列说法错误的是（）',o:["著作权质押自登记时设立", "著作权质押应订立书面合同", "著作权质实现的方式包括以质押财产协议，拍卖，变卖质押财产", "质押财产折价或者拍卖后价款不足部分由出质人清偿"],a:3,x:'人承担赔偿责任。质押财产折价或者拍卖、变卖后，其价款超过债权数额的部分归出质人所有，不足部分由债务人清偿。 第九章-著作权质押'},
  {ch:9,type:'multi',q:'下列关于著作权质权登记的说法正确的有（）。',o:["经审查符合要求的，登记机构应当自受理之日起十日内予以著作权质权登记", "申请著作权质权登记，以共有的著作权出质的，应提交共有人同意出质的书面文件", "出质人不是著作权人的，登记机构不予著作权质权登记", "出质著作权存在争议进入诉讼程序的，登记机构应当撤销质权登记", "主合同履行完毕的，申请人应当注销著作权质权登记"],a:[0, 1, 2, 4],x:'根据司法机关、仲裁机关或行政管理机关作出的影响质权效力的生效裁决或行政处罚决定书应当撤销的，登记机构应当撤销质权登记。'},
  {ch:9,type:'multi',q:'下列对著作权转让合同描述正确的是(　　)。',o:["著作权转让合同应当采用书面形式", "著作权转让合同应当进行登记", "对于转让合同中著作权人未明确转让的权利，未经著作权人同意，另一方当事人不得行使", "著作权转让合同必须经国家版权局批准", "受让人自转让合同登记之日起享有权利"],a:[0, 2],x:'我国《著作权法》规定，著作权转让应当订立书面合同。对于转让合同中著作权人未明确转让的权利，未经著作权人同意，另一方当事人不得行使。著作权转让合同不需要批准，也不以登记为生效要件。'},
  {ch:9,type:'multi',q:'下列选项中，属于著作权转让合同的主要内容的有（）。',o:["作品的名称", "转让的权利种类", "违约责任", "争议解决方式", "许可的方式"],a:[0, 1, 2, 3],x:'著作权转让合同应当包括以下内容：①作品的名称；②转让的权利种类、地域范围；③转让价金；④交付转让价金的日期和方式；⑤违约责任；⑥双方认为需要约定的其他内容，如要求转让方保证其享有相应的权利，受让方行使合同约定的权利不会构成对第三方的侵权，以及争议解决条款等。 中级经济师'},
  {ch:9,type:'single',q:'甲、乙曾为恋人关系，在此期间甲为乙写作了多封情书。甲、乙分手后，乙将情书送给朋友丙。丙见这些情书文采飞扬，便将其发表在丁网站上。甲得知后要求该网站将情书删除。对此下列说法正确的是(  )。',o:["情书的著作权由乙享有", "乙将情书赠与丙时著作权转移给丙", "丙的行为构成著作权侵权", "丁网站收到甲的通知后无须自行删除，但应通知丙予以删除"],a:2,x:'情书的著作权归作者甲，乙对情书享有所有权，因此丙受赠的是所有权而非著作权。丁网站收到通知后应自行删除，而非要求丙删除。'},
  {ch:9,type:'single',q:'下列关于反向工程的说法错误的是（）。',o:["在法律上既不必然合法，也不必然违法", "合法反向工程中，作为技术还原基础的产品和服务必须是通过合法方式取得的", "任何技术人员均可以对公开销售的含有商业秘密的产品进行反向工程", "合法反向工程中，从事反向工程的技术人员与商业秘密权利人之间须没有订立禁止反向工程的合同"],a:2,x:'反向工程作为一种技术行为，在性质上属于中性行为，在法律上既不必然合法，也不必然违法。反向工程是否合法，不在于反向工程行为本身，而在于反向工程是否符合以下两个条件：作为技术还原基础的产品或服务，是通过合法方式取得的；进行反向工程的技术人员与商业秘密权利人之间没有订立禁止反向工程的合同。'},
  {ch:9,type:'single',q:'著作权侵权的法律责任不包括（）。',o:["诉前临时禁令", "法定赔偿", "返还原物", "刑事责任"],a:2,x:'在知识产权的民事救济措施中，请求停止侵害既包括请求除去已经发生的侵害，也包括请求除去可能出现的侵害。由于权利客体具有无形性特征，在知识产权侵权之诉中，知识产权主体并不能援用请求恢复原状、返还原物的传统民事救济方法（C选项正确），且停止侵害只能是排除对权利人行使专有权利的“妨碍”,而不可能是制止对权利客体即知识产品的“侵害”。故选D选项。 著作权侵权的民事责任包括停止侵害（A选项）、赔偿损失（B选项）、赔礼道歉和消除影响等。 行政责任：对于构成著作权行政违法行为的，著作权主管部门可以采取责令停止侵权行为，予以警告，没收违法所得，没收、无害化销毁处理侵权复制品以及主要用于制作侵权复制品的材料、工具、设备等，并可处以罚款。 刑事责任（D选项）：对于构成侵犯著作权罪的情形，违法所得数额较大或者有其他严重情节的，处三年以下有期徒刑，并处或者单处罚金；违法所得数额巨大或者有其他特别严重情节的，处三年以上十年以下有期徒刑，并处罚金。'},
  {ch:9,type:'multi',q:'主管著作权的部门对涉嫌侵犯著作权的行为进行查处时，可采取的执法手段有：',o:["询问有关当事人", "对当事人涉嫌违法行为的场所和物品实施现场检查", "复制与涉嫌违法行为有关的资料", "对于涉嫌违法行为的场所和物品，可以查封", "对当事人可处以5万元以下罚款"],a:[0, 1, 2, 3],x:'《著作权法》第55条：主管著作权的部门对涉嫌侵犯著作权和与著作权有关的权利的行为进行查处时，可以询问有关当事人，调查与涉嫌违法行为有关的情况；对当事人涉嫌违法行为的场所和物品实施现场检查；查阅、复制与涉嫌违法行为有关的合同、发票、账簿以及其他有关资料；对于涉嫌违法行为的场所和物品，可以查封或者扣押。'},
  {ch:9,type:'multi',q:'下列行为可能导致网络服务提供者承担著作权间接侵权责任的是(  )。',o:["教唆", "帮助", "制作侵权内容", "提供存储空间", "设置侵权链接"],a:[0, 1, 3, 4],x:'网络服务提供者承担著作权间接侵权责任分为两种情况，一是教唆，二是帮助。网络服务提供者以言语、推介技术支持、奖励积分等方式诱导、鼓励网络用户实施侵害信息网络传播权行为的，人民法院应当认定其构成教唆侵权行为。网络服务提供者明知或者应知网络用户利用网络服务侵害信息网络传播权，未采取删除、屏蔽、断开链接等必要措施，或者提供技术支持等帮助行为的，人民法院应当认定其构成帮助侵权行为。'},
  {ch:9,type:'multi',q:'下列选项中，对侵犯著作权的民事责任描述正确的有（）。',o:["法定赔偿的范围为500元到500万元", "惩罚性赔偿的倍数为1倍到5倍", "法定赔偿可以作为惩罚性赔偿的计算基数", "可以适用禁令救济", "可以参照权利使用费给予赔偿"],a:[0, 1, 3, 4],x:'著作权侵权的民事责任包括停止侵害、赔偿损 失、赔礼道歉等。赔偿损失数额的计算方式包括权利人 的实际损失、侵权人的违法所得、权利使用费、法定赔 偿和惩罚性赔偿，但是法定赔偿不能作为惩罚性赔偿的 基数。 中级经济师'},
  {ch:6,type:'single',q:'关于注册商标专用权与肖像权、姓名权，下列说法错误的是（    ）',o:["使用他人肖像注册商标的，应取得肖像权人的同意", "使用他人姓名注册商标的，应取得姓名权人的同意", "使用他人肖像、姓名注册商标的，应由注册申请人就取得权利人同意的事实承担举证责任", "使用申请人姓名申请商标注册的，即使易被误认为是与其姓名相同的他人本人注册或者与他人有密切关系的，也能获得注册"],a:3,x:'使用本人姓名申请注册商标，误导公众、妨害公序良俗或者有其他不良影响的，不能获得注册。'},
  {ch:6,type:'single',q:'以下选项不属于以集体商标、证明商标保护的地理标志侵权违法行为的是(  )。',o:["王某销售侵犯集体商标专用权的商品", "王某故意为赵某伪造他人证明商标标识的行为提供便利条件", "王某未经集体商标注册人H协会同意，更换了H协会注册的集体商标并将该更换商标的商品又投入市场", "王某经集体商标注册人Z组织的许可，在同一种商品上使用与其注册的集体商标相同的商标"],a:3,x:'此题考查的是以集体商标、证明商标保护的地理标志侵权违法行为。属于侵犯集体商标、证明商标的注册商标专用权的行为类型有：①未经集体商标、证明商标注册人的许可，在同一种商品上使用与其注册的集体商标、证明商标相同的商标的；②未经集体商标、证明商标注册人的许可，在同一种商品上使用与其注册的集体商标、证明商标近似的商标，或者在类似商品上使用与其注册集体商标、证明商标相同或近似的商标，容易导致混淆的。③销售侵犯集体商标、证明商标注册商标专用权的商品的；④ 伪造、擅自制造他人注册的集体商标、证明商标标示或者销售他人注册的集体商标、证明商标标示的。⑤未经集体商标、证明商标注册人同意，更换其注册的集体商标、证明商标并将该更换商标的商品又投入市场的；⑥故意为侵犯他人集体商标、证明商标注册商标专用权行为提供便利条件，帮助他人实施侵犯集体商标、证明商标注册商标专用权行为的。⑦给他人的集体商标、证明商标注册商标专用权造成其他损害的。'},
  {ch:6,type:'single',q:'在审理商标纠纷案件时，人民法院应商标权利人请求可以作出（  ）判决。',o:["责令收缴并销毁假冒注册商标标识", "责令销毁现场相同或类似的商品", "责令罚款", "责令销毁假冒注册商标的商品"],a:3,x:'根据《商标法》第六十三条，人民法院审理商标纠纷案件，应权利人请求，对属于假冒注册商标的商品，除特殊情况外，责令销毁；对主要用于制造假冒注册商标的商品的材料、工具，责令销毁，且不予补偿；或者在特殊情况下，责令禁止前述材料、工具进入商业渠道，且不予补偿。故D选项正确。 ABC为干扰选项。'},

// 按章节顺序轮动选取 count 题；某章不足则顺延后续章节；跨天不重复（按题号索引去重，耗尽自动重置）
pickChapterRotation(bank,startCh,usedArr,count){
  if(!Array.isArray(usedArr))usedArr=[];
  if(usedArr.some(x=>typeof x!=='number'))usedArr.length=0;
  const total=bank.length?(bank[0].subject==='econ'?ECON_TOTAL:IP_TOTAL):37;
  // 只取有效章节的题目（ch:0/undefined 为未归类，不进入每日轮动）
  const validBank=bank.map((q,i)=>({q,i})).filter(({q})=>q.ch>=1&&q.ch<=total);
  const pick=(usedSet)=>{
    let collected=[];let ch=startCh;let guard=0;
    while(collected.length<count&&guard<=total){
      const inCh=validBank.filter(({q,i})=>q.ch===ch&&!usedSet.has(i)).sort(()=>Math.random()-.5);
      collected=collected.concat(inCh);
      if(collected.length>=count)break;
      ch=(ch%total)+1;guard++;
    }
    if(collected.length<count){
      const rest=validBank.filter(({q,i})=>!usedSet.has(i)&&!collected.some(c=>c.i===i))
        .sort(()=>Math.random()-.5);
      collected=collected.concat(rest);
    }
    return collected.slice(0,count);
  };
  let usedSet=new Set(usedArr);
  let collected=pick(usedSet);
  // 若题库已耗尽仍不足 count，重置已做记录再取一次，保证每日必有题
  if(collected.length<count){
    usedArr.length=0;usedSet=new Set();
    collected=pick(usedSet);
  }
  collected.forEach(({i})=>usedSet.add(i));
  usedArr.length=0;usedSet.forEach(i=>usedArr.push(i));
  const lastQ=collected[collected.length-1];
  const lastCh=lastQ?lastQ.q.ch:startCh;
  const nextPtr=(lastCh%total)+1;
  return {sel:collected.map(c=>c.q),nextPtr};
},

  // 兼容旧版 localStorage：旧 usedEcon/usedIP 存的是题干字符串，重置为索引数组

submitOneAnswer(subj,idx){

this.data.errorNotebook[subj].push({

_pickTips(arr,shownArr,count){
// 当天已展示的条目去重；展示完一轮后如果还有剩余则继续随机补充，全部用完则重置
const total=arr.length;
let shown=new Set(shownArr||[]);
if(shown.size>=total){shownArr.length=0;shown=new Set();}
const rest=arr.filter((t,i)=>!shown.has(i));
// Fisher–Yates 洗牌后取前 count 条
const pool=rest.slice();
for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
const sel=pool.slice(0,Math.min(count,pool.length));
// 若一轮不足 count，从已展示的里再补（保证凑满）
if(sel.length<count){
const filler=arr.filter((t,i)=>shown.has(i));
for(let i=filler.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[filler[i],filler[j]]=[filler[j],filler[i]];}
sel.push(...filler.slice(0,count-sel.length));
}
sel.forEach((t,i)=>{const idx=arr.indexOf(t);if(!shownArr.includes(idx))shownArr.push(idx);});
return sel;
},
renderTips(){
const today=new Date().toISOString().split('T')[0];
let st=this.data.tipsState||{date:'',econShown:[],ipShown:[]};
if(!this.data.tipsState)this.data.tipsState=st;
if(st.date!==today){st.date=today;st.econShown=[];st.ipShown=[];sd(this.data);}
const econ=this.tipsData().econ, ip=this.tipsData().ip;
const selE=this._pickTips(econ,st.econShown,15);
const selI=this._pickTips(ip,st.ipShown,15);
const intro=document.getElementById('tips-intro');
if(intro)intro.textContent='以下知识点精选自官方教材高频考点，两科分开显示、每天随机推送（当天已看过的不会重复），利用排队、通勤时间反复记忆。';
const htmlE=selE.map((t,i)=>`<div class="tip-card"><div class="tip-idx">${i+1}</div><div class="tip-body"><div class="tip-text">${t.t}<span class="tip-tag">${t.tag}</span></div></div></div>`).join('');
const htmlI=selI.map((t,i)=>`<div class="tip-card"><div class="tip-idx">${i+1}</div><div class="tip-body"><div class="tip-text">${t.t}<span class="tip-tag">${t.tag}</span></div></div></div>`).join('');

},
